  // ===========================================================
  // 調整画面の上書き設定(Tuning)
  // ===========================================================
  const DEFAULTS = JSON.parse(JSON.stringify(CONFIG));
  function getPath(obj, path) {
    return path.split('.').reduce((o, k) => (o == null ? undefined : o[k]), obj);
  }
  function setPath(obj, path, value) {
    const ks = path.split('.');
    let o = obj;
    for (let i = 0; i < ks.length - 1; i++) o = o[ks[i]];
    o[ks[ks.length - 1]] = value;
  }
  // 上書き設定 { path: 値 } を CONFIG に反映する(調整できる値だけ。指定のない値は初期値に戻す)
  function applyOverrides(overrides) {
    overrides = overrides || {};
    for (const m of CONFIG.paramMeta) {
      const v = overrides[m.path];
      const ok = (typeof v === 'number' && isFinite(v)) || (typeof v === 'boolean' && typeof getPath(DEFAULTS, m.path) === 'boolean')  // オン/オフの設定は真偽値
        || (typeof v === 'string' && m.options && m.options.indexOf(v) >= 0);                                                      // 選択肢の設定は文字列
      setPath(CONFIG, m.path, ok ? v : getPath(DEFAULTS, m.path));
    }
  }
  // 一時的に別の上書き設定で fn を実行する(試し計算用。終わったら元に戻す)
  function withOverrides(overrides, restore, fn) {
    applyOverrides(overrides);
    try { return fn(); } finally { applyOverrides(restore); }
  }
  // 進行中のゲームに使う設定:ゲームを作ったときの上書き + 表示だけに使う値は今の上書き
  function effectiveOverrides(gameOverrides, pending) {
    const out = Object.assign({}, gameOverrides || {});
    for (const m of CONFIG.paramMeta) {
      if (!m.displayOnly) continue;
      if (pending && pending[m.path] != null) out[m.path] = pending[m.path];
      else delete out[m.path];
    }
    return out;
  }
  function overridesToText(overrides) {
    return CONFIG.paramMeta.filter((m) => overrides && overrides[m.path] != null)
      .map((m) => m.path + ' = ' + overrides[m.path]).join('\n');
  }
  const Tuning = {
    DEFAULTS: DEFAULTS,
    getPath: getPath,
    defaultValue: (path) => getPath(DEFAULTS, path),
    currentValue: (path) => getPath(CONFIG, path),
    applyOverrides: applyOverrides,
    withOverrides: withOverrides,
    effectiveOverrides: effectiveOverrides,
    overridesToText: overridesToText,
  };

  // ===========================================================
  // 保存・リセット(Persist)
  //   storage は localStorage と同じ形(getItem / setItem / removeItem / key / length)
  // ===========================================================
  const KEYS = {
    save: CONFIG.storagePrefix + 'v' + CONFIG.saveVersion + '_save',
    overrides: CONFIG.storagePrefix + 'tune_overrides',
    benchmark: CONFIG.storagePrefix + 'tune_benchmark',
    lastTrial: CONFIG.storagePrefix + 'tune_lastTrial',
    ui: CONFIG.storagePrefix + 'v' + CONFIG.saveVersion + '_ui',   // 折りたたみの開閉の記憶・表示の詳しさ
  };
  function readJson(storage, key) {
    try {
      const raw = storage.getItem(key);
      return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
  }
  function writeJson(storage, key, value) {
    try { storage.setItem(key, JSON.stringify(value)); return true; } catch (e) { return false; }
  }
  // チーム戦力の月ごとの記録(powerLog)は保存しない(遊ぶ画面では使わない。sim.js などの集計はメモリ上の記録を使う)
  function saveGame(storage, state) { return writeJson(storage, KEYS.save, Object.assign({}, state, { powerLog: [] })); }
  function loadGame(storage) {
    const s = readJson(storage, KEYS.save);
    if (s && s.version === CONFIG.saveVersion && !Array.isArray(s.powerLog)) s.powerLog = [];
    return s && s.version === CONFIG.saveVersion ? s : null;
  }
  function loadOverrides(storage) { return readJson(storage, KEYS.overrides) || {}; }
  function saveOverrides(storage, ov) { return writeJson(storage, KEYS.overrides, ov || {}); }
  // 新しいゲームを作る:今の上書き設定を、このゲームの設定として固定する
  function startGame(storage, seed) {
    try { storage.removeItem(KEYS.ui); } catch (e) { /* なし */ }   // 開閉の記憶もリセットで消す
    const ov = loadOverrides(storage);
    applyOverrides(ov);
    const state = newGame({ seed: seed, overrides: ov });
    saveGame(storage, state);
    return state;
  }
  // 「同じシードでやり直す」
  function resetSameSeed(storage, state) { return startGame(storage, state.seed); }
  // 「新しいシードで始める」(seed を省くとランダム)
  function resetNewSeed(storage, seed) { return startGame(storage, seed); }
  // 「セーブを完全に消す」:このゲームの保存データ(bbgacha_ で始まるキー)をすべて消して、初期状態から
  function wipeAll(storage, seed) {
    const keys = [];
    try {
      for (let i = 0; i < storage.length; i++) {
        const k = storage.key(i);
        if (k && k.indexOf(CONFIG.storagePrefix) === 0) keys.push(k);
      }
      for (const k of keys) storage.removeItem(k);
    } catch (e) { /* 保存できない環境 */ }
    setBenchmark(null);
    applyOverrides({});
    const state = newGame({ seed: seed });
    saveGame(storage, state);
    return state;
  }
  // 起動時:?reset=1 なら全部消す。そうでなければ読み込み(なければ新規)
  function startup(storage, search) {
    const reset = /[?&]reset=1(&|$)/.test(search || '');
    if (reset) return { state: wipeAll(storage), reset: true };
    const custom = readJson(storage, KEYS.benchmark);
    if (custom) setBenchmark(custom, 'custom');
    const saved = loadGame(storage);
    if (saved) {
      applyOverrides(effectiveOverrides(saved.overrides, loadOverrides(storage)));
      return { state: saved, reset: false };
    }
    return { state: startGame(storage), reset: false };
  }
  // このゲームの保存データの大きさ(bbgacha_ で始まるキーの、キーと値の文字数の合計)
  function usage(storage) {
    let n = 0;
    try {
      for (let i = 0; i < storage.length; i++) {
        const k = storage.key(i);
        if (k && k.indexOf(CONFIG.storagePrefix) === 0) n += k.length + (storage.getItem(k) || '').length;
      }
    } catch (e) { /* 読めない環境 */ }
    return n;
  }
  const Persist = {
    KEYS: KEYS,
    usage: usage,
    readJson: readJson,
    writeJson: writeJson,
    saveGame: saveGame,
    loadGame: loadGame,
    loadOverrides: loadOverrides,
    saveOverrides: saveOverrides,
    startGame: startGame,
    resetSameSeed: resetSameSeed,
    resetNewSeed: resetNewSeed,
    wipeAll: wipeAll,
    startup: startup,
  };

  // ===========================================================
  // 自動実行と集計(Sim)。sim.js と調整画面の試し計算で共用する
  // ===========================================================
  // 方針の選択(auto:新入生と在校生の全員をおまかせ / balance / random)
  function makeChooser(seed, mode) {
    const pickRng = new Rng(seed ^ 0x9e3779b9); // ゲーム本体の乱数とは別
    return (p) => {
      const list = POLICIES[policySetOf(p)];
      if (mode === 'balance') return list[list.length - 1].key;
      if (mode === 'random') return pickRng.pick(list).key;
      return autoPolicy(p);
    };
  }
  // 1シードを1年ずつ進めるランナー。opts: { seed, years, policyMode, fixedCoachLv, observer }
  function createSeedRunner(opts) {
    const choose = makeChooser(opts.seed, opts.policyMode || 'auto');
    const t0 = Date.now();
    const state = newGame({ seed: opts.seed, fixedCoachLv: opts.fixedCoachLv, fixedRep: opts.fixedRep });
    const startMs = Date.now() - t0;   // 前史の所要時間(状態には入れない。同じシードで同じ結果にするため)
    return {
      state: state,
      startMs: startMs,
      done: () => state.stats.years >= opts.years,
      stepYear: () => {
        const target = state.stats.years + 1;
        while (state.stats.years < target) {
          if (state.awaiting) {
            const pol = {};
            for (const p of state.pendingRecruits) pol[p.id] = choose(p);
            for (const p of reviewablePlayers(state)) {
              if ((opts.policyMode || 'auto') === 'auto' || p.needsPolicy) pol[p.id] = choose(p);
            }
            confirmPolicies(state, pol);
            continue;
          }
          advanceToNextEvent(state, opts.observer);
        }
      },
    };
  }
  // 自校の在校生のラベルの割合(毎月の観測)
  function labelObserver(acc) {
    return (state, month) => {
      if (!benchmark) return;
      for (const p of state.players) {
        if (p.helper) continue;
        const r = getGenerationRank(p, p.retired ? 3 : p.grade, p.retired ? 3 : month);
        acc.total++;
        if (r && r.top <= CONFIG.labelTop.promising) acc.promising++;
        if (r && r.top <= CONFIG.labelTop.monster) acc.monster++;
      }
    };
  }
  // 複数シードの実行を、少しずつ進められる形にする(画面が固まらないように)
  //   opts: { seeds: [..], years, policyMode }。step() を呼ぶたびに1年進む
  function createRunner(opts) {
    const labels = { total: 0, promising: 0, monster: 0 };
    const runners = [];
    let idx = 0;
    const totalSteps = opts.seeds.length * opts.years;
    let done = 0;
    return {
      labels: labels,
      progress: () => done / totalSteps,
      finished: () => idx >= opts.seeds.length,
      step: () => {
        if (idx >= opts.seeds.length) return true;
        if (!runners[idx]) runners[idx] = createSeedRunner({ seed: opts.seeds[idx], years: opts.years, policyMode: opts.policyMode, observer: labelObserver(labels) });
        const r = runners[idx];
        r.stepYear();
        done++;
        if (r.done()) idx++;
        return idx >= opts.seeds.length;
      },
      states: () => runners.map((r) => r.state),
      startMs: () => Math.max.apply(null, runners.map((r) => r.startMs).concat([0])),
    };
  }
  function quantile(sorted, q) {
    if (!sorted.length) return NaN;
    return sorted[Math.min(sorted.length - 1, Math.floor(q * (sorted.length - 1)))];
  }
  function mean_(arr) { return arr.length ? arr.reduce((a, b) => a + b, 0) / arr.length : NaN; }
  // 卒業生の区分
  function gradGroups(grads) {
    const starterRatio = (a) => (a.teamGames ? a.starts / a.teamGames : 0);
    const bloom = (a) => a.talent === 'genius' && !a.geniusBust;
    const isNormal = (a) => !a.reincarnation && !bloom(a);
    return {
      normal: grads.filter(isNormal),
      starter: grads.filter((a) => isNormal(a) && starterRatio(a) >= 0.6),
      bench: grads.filter((a) => isNormal(a) && starterRatio(a) <= 0.2),
      genius: grads.filter((a) => bloom(a) && !a.reincarnation),
      reinc: grads.filter((a) => a.reincarnation && !bloom(a)),
      both: grads.filter((a) => a.reincarnation && bloom(a)),
      twoWay: grads.filter((a) => a.twoWay),
    };
  }
  // 結果の集計(目安と比べる項目)
  //   extra:{ preMs }(前史の所要時間。ランナーの startMs())
  function analyze(states, labels, extra) {
    const grads = [];
    let years = 0;
    let limitBreaks = 0;
    const sum = { practice: 0, camp: 0, exp: 0 };
    const titles = { summer: [], autumn: [] };
    const reach = { lv5: [], lv10: [] };
    for (const st of states) {
      years += st.stats.years;
      limitBreaks += st.stats.limitBreak.count;
      for (const a of st.alumni) if (a.origin === 'recruit') grads.push(a);
      for (const k of ['summer', 'autumn']) {
        const t = st.stats.tournaments[k];
        if (t.played) titles[k].push(t.champion / t.played);
      }
      const L = st.stats.leadershipByYear;
      const f = (lv) => { const i = L.findIndex((v) => v >= lv); return i < 0 ? null : i + 1; };
      reach.lv5.push(f(5));
      reach.lv10.push(f(10));
    }
    for (const a of grads) for (const k of Object.keys(sum)) sum[k] += (a.growthBy && a.growthBy[k]) || 0;
    const tot = sum.practice + sum.camp + sum.exp;
    const g = gradGroups(grads);
    const avgR = (list) => mean_(list.map((a) => a.rating));
    // 指導力:Lv10 に最も早く届いたシード(強い年が続いたチーム)の、Lv5・Lv10 の到達年
    let strong = -1;
    reach.lv10.forEach((v, i) => { if (v != null && (strong < 0 || v < reach.lv10[strong])) strong = i; });
    if (strong < 0) reach.lv5.forEach((v, i) => { if (v != null && (strong < 0 || v < reach.lv5[strong])) strong = i; });
    return Object.assign({
      grads: grads.length,
      years: years,
      normalGrad: avgR(g.normal),
      starterGrad: avgR(g.starter),
      benchGrad: avgR(g.bench),
      geniusGrad: avgR(g.genius),
      reincGrad: avgR(g.reinc),
      bothGrad: avgR(g.both),
      counts: { normal: g.normal.length, starter: g.starter.length, bench: g.bench.length, genius: g.genius.length, reinc: g.reinc.length, both: g.both.length },
      over500: grads.length ? grads.filter((a) => a.rating > 500).length / grads.length : NaN,
      over600: grads.length ? grads.filter((a) => a.rating > 600).length / grads.length : NaN,
      cappedShare: g.normal.length ? g.normal.filter((a) => a.cappedOut).length / g.normal.length : NaN,
      limitBreaks: years ? limitBreaks / years * 10 : NaN,
      sharePractice: tot ? sum.practice / tot : NaN,
      shareCamp: tot ? sum.camp / tot : NaN,
      shareExp: tot ? sum.exp / tot : NaN,
      lv5Years: strong >= 0 ? reach.lv5[strong] : null,
      lv10Years: strong >= 0 ? reach.lv10[strong] : null,
      lvReach: reach,
      summerTitle: mean_(titles.summer),
      autumnTitle: mean_(titles.autumn),
      preHistoryMs: extra && extra.preMs != null ? extra.preMs : NaN,
      promisingUp: labels && labels.total ? labels.promising / labels.total : NaN,
      monsterUp: labels && labels.total ? labels.monster / labels.total : NaN,
    }, analyzeVisual(states), analyzeStartAndRep(states), repSynthetic(), analyzeLineup(states));
  }
  // スタメン編成の集計(不変条件の違反・本職外起用の割合・上位3人の控え)
  function analyzeLineup(states) {
    const t = { months: 0, violations: 0, oop: 0, starters: 0, top3: 0, top3Out: 0, oopMonths: 0, oopByPos: { P: 0, C: 0, IF: 0, OF: 0 } };
    for (const s of states) {
      const L = s.stats.lineupCheck;
      if (!L) continue;
      for (const k of Object.keys(t)) if (k !== 'oopByPos') t[k] += L[k];
      for (const k of POSITIONS) t.oopByPos[k] += L.oopByPos[k];
    }
    return {
      lineupViolations: t.months ? t.violations : NaN,
      offPositionShare: t.starters ? t.oop / t.starters : NaN,
      top3Benched: t.top3 ? t.top3Out / t.top3 : NaN,
      lineupStats: t,
    };
  }
  // 前史と評判の集計
  function analyzeStartAndRep(states) {
    const b = benchmark;
    const st = states.filter((s) => s.stats.start);
    const g2 = mean_(st.map((s) => s.stats.start.g2));
    const g3 = mean_(st.map((s) => s.stats.start.g3));
    let startVsBench = NaN;
    if (b && b.rows['2-4'] && b.rows['3-4']) startVsBench = Math.max(Math.abs(g2 / b.rows['2-4'].p50 - 1), Math.abs(g3 / b.rows['3-4'].p50 - 1));
    const april = (s, y) => { const e = s.powerLog.find((x) => x.y === y && x.m === 4); return e ? e.p : null; };
    const p1 = st.map((s) => april(s, 1)).filter((v) => v != null);
    const p23 = st.map((s) => [april(s, 2), april(s, 3)].filter((v) => v != null)).filter((a) => a.length).map((a) => mean_(a));
    const reps = [];
    for (const s of states) for (const r of s.stats.repByYear) reps.push(r);
    return {
      startG2: g2,
      startG3: g3,
      startVsBench: startVsBench,
      startPowerGap: p1.length && p23.length ? Math.abs(mean_(p1) / mean_(p23) - 1) : NaN,
      repCapYears: reps.length ? reps.filter((r) => r.x >= 0.999).length / reps.length : NaN,
      repAvg: reps.length ? mean_(reps.map((r) => r.rep)) : NaN,
      repXAvg: reps.length ? mean_(reps.map((r) => r.x)) : NaN,
    };
  }
  // 評判の効果:x = 0 と x = 1 で新入生をたくさん抽選して比べる(試し抽選。ゲームには影響しない)
  function repSynthetic(n) {
    n = n || 20000;
    const draw = (x) => {
      const rng = new Rng(20240607);
      const q = recruitQuality(x);
      const list = [];
      for (let i = 0; i < n; i++) list.push(createPlayer(rng, { id: i, year: 1, quality: q }));
      return list;
    };
    const special = (p) => p.talent === 'genius' || !!p.reincarnation;
    const a0 = draw(0);
    const a1 = draw(1);
    const normAvg = (list) => mean_(list.filter((p) => !special(p)).map((p) => rating(p)));
    const talentRate = (list) => list.filter(special).length / list.length;
    return {
      repTopGain: normAvg(a1) - normAvg(a0),
      repNormalShare: a1.filter((p) => !special(p) && rating(p) >= 80 && rating(p) <= 120).length / a1.length,
      repTalentMult: talentRate(a1) / talentRate(a0),
    };
  }
  // 見える化の集計:勝率予想の校正・チーム戦力の推移・成長の反映・ハイライト・保存容量
  function analyzeVisual(states) {
    const V = CONFIG.visual;
    const bins = [];
    for (let i = 0; i < 10; i++) bins.push({ n: 0, w: 0, p: 0 });
    let hl = { games: 0, count: 0, withNote: 0 };
    const powerByYear = {};
    const reflect = [];
    const growth = [];
    const storage = [];
    for (const st of states) {
      (st.stats.calib || []).forEach((c, i) => { if (c) { bins[i].n += c.n; bins[i].w += c.w; bins[i].p += c.p; } });
      const H = st.stats.highlights;
      hl = { games: hl.games + H.games, count: hl.count + H.count, withNote: hl.withNote + H.withNote };
      const byY = {};
      for (const e of st.powerLog) (byY[e.y] = byY[e.y] || []).push(e.p);
      const ys = Object.keys(byY).map(Number).sort((a, b) => a - b);
      for (const y of ys) (powerByYear[y] = powerByYear[y] || []).push(mean_(byY[y]));
      if (ys.length >= 6) {
        const first = mean_(byY[ys[0]]);
        const last5 = mean_(ys.slice(-5).map((y) => mean_(byY[y])));
        growth.push((last5 - first) / first);
      }
      const ref = opponentRef();
      const at = (y, m) => st.powerLog.find((e) => e.y === y && e.m === m);
      // 各年の4月と、その2年後の4月(その年の1年生が3年生になったとき)の差を、全学年ぶん平均する
      for (let y = 1; y + 2 <= st.stats.years; y++) {
        const a = at(y, 4);
        const b = at(y + 2, 4);
        if (a && b) reflect.push(winProbability(b.st, ref.avg) - winProbability(a.st, ref.avg));
      }
      // 保存容量:年数に比例して増える分を、50年ぶんに引き延ばして見積もる
      const size = JSON.stringify(st).length;
      const years = Math.max(1, st.stats.years);
      const base = 60000; // 開始直後のおおよその大きさ
      storage.push((base + Math.max(0, size - base) / years * 50) / V.storageQuotaChars);
    }
    const calibRows = bins.map((b, i) => ({ bin: i, n: b.n, pred: b.n ? b.p / b.n : NaN, actual: b.n ? b.w / b.n : NaN }));
    const used = calibRows.filter((r) => r.n >= V.calibrationMinGames);
    return {
      calibration: used.length ? Math.max.apply(null, used.map((r) => Math.abs(r.actual - r.pred))) : NaN,
      calibRows: calibRows,
      powerGrowth: growth.length ? mean_(growth) : NaN,
      powerByYear: Object.keys(powerByYear).map(Number).sort((a, b) => a - b).map((y) => ({ y: y, p: mean_(powerByYear[y]) })),
      growthReflect: reflect.length ? mean_(reflect) : NaN,
      highlightsPerGame: hl.games ? hl.count / hl.games : NaN,
      growthNoteShare: hl.count ? hl.withNote / hl.count : NaN,
      storageShare: storage.length ? Math.max.apply(null, storage) : NaN,
    };
  }
  // 目安との比較:✓ 範囲内 / △ 目安の±20%以内 / ✕ それ以外 / − データなし(該当する選手がいない、未到達など)
  function judgeValue(v, t) {
    if (v == null || Number.isNaN(v)) return '−';
    const lo = t.min != null ? t.min : -Infinity;
    const hi = t.max != null ? t.max : Infinity;
    if (v >= lo && v <= hi) return '✓';
    if (v >= lo * 0.8 && v <= hi * 1.2) return '△';
    return '✕';
  }
  function judge(metrics) {
    return Object.keys(CONFIG.targets).map((key) => {
      const t = CONFIG.targets[key];
      return { key: key, label: t.label, value: metrics[key], target: t, verdict: judgeValue(metrics[key], t), tune: t.tune };
    });
  }
  function formatMetric(v, t) {
    if (v == null || Number.isNaN(v)) return '-';
    if (t && t.pct) return (v * 100).toFixed(1) + '%';
    return Math.abs(v) >= 10 ? String(Math.round(v)) : (Math.round(v * 10) / 10).toString();
  }
  function formatTarget(t) {
    const f = (v) => formatMetric(v, t);
    if (t.min != null && t.max != null) return f(t.min) + '〜' + f(t.max);
    if (t.max != null) return f(t.max) + '以下';
    return f(t.min) + '以上';
  }

  // 世代の基準をつくる(標準的な学校:指導力固定・おまかせ)。step() で1年ずつ進む
  function createBenchmarkRunner(opts) {
    opts = Object.assign({ seeds: CONFIG.benchmarkRuns.seeds, years: CONFIG.benchmarkRuns.years, burnIn: CONFIG.benchmarkRuns.burnIn, coachLv: CONFIG.baselineCoachLv, seedBase: 1000 }, opts || {});
    const samples = {};
    const observer = (state, month) => {
      if (state.stats.years < opts.burnIn) return;
      for (const p of state.players) {
        if (p.helper) continue;
        const grade = p.retired ? 3 : p.grade;
        const key = grade + '-' + month;
        (samples[key] = samples[key] || []).push(rating(p));
      }
    };
    const total = opts.seeds * opts.years;
    let done = 0;
    let i = 0;
    let cur = null;
    return {
      progress: () => done / total,
      finished: () => i >= opts.seeds,
      step: () => {
        if (i >= opts.seeds) return true;
        if (!cur) cur = createSeedRunner({ seed: opts.seedBase + i, years: opts.years, policyMode: 'auto', fixedCoachLv: opts.coachLv, fixedRep: true, observer: observer });
        cur.stepYear();
        done++;
        if (cur.done()) { i++; cur = null; }
        return i >= opts.seeds;
      },
      result: () => {
        const rows = {};
        for (const key of Object.keys(samples)) {
          const v = samples[key].slice().sort((a, b) => a - b);
          rows[key] = { n: v.length, p50: quantile(v, 0.5), p90: quantile(v, 0.9), p97: quantile(v, 0.97), p99: quantile(v, 0.99), p999: quantile(v, 0.999) };
        }
        return { hash: benchmarkConfigHash(), runs: { seeds: opts.seeds, years: opts.years, burnIn: opts.burnIn }, coachLv: opts.coachLv, rows: rows };
      },
    };
  }
  const Sim = {
    createSeedRunner: createSeedRunner,
    createRunner: createRunner,
    createBenchmarkRunner: createBenchmarkRunner,
    analyze: analyze,
    gradGroups: gradGroups,
    judge: judge,
    judgeValue: judgeValue,
    formatMetric: formatMetric,
    formatTarget: formatTarget,
    quantile: quantile,
  };

  return { CONFIG: CONFIG, Core: Core, HighSchool: HighSchool, Generation: Generation, Tuning: Tuning, Persist: Persist, Sim: Sim };
});
</script>
<script>
(function () {
  'use strict';
  if (!window.Logic) {
    // config.js / logic.js を読み込めなかった(プレビューなどで単体表示された)場合
    document.getElementById('main').innerHTML = '<div class="card"><h2>読み込みエラー</h2>'
      + '<div class="small">config.js と logic.js を読み込めませんでした。index.html と同じフォルダに置いて開くか、'
      + '単一ファイル版の play.html を開いてください。</div></div>';
    return;
  }
  const { CONFIG, Core, HighSchool, Generation, Tuning, Persist, Sim } = window.Logic;
  let state = null;
  // 開発用の入口:URL に ?dev=1 を付けたときだけ、調整タブと世代の基準の警告を出す(保存データには影響しない)
  const DEV = /[?&]dev=1(&|$)/.test(window.location.search);
  let tab = 'home';
  let alumniFilter = 'all';
  let autoTarget = 'new';        // おまかせの対象:'new'(新入生のみ) / 'all'(全員)
  let pendingWatchId = null;     // 上限を超えて注目しようとした選手
  const draftPolicies = {};      // 方針の選択画面で選択中の方針

  // ---------- セーブ / ロード ----------
  // localStorage が使えない環境(一部のプレビュー)では、メモリ上の保存で代用する
  const storage = (function () {
    try {
      const t = '__bbgacha_test__';
      window.localStorage.setItem(t, '1');
      window.localStorage.removeItem(t);
      return window.localStorage;
    } catch (e) {
      const m = new Map();
      return {
        getItem: (k) => (m.has(k) ? m.get(k) : null), setItem: (k, v) => m.set(k, String(v)), removeItem: (k) => m.delete(k),
        key: (i) => Array.from(m.keys())[i] || null, get length() { return m.size; }, memory: true,
      };
    }
  })();
  let modal = null;              // 確認のダイアログ { text, action }
  let detailPid = null;          // 見直し画面から開いた選手詳細
  // 表示の詳しさ(最小 / 標準 / 詳細)と、折りたたみの開閉の記憶(パネルごと)。リセットで消える
  const UI_FORMAT = 3;   // 開閉の記憶の形式(パネルの構成を変えたら上げる。違う形式の記憶は使わない)
  let uiPrefs = loadUiPrefs();
  function loadUiPrefs() {
    let u = Persist.readJson(storage, Persist.KEYS.ui) || {};
    if (u.fmt !== UI_FORMAT) {   // 古い形式の記憶は消す
      try { storage.removeItem(Persist.KEYS.ui); } catch (e) { /* なし */ }
      u = {};
    }
    return { fmt: UI_FORMAT, level: u.level || CONFIG.display.defaultLevel, open: u.open || {}, polSort: u.polSort || 'need', polFilter: u.polFilter || 'all' };
  }
  function saveUi() { Persist.writeJson(storage, Persist.KEYS.ui, uiPrefs); }
  // 開いているか:個別に開閉した記憶 → 表示の詳しさ(詳細=全部 / 標準=panelDefaults / 最小=閉じる)→ defaultOpen
  function isOpen(key, defaultOpen) {
    if (Object.prototype.hasOwnProperty.call(uiPrefs.open, key)) return !!uiPrefs.open[key];
    if (uiPrefs.level === 'full') return true;
    if (uiPrefs.level === 'std' && CONFIG.display.panelDefaults.std.some((k) => key === k || key.indexOf(k + ':') === 0)) return true;
    return !!defaultOpen;
  }
  // 共通部品:1行の要約(押せる)+ 押して開いたときに初めて描画する詳細(遅延描画)
  //   options:{ defaultOpen, cls, forceOpen, after(要約の下に常に出す部分。ボタンの外なのでプルダウンも置ける) }
  function renderCollapsible(key, summary, renderDetail, options) {
    options = options || {};
    const open = options.forceOpen || isOpen(key, options.defaultOpen);
    return '<div class="col ' + (options.cls || '') + '"><button class="colhead" data-col="' + esc(key) + '" aria-expanded="' + open + '">'
      + '<span class="ar">' + (open ? '▾' : '▸') + '</span>' + summary + (open ? '' : '<span class="more">詳しく</span>') + '</button>'
      + (options.after || '') + (open ? '<div class="colbody">' + renderDetail() + '</div>' : '') + '</div>';
  }

  // 共通部品:能力の詳細(項目ごとの現在値・入学時からの増減・前回の見直しからの増減・横棒・印)
  //   options:{ detail(false は能力の枠だけ。true で補助情報つき), policy(▲ の計算に使う方針。省くと今の方針) }。二刀流は投手系と野手系を分けて出す
  function lastReviewAbilities(p) {
    if (!p.mlog) return null;
    const cur = HighSchool.monthSerial(state.year, state.month);
    for (let sv = cur - 1; sv >= cur - 12; sv--) {
      const idx = ((sv % 12) + 12) % 12;
      const m = HighSchool.CALENDAR[idx].month;
      if (CONFIG.policyReviewMonths.indexOf(m) >= 0) return HighSchool.abilitiesAt(p, sv - 1);
    }
    return null;
  }
  function statSides(p) {
    return Core.isTwoWayKnown(p) || (p.finalAbilities && p.twoWay) ? [Core.PITCH_KEYS, Core.BAT_KEYS] : [Core.sideKeys(Core.sideOf(p.position))];
  }
  function renderPlayerStatsCompact(p, options) {
    options = options || {};
    if (!options.detail) return abilBoxes(p);
    // 詳細:入学時から・前回の見直しからの増減、最高・最低・▲・壁の印、横棒、判明している副能力
    const a = p.finalAbilities || p.abilities;
    const dec = growthView.decimal;
    const fmt = (v) => (dec ? Core.round1(v).toFixed(1) : String(Math.round(v)));
    const dlt = (v) => { const r = dec ? Core.round1(v) : Math.round(v); return r === 0 ? '±0' : (r > 0 ? '+' : '') + (dec ? r.toFixed(1) : r); };
    const prev = p.finalAbilities ? null : lastReviewAbilities(p);
    const weights = p.finalAbilities ? {} : Core.policyWeightMap(options.policy != null && options.policy !== p.policy ? Object.assign({}, p, { policy: options.policy }) : p);
    const sides = statSides(p);
    const item = (k, keys, sub) => {
      const v = a[k];
      const vals = keys.map((x) => a[x]);
      const marks = [];
      if (!sub && keys.length > 1 && v === Math.max.apply(null, vals)) marks.push('<span class="mk best">最高</span>');
      if (!sub && keys.length > 1 && v === Math.min.apply(null, vals)) marks.push('<span class="mk worst">最低</span>');
      if (!sub && weights[k] >= CONFIG.policyScreen.strongWeight && Object.values(weights).some((w) => w < CONFIG.policyScreen.strongWeight)) marks.push('<span class="mk up">▲</span>');
      const cap = p.limit && p.limit.caps[k] != null ? p.limit.caps[k] : p.statCap;
      if (!sub && cap && v >= cap * CONFIG.display.wallRatio) marks.push('<span class="mk wall">壁</span>');
      const base = Math.min(v, 100);
      return '<div class="it' + (sub ? ' sub' : '') + '"><div class="hd"><span>' + Core.ABILITY_LABEL[k] + marks.join('') + '</span><b>' + fmt(v) + '</b></div>'
        + '<div class="bar"><i style="width:' + base + '%"></i>' + (v > 100 ? '<i class="ov" style="left:' + (100 - Math.min(v - 100, 100)) + '%;width:' + Math.min(v - 100, 100) + '%"></i>' : '') + '</div>'
        + '<div class="dd">入学時から ' + dlt(v - p.initialAbilities[k]) + (prev ? ' / 前回の見直しから ' + dlt(v - prev[k]) : '') + '</div></div>';
    };
    let html = sides.map((keys) => (sides.length > 1 ? '<div class="sublabel">' + (keys === Core.PITCH_KEYS ? '投手系' : '野手系') + '</div>' : '')
      + '<div class="pst">' + keys.map((k) => item(k, keys, false)).join('') + '</div>').join('');
    // 副能力:判明している場合のみ、本職側とは分けて薄く表示
    const known = p.finalAbilities ? p.subRevealed : Core.isSubKnown(p);
    if (sides.length === 1 && known) {
      const sk = Core.ALL_KEYS.filter((k) => sides[0].indexOf(k) < 0);
      html += '<div class="sublabel">副能力(判明済み)</div><div class="pst">' + sk.map((k) => item(k, sk, true)).join('') + '</div>';
    }
    return html;
  }
  // 本職側の最高・最低の項目(1行の要約用)
  function bestWorst(p) {
    const a = p.finalAbilities || p.abilities;
    const keys = Core.visibleKeys(p);
    let b = keys[0];
    let w = keys[0];
    for (const k of keys) { if (a[k] > a[b]) b = k; if (a[k] < a[w]) w = k; }
    return '最高 ' + Core.ABILITY_LABEL[b] + ' ' + Math.round(a[b]) + ' / 最低 ' + Core.ABILITY_LABEL[w] + ' ' + Math.round(a[w]);
  }
  const growthView = { serial: null, filter: 'all', changedOnly: false, decimal: false };  // 成長タブ
  let storageWarn = false;       // 保存容量の警告
  let trial = { running: false, progress: 0, result: null, label: '' };   // 試し計算
  let benchJob = { running: false, progress: 0 };                          // 世代の基準の再計算
  let copyText = null;
  let pending = Persist.loadOverrides(storage);                            // 調整画面の上書き設定(次のゲームから)
  function save() {
    Persist.saveGame(storage, state);
    const V = CONFIG.visual;
    if (Persist.usage(storage) > V.storageQuotaChars * V.storageWarnRatio) {
      storageWarn = true;
      if (HighSchool.compressAlumniLogs(state, 0)) Persist.saveGame(storage, state);
    }
  }
  function clearDraft() { for (const k of Object.keys(draftPolicies)) delete draftPolicies[k]; }
  // 画面のメモリ上の状態をすべて初期化する(リセットの後)
  function resetUiState() {
    tab = 'home';
    alumniFilter = 'all';
    autoTarget = 'new';
    pendingWatchId = null;
    clearDraft();
    modal = null;
    detailPid = null;
    copyText = null;
    growthView.serial = null;
    growthView.filter = 'all';
    growthView.changedOnly = false;
    growthView.decimal = false;
    storageWarn = false;
    uiPrefs = loadUiPrefs();
  }
  // 進行中のゲームに使う設定(作ったときの上書き + 表示だけに使う値は今の上書き)
  function applyGameConfig() { Tuning.applyOverrides(Tuning.effectiveOverrides(state.overrides, pending)); }

  // ---------- 表示ヘルパー ----------
  function esc(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  const int = (v) => Math.round(v);
  function vClass(v) { return v > 100 ? 'v100' : v >= 80 ? 'v80' : v >= 60 ? 'v60' : v >= 40 ? 'v40' : 'v0'; }
  // 能力のマス目。keys の順に並べる。base を渡すと増分も表示。100を超えた項目は金色
  // 能力の枠(項目ごとのボックス)。useDecimal のときは「小数で表示」の設定に従う
  function abilGrid(keys, abilities, base, useDecimal) {
    const dec = useDecimal && growthView.decimal;
    const show = (v) => (dec ? Core.round1(v).toFixed(1) : String(int(v)));
    return '<div class="abil" style="--cols:' + keys.length + '">' + keys.map((k) => {
      const v = abilities[k];
      const diff = base ? int(v) - int(base[k]) : 0;
      return '<div class="' + vClass(v) + '">' + Core.ABILITY_LABEL[k] + '<b>' + show(v) + '</b>'
        + (base ? '<span class="small">' + (diff > 0 ? '+' + diff : '±0') + '</span>' : '') + '</div>';
    }).join('') + '</div>';
  }

  // 同世代の上位○%(世代の基準と比べる)。卒業生・引退後の3年生は3年3月、入学前は1年4月の基準
  function genRank(p) {
    const isAlumni = !!p.finalAbilities;
    const pendingNew = state.pendingRecruits.indexOf(p) >= 0;
    const grade = isAlumni || p.retired ? 3 : pendingNew ? 1 : p.grade;
    const month = isAlumni || p.retired ? 3 : pendingNew ? 4 : HighSchool.CALENDAR[state.month].month;
    return Generation.getGenerationRank(p, grade, month);
  }
  // ラベルと「同世代 上位○%」(p50 より下は何も出さない)
  function ratingBadge(p) {
    const r = genRank(p);
    if (!r) return '';
    const cls = r.label === '規格外' ? ' r400' : r.label === '怪物級' ? ' r200' : '';
    return (r.label ? '<span class="rlabel' + cls + '">' + r.label + '</span>' : '')
      + '<span class="gen">同世代 上位' + Generation.formatTop(r.top) + '</span>';
  }
  function ratingHtml(p) {
    if (Core.isTwoWayKnown(p) || (p.finalAbilities && p.twoWay)) {
      const s = Core.ratingSides(p);
      return '総合値 投<span class="rt">' + s.pitch + '</span>/打<span class="rt">' + s.bat + '</span>' + ratingBadge(p);
    }
    const r = p.finalAbilities ? p.rating : Core.rating(p);
    return '総合値 <span class="rt">' + r + '</span>' + ratingBadge(p);
  }
  function policyUI() { return !!CONFIG.policyControlEnabled; }
  // 方針の選択を出さないとき、見直しの月で止まっていたら、おまかせで確定して進める(設定の切り替え直後や読み込み時)
  function ensureNoReview() {
    if (!policyUI() && HighSchool.resolveReviewAuto(state)) save();
  }
  function staleWarning() {
    if (!DEV) return '';   // 開発用の表示(?dev=1 のときだけ)
    if (!Generation.getBenchmark()) return '<div class="warnbox">世代の基準(benchmark.js)がありません。ラベルは表示されません。</div>';
    return Generation.isStale() ? '<div class="warnbox">⚠ 世代の基準が古い可能性があります(再計算してください。調整タブ)</div>' : '';
  }
  function posTag(pos) { return '<span class="tag ' + pos + '">' + Core.POSITION_LABEL[pos] + '</span>'; }
  function extraTags(p, isAlumni) {
    let t = '';
    if (p.twoWay && (p.twoWayRevealed || isAlumni)) t += '<span class="tag twoway">二刀流</span>';
    if (p.reincarnation && (p.reincarnationRevealed || isAlumni)) {
      t += '<span class="tag reinc">転生:' + esc(Core.reincarnationName(p.reincarnation)) + '</span>';
    }
    if (p.helper) t += '<span class="tag helper">助っ人</span>';
    if (p.convert) t += '<span class="tag conv">転向中</span>';
    if (p.retired) t += '<span class="tag ret">引退</span>';
    return t;
  }
  function histList(history) {
    return '<ul class="hist">' + history.map((h) =>
      '<li>' + HighSchool.formatYear(h.y) + '(' + h.g + '年) ' + esc(h.ev) + (h.res ? ':' + esc(h.res) : '')
      + (h.d && Object.keys(h.d).length ? ' <span class="small">' + esc(Core.formatDelta(h.d)) + '</span>' : '') + '</li>'
    ).join('') + '</ul>';
  }
  function snapTable(keys, snaps, current) {
    if (!snaps || !snaps.length) return '';
    let html = '<div class="scroll"><table class="snap"><tr><th>年</th>' + keys.map((k) => '<th>' + Core.ABILITY_LABEL[k] + '</th>').join('') + '<th>総合値</th></tr>';
    const row = (label, a) => '<tr><td>' + label + '</td>' + keys.map((k) => '<td>' + int(a[k]) + '</td>').join('')
      + '<td>' + Core.ratingOfKeys(a, keys) + '</td></tr>';
    snaps.forEach((s, i) => { html += row(i === 0 ? '入学時' : HighSchool.formatYear(s.y) + '末', s.a); });
    if (current) html += row('現在', current);
    return html + '</table></div>';
  }
  function aptLine(p) {
    const known = Core.isSubKnown(p);
    const side = Core.mainSide(p);
    const parts = Core.POSITIONS.filter((pos) => known || Core.sideOf(pos) === side)
      .map((pos) => Core.POSITION_SHORT[pos] + ' ' + int(Core.aptitude(p, pos)));
    let s = '適性:' + parts.join(' / ');
    if (p.convert) s += '(' + Core.POSITION_LABEL[p.convert.pos] + 'は転向直後のため -' + p.convert.penalty + ')';
    return '<div class="small">' + s + '</div>';
  }
  function growthLabel(p) {
    const t = Core.formatBestGrowth(Core.growthSinceEntry(p));
    return t ? '<span class="gr">' + esc(t) + '</span>' : '';
  }
  function starBtn(p) {
    return '<button class="star' + (p.watched ? ' on' : '') + '" data-watch="' + p.id + '" title="注目">' + (p.watched ? '★' : '☆') + '</button>';
  }
  // 能力の推移のグラフ(インラインSVG)。横軸は学期、縦軸は能力値、能力ごとに線を分ける
  const LINE_COLORS = ['#c0392b', '#2471a3', '#1e8449', '#b9770e', '#7d3c98', '#117a65', '#a04000', '#5d6d7e', '#cb4335'];
  // 学期の名前(入学・1年夏・1年冬…卒業)から、月の番号を求める
  function termSerial(p, label) {
    const base = HighSchool.monthSerial(p.enrolledYear, 0);
    if (label === '入学' || label === '加入') return base - 0.5;
    if (label === '卒業') return base + 35;
    const m = /^(\d)年(夏|冬)$/.exec(label);
    if (!m) return null;
    return base + (Number(m[1]) - 1) * 12 + (m[2] === '夏' ? 2 : 8);
  }
  // 能力の推移のグラフ(インラインSVG)。月ごとの点で描き、学期(入学・合宿・卒業)に印を付ける
  function growthChart(p, keys) {
    const pts = [];
    const marks = [];
    for (const t of (p.timeline || [])) {
      const sx = termSerial(p, t.label);
      if (sx == null) continue;
      marks.push({ s: sx, label: t.label.replace('年', '').replace('入学', '入').replace('卒業', '卒') });
      if (!p.mlog || sx < p.mlog.s) pts.push({ s: sx, a: t.a });
    }
    if (p.mlog) p.mlog.a.forEach((arr, i) => pts.push({ s: p.mlog.s + i, a: HighSchool.unpackAbilities(arr) }));
    if (!p.finalAbilities && !p.mlog) pts.push({ s: HighSchool.monthSerial(state.year, state.month), a: p.abilities });
    pts.sort((a, b) => a.s - b.s);
    if (pts.length < 2) return '';
    let top = 100;
    for (const pt of pts) for (const k of keys) top = Math.max(top, pt.a[k]);
    top = top > 100 ? 150 : 100;
    const s0 = pts[0].s;
    const s1 = Math.max(pts[pts.length - 1].s, s0 + 1);
    const W = 320, H = 150, L = 24, R = 10, T = 6, B = 24;
    const x = (sv) => L + (W - L - R) * (sv - s0) / (s1 - s0);
    const y = (v) => T + (H - T - B) * (1 - v / top);
    let svg = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="能力の推移">';
    for (let v = 0; v <= top; v += top > 100 ? 25 : 20) {
      svg += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(v) + '" y2="' + y(v) + '" stroke="' + (v === 100 && top > 100 ? '#e0b84d' : '#e5ddd0') + '" stroke-width="1"/>'
        + '<text x="' + (L - 3) + '" y="' + (y(v) + 3) + '" font-size="8" text-anchor="end" fill="#999">' + v + '</text>';
    }
    for (const m of marks) {
      if (m.s < s0 || m.s > s1) continue;
      svg += '<line x1="' + x(m.s).toFixed(1) + '" x2="' + x(m.s).toFixed(1) + '" y1="' + T + '" y2="' + (H - B) + '" stroke="#d8cfbf" stroke-dasharray="2,2"/>'
        + '<text x="' + x(m.s).toFixed(1) + '" y="' + (H - B + 10) + '" font-size="7.5" text-anchor="middle" fill="#888">' + esc(m.label) + '</text>';
    }
    keys.forEach((k, ki) => {
      const c = LINE_COLORS[ki % LINE_COLORS.length];
      svg += '<polyline points="' + pts.map((pt) => x(pt.s).toFixed(1) + ',' + y(pt.a[k]).toFixed(1)).join(' ') + '" fill="none" stroke="' + c + '" stroke-width="1.4"/>';
      for (const m of marks) {
        const pt = pts.find((q) => Math.abs(q.s - m.s) < 0.6);
        if (pt) svg += '<circle cx="' + x(pt.s).toFixed(1) + '" cy="' + y(pt.a[k]).toFixed(1) + '" r="1.8" fill="' + c + '"/>';
      }
    });
    svg += '</svg>';
    const legend = '<div class="legend">' + keys.map((k, ki) => '<i style="background:' + LINE_COLORS[ki % LINE_COLORS.length] + '"></i>'
      + Core.ABILITY_LABEL[k]).join('') + '</div>';
    return '<div class="sublabel">能力の推移(月ごと。点は学期:入・夏・冬・卒)</div>' + svg + legend;
  }
  function renderWatchChooser() {
    if (pendingWatchId == null) return '';
    const cur = HighSchool.watchedPlayers(state);
    const target = state.players.concat(state.pendingRecruits).find((p) => p.id === pendingWatchId);
    if (!target) return '';
    return '<div class="card chooser"><h2>★ 注目選手は' + CONFIG.watch.max + '人までです</h2>'
      + '<div class="small">' + esc(target.name) + 'を注目にするため、外す選手を選んでください。</div>'
      + cur.map((p) => '<button data-swapwatch="' + p.id + '">★ ' + esc(p.name) + '(' + p.grade + '年・' + Core.POSITION_SHORT[p.position] + ')を外す</button>').join('')
      + '<div><button data-swapwatch="cancel">やめる</button></div></div>';
  }
  function whenText(n) { return HighSchool.formatYear(n.y) + (n.m ? ' ' + n.m + '月' : ''); }
  function renderWatchCard() {
    const list = HighSchool.watchedPlayers(state);
    if (!list.length) return '';
    // 1人1行:名前、守備区分、総合値、入学時からの増減
    return '<div class="card"><h2>★ 注目選手</h2>' + list.map((p) => {
      const d = Core.rating(p) - Core.initialRating(p);
      return '<div class="watchrow">' + starBtn(p) + '<b>' + esc(p.name) + '</b> <span class="small">' + Core.POSITION_SHORT[p.position]
        + ' / 総合値 ' + Core.rating(p) + (state.pendingRecruits.indexOf(p) < 0 ? '(入学時から ' + signed(d) + ')' : '(入学前)') + '</span></div>';
    }).join('') + '</div>';
  }

  function linesHtml(lines) {
    return '<div class="lines">' + lines.map((l) => {
      const o = typeof l === 'string' ? { text: l, cls: '' } : l;
      return '<div class="' + (o.cls || '') + '">' + esc(o.text) + '</div>';
    }).join('') + '</div>';
  }
  // ラインスコア・勝敗投手(試合の中身)
  function boxHtml(b) {
    if (!b) return '';
    const row = (name, inn, total) => '<tr><th>' + name + '</th>' + inn.map((v) => '<td>' + v + '</td>').join('') + '<td class="t">' + total + '</td></tr>';
    let html = '<div class="scroll"><table class="ls"><tr><th></th>' + [1, 2, 3, 4, 5, 6, 7, 8, 9].map((i) => '<th>' + i + '</th>').join('') + '<th>計</th></tr>'
      + row('自校', b.line.my, b.my) + row('相手', b.line.opp, b.opp) + '</table></div>';
    if (b.pitcher) html += '<div class="small">' + (b.win ? '勝利投手 ' : '敗戦投手 ') + esc(b.pitcher.name) + '(' + Math.floor(b.pitcher.outs / 3) + '回 ' + b.pitcher.runs + '失点)</div>';
    const hitters = b.batters.filter((x) => x.h || x.rbi).map((x) => esc(x.name) + ' ' + x.ab + '-' + x.h + (x.rbi ? ' ' + x.rbi + '打点' : '') + (x.hr ? ' ' + x.hr + '本' : ''));
    if (hitters.length) html += '<div class="small">打撃:' + hitters.join(' / ') + (b.unearned ? '(打点のつかない得点 ' + b.unearned + ')' : '') + '</div>';
    return html;
  }
  // 活躍選手:1行(成長の成果は詳細に)
  function highlightLine(hs) {
    if (!hs || !hs.length) return '';
    return '<div class="hl">☆ ' + hs.map((h) => esc(h.text)).join(' / ') + '</div>';
  }
  function growthNotes(hs) {
    const n = (hs || []).filter((h) => h.note);
    return n.length ? '<div class="small">' + n.map((h) => esc(h.text.split(' ')[0]) + ':' + esc(h.note)).join(' / ') + '</div>' : '';
  }
  // 1試合:1行(相手・スコア・勝敗)+ 活躍選手1行。「詳しく」でラインスコア・勝敗投手・打点・成長の成果
  function gameHtml(g, key) {
    const vs = g.round ? g.round + ' 対' + (g.opp || '') : g.title;
    const head = '<span style="color:' + (g.tag ? 'var(--special)' : g.win ? 'var(--win)' : 'var(--lose)') + '">' + esc(vs) + ' '
      + (g.box ? g.box.my + '対' + g.box.opp : '') + 'で' + (g.win ? '勝利' : '敗戦') + (g.tag ? '【' + g.tag + '】' : '') + '</span>'
      ;
    return '<div class="game">' + renderCollapsible(key, head, () => boxHtml(g.box) + growthNotes(g.highlights)) + highlightLine(g.highlights) + '</div>';
  }
  // イベントの結果のカード:1行の要約 + 「詳しく」
  function eventCard(ev, key) {
    if (ev.type === 'review' && !policyUI()) return '';
    if (ev.yearSummary) return yearSummaryCard(ev.yearSummary, key + ':ys', ev) + eventCard(Object.assign({}, ev, { yearSummary: null }), key);
    const lines = ev.lines || [];
    let html = '<div class="card"><h2>' + esc(ev.title) + '</h2>';
    if (ev.type === 'tournament') {
      // 結果の1行と、試合ごとの1行
      html += linesHtml(lines.filter((l) => l.cls === 'special' || /優勝|敗退|準優勝|引退/.test(l.text || l)).slice(0, 2));
      if (ev.games) html += ev.games.map((g, i) => gameHtml(g, key + ':g' + i)).join('');
      html += renderCollapsible(key + ':more', '<span class="small">通知・スタメン</span>', () => linesHtml(lines) + (ev.lineup ? lineupTable(ev.lineup, null) : ''));
      return html + '</div>';
    }
    const first = lines[0];
    if (first) html += linesHtml([first]);
    if (lines.length > 1) html += renderCollapsible(key + ':more', '<span class="small">ほか ' + (lines.length - 1) + '行</span>', () => linesHtml(lines.slice(1)));
    return html + '</div>';
  }
  // 年度末のまとめ:要点の3行 + 「詳しく」
  function yearSummaryCard(ys, key, yearEnd) {
    const L = ys.lines.map((l) => l.text || l);
    const upsets = L.find((t) => /^番狂わせ/.test(t)) || '';
    const tour = L.filter((t) => /地区大会/.test(t)).map((t) => t.replace('の地区大会', '')).join(' / ');
    const top = ((yearEnd && yearEnd.lines) || []).find((l) => /^1位/.test(l.text || ''));
    let html = '<div class="card"><h2>' + esc(ys.title) + '</h2><div class="ml3">'
      + '<div>' + esc(tour) + '</div>' + (top ? '<div>成長トップ:' + esc(top.text.replace(/^1位 /, '')) + '</div>' : '') + '<div>' + esc(upsets) + '</div></div>';
    html += renderCollapsible(key, '<span class="small">今年のまとめの詳細</span>', () => linesHtml(ys.lines));
    return html + '</div>';
  }
  // 月のまとめの1行(練習の成長人数・練習試合など)
  function monthLine(m) {
    const parts = [];
    if (m.note) parts.push(m.note);
    parts.push('成長 ' + m.grown + '人');
    for (const s of m.summaries) parts.push(s);
    return parts.join(' / ');
  }
  // 「次のイベントまで」などで進んだ月の表示。途中の月は1行、止まった月は最小表示(最大3行 + 詳しく)
  // part:'yearEnd' は年度末(3月)のまとめのカードだけ、'rest' はそれ以外(月のまとめと、大会などのカード)
  function renderMonths(list, part) {
    if (!list.length) return '';
    const isYE = (c) => c.type === 'yearEnd';
    if (part === 'yearEnd') {
      let ye = '';
      list.forEach((m) => m.cards.forEach((c, i) => { if (isYE(c)) ye += eventCard(c, 'month:' + m.serial + ':c' + i + ':ye'); }));
      return ye;
    }
    const keepCard = (c) => part !== 'rest' || !isYE(c);
    let html = '';
    const last = list[list.length - 1];
    const mid = list.slice(0, -1);
    if (mid.length) {
      const grown = mid.reduce((a, m) => a + m.grown, 0);
      const nImp = mid.reduce((a, m) => a + m.notices.filter((n) => n.importance >= 3).length, 0);
      html += '<div class="card">' + renderCollapsible('months:' + (last.serial != null ? last.serial : 'x'),
        '途中の月(' + esc(mid[0].label + (mid.length > 1 ? '〜' + mid[mid.length - 1].label : '')) + '):成長 のべ' + grown + '人' + (nImp ? ' / 通知 ' + nImp + '件' : ''), () => mid.map((m) =>
        '<div class="mline"><span class="ml">' + esc(m.label) + '</span>' + esc(monthLine(m))
        + m.watchLines.map((w) => '<span class="wt">' + esc(w) + '</span>').join('')
        + m.notices.map((n) => '<span class="nt">' + esc(n.text) + '</span>').join('')
        + (m.hidden ? '<span class="nt">ほか ' + m.hidden + '件</span>' : '') + '</div>').join('')) + '</div>';
    }
    // 止まった月:最大3行(注目選手の成長 / 今月の成長トップ / 重要な通知)
    const key = 'month:' + (last.serial != null ? last.serial : 'x');
    const rows = [];
    if (last.watchLines.length) rows.push('<div class="wt">' + esc(last.watchLines.join(' / ')) + '</div>');
    if (last.topGrowers && last.topGrowers.length) {
      rows.push('<div>今月の成長:' + last.topGrowers.map((t) => (t.watched ? '★' : '') + esc(t.name) + ' +' + Core.fmtNum(t.gain)).join('、') + '</div>');
    }
    const imp = last.notices.filter((n) => n.importance >= 3).slice(0, 3);
    if (imp.length) rows.push('<div class="nt" style="color:var(--special)">' + imp.map((n) => esc(n.text)).join(' / ') + '</div>');
    const unread = state.summaryUnread != null && state.summaryUnread === last.serial;
    html += '<div class="card"><h2>' + esc(HighSchool.formatYear(last.year) + ' ' + last.label) + 'のまとめ' + (unread ? ' <span class="newmark">●新着</span>' : '') + '</h2><div class="ml3">' + rows.slice(0, 3).join('') + '</div>';
    html += renderCollapsible(key, '<span class="small">' + esc(monthLine(last)) + '</span>', () => {
      let d = '';
      if (last.topGrowers && last.topGrowers.length) {
        d += '<div class="sublabel">今月よく伸びた選手</div><div class="lines">' + last.topGrowers.map((t, i) =>
          '<div class="small">' + (i + 1) + '位 ' + (t.watched ? '★' : '') + esc(t.name) + '(' + t.grade + '年)総合値 +' + Core.fmtNum(t.gain) + '</div>').join('') + '</div>';
      }
      if (last.serial != null) d += '<div class="row"><button class="minibtn" data-growth-serial="' + last.serial + '">全員の変化を見る</button></div>';
      if (last.practice && last.practice.length) d += '<div class="sublabel">練習試合</div>' + last.practice.map((g, i) => gameHtml(g, key + ':pg' + i)).join('');
      if (last.notices.length) {
        d += '<div class="sublabel">通知</div>' + linesHtml(last.notices.map((n) => ({ text: n.text, cls: n.cls }))
          .concat(last.hidden ? [{ text: 'ほか ' + last.hidden + '件', cls: 'none' }] : []));
      }
      return d || '<div class="small">特になし</div>';
    });
    html += '</div>';
    last.cards.forEach((c, i) => { if (keepCard(c)) html += eventCard(c, key + ':c' + i); });
    mid.forEach((m, mi) => m.cards.forEach((c, i) => { if (keepCard(c)) html += eventCard(c, 'month:' + m.serial + ':c' + i + ':' + mi); }));
    return html;
  }

  // ---------- 成績の表示 ----------
  function careerOf(p) { return (p && p.stats && p.stats.career) || Core.emptyStatLine(); }
  function batText(l) { return Core.formatAverage(l) + ' ' + l.hr + '本 ' + l.rbi + '点'; }
  function pitchText(l) { return l.w + '勝' + l.l + '敗 防' + Core.formatEra(l); }
  function statBrief(p) {
    const l = careerOf(p);
    const parts = [];
    if (p.position === 'P' || l.pg > 0) parts.push('防' + Core.formatEra(l));
    if (p.position !== 'P' || Core.isTwoWayKnown(p) || p.twoWay && p.finalAbilities) parts.push('打率' + Core.formatAverage(l));
    return parts.join(' ');
  }
  function statTable(p) {
    const st = p.stats;
    if (!st || !st.career.g) return '<div class="sublabel">成績:まだ大会に出ていません</div>';
    const years = Object.keys(st.byYear).map(Number).sort((a, b) => a - b);
    const rows = years.map((y) => [HighSchool.formatYear(y), st.byYear[y]]).concat([['通算', st.career]]);
    let html = '';
    if (st.career.pa > 0) {
      html += '<div class="sublabel">打撃成績</div><div class="scroll"><table class="st"><tr><th>年度</th><th>試合</th><th>打席</th><th>打数</th>'
        + '<th>安打</th><th>本塁打</th><th>打点</th><th>三振</th><th>打率</th></tr>'
        + rows.filter((r) => r[1].pa > 0).map((r) => '<tr><td>' + r[0] + '</td><td>' + r[1].g + '</td><td>' + r[1].pa + '</td><td>' + r[1].ab
          + '</td><td>' + r[1].h + '</td><td>' + r[1].hr + '</td><td>' + r[1].rbi + '</td><td>' + r[1].k
          + '</td><td>' + Core.formatAverage(r[1]) + '</td></tr>').join('') + '</table></div>';
    }
    if (st.career.pg > 0) {
      html += '<div class="sublabel">投手成績</div><div class="scroll"><table class="st"><tr><th>年度</th><th>登板</th><th>勝</th><th>敗</th>'
        + '<th>投球回</th><th>自責点</th><th>防御率</th></tr>'
        + rows.filter((r) => r[1].pg > 0).map((r) => '<tr><td>' + r[0] + '</td><td>' + r[1].pg + '</td><td>' + r[1].w + '</td><td>' + r[1].l
          + '</td><td>' + Math.floor(r[1].outs / 3) + (r[1].outs % 3 ? ' ' + (r[1].outs % 3) + '/3' : '') + '</td><td>' + r[1].er
          + '</td><td>' + Core.formatEra(r[1]) + '</td></tr>').join('') + '</table></div>';
    }
    return html;
  }
  // スタメン表。withStats のときは 打順・守備・名前・学年・総合値・打率(投手は防御率)の6列。
  //   「詳細列」で、本塁打・打点・入学時からの増減・同世代の上位%を足す
  function lineupTable(lu, title, withStats) {
    const byId = {};
    for (const p of state.players) byId[p.id] = p;
    const more = withStats && isOpen('lineupCols');
    const head = '<tr><th>打順</th><th>守</th><th>名前</th><th>学年</th>'
      + (withStats ? '<th>総合値</th><th>打率</th>' + (more ? '<th>本</th><th>点</th><th>入学時から</th><th>同世代</th>' : '') : '<th>適性</th>') + '</tr>';
    const rows = lu.map((s) => {
      const p = byId[s.id];
      const isP = s.pos === 'P';
      const ord = isP ? '先発' + (s.order ? '<small>' + s.order + '番</small>' : '') : (s.order || '-');
      const name = esc(s.name) + (s.twoWay ? ' <span class="tag twoway">二刀流</span>' : '') + (s.helper ? ' <span class="tag helper">助っ人</span>' : '')
        + (s.outOfPosition && s.primary ? ' <span class="small">(本職:' + Core.POSITION_SHORT[s.primary] + ')</span>' : '');
      let cols;
      if (!withStats) {
        cols = '<td class="num small">' + (s.apt == null ? '-' : int(s.apt)) + '</td>';
      } else {
        const l = careerOf(p);
        const r = p ? Core.rating(p) : null;
        const rk = p ? genRank(p) : null;
        cols = '<td class="num">' + (r == null ? '-' : r + (rk && rk.label ? '<span class="rlabel">' + rk.label + '</span>' : '')) + '</td>'
          + '<td class="num">' + (isP ? '防' + Core.formatEra(l) : Core.formatAverage(l)) + '</td>';
        if (more) {
          cols += '<td class="num">' + l.hr + '</td><td class="num">' + l.rbi + '</td><td class="num">' + (p ? growthLabel(p) || '-' : '-') + '</td>'
            + '<td class="num small">' + (rk ? '上位' + Generation.formatTop(rk.top) : '-') + '</td>';
        }
      }
      const grade = s.helper ? '助' : (s.grade ? s.grade + '年' : '-');
      return '<tr class="' + (s.outOfPosition ? 'oop' : '') + '"><td class="ord">' + ord + '</td><td class="pos">' + Core.POSITION_SHORT[s.pos]
        + '</td><td class="nm">' + name + '</td><td>' + grade + '</td>' + cols + '</tr>';
    }).join('');
    const table = '<div class="scroll"><table class="lu">' + head + rows + '</table></div>'
      + (withStats ? '<div class="row"><button class="minibtn" data-col="lineupCols" aria-expanded="' + more + '">' + (more ? '詳細列を隠す' : '詳細列') + '</button>'
        + '<span class="small">成績は通算(大会のみ)。赤字は本職外の起用。</span></div>' : '');
    if (!title) return table;
    return renderCollapsible('lu:' + title, '<span class="small">' + esc(title) + '</span>', () => table);
  }
  // 入学時の第一印象(固定の文章リストから選ぶ)
  function impression(p) {
    const r = Core.rating(p);
    const pool = r >= 200 ? ['……空気が変わった。', '入部初日から格の違いを見せつけた。', 'どこでこんな選手が埋もれていたのか。']
      : r >= 150 ? ['即戦力の予感がする。', 'いきなり上級生に混ざっても見劣りしない。', '今年の目玉かもしれない。']
      : r >= 115 ? ['光るものを持っている。', '尖った長所がある。', '何か一芸がありそうだ。']
      : r >= 95 ? ['素直そうな新入生だ。', 'まだ線が細いが伸びしろはある。', '平凡だが真面目に練習しそう。']
      : ['正直、まだまだこれから。', '体力づくりから始めよう。', '入部動機は「なんとなく」らしい。'];
    return pool[p.id % pool.length];
  }

  // ---------- 画面 ----------
  function renderHeader() {
    document.getElementById('title').textContent = CONFIG.schoolName + ' 野球部';
    const mem = HighSchool.members(state).filter((p) => !p.retired).length;
    document.getElementById('meta').innerHTML = '<b>' + HighSchool.formatYear(state.year) + ' ' + esc(HighSchool.monthLabel(state.month)) + '</b>'
      + ' ・ チームの強さ <b>' + HighSchool.teamStrength(state) + '</b> ・ 部員 ' + mem + '人';
  }
  // 12か月の帯(現在の月を強調。イベントのある月に下線)
  function renderMonthBand() {
    const cal = HighSchool.CALENDAR;
    const band = '<div class="months">' + cal.map((c, i) => {
      const hasEv = c.events.some((e) => CONFIG.eventTypes[e] && CONFIG.stopKinds.indexOf(CONFIG.eventTypes[e].kind) >= 0);
      const cls = (i < state.month ? 'done' : i === state.month ? 'now' : '') + (hasEv ? ' ev' : '');
      return '<span class="' + cls + '">' + c.month + '月</span>';
    }).join('') + '</div>';
    const c = cal[state.month];
    const L = state.leadership;
    const lead = '<div class="lead">指導力 <b>Lv.' + L.lv + '</b>'
      + (L.lv < CONFIG.leadership.maxLv ? '(次のLvまで ' + L.exp + '/' + HighSchool.leadershipNeed(L.lv) + ')' : '(最大)') + '</div>';
    return band + '<div class="monthnote">今月:' + esc(c.label + ' ' + (c.note || '')) + '</div>' + lead;
  }

  // 方針の選択画面(4月:新入生と在校生 / 12月:在校生の見直し)
  function policySelect(p) {
    const setName = Core.policySetOf(p);
    const cur = draftPolicies[p.id] != null ? draftPolicies[p.id] : p.policy;
    // 選択肢は方針の名前だけ。policyOptionHints がオンのときだけ、伸びやすい項目(◎○)を併記する
    return '<select data-pid="' + p.id + '">' + Core.POLICIES[setName].map((pol) =>
      '<option value="' + pol.key + '"' + (cur === pol.key ? ' selected' : '') + '>' + pol.label
      + (CONFIG.policyOptionHints ? '(' + esc(Core.policyHint(setName, pol.key)) + ')' : '') + '</option>'
    ).join('') + '</select>';
  }
  function policyLabelOf(p, key) {
    const x = Core.POLICIES[Core.policySetOf(p)].find((q) => q.key === key);
    return x ? x.label : key;
  }
  // 方針の選択画面の選手カード:常に見える1行(押すと能力の詳細)+ 方針のプルダウン
  // 見直し画面の選手カード(新入生・在校生で共通。配置は 1.6u と同じ)
  //   1行目:名前・守備区分・ラベル・総合値・同世代の上位%・現在の方針(学年と ⚠ は小さく)
  //   その下:能力の枠(項目ごとの大きな数字のボックス)/ 方針のプルダウン(幅いっぱい)
  //   増減などの補助情報は、名前を押して開く選手詳細に置く
  function polCard(p, isNew, simple) {
    const draft = draftPolicies[p.id];
    const changed = !isNew && draft != null && draft !== p.policy;
    let html = '<div class="player' + (changed ? ' changed' : '') + '">' + (isNew ? starBtn(p) : '')
      + '<button class="pnamebtn" data-pdetail="' + p.id + '">' + esc(p.name) + '</button>'
      + posTag(p.position) + extraTags(p) + ' <span class="small">' + ratingHtml(p) + (simple ? '' : ' / 現在:' + esc(Core.policyLabel(p))) + '</span>'
      + ' <span class="gradetag">' + (isNew ? '新入生' : p.grade + '年') + '</span>' + (p.needsPolicy && !simple ? '<span class="needpol"> ⚠</span>' : '');
    if (isNew) html += '<div class="impress">' + esc(impression(p)) + '</div>';   // 最初期と同じ順:第一印象 → 能力の枠 → 判明の演出
    if (CONFIG.reviewShowStats) html += abilBoxes(p);
    if (isNew) {
      if (p.reincarnation && p.reincarnationRevealed) {
        html += '<div class="reveal">……!? この新入生、ただ者ではない。<br>【' + esc(Core.reincarnationName(p.reincarnation)) + '】の転生者だ!</div>';
      }
      if (p.twoWay && p.twoWayRevealed) html += '<div class="reveal">投げても打っても本職級……! <br>【二刀流】の素質を持っている!</div>';
    }
    if (simple) return html + '</div>';   // 方針の選択なし(プルダウン・変更前→変更後は出さない)
    if (p.needsPolicy) html += '<div class="needpol">⚠ 本職が変わったため方針がバランスに戻りました。選び直してください</div>';
    html += policySelect(p);
    if (changed) {
      html += '<div class="undo">' + esc(policyLabelOf(p, p.policy)) + ' → <b>' + esc(policyLabelOf(p, draft)) + '</b> '
        + '<button class="linkbtn" data-undo="' + p.id + '">元に戻す</button></div>';
    }
    return html + '</div>';
  }
  // 能力の枠:項目ごとの大きな数字のボックス(最初期の見た目)。100超えは金色。二刀流は投手系・野手系の2段
  function abilBoxes(p) {
    const a = p.finalAbilities || p.abilities;
    if (statSides(p).length > 1) {
      return '<div class="sublabel">投手系</div>' + abilGrid(Core.PITCH_KEYS, a, null, true) + '<div class="sublabel">野手系</div>' + abilGrid(Core.BAT_KEYS, a, null, true);
    }
    return abilGrid(statSides(p)[0], a, null, true);
  }
  // 在校生の並べ替えと絞り込み
  function polList() {
    let list = HighSchool.reviewablePlayers(state).slice();
    const f = uiPrefs.polFilter;
    if (/^g\d$/.test(f)) list = list.filter((p) => p.grade === Number(f.slice(1)));
    else if (Core.POSITIONS.indexOf(f) >= 0) list = list.filter((p) => p.position === f);
    else if (f === 'watched') list = list.filter((p) => p.watched);
    else if (f === 'need') list = list.filter((p) => p.needsPolicy);
    else if (f === 'capped') list = list.filter((p) => Core.isCappedOut(p));
    const byRating = (a, b) => Core.rating(b) - Core.rating(a) || a.id - b.id;
    if (uiPrefs.polSort === 'rating') list.sort(byRating);
    else if (uiPrefs.polSort === 'grade') list.sort((a, b) => b.grade - a.grade || byRating(a, b));
    else list.sort((a, b) => (b.needsPolicy ? 1 : 0) - (a.needsPolicy ? 1 : 0) || b.grade - a.grade || byRating(a, b));
    return list;
  }
  // 並べ替え・絞り込み(1つの折りたたみ。初期は閉じる。中身は 1.6w のまま)
  function polControls() {
    const chip = (key, label) => '<button class="chip' + (uiPrefs.polFilter === key ? ' on' : '') + '" data-polf="' + key + '">' + label + '</button>';
    const opt = (v, l) => '<option value="' + v + '"' + (uiPrefs.polSort === v ? ' selected' : '') + '>' + l + '</option>';
    const fl = uiPrefs.polFilter !== 'all' ? '(絞り込み中)' : '';
    return renderCollapsible('pol-sort', '<span class="small">並べ替え・絞り込み' + fl + '</span>', () =>
      '<div class="row"><span class="small">並べ替え</span><select id="polSort">' + opt('need', '要選び直し先頭') + opt('rating', '総合値') + opt('grade', '学年') + '</select></div>'
      + '<div class="row">' + chip('all', '全員') + chip('g3', '3年') + chip('g2', '2年') + chip('g1', '1年')
      + Core.POSITIONS.map((pos) => chip(pos, Core.POSITION_SHORT[pos])).join('') + chip('watched', '★') + chip('need', '要選び直し') + chip('capped', '頭打ち') + '</div>');
  }

      + (info.capped ? '。部員数の上限のため人数を絞った' : '') + '</div>'
      + (info.trend ? '<div class="small">今年の新入生の傾向:<b>' + esc(info.trend) + '</b></div>' : '')
      + '<div class="small">表示は本職側の能力だけです。総合値 = 本職側の能力の平均 × 5。育成はおまかせ(能力に合わせて自動で決まる)。名前を押すと選手詳細。</div>';

  function renderPolicyScreen() {

    let html = '';
    if (isEnroll) {
      const info = state.newcomerInfo || {};
      const n = state.pendingRecruits.length;
      html += '<div class="card"><h2>🌸 ' + HighSchool.formatYear(state.year) + ' 4月 新入生がやってきた!</h2>'
        + '<div class="nc">今年の入部希望者は <b>' + n + '人</b>'
        + (info.strength != null ? '(前年夏のチームの強さ ' + info.strength + ')' : '')
        + (info.capped ? '。部員数の上限のため人数を絞った' : '') + '</div>'
        + (info.trend ? '<div class="small">今年の新入生の傾向:<b>' + esc(info.trend) + '</b></div>' : '')
        + '<div class="small">育成方針を選んでください。特化:選んだ能力が伸びやすく、他はほとんど伸びない。バランス:全体が少しずつ伸びる。'
        + '表示は本職側の能力だけです。総合値 = 本職側の能力の平均 × 5。名前を押すと選手詳細(増減など)。</div>';
      if (!n) html += '<div class="small">今年は新入生がいません。</div>';
      else html += renderCollapsible('pol-new', '<b>新入生(' + n + '人)</b>', () => state.pendingRecruits.map((p) => polCard(p, true)).join(''), { defaultOpen: true, cls: 'flat' });
      html += '</div>';
    } else {
      html += '<div class="card"><h2>📝 ' + HighSchool.formatYear(state.year) + ' ' + esc(HighSchool.monthLabel(state.month)) + ' 方針の見直し</h2>'
        + '<div class="small">冬合宿の前に、在校生の育成方針を見直せます。変更しなければそのまま進みます。</div></div>';
    }

    html += '<div class="card"><h2>在校生の方針</h2><div class="small">変更した選手は色が付きます。⚠ は選び直しが必要な選手です。</div>' + polControls();
    if (!grades.length) html += '<div class="small">該当する選手がいません。</div>';
    for (const g of grades) {
      const ps = list.filter((p) => p.grade === g);
      const need = ps.filter((p) => p.needsPolicy).length;
      const changed = ps.filter((p) => draftPolicies[p.id] != null && draftPolicies[p.id] !== p.policy).length;
      html += renderCollapsible('pol-g' + g, '<b>' + g + '年生(' + ps.length + '人)</b>'
        + (need ? ' <span class="needpol">⚠' + need + '</span>' : '') + (changed ? ' <span class="small">変更 ' + changed + '人</span>' : ''),
        () => ps.map((p) => polCard(p, false)).join(''), { defaultOpen: true, cls: 'flat' });
    }
    html += '</div>';
    html += '<div class="autosel">おまかせの対象:<select id="autoTarget">'
      + '<option value="new"' + (autoTarget === 'new' ? ' selected' : '') + '>' + (isEnroll ? '新入生のみ' : '選び直しが必要な選手のみ') + '</option>'
      + '<option value="all"' + (autoTarget === 'all' ? ' selected' : '') + '>全員</option></select></div>'
      + '<div class="btns"><button class="btn sub" id="btnAuto">おまかせ</button>'
      + '<button class="btn" id="btnPolicy">' + (isEnroll ? 'この方針で入部させる' : 'この方針で進む') + '</button></div>';
    return html;
  }
  // 選手詳細(名前を押して開く。ページ内のダイアログ)。詳細版の能力表示を初期から開いて出す
  function renderPlayerDetail() {

  function signed(v) { return (v >= 0 ? '+' : '') + v; }

  // ---------- 成長タブ(月ごとの、全在校生の能力の変化) ----------
  function growthSerials() {
    const start = HighSchool.monthSerial(1, 0);
    let last = -1;
    for (const p of state.players.concat(state.alumni)) if (p.mlog && p.mlog.a.length) last = Math.max(last, p.mlog.s + p.mlog.a.length - 1);
    const out = [];
    for (let sv = start; sv <= last; sv++) out.push(sv);
    return out;
  }
  function renderGrowth() {
    const serials = growthSerials();
    if (!serials.length) return '<div class="card"><h2>成長</h2><div class="small">まだ記録がありません。1か月進めると、毎月末の能力の変化がここに出ます。</div></div>';
    let sv = growthView.serial;
    if (sv == null || serials.indexOf(sv) < 0) sv = serials[serials.length - 1];
    const idx = serials.indexOf(sv);
    const y = Math.floor(sv / 12) + 1;
    // その月に在籍していた選手(在校生と、月ごとの記録が残っている卒業生)
    const people = state.players.filter((p) => !p.helper).concat(state.alumni.filter((a) => a.mlog && !a.helper));
    const rows = [];
    for (const p of people) {
      const md = HighSchool.monthDelta(p, sv);
      if (!md) continue;
      const grade = y - p.enrolledYear + 1;
      const keys = p.finalAbilities ? p.mainKeys : Core.visibleKeys(p);
      const parts = [];
      let sum = 0;
      for (const k of keys) {
        const d = growthView.decimal ? Core.round1(md.d[k]) : Math.round(md.now[k]) - Math.round(md.prev[k]);
        sum += md.d[k];
        if (d !== 0) parts.push({ k: k, d: d });
      }
      rows.push({ p: p, grade: grade, parts: parts, gain: sum / keys.length * CONFIG.ratingMultiplier });
    }
    rows.sort((a, b) => b.gain - a.gain || a.p.id - b.p.id);
    const chip = (key, label) => '<button class="chip' + (growthView.filter === key ? ' on' : '') + '" data-gfilter="' + key + '">' + label + '</button>';
    const rowHtml = (r) => '<div class="grow-row">' + (r.p.watched ? '★' : '') + '<b>' + esc(r.p.name) + '</b> <span class="small">' + r.grade + '年・'
      + Core.POSITION_SHORT[r.p.position] + (r.p.finalAbilities ? '・卒業生' : '') + '</span> '
      + (r.parts.length ? r.parts.map((x) => '<span class="' + (x.d > 0 ? 'd' : 'dn') + '">' + Core.ABILITY_LABEL[x.k] + ' ' + (x.d > 0 ? '+' : '') + (growthView.decimal ? x.d.toFixed(1) : x.d) + '</span>').join(' ')
        : '<span class="small">変化なし</span>') + '</div>';
    let html = '<div class="card"><h2>成長(' + esc(HighSchool.serialLabel(sv)) + ' 末)</h2>'
      + '<div class="row"><button class="minibtn" data-gstep="-1"' + (idx <= 0 ? ' disabled' : '') + '>◀ 前月</button>'
      + '<button class="minibtn" data-gstep="1"' + (idx >= serials.length - 1 ? ' disabled' : '') + '>次月 ▶</button>'
      + '<button class="minibtn" data-gstep="latest">最新</button></div>';
    // 最初に見せるのは、伸びた上位N人と注目選手だけ(絞り込みは「全員を見る」の中)
    const N = CONFIG.display.growthTopN;
    const top = rows.filter((r) => r.gain > 0).slice(0, N);
    const stars = rows.filter((r) => r.p.watched && top.indexOf(r) < 0);
    const changedN = rows.filter((r) => r.parts.length).length;
    html += '<div class="small">' + changedN + '人に変化。よく伸びた上位' + top.length + '人' + (stars.length ? 'と★注目' : '') + '</div>'
      + (top.concat(stars).map(rowHtml).join('') || '<div class="small">この月に伸びた選手はいません。</div>');
    html += renderCollapsible('growth-all', '全員を見る(' + rows.length + '人・絞り込み・小数表示)', () => {
      let list = rows;
      if (growthView.filter === 'watched') list = list.filter((r) => r.p.watched);
      if (/^g\d$/.test(growthView.filter)) list = list.filter((r) => r.grade === Number(growthView.filter.slice(1)));
      if (growthView.changedOnly) list = list.filter((r) => r.parts.length);
      return '<div class="row">' + chip('all', '全員') + chip('watched', '★注目') + chip('g1', '1年') + chip('g2', '2年') + chip('g3', '3年') + '</div>'
        + '<div class="row"><label><input type="checkbox" id="gChanged"' + (growthView.changedOnly ? ' checked' : '') + '> 変化があった選手のみ</label>'
        + '<label><input type="checkbox" id="gDecimal"' + (growthView.decimal ? ' checked' : '') + '> 小数で表示</label></div>'
        + '<div class="small">' + list.length + '人を表示(前月末、または入学時との差)</div>' + list.map(rowHtml).join('');
    });
    return html + '</div>';
  }

  function renderHome() {
    let html = renderMonthBand() + staleWarning() + renderWatchChooser()
      + (storageWarn ? '<div class="warnbox">⚠ 保存容量が上限の' + Math.round(CONFIG.visual.storageWarnRatio * 100) + '%に近づいたため、卒業生の月ごとの記録を学期ごとに圧縮しました。</div>' : '');
    const evs = state.lastEvents || [];
    if (state.awaiting === 'policy') {
      html += renderMonths(evs);
      html += renderPolicyScreen();
      return html;
    }
    html += '<div class="btns"><button class="btn" id="btnNextEvent">次のイベントまで</button></div>'
      + '<div class="btns"><button class="btn sub small" id="btnNextMonth">次の月へ</button>'
      + '<button class="btn sub small" id="btnApril">次の4月まで</button></div>';
    // 並び:スタメン → 注目選手 → 月のまとめ → 最近の出来事(homeSummaryPosition が 'top' ならまとめは上)
    //   年度末(3月)のまとめは、これまでどおりボタンの下に出す
    const top = CONFIG.homeSummaryPosition === 'top';
    html += renderMonths(evs, 'yearEnd');
    if (top) html += renderMonths(evs, 'rest');
    html += '<div class="card"><h2>現在のスタメン</h2>' + lineupTable(HighSchool.lineup(state), null, true) + '</div>';
    html += renderWatchCard();
    if (!top) html += renderMonths(evs, 'rest');
    const recent = state.log.slice(-10).reverse();
    html += '<div class="card">' + renderCollapsible('log', '最近の出来事', () => '<div class="lines">'
      + recent.map((l) => '<div>' + esc(whenText(l)) + ':' + esc(l.t) + '</div>').join('') + '</div>') + '</div>';
    return html;

  function playerCard(p) {
    const keys = Core.visibleKeys(p);
    const capped = Core.isCappedOut(p);
    const summary = '<span class="pname">' + esc(p.name) + '</span>' + growthLabel(p) + ' '
      + '<span class="small">' + (p.helper ? '' : p.grade + '年') + '</span>' + posTag(p.position) + extraTags(p)
      + (capped ? '<span class="capped">頭打ち</span>' : '') + (p.needsPolicy && policyUI() ? ' <span class="needpol">⚠</span>' : '')
      + '<div class="small">' + ratingHtml(p) + ' / ' + statBrief(p) + '</div>';
    return '<div class="player pflex">' + starBtn(p) + '<div class="grow">' + renderCollapsible('p:' + p.id, summary, () => {
      let d = '<div class="small">方針:' + (policyUI() ? esc(Core.policyLabel(p)) + (p.needsPolicy ? ' <span class="needpol">⚠選び直し</span>' : '') : 'おまかせ')
        + ' / 試合 ' + p.record.games + '(' + p.record.wins + '勝)'
        + (p.originalPosition !== p.position ? ' / 元:' + Core.POSITION_LABEL[p.originalPosition] : '')
        + ' / 入学時の総合値 ' + Core.initialRating(p) + (p.limitBreaks ? ' / 限界突破 ' + p.limitBreaks + '回' : '')
        + ' / 試合経験値 ' + int(p.exp) + '(累計 ' + int(p.expTotal) + ')</div>'
        + renderPlayerStatsCompact(p, { detail: true }) + aptLine(p);
      if (!Core.isSubKnown(p) && !Core.isTwoWayKnown(p)) d += '<div class="sublabel">副能力:未判明(本職でない役割で出場すると分かる)</div>';
      d += renderCollapsible('pchart:' + p.id, '<span class="small">能力の推移(グラフ)</span>', () => growthChart(p, keys))
        + renderCollapsible('pstat:' + p.id, '<span class="small">成績</span>', () => statTable(p))
        + renderCollapsible('phist:' + p.id, '<span class="small">学期ごとの能力と成長履歴</span>', () => snapTable(keys, p.snapshots, p.abilities) + histList(p.history));
      return d;
    }) + '</div></div>';
  }

  function renderRoster() {
    return renderWatchChooser() + renderRosterBody();
  }
  function renderRosterBody() {
    const posOrder = { P: 0, C: 1, IF: 2, OF: 3 };
    const sortFn = (a, b) => posOrder[a.position] - posOrder[b.position] || Core.rating(b) - Core.rating(a);
    const counts = HighSchool.countByPosition(HighSchool.members(state).filter((p) => !p.retired));
    let html = '<div class="card"><h2>部員の構成</h2><div class="small">'
      + Core.POSITIONS.map((pos) => Core.POSITION_LABEL[pos] + ' ' + counts[pos] + '人').join(' / ')
      + '(引退した3年生を除く)</div>' + lineupTable(HighSchool.lineup(state), 'スタメン(自動編成)', true) + '</div>';
    for (const g of [3, 2, 1]) {
      const list = state.players.filter((p) => p.grade === g && !p.helper).sort(sortFn);
      html += '<div class="card"><h2>' + g + '年生(' + list.length + '人)</h2>';
      html += list.length ? list.map(playerCard).join('') : '<div class="small">いません</div>';
      html += '</div>';
    }
    const helpers = state.players.filter((p) => p.helper);
    if (helpers.length) html += '<div class="card"><h2>助っ人(' + helpers.length + '人)</h2>' + helpers.map(playerCard).join('') + '</div>';
    html += '<div class="small">名前の行を押すと、能力の詳細・適性が開きます。推移・成績・履歴はその中でさらに開けます。隠れた才能と成長限界は表示されません。</div>';
    return html;
  }

  function alumniStatLine(a) {
    const l = careerOf(a);
    const parts = [];
    if (l.pg > 0) parts.push(pitchText(l));
    if (l.pa > 0 && (a.position !== 'P' || a.twoWay || l.pg === 0)) parts.push('打率 ' + batText(l));
    return parts.length ? parts.join(' / ') : '出場なし';
  }
  function renderAlumni() {
    const minAB = CONFIG.stats.minAtBatsForAverage;
    const filters = [['all', 'すべて'], ['genius', '天才'], ['reinc', '転生'], ['twoway', '二刀流'], ['pro', 'プロ入り'], ['three', '3割打者'], ['watched', '注目だった選手'], ['helper', '助っ人']];
    let list = state.alumni.slice().reverse();
    if (alumniFilter === 'genius') list = list.filter((a) => a.talent === 'genius');
    if (alumniFilter === 'reinc') list = list.filter((a) => a.reincarnation);
    if (alumniFilter === 'twoway') list = list.filter((a) => a.twoWay);
    if (alumniFilter === 'pro') list = list.filter((a) => a.career === CONFIG.career.paths[0].label);
    if (alumniFilter === 'helper') list = list.filter((a) => a.helper);
    if (alumniFilter === 'watched') list = list.filter((a) => a.watched);
    if (alumniFilter === 'three') list = list.filter((a) => careerOf(a).ab >= minAB && Core.battingAverage(careerOf(a)) >= 0.3);
    let html = '<div class="card"><h2>名鑑(' + state.alumni.length + '人)</h2><div class="filters">'
