<!doctype html>
<html lang="ja">
<!-- このファイルは build-play.js が生成します。直接編集しないこと -->
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>野球ガチャ育成</title>
<style>
  :root {
    --bg: #f4f1ea; --card: #fffdf8; --ink: #222; --sub: #777; --line: #ddd5c6;
    --accent: #1f5f8b; --win: #1d7a3a; --lose: #b03a2e; --gold: #b07d00; --special: #8a2be2;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
    font-size: 15px; line-height: 1.5;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 12px 80px; }
  header { position: sticky; top: 0; background: var(--bg); padding: 10px 0 6px; z-index: 5; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 18px; margin: 0; }
  header .meta { font-size: 13px; color: var(--sub); }
  header .meta b { color: var(--ink); }
  nav { display: flex; gap: 6px; margin-top: 8px; }
  nav button { flex: 1; padding: 8px 0; border: 1px solid var(--line); background: var(--card); border-radius: 6px; font-size: 14px; color: var(--ink); }
  nav button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  .cal { display: flex; flex-wrap: wrap; gap: 4px; margin: 10px 0; }
  .cal span { font-size: 11px; padding: 2px 6px; border-radius: 10px; background: #e8e2d5; color: var(--sub); }
  .cal span.done { color: #aaa; text-decoration: line-through; }
  .cal span.now { background: var(--accent); color: #fff; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin: 10px 0; }
  .card h2 { font-size: 16px; margin: 0 0 6px; }
  .card h3 { font-size: 14px; margin: 8px 0 4px; }
  .lines div { padding: 2px 0; border-bottom: 1px dotted #eee; font-size: 14px; }
  .lines .summary { font-weight: bold; }
  .lines .win { color: var(--win); }
  .lines .lose { color: var(--lose); }
  .lines .big { color: var(--win); font-weight: bold; }
  .lines .none { color: var(--sub); }
  .lines .special { color: var(--special); font-weight: bold; }
  .lines .big { background: #e9f6ec; border-radius: 4px; padding-left: 4px; }
  .lines .watch { color: #9a6a00; }
  .lines .watchhead { color: #9a6a00; font-weight: bold; border-top: 1px solid var(--line); margin-top: 4px; }
  .gr { font-size: 11px; color: var(--win); font-weight: bold; margin-left: 4px; white-space: nowrap; }
  .star { border: none; background: none; font-size: 18px; line-height: 1; padding: 0 4px; color: #bbb; cursor: pointer; vertical-align: middle; }
  .star.on { color: #e0a800; }
  .watchrow { padding: 4px 0; border-bottom: 1px dotted #eee; font-size: 13px; }
  .watchrow .note { display: block; font-size: 12px; color: var(--sub); }
  .chooser { border: 2px solid #e0a800; }
  .chooser button { margin: 3px 4px 3px 0; padding: 6px 10px; border: 1px solid var(--line); background: #fff; border-radius: 6px; font-size: 14px; }
  svg.chart { width: 100%; height: auto; display: block; margin-top: 4px; }
  .legend { font-size: 11px; color: var(--sub); }
  .legend i { display: inline-block; width: 10px; height: 3px; margin: 0 3px 2px 6px; vertical-align: middle; }
  .btns { display: flex; gap: 8px; margin: 10px 0; }
  .btn { flex: 1; padding: 14px 8px; font-size: 16px; border: none; border-radius: 8px; background: var(--accent); color: #fff; font-weight: bold; }
  .btn.sub { background: #fff; color: var(--accent); border: 1px solid var(--accent); }
  .btn.danger { background: #fff; color: var(--lose); border: 1px solid var(--lose); }
  .btn:disabled { opacity: .4; }
  .player { border-top: 1px solid var(--line); padding: 8px 0; }
  .player:first-child { border-top: none; }
  .pname { font-weight: bold; }
  .tag { display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 8px; margin-left: 4px; vertical-align: middle; border: 1px solid var(--line); color: var(--sub); }
  .tag.P { border-color: #c77; color: #a33; }
  .tag.C { border-color: #7a7; color: #363; }
  .tag.IF { border-color: #79c; color: #357; }
  .tag.OF { border-color: #c9a040; color: #8a6400; }
  .tag.twoway { border-color: #d4006a; color: #d4006a; }
  .tag.helper { background: #fde; }
  .tag.conv { border-style: dashed; }
  .tag.genius { border-color: var(--gold); color: var(--gold); }
  .tag.reinc { border-color: var(--special); color: var(--special); }
  .tag.ret { background: #eee; }
  .abil { display: grid; grid-template-columns: repeat(var(--cols, 4), 1fr); gap: 4px; margin-top: 4px; }
  .abil div { background: #f6f2e9; border-radius: 4px; padding: 2px 4px; text-align: center; font-size: 12px; color: var(--sub); }
  .abil b { display: block; font-size: 16px; color: var(--ink); }
  .v80 b { color: #c0392b; } .v60 b { color: #d35400; } .v40 b { color: #222; } .v0 b { color: #999; }
  .small { font-size: 12px; color: var(--sub); }
  select { width: 100%; padding: 8px; font-size: 15px; margin-top: 6px; border-radius: 6px; border: 1px solid var(--line); background: #fff; }
  details summary { cursor: pointer; padding: 6px 0; }
  .hist { font-size: 12px; color: #444; margin: 4px 0 0 0; padding-left: 16px; }
  .hist li { margin: 1px 0; }
  table.snap { border-collapse: collapse; font-size: 12px; margin-top: 4px; width: 100%; }
  table.snap th, table.snap td { border: 1px solid var(--line); padding: 2px 4px; text-align: center; }
  .reveal { margin-top: 6px; padding: 6px; border: 1px dashed var(--special); color: var(--special); font-weight: bold; border-radius: 6px; font-size: 14px; }
  .impress { font-size: 13px; color: #555; margin-top: 2px; }
  input[type=text] { padding: 8px; font-size: 15px; width: 100%; border: 1px solid var(--line); border-radius: 6px; }
  .filters { display: flex; gap: 6px; flex-wrap: wrap; }
  .filters button { padding: 4px 10px; border: 1px solid var(--line); background: #fff; border-radius: 14px; font-size: 13px; }
  .filters button.on { background: var(--ink); color: #fff; }
  .sublabel { font-size: 11px; color: var(--sub); margin-top: 6px; }
  .scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  table.lu { border-collapse: collapse; width: 100%; font-size: 13px; white-space: nowrap; }
  table.lu th { font-size: 11px; color: var(--sub); font-weight: normal; text-align: left; padding: 2px 4px; border-bottom: 1px solid var(--line); }
  table.lu td { border-bottom: 1px dotted #eee; padding: 3px 4px; }
  table.lu td.num { text-align: right; }
  table.lu td.ord { width: 2.4em; font-weight: bold; text-align: center; }
  table.lu td.pos { width: 1.6em; font-weight: bold; }
  table.lu td.nm { white-space: normal; min-width: 7em; }
  table.lu tr.oop td { color: var(--lose); }
  table.lu .ord small { display: block; font-size: 10px; font-weight: normal; color: var(--sub); }
  table.st { border-collapse: collapse; font-size: 12px; margin-top: 4px; white-space: nowrap; }
  table.st th, table.st td { border: 1px solid var(--line); padding: 2px 5px; text-align: right; }
  table.st th { text-align: center; }
  .nc { font-size: 13px; margin: 4px 0; }
  .months { display: grid; grid-template-columns: repeat(12, 1fr); gap: 2px; margin: 10px 0 4px; }
  .months span { font-size: 10px; text-align: center; padding: 3px 0; border-radius: 4px; background: #e8e2d5; color: var(--sub); }
  .months span.done { color: #bbb; }
  .months span.now { background: var(--accent); color: #fff; font-weight: bold; }
  .months span.ev { box-shadow: inset 0 -2px 0 #c9a040; }
  .monthnote { font-size: 12px; color: var(--sub); margin-bottom: 6px; }
  .lead { font-size: 12px; color: var(--sub); }
  .lead b { color: var(--ink); }
  .v100 b { color: #b8860b; text-shadow: 0 0 1px #f5d76e; }
  .rt { font-weight: bold; }
  .rlabel { font-size: 11px; margin-left: 3px; padding: 0 5px; border-radius: 8px; background: #fff4d6; color: #8a6400; border: 1px solid #e6c56a; white-space: nowrap; }
  .rlabel.r200 { background: #fde8e8; color: #b03a2e; border-color: #e6a39b; }
  .rlabel.r400 { background: #2b2b2b; color: #ffd84d; border-color: #2b2b2b; }
  .mline { font-size: 13px; padding: 3px 0; border-bottom: 1px dotted #eee; }
  .mline .ml { display: inline-block; min-width: 3.2em; font-weight: bold; }
  .mline .nt { display: block; font-size: 12px; color: var(--special); padding-left: 3.2em; }
  .mline .wt { display: block; font-size: 12px; color: #9a6a00; padding-left: 3.2em; }
  .changed { background: #fff6dc; border-radius: 6px; }
  .needpol { color: var(--lose); font-size: 12px; font-weight: bold; }
  .capped { font-size: 11px; color: #fff; background: #888; border-radius: 8px; padding: 0 6px; margin-left: 4px; }
  .autosel { display: flex; gap: 6px; align-items: center; font-size: 13px; }
  .autosel select { width: auto; margin: 0; padding: 6px; }
  .btn.small { padding: 10px 6px; font-size: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="title">野球ガチャ育成</h1>
    <div class="meta" id="meta"></div>
    <nav>
      <button data-tab="home" class="on">ホーム</button>
      <button data-tab="roster">選手一覧</button>
      <button data-tab="alumni">名鑑</button>
      <button data-tab="settings">設定</button>
    </nav>
  </header>
  <main id="main"></main>
</div>

<script>
// ---- config.js(build-play.js で埋め込み)----
// =============================================================
// config.js : 確率・補正値などの設定をここに集約する
// 数値はすべて仮の値。sim.js の出力を見ながら調整すること。
// =============================================================
(function (root) {
  'use strict';

  const CONFIG = {
    // ---- 基本 ----
    schoolName: '白樺高校',        // 自校の名前(架空)
    saveKey: 'bbgacha_save',       // localStorage のキー
    saveVersion: 5,                // セーブデータの形式。違うバージョンのセーブは初期化する
    logLimit: 300,                 // 出来事ログの保存件数

    // ---- カレンダー(4月始まり) ----
    // events には eventTypes のキーを並べる。行を足せば、新しいイベントを追加できる
    //   例:春の甲子園 → eventTypes に { kind: 'tournament', key: 'spring' } を足し、3月や4月の行に加える
    calendar: [
      { month: 4,  label: '4月',  events: ['enrollment'], note: '入学' },
      { month: 5,  label: '5月',  events: ['practiceGames'], note: '練習・練習試合' },
      { month: 6,  label: '6月',  events: ['summerCamp'], note: '夏合宿' },
      { month: 7,  label: '7月',  events: ['summerTournament'], note: '夏の地区大会' },
      { month: 8,  label: '8月',  events: ['practiceGames'], note: '練習・練習試合' },
      { month: 9,  label: '9月',  events: [], note: '練習' },
      { month: 10, label: '10月', events: ['autumnTournament'], note: '秋の地区大会' },
      { month: 11, label: '11月', events: ['practiceGames'], note: '練習・練習試合' },
      { month: 12, label: '12月', events: ['winterCamp'], note: '冬合宿' },
      { month: 1,  label: '1月',  events: [], note: '練習' },
      { month: 2,  label: '2月',  events: ['practiceGames'], note: '練習・練習試合' },
      { month: 3,  label: '3月',  events: ['yearEnd'], note: '年度末' },
    ],
    // イベントの種類。kind は logic.js の処理の種類(enrollment / practiceGames / camp / tournament / yearEnd)
    eventTypes: {
      enrollment:       { kind: 'enrollment', label: '入学' },
      practiceGames:    { kind: 'practiceGames', label: '練習試合' },
      summerCamp:       { kind: 'camp', label: '夏合宿', term: '夏' },
      winterCamp:       { kind: 'camp', label: '冬合宿', term: '冬' },
      summerTournament: { kind: 'tournament', key: 'summer', retireAfter: true },
      autumnTournament: { kind: 'tournament', key: 'autumn' },
      yearEnd:          { kind: 'yearEnd', label: '年度末' },
    },
    policyReviewMonths: [4, 12],   // 在校生の方針を見直せる月(4月は入学と同じ画面)
    // 「次のイベントまで」で止まるイベントの種類
    stopKinds: ['enrollment', 'camp', 'tournament', 'yearEnd'],
    // 重要度の高い通知が出た月でも止まる
    autoStop: { enabled: true, minImportance: 3 },

    // ---- 新入生の人数 ----
    // 人数 = base + (前年夏のチームの強さ - strengthPivot) * perStrength + 乱数(±noise)
    newcomers: {
      base: 6,
      strengthPivot: 50,
      perStrength: 0.3,
      noise: 1,
      min: 3,
      max: 12,
      rosterCap: 30,               // 部員の総数の上限(超える分は新入生を減らす)
    },

    // ---- 守備区分 ----
    positionRates: { P: 0.22, C: 0.12, IF: 0.36, OF: 0.30 },
    positionDeficit: {
      P:  { min: 2, mult: 2.5 },
      C:  { min: 1, mult: 3.0 },
      IF: { min: 4, mult: 1.5 },
      OF: { min: 3, mult: 1.5 },
    },
    initialComposition: { P: [2, 3], C: [1, 2], IF: [4, 5], OF: [3, 4] },

    // ---- 隠れた才能 / 転生 / 二刀流 ----
    talent: {
      geniusRate: 0.05,
      reincarnationRate: 0.015,
      twoWayRate: 0.003,
      geniusBustRate: 0.2,         // 開花しない天才は、通常と同じ扱い(項目上限100・成長限界あり)
    },
    reincarnationReveal: 'enrollment',
    twoWayReveal: 'enrollment',

    // ---- 総合値と、初期能力のスケール ----
    // 総合値 = 本職側の見える能力の平均 × ratingMultiplier(整数に丸める。上限なし)
    ratingMultiplier: 5,
    // 総合値の横に出すラベル(上から順に判定)
    ratingLabels: [
      { min: 400, label: '規格外' },
      { min: 200, label: '怪物級' },
      { min: 160, label: '逸材' },
      { min: 120, label: '有望' },
    ],
    // 能力の項目上限
    statCap: { normal: 100, special: 150 },     // special = 開花した天才 または 転生
    // 100を超えた分の寄与の割引(試合の勝率・チームの強さ・成績の確率)
    overCapWeight: 0.5,
    // 新入生の初期の総合値
    rating: {
      normal: { mean: 100, sd: 9, min: 80, max: 120, highRate: 0.15, highMin: 120, highMax: 160 },
      genius: { min: 150, max: 250 },
      reincarnation: { min: 200, max: 300 },
      geniusReincarnationMax: 300,
      keySd: 4,                    // 項目ごとのばらつき(能力値)
      itemMax: 95,                 // 初期の1項目の上限
      min: 1,
    },
    // 本職でない側(副能力):本職側の平均 × [coefMin, coefMax] + 乱数(sd)
    subAbility: { coefMin: 0.25, coefMax: 0.4, sd: 2, min: 1 },
    // 守備区分ごとの得意項目(初期能力の偏り。総合値は変えずに配分だけ寄せる)
    positionBonus: {
      P: {},
      C: { arm: 4, defense: 4 },
      IF: { defense: 4, arm: 2 },
      OF: { speed: 4, arm: 2 },
    },
    twoWay: {
      subRatio: 0.8,
      bothShare: 0.7,
      alwaysStartAsPitcher: true,
    },
    // 転生の型:position の本職として生まれる。bonus の項目に初期能力を寄せる(総合値は変えない)
    reincarnationTypes: {
      gouwan:   { name: '剛腕型', position: 'P',  bonus: { velocity: 22, stamina: 10 } },
      gikou:    { name: '技巧型', position: 'P',  bonus: { control: 18, breaking: 16 } },
      kyouken:  { name: '強肩型', position: 'C',  bonus: { arm: 22, defense: 10 } },
      kouda:    { name: '巧打型', position: 'IF', bonus: { contact: 22, defense: 8 } },
      kyouda:   { name: '強打型', position: 'OF', bonus: { power: 22, contact: 8 } },
      shunsoku: { name: '俊足型', position: 'OF', bonus: { speed: 22, arm: 8 } },
    },

    // ---- 成長 ----
    growth: {
      // 育成方針の重み(成長を振り分ける)
      focusWeight: 1.0,
      otherWeight: 0.12,
      balanceWeight: 1.0,
      // 「元々高い能力ほど伸びやすい」補正:効率 = 1 + (現在値 - pivot) / 100 * slope を [min, max] に
      efficiency: { pivot: 40, slope: 0.6, min: 0.7, max: 1.3 },
      chunk: 1.5,                  // 成長を振り分ける単位(能力値)
      // 才能による成長の倍率(全ての成長に掛かる)
      talentMult: { genius: 1.42, reincarnation: 1.6, both: 1.75 },

      // (1) 練習による成長(毎月)
      monthly: {
        chance: 0.35,
        amount: [3.6, 8.0],        // 1回の成長量(能力値の合計)
        retiredMult: 0.5,          // 引退後の3年生の成長確率の倍率
        // 季節の補正(月ごと、項目ごとの伸びやすさ)
        season: {
          4:  { contact: 1.3, control: 1.3 },
          5:  { contact: 1.3, control: 1.3 },
          12: { power: 1.3, stamina: 1.3 },
          1:  { power: 1.3, stamina: 1.3 },
          2:  { power: 1.3, stamina: 1.3 },
        },
      },

      // (2) 合宿による成長
      camp: {
        outcomeRates: {
          normal: { big: 0.15, small: 0.50, none: 0.35 },
          genius: { big: 0.45, small: 0.40, none: 0.15 },
        },
        points: { big: [13, 22], small: [5, 9], none: [0, 0.5] },
      },

      // (3) 試合経験値による成長
      exp: {
        starter: 2,                // スタメンで出場
        bench: 0.25,               // ベンチ入りのみ(仕様の仮値 0.5 から調整)
        benchSize: 11,             // ベンチ入りの人数(スタメン以外)
        practiceStarter: 2,        // 練習試合でスタメン
        practiceSub: 0.5,          // 練習試合で出場した控え(仕様の仮値 1 から調整)
        winMult: 1.5,
        tournamentMult: [1.5, 2.0],   // 大会の1回戦 → 決勝(上の段階ほど高い)
        strongerMult: 1.3,         // 相手が格上(強さの差 > margin)
        weakerMult: 0.7,           // 相手が格下
        margin: 3,
        maxMult: 3,                // 倍率を掛け合わせた上限
        consumeRate: 0.5,          // 毎月、貯まった経験値のこの割合を成長に変換
        carryMax: 30,              // 持ち越せる経験値の上限
        growthPerExp: 1.8,        // 消費した経験値1あたりの成長量(能力値)
        capVsPractice: 3,          // 試合経験値による成長は、練習による成長(期待値)の最大この倍
      },

      // (4) 成長限界(通常の選手・開花しない天才)
      limit: {
        mean: 405, sd: 32, min: 340, max: 470,   // 総合値換算
        rareRate: 0.03, rareMin: 480, rareMax: 500,
        focusBonus: 15,            // 特化した項目の実効上限 = 平均 + focusBonus(最大100)
        jitter: 4,                 // 項目ごとの実効上限のばらつき
        zone: 14,                  // 実効上限のこの手前から成長が鈍る(能力値)
        cappedRatio: 0.97,         // 総合値が限界のこの割合以上で「頭打ち」
      },
      // 天才・転生(成長限界なし):100までは緩やかに、100を超えると強く鈍る
      special: {
        solo: { soft: 0.35, hardExp: 1.6 },
        both: { soft: 0.2, hardExp: 1.2 },   // 天才かつ転生
      },
    },
    // 副能力の側で出場した年は、年度末に副能力が少し伸びる(転向ボーナス。能力ごとの範囲)
    subRoleGrowth: [1, 4],

    // ---- (5) 指導力 ----
    leadership: {
      maxLv: 10,
      needPerLv: 5,                // Lv n → n+1 に必要な経験値 = needPerLv × n
      gains: { champion: 3, runnerUp: 2, best4: 1, pro: 2 },
      monthlyMultMax: 1.4,         // Lv10 での月ごとの成長確率の倍率(Lv1 で 1.0)
      campBigBonusMax: 0.10,       // Lv10 での合宿「大きく伸びる」確率の加算
    },

    // ---- (6) 限界突破 ----
    limitBreak: {
      threshold: 0.95,             // 総合値が成長限界のこの割合以上の選手が対象
      chance: 0.015,               // 毎月の確率
      bigWinBonus: 0.03,           // 決勝以上の試合に出て勝った月の加算
      leadershipLv: 7,

    const targetRating = opts.ratingOverride != null ? opts.ratingOverride : drawInitialRating(rng, talent, reincarnation);
    const abilities = {};
    // 得意項目への偏り(守備区分と転生の型)
    const bonusFor = (s) => {
      const b = {};
      if (s === side) Object.assign(b, CONFIG.positionBonus[position] || {});
      if (reincarnation) {
        const rt = CONFIG.reincarnationTypes[reincarnation];
        if (sideOf(rt.position) === s) for (const k of Object.keys(rt.bonus)) b[k] = (b[k] || 0) + rt.bonus[k];
      }
      return b;
    };
    fillSide(rng, abilities, sideKeys(side), targetRating, bonusFor(side));
    // もう一方の側
    const os = otherSide(side);
    if (twoWay) {
      fillSide(rng, abilities, sideKeys(os), targetRating * CONFIG.twoWay.subRatio, bonusFor(os));
    } else {
      const S = CONFIG.subAbility;
      const mainAvg = targetRating / CONFIG.ratingMultiplier;
      for (const k of sideKeys(os)) {
        abilities[k] = round1(Math.max(S.min, mainAvg * rng.float(S.coefMin, S.coefMax) + rng.normal(0, S.sd)));
      }
    }

    const name = generateName(rng, opts.takenSurnames);
    const p = {
      id: opts.id,
      surname: name.surname,
      given: name.given,
      name: name.surname + ' ' + name.given,
      grade: opts.grade || 1,
      position: position,
      originalPosition: position,
      abilities: abilities,
      initialAbilities: Object.assign({}, abilities),
      talent: talent,
      geniusBust: geniusBust,
      reincarnation: reincarnation,
      reincarnationRevealed: false,
      twoWay: twoWay,
      twoWayRevealed: false,
      subRevealed: false,
      subPlayedThisYear: false,  // 副能力の側で出場したか(年度末の転向ボーナス用)
      convert: null,             // 転向中の減点 { pos, penalty }
      needsPolicy: false,        // 本職の側が変わるコンバートで方針がバランスに戻った
      policy: opts.policy || 'balance',
      enrolledYear: opts.year,
      statCap: 100,
      limit: null,               // 成長限界(通常の選手のみ){ rating, jitter, caps }。画面には出さない
      limitBreaks: 0,
      exp: 0,                    // 試合経験値(未消費)
      expTotal: 0,               // 試合経験値の累計
      growthBy: { practice: 0, camp: 0, exp: 0 },  // 成長の内訳(能力値の合計)
      yearGain: {},              // 今年度の練習・試合経験による増分(年度末に履歴へ)
      bigWinThisMonth: false,    // 決勝以上の試合に出て勝った月
      starts: 0,                 // スタメン出場(大会・練習試合)
      teamGames: 0,              // 在籍中にチームが戦った試合数
      history: [],      // 出来事のメモ { y, g, ev, res, d }
      snapshots: [],    // 年ごとの能力 { y, g, a }
      timeline: [],     // 能力の推移(グラフ用){ label, a }
      record: { games: 0, wins: 0, titles: [] },
      stats: { career: emptyStatLine(), byYear: {} },
      watched: false,
      lastNotice: null,
      hidden: { clutch: 0 },
      retired: false,
    };
    p.statCap = isSpecial(p) ? CONFIG.statCap.special : CONFIG.statCap.normal;
    if (!isSpecial(p)) {
      const L = CONFIG.growth.limit;
      const r = rng.chance(L.rareRate) ? rng.float(L.rareMin, L.rareMax) : clamp(rng.normal(L.mean, L.sd), L.min, L.max);
      const jitter = {};
      for (const k of ALL_KEYS) jitter[k] = round1(rng.normal(0, L.jitter));
      p.limit = { rating: Math.round(r), jitter: jitter, caps: {} };
      computeLimitCaps(p);
    }
    return p;
  }

  // 能力の低い助っ人を作る
  function createHelper(rng, opts) {
    const H = CONFIG.helper;
    const p = createPlayer(rng, Object.assign({}, opts, {
      forceTwoWay: false,
      ratingOverride: clamp(rng.normal(H.mean, H.sd), H.min, H.max),
    }));
    p.talent = 'normal';
    p.geniusBust = false;
    p.reincarnation = null;
    p.helper = true;
    p.subRevealed = true;
    p.statCap = CONFIG.statCap.normal;
    return p;
  }

  // ---------- 成長限界 ----------
  // 成長限界(総合値)を、項目ごとの実効上限に配分する(特化した項目は高く、それ以外は低く。1項目の最大は100)
  function computeLimitCaps(p) {
    if (!p.limit) return;
    const L = CONFIG.growth.limit;
    const avg = p.limit.rating / CONFIG.ratingMultiplier;
    const caps = {};
    const sides = p.twoWay ? ['pitch', 'bat'] : [mainSide(p)];
    for (const side of sides) {
      const keys = sideKeys(side);
      let focus = null;
      const tw = POLICIES.twoWay.find((x) => x.key === p.policy);
      if (!(p.twoWay && tw)) {
        const pol = POLICIES[side].find((x) => x.key === p.policy);
        focus = pol ? pol.focus : null;
      }
      const base = {};
      if (focus) {
        const capF = Math.min(100, avg + L.focusBonus);
        const rest = Math.min(100, (avg * keys.length - capF) / (keys.length - 1));
        for (const k of keys) base[k] = k === focus ? capF : rest;
      } else {
        for (const k of keys) base[k] = Math.min(100, avg);
      }
      for (const k of keys) caps[k] = round1(clamp(base[k] + (p.limit.jitter[k] || 0), 10, 100));
    }
    p.limit.caps = caps;
  }
  // 頭打ち(成長限界に達した)
  function isCappedOut(p) {
    if (!p.limit) return false;
    return rating(p) >= p.limit.rating * CONFIG.growth.limit.cappedRatio
      || growthKeys(p).every((k) => p.limit.caps[k] == null || p.abilities[k] >= p.limit.caps[k] - 1);
  }

  // ---------- 成長 ----------
  // 現在値に応じた伸びの効率(元々高い能力ほど伸びやすい)
  function growthEfficiency(cur) {
    const E = CONFIG.growth.efficiency;
    return clamp(1 + ((Math.min(cur, 100) - E.pivot) / 100) * E.slope, E.min, E.max);
  }
  // 上限に近づくほど成長が鈍る係数(0〜1)
  function slowFactor(p, k) {
    const cur = p.abilities[k];
    const cap = p.statCap;
    if (cur >= cap) return 0;
    if (p.limit) {
      const c = p.limit.caps[k] != null ? p.limit.caps[k] : cap;
      return clamp((c - cur) / CONFIG.growth.limit.zone, 0, 1);
    }
    const S = isBloomingGenius(p) && p.reincarnation ? CONFIG.growth.special.both : CONFIG.growth.special.solo;
    if (cur < 100) return 1 - S.soft * Math.pow(cur / 100, 2);
    return (1 - S.soft) * Math.pow((cap - cur) / (cap - 100), S.hardExp);
  }
  function talentMult(p) {
    const T = CONFIG.growth.talentMult;
    if (isBloomingGenius(p) && p.reincarnation) return T.both;
    if (isBloomingGenius(p)) return T.genius;
    if (p.reincarnation) return T.reincarnation;
    return 1;
  }

  // 育成方針から、能力ごとの伸びやすさの重みを作る
  function policyWeights(side, policyKey) {
    const G = CONFIG.growth;
    const pol = POLICIES[side].find((x) => x.key === policyKey) || { focus: null };
    const w = {};
    for (const key of sideKeys(side)) {
      if (!pol.focus) w[key] = G.balanceWeight;
      else w[key] = key === pol.focus ? G.focusWeight : G.otherWeight;
    }
    return w;
  }
  // 成長の振り分け先 [{ weights, share }]
  function growthTargets(p) {
    const tw = POLICIES.twoWay.find((x) => x.key === p.policy);
    if (p.twoWay && tw) {
      if (tw.side) return [{ weights: policyWeights(tw.side, 'balance'), share: 1 }];
      return [
        { weights: policyWeights('pitch', 'balance'), share: CONFIG.twoWay.bothShare },
        { weights: policyWeights('bat', 'balance'), share: CONFIG.twoWay.bothShare },
      ];
    }
    return [{ weights: policyWeights(mainSide(p), p.policy), share: 1 }];
  }

  // amount(能力値の合計)だけ成長させる。source は 'practice' / 'camp' / 'exp'
  //   season は { 項目: 倍率 }(季節の補正)。戻り値は増分 { key: +n }
  function grow(rng, p, amount, source, season) {
    const delta = {};
    if (amount <= 0) return delta;
    amount *= talentMult(p);
    const chunk = CONFIG.growth.chunk;
    let total = 0;
    for (const t of growthTargets(p)) {
      const amt = amount * t.share;
      const n = Math.max(1, Math.round(amt / chunk));
      const size = amt / n;
      for (let i = 0; i < n; i++) {
        // 上限に近い項目には振り分けにくくする(その分、他の項目が伸びる)
        const w = {};
        let sum = 0;
        for (const k of Object.keys(t.weights)) {
          const sf = slowFactor(p, k);
          w[k] = t.weights[k] * ((season && season[k]) || 1) * Math.sqrt(sf);
          sum += w[k];
        }
        if (sum <= 0) break;
        const k = rng.weighted(w);
        const cur = p.abilities[k];
        const gain = Math.min(size * growthEfficiency(cur) * slowFactor(p, k), p.statCap - cur);
        if (gain <= 0) continue;
        p.abilities[k] = cur + gain;
        delta[k] = (delta[k] || 0) + gain;
        total += gain;
      }
    }
    if (p.growthBy) p.growthBy[source] = (p.growthBy[source] || 0) + total;
    return delta;
  }

  // 合宿の結果(大きく伸びる / 少し伸びる / 変わらない)を抽選。bigBonus は指導力による加算
  function drawGrowthOutcome(rng, p, bigBonus) {
    const base = CONFIG.growth.camp.outcomeRates[isBloomingGenius(p) ? 'genius' : 'normal'];
    const r = Object.assign({}, base);
    if (bigBonus) {
      r.big += bigBonus;
      const fromNone = Math.min(r.none, bigBonus);
      r.none -= fromNone;
      r.small = Math.max(0, r.small - (bigBonus - fromNone));
    }
    return rng.weighted(r);
  }
  // 合宿の成長の1イベント(抽選→適用→履歴)
  function campGrowth(rng, p, year, label, bigBonus) {
    const outcome = drawGrowthOutcome(rng, p, bigBonus);
    const range = CONFIG.growth.camp.points[outcome];
    const delta = grow(rng, p, rng.float(range[0], range[1]), 'camp');
    addHistory(p, year, label, OUTCOME_LABEL[outcome], delta);
    return { outcome: outcome, delta: delta };
  }

  // 副能力の側で出場した年の、年度末の伸び(転向ボーナス)
  function subRoleGrowth(rng, p) {
    const delta = {};
    const r = CONFIG.subRoleGrowth;
    for (const k of subKeysOf(p)) {
      const gain = Math.min(rng.int(r[0], r[1]), 100 - p.abilities[k]);
      if (gain > 0) { p.abilities[k] += gain; delta[k] = gain; }
    }
    return delta;
  }

  // ---------- 適性 ----------
  function aptitude(p, pos) {
    const w = CONFIG.aptitudeWeights[pos];
    let s = 0;
    let t = 0;
    for (const k of Object.keys(w)) { s += effAbility(p.abilities[k]) * w[k]; t += w[k]; }
    return round1(s / t);
  }
  function effectiveAptitude(p, pos) {
    const apt = aptitude(p, pos);
    let v = apt;
    if (p.convert && p.convert.pos === pos) v -= p.convert.penalty;
    const L = CONFIG.lowAptitude;
    if (apt < L.threshold) v -= (L.threshold - apt) * L.rate;
    return round1(Math.max(0, v));
  }
  function batting(p) {
    const w = CONFIG.teamStrength.batWeights;
    let s = 0;
    let t = 0;
    for (const k of Object.keys(w)) { s += effAbility(p.abilities[k]) * w[k]; t += w[k]; }
    return round1(s / t);
  }

  // ---------- 記録 ----------
  function roundDelta(d) {
    const out = {};
    for (const k of Object.keys(d || {})) {
      const v = round1(d[k]);
      if (v > 0) out[k] = v;
    }
    return out;
  }
  function addHistory(p, year, ev, res, delta) {
    p.history.push({ y: year, g: p.grade, ev: ev, res: res || '', d: delta ? roundDelta(delta) : null });
  }
  function takeSnapshot(p, year) {
    const a = {};
    for (const k of ALL_KEYS) a[k] = round1(p.abilities[k]);
    p.snapshots.push({ y: year, g: p.grade, a: a });
  }
  function addTimeline(p, label) {
    const a = {};
    for (const k of ALL_KEYS) a[k] = round1(p.abilities[k]);
    p.timeline.push({ label: label, a: a });
  }
  function fmtNum(v) {
    const r = round1(v);
    return Math.abs(r) >= 10 || r === Math.round(r) ? String(Math.round(r)) : String(r);
  }
  function formatDelta(delta) {
    if (!delta) return '';
    return Object.keys(delta).filter((k) => round1(delta[k]) > 0)
      .map((k) => ABILITY_LABEL[k] + '+' + fmtNum(delta[k])).join(' ');
  }

  // 卒業・引退時の進路を決める
  function decideCareer(rng, p) {
    const C = CONFIG.career;
    let r = rating(p);
    let mx = maxAbility(p.abilities, sideKeys(mainSide(p)));
    if (p.twoWay) { r += C.twoWayBonus; mx = maxAbility(p.abilities, ALL_KEYS); }
    const score = r * C.overallWeight + mx * CONFIG.ratingMultiplier * C.maxWeight + rng.normal(0, C.noiseSd);
    for (const path of C.paths) if (score >= path.min) return path.label;
    return C.paths[C.paths.length - 1].label;
  }

  // 名鑑に残す記録を作る
  function makeAlumniRecord(p, extra) {
    const fin = {};
    for (const k of ALL_KEYS) fin[k] = round1(p.abilities[k]);
    return Object.assign({
      id: p.id,
      name: p.name,
      position: p.position,
      originalPosition: p.originalPosition,
      talent: p.talent,
      geniusBust: p.geniusBust,
      reincarnation: p.reincarnation,
      twoWay: p.twoWay,
      twoWayRevealed: true,
      helper: !!p.helper,
      subRevealed: isSubKnown(p),
      policy: p.policy,
      policyLabel: policyLabel(p),
      mainKeys: p.twoWay ? ALL_KEYS.slice() : sideKeys(mainSide(p)).slice(),
      initialAbilities: Object.assign({}, p.initialAbilities),
      finalAbilities: fin,
      rating: rating(p),
      initialRating: initialRating(p),
      statCap: p.statCap,
      cappedOut: isCappedOut(p),
      limitBreaks: p.limitBreaks,
      expTotal: round1(p.expTotal),
      growthBy: Object.assign({}, p.growthBy),
      starts: p.starts,
      teamGames: p.teamGames,
      lvAtEntry: p.lvAtEntry || 1,
      history: p.history.slice(),
      snapshots: p.snapshots.slice(),
      timeline: p.timeline.slice(),
      record: JSON.parse(JSON.stringify(p.record)),
      stats: JSON.parse(JSON.stringify(p.stats)),
      watched: !!p.watched,
      enrolledYear: p.enrolledYear,
      origin: p.origin || 'recruit',
    }, extra || {});
  }

  // ---------- スタメン編成・チームの強さ ----------
  function buildLineup(players) {
    const avail = players.filter((p) => !p.retired && !p.excluded);
    const used = new Set();
    const slots = [];
    for (const pos of CONFIG.lineupOrder) {
      for (let i = 0; i < CONFIG.lineup[pos]; i++) {
        const cands = avail.filter((p) => !used.has(p.id));
        let pool;
        if (pos === 'P') {
          const primary = cands.filter((p) => p.position === 'P');
          const twoWays = CONFIG.twoWay.alwaysStartAsPitcher ? primary.filter(isTwoWayKnown) : [];
          pool = twoWays.length ? twoWays : primary.length ? primary : cands;
        } else {
          const nonP = cands.filter((p) => p.position !== 'P');
          pool = nonP.length ? nonP : cands;
        }
        const score = (p) => effectiveAptitude(p, pos) + (p.position === pos ? CONFIG.primaryBonus : 0);
        pool.sort((a, b) => score(b) - score(a) || a.id - b.id);
        const pl = pool[0] || null;
        if (pl) used.add(pl.id);
        slots.push({
          pos: pos,
          player: pl,
          apt: pl ? effectiveAptitude(pl, pos) : null,
          outOfPosition: pl ? pl.position !== pos : false,
          subRole: pl ? sideOf(pos) !== mainSide(pl) && !pl.twoWay : false,
        });
      }
    }
    return slots;
  }

  // 編成されたメンバーから強さを計算する(この関数1つで計算する)
  //   opts: { gameNo, close } … 連戦・接戦でのスタミナ補正
  function evaluateLineup(slots, opts) {
    const TS = CONFIG.teamStrength;
    opts = opts || {};
    let pitch = TS.missingValue;
    let pitcherBat = TS.missingValue;
    let fatigue = 0;
    const fielderVals = [];
    for (const s of slots) {
      if (s.pos === 'P') {
        if (s.player) {
          pitch = effectiveAptitude(s.player, 'P');
          pitcherBat = batting(s.player);
          const ST = CONFIG.stamina;
          const lack = Math.max(0, ST.threshold - effAbility(s.player.abilities.stamina));
          fatigue = lack * (ST.perGame * Math.max(0, (opts.gameNo || 1) - 1) + (opts.close ? ST.close : 0));
        }
      } else {
        fielderVals.push(s.player ? batting(s.player) * TS.fielderBat + effectiveAptitude(s.player, s.pos) * TS.fielderDef : TS.missingValue);
      }
    }
    const fieldAvg = fielderVals.length ? fielderVals.reduce((a, b) => a + b, 0) / fielderVals.length : TS.missingValue;
    const pitchPart = TS.pitchWeight * pitch;
    const pitcherBatPart = TS.pitcherBatWeight * pitcherBat;
    const strength = pitchPart + TS.fieldWeight * fieldAvg + pitcherBatPart - fatigue;
    return {
      strength: round1(strength),
      pitch: round1(pitch),
      pitcherBat: round1(pitcherBat),
      pitcherSlotValue: round1(pitchPart + pitcherBatPart),
      field: round1(fieldAvg),
      fatigue: round1(fatigue),
    };
  }
  function calcTeamStrength(players, opts) {
    return evaluateLineup(buildLineup(players), opts).strength;
  }

  function winProbability(my, opp) {
    const M = CONFIG.match;
    return clamp(1 / (1 + Math.exp(-(my - opp) / M.scale)), M.minWinRate, M.maxWinRate);
  }
  function playMatch(rng, myStrength, oppStrength) {
    const M = CONFIG.match;
    const win = rng.chance(winProbability(myStrength, oppStrength));
    const loser = rng.weighted(M.loserRunsWeights);
    const winner = loser + 1 + rng.weighted(M.marginWeights);
    return { win: win, my: win ? winner : loser, opp: win ? loser : winner };
  }

  // ---------- 試合経験値 ----------
  // 倍率を掛け合わせて経験値を加える(倍率の合計は上限あり)
  function expMultiplier(opt) {
    const X = CONFIG.growth.exp;
    let m = 1;
    if (opt.win) m *= X.winMult;
    if (opt.stageMult) m *= opt.stageMult;
    if (opt.oppDiff != null) {
      if (opt.oppDiff > X.margin) m *= X.strongerMult;
      else if (opt.oppDiff < -X.margin) m *= X.weakerMult;
    }
    return Math.min(m, X.maxMult);
  }
  function gainExp(p, base, mult) {
    const v = base * mult;
    p.exp += v;
    p.expTotal += v;
  }

  // ---------- 成長の見える化(乱数は使わない) ----------
  function growthSinceEntry(p, keys) {
    keys = keys || visibleKeys(p);
    const base = p.initialAbilities;
    const now = abilitiesOf(p);
    let best = null;
    let total = 0;
    for (const k of keys) {
      const d = now[k] - base[k];
      total += d;
      if (!best || d > best.delta) best = { key: k, delta: d };
    }
    return { best: best && Math.round(best.delta) > 0 ? best : null, total: total };
  }
  function formatBestGrowth(g) {
    return g && g.best ? ABILITY_LABEL[g.best.key] + ' +' + Math.round(g.best.delta) : '';
  }
  // 能力の推移(入学・各合宿・卒業の時点)。在籍中なら「現在」を足す。グラフ用
  function growthSeries(p) {
    const out = (p.timeline || []).slice();
    if (!p.finalAbilities) out.push({ label: '現在', a: p.abilities });
    return out;
  }

  // ---------- 打順(強さの計算には影響しない) ----------
  function weightedScore(p, w) {
    let s = 0;
    let t = 0;
    for (const k of Object.keys(w)) { s += effAbility(p.abilities[k]) * w[k]; t += w[k]; }
    return s / t;
  }
  function battingOrder(slots) {
    const BO = CONFIG.battingOrder;
    const left = slots.filter((s) => s.player).map((s) => s.player);
    const order = {};
    const used = new Set();
    const take = (num, score, lowest) => {
      if (!left.length) return;
      left.sort((a, b) => (lowest ? score(a) - score(b) : score(b) - score(a)) || a.id - b.id);
      const p = left.shift();
      order[p.id] = num;
      used.add(num);
    };
    for (const num of BO.pickSequence) {
      if (num === 9) take(9, batting, true);
      else take(num, (p) => weightedScore(p, BO.weights[num]));
    }
    left.sort((a, b) => batting(b) - batting(a) || a.id - b.id);
    for (let num = 1; num <= 9 && left.length; num++) {
      if (!used.has(num)) order[left.shift().id] = num;
    }
    return order;
  }

  // ---------- 簡易成績 ----------
  function emptyStatLine() {
    return { g: 0, pa: 0, ab: 0, h: 0, hr: 0, rbi: 0, k: 0, bb: 0, pg: 0, w: 0, l: 0, er: 0, outs: 0 };
  }
  function statLinesFor(p, year) {
    if (!p.stats) p.stats = { career: emptyStatLine(), byYear: {} };
    if (!p.stats.byYear[year]) p.stats.byYear[year] = emptyStatLine();
    return [p.stats.career, p.stats.byYear[year]];
  }
  function sumStatLines(lines) {
    const t = emptyStatLine();
    for (const l of lines) for (const k of Object.keys(t)) t[k] += l[k] || 0;
    return t;
  }
  function battingAverage(line) { return line && line.ab > 0 ? line.h / line.ab : null; }
  function formatAverage(line) {
    const v = battingAverage(line);
    if (v == null) return '---';
    return v >= 1 ? '1.000' : '.' + String(Math.round(v * 1000)).padStart(3, '0');
  }
  function earnedRunAverage(line) { return line && line.outs > 0 ? line.er * 27 / line.outs : null; }
  function formatEra(line) {
    const v = earnedRunAverage(line);
    return v == null ? '-.--' : v.toFixed(2);
  }
  function plateAppearances(rng, orderNum) {
    const S = CONFIG.stats;
    const x = S.paFirst - (S.paFirst - S.paLast) * (orderNum - 1) / 8;
    return Math.floor(x) + (rng.chance(x - Math.floor(x)) ? 1 : 0);
  }
  // 1打席の結果を、ミート・パワー・走力から抽選する(100超は割り引く)
  function plateAppearance(rng, p, orderNum) {
    const S = CONFIG.stats;
    const c = effAbility(p.abilities.contact);
    const pw = effAbility(p.abilities.power);
    const sp = effAbility(p.abilities.speed);
    const r = { pa: 1, ab: 0, h: 0, hr: 0, rbi: 0, k: 0, bb: 0 };
    if (rng.chance(S.walkRate)) { r.bb = 1; return r; }
    r.ab = 1;
    const H = S.hit;
    const hitP = clamp(H.base + (c - H.pivot) * H.perContact + (pw - H.pivot) * H.perPower
      + (sp - H.pivot) * H.perSpeed, H.min, H.max);
    const cleanup = orderNum >= 3 && orderNum <= 5 ? S.cleanupRbiBonus : 0;
    if (rng.chance(hitP)) {
      r.h = 1;
      const HR = S.homeRun;
      if (rng.chance(clamp(HR.base + (pw - HR.pivot) * HR.perPower, HR.min, HR.max))) {
        r.hr = 1;
        r.rbi = 1 + rng.weighted(S.homeRunRunners);
      } else if (rng.chance(S.rbiOnHit + cleanup)) {
        r.rbi = 1;
      }
      return r;
    }
    const K = S.strikeout;
    if (rng.chance(clamp(K.base - (c - K.pivot) * K.perContact, K.min, K.max))) r.k = 1;
    else if (rng.chance(S.rbiOnOut + cleanup / 2)) r.rbi = 1;
    return r;
  }
  function recordGameStats(rng, year, slots, order, result) {
    const S = CONFIG.stats;
    const paByOrder = {};
    for (const s of slots) {
      const p = s.player;
      if (!p) continue;
      const lines = statLinesFor(p, year);
      const num = order[p.id] || 9;
      const n = plateAppearances(rng, num);
      paByOrder[num] = n;
      const g = emptyStatLine();
      g.g = 1;
      for (let i = 0; i < n; i++) {
        const r = plateAppearance(rng, p, num);
        for (const k of Object.keys(r)) g[k] += r[k];
      }
      if (s.pos === 'P') {
        g.pg = 1;
        if (result.win) g.w = 1; else g.l = 1;
        g.er = Math.round(result.opp * S.earnedRate);
        g.outs = S.innings * 3;
      }
      for (const line of lines) for (const k of Object.keys(g)) line[k] += g[k];
    }
    return paByOrder;
  }

  const Core = {
    Rng: Rng,
    PITCH_KEYS: PITCH_KEYS,
    BAT_KEYS: BAT_KEYS,
