<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>野球ガチャ育成</title>
<style>
  :root {
    --bg: #f4f1ea; --card: #fffdf8; --ink: #222; --sub: #777; --line: #ddd5c6;
    --accent: #1f5f8b; --win: #1d7a3a; --lose: #b03a2e; --gold: #b07d00; --special: #8a2be2;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
    font-size: 15px; line-height: 1.5;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 12px 80px; }
  header { position: sticky; top: 0; background: var(--bg); padding: 10px 0 6px; z-index: 5; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 18px; margin: 0; }
  header .meta { font-size: 13px; color: var(--sub); }
  header .meta b { color: var(--ink); }
  nav { display: flex; gap: 6px; margin-top: 8px; }
  nav button { flex: 1; padding: 8px 0; border: 1px solid var(--line); background: var(--card); border-radius: 6px; font-size: 14px; color: var(--ink); }
  nav button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  .cal { display: flex; flex-wrap: wrap; gap: 4px; margin: 10px 0; }
  .cal span { font-size: 11px; padding: 2px 6px; border-radius: 10px; background: #e8e2d5; color: var(--sub); }
  .cal span.done { color: #aaa; text-decoration: line-through; }
  .cal span.now { background: var(--accent); color: #fff; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin: 10px 0; }
  .card h2 { font-size: 16px; margin: 0 0 6px; }
  .card h3 { font-size: 14px; margin: 8px 0 4px; }
  .lines div { padding: 2px 0; border-bottom: 1px dotted #eee; font-size: 14px; }
  .lines .summary { font-weight: bold; }
  .lines .win { color: var(--win); }
  .lines .lose { color: var(--lose); }
  .lines .big { color: var(--win); font-weight: bold; }
  .lines .none { color: var(--sub); }
  .lines .special { color: var(--special); font-weight: bold; }
  .lines .big { background: #e9f6ec; border-radius: 4px; padding-left: 4px; }
  .lines .watch { color: #9a6a00; }
  .lines .watchhead { color: #9a6a00; font-weight: bold; border-top: 1px solid var(--line); margin-top: 4px; }
  .gr { font-size: 11px; color: var(--win); font-weight: bold; margin-left: 4px; white-space: nowrap; }
  .star { border: none; background: none; font-size: 18px; line-height: 1; padding: 0 4px; color: #bbb; cursor: pointer; vertical-align: middle; }
  .star.on { color: #e0a800; }
  .watchrow { padding: 4px 0; border-bottom: 1px dotted #eee; font-size: 13px; }
  .watchrow .note { display: block; font-size: 12px; color: var(--sub); }
  .chooser { border: 2px solid #e0a800; }
  .chooser button { margin: 3px 4px 3px 0; padding: 6px 10px; border: 1px solid var(--line); background: #fff; border-radius: 6px; font-size: 14px; }
  svg.chart { width: 100%; height: auto; display: block; margin-top: 4px; }
  .legend { font-size: 11px; color: var(--sub); }
  .legend i { display: inline-block; width: 10px; height: 3px; margin: 0 3px 2px 6px; vertical-align: middle; }
  .btns { display: flex; gap: 8px; margin: 10px 0; }
  .btn { flex: 1; padding: 14px 8px; font-size: 16px; border: none; border-radius: 8px; background: var(--accent); color: #fff; font-weight: bold; }
  .btn.sub { background: #fff; color: var(--accent); border: 1px solid var(--accent); }
  .btn.danger { background: #fff; color: var(--lose); border: 1px solid var(--lose); }
  .btn:disabled { opacity: .4; }
  .player { border-top: 1px solid var(--line); padding: 8px 0; }
  .player:first-child { border-top: none; }
  .pname { font-weight: bold; }
  .tag { display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 8px; margin-left: 4px; vertical-align: middle; border: 1px solid var(--line); color: var(--sub); }
  .tag.P { border-color: #c77; color: #a33; }
  .tag.C { border-color: #7a7; color: #363; }
  .tag.IF { border-color: #79c; color: #357; }
  .tag.OF { border-color: #c9a040; color: #8a6400; }
  .tag.twoway { border-color: #d4006a; color: #d4006a; }
  .tag.helper { background: #fde; }
  .tag.conv { border-style: dashed; }
  .tag.genius { border-color: var(--gold); color: var(--gold); }
  .tag.reinc { border-color: var(--special); color: var(--special); }
  .tag.ret { background: #eee; }
  .abil { display: grid; grid-template-columns: repeat(var(--cols, 4), 1fr); gap: 4px; margin-top: 4px; }
  .abil div { background: #f6f2e9; border-radius: 4px; padding: 2px 4px; text-align: center; font-size: 12px; color: var(--sub); }
  .abil b { display: block; font-size: 16px; color: var(--ink); }
  .v80 b { color: #c0392b; } .v60 b { color: #d35400; } .v40 b { color: #222; } .v0 b { color: #999; }
  .small { font-size: 12px; color: var(--sub); }
  select { width: 100%; padding: 8px; font-size: 15px; margin-top: 6px; border-radius: 6px; border: 1px solid var(--line); background: #fff; }
  details summary { cursor: pointer; padding: 6px 0; }
  .hist { font-size: 12px; color: #444; margin: 4px 0 0 0; padding-left: 16px; }
  .hist li { margin: 1px 0; }
  table.snap { border-collapse: collapse; font-size: 12px; margin-top: 4px; width: 100%; }
  table.snap th, table.snap td { border: 1px solid var(--line); padding: 2px 4px; text-align: center; }
  .reveal { margin-top: 6px; padding: 6px; border: 1px dashed var(--special); color: var(--special); font-weight: bold; border-radius: 6px; font-size: 14px; }
  .impress { font-size: 13px; color: #555; margin-top: 2px; }
  input[type=text] { padding: 8px; font-size: 15px; width: 100%; border: 1px solid var(--line); border-radius: 6px; }
  .filters { display: flex; gap: 6px; flex-wrap: wrap; }
  .filters button { padding: 4px 10px; border: 1px solid var(--line); background: #fff; border-radius: 14px; font-size: 13px; }
  .filters button.on { background: var(--ink); color: #fff; }
  .sublabel { font-size: 11px; color: var(--sub); margin-top: 6px; }
  .scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  table.lu { border-collapse: collapse; width: 100%; font-size: 13px; white-space: nowrap; }
  table.lu th { font-size: 11px; color: var(--sub); font-weight: normal; text-align: left; padding: 2px 4px; border-bottom: 1px solid var(--line); }
  table.lu td { border-bottom: 1px dotted #eee; padding: 3px 4px; }
  table.lu td.num { text-align: right; }
  table.lu td.ord { width: 2.4em; font-weight: bold; text-align: center; }
  table.lu td.pos { width: 1.6em; font-weight: bold; }
  table.lu td.nm { white-space: normal; min-width: 7em; }
  table.lu tr.oop td { color: var(--lose); }
  table.lu .ord small { display: block; font-size: 10px; font-weight: normal; color: var(--sub); }
  table.st { border-collapse: collapse; font-size: 12px; margin-top: 4px; white-space: nowrap; }
  table.st th, table.st td { border: 1px solid var(--line); padding: 2px 5px; text-align: right; }
  table.st th { text-align: center; }
  .nc { font-size: 13px; margin: 4px 0; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="title">野球ガチャ育成</h1>
    <div class="meta" id="meta"></div>
    <nav>
      <button data-tab="home" class="on">ホーム</button>
      <button data-tab="roster">選手一覧</button>
      <button data-tab="alumni">名鑑</button>
      <button data-tab="settings">設定</button>
    </nav>
  </header>
  <main id="main"></main>
</div>

<script src="config.js"></script>
<script src="logic.js"></script>
<script>
(function () {
  'use strict';
  if (!window.Logic) {
    // config.js / logic.js を読み込めなかった(プレビューなどで単体表示された)場合
    document.getElementById('main').innerHTML = '<div class="card"><h2>読み込みエラー</h2>'
      + '<div class="small">config.js と logic.js を読み込めませんでした。index.html と同じフォルダに置いて開くか、'
      + '単一ファイル版の play.html を開いてください。</div></div>';
    return;
  }
  const { CONFIG, Core, HighSchool } = window.Logic;
  let state = null;
  let tab = 'home';
  let alumniFilter = 'all';
  let pendingWatchId = null;    // 上限を超えて注目しようとした選手
  const openDetails = new Set(); // 開いている選手詳細(描き直しても開いたままにする)
  const draftPolicies = {}; // 入学時に選択中の方針

  // ---------- セーブ / ロード ----------
  function save() {
    try { localStorage.setItem(CONFIG.saveKey, JSON.stringify(state)); } catch (e) { /* 保存できなくても遊べる */ }
  }
  function load() {
    try {
      const raw = localStorage.getItem(CONFIG.saveKey);
      if (raw) return JSON.parse(raw);
    } catch (e) { /* 壊れたセーブは無視 */ }
    return null;
  }
  function clearDraft() { for (const k of Object.keys(draftPolicies)) delete draftPolicies[k]; }
  function startNew(seed) {
    state = HighSchool.newGame(seed !== '' && seed != null ? { seed: Number(seed) } : {});
    clearDraft();
    save();
  }

  // ---------- 表示ヘルパー ----------
  function esc(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  function vClass(v) { return v >= 80 ? 'v80' : v >= 60 ? 'v60' : v >= 40 ? 'v40' : 'v0'; }
  // 能力のマス目。keys の順に並べる。base を渡すと増分も表示
  function abilGrid(keys, abilities, base) {
    return '<div class="abil" style="--cols:' + keys.length + '">' + keys.map((k) => {
      const v = abilities[k];
      const diff = base ? v - base[k] : 0;
      return '<div class="' + vClass(v) + '">' + Core.ABILITY_LABEL[k] + '<b>' + v + '</b>'
        + (base ? '<span class="small">' + (diff > 0 ? '+' + diff : '±0') + '</span>' : '') + '</div>';
    }).join('') + '</div>';
  }
  // 本職側の能力(判明した二刀流は投打2段)
  function mainGrids(p, abilities, base) {
    if (Core.isTwoWayKnown(p) || (p.finalAbilities && p.twoWay)) {
      return '<div class="sublabel">投手系</div>' + abilGrid(Core.PITCH_KEYS, abilities, base)
        + '<div class="sublabel">野手系</div>' + abilGrid(Core.BAT_KEYS, abilities, base);
    }
    return abilGrid(Core.sideKeys(Core.sideOf(p.position)), abilities, base);
  }
  function posTag(pos) { return '<span class="tag ' + pos + '">' + Core.POSITION_LABEL[pos] + '</span>'; }
  function extraTags(p, isAlumni) {
    let t = '';
    if (p.twoWay && (p.twoWayRevealed || isAlumni)) t += '<span class="tag twoway">二刀流</span>';
    if (p.reincarnation && (p.reincarnationRevealed || isAlumni)) {
      t += '<span class="tag reinc">転生:' + esc(Core.reincarnationName(p.reincarnation)) + '</span>';
    }
    if (p.helper) t += '<span class="tag helper">助っ人</span>';
    if (p.convert) t += '<span class="tag conv">転向中</span>';
    if (p.retired) t += '<span class="tag ret">引退</span>';
    return t;
  }
  function histList(history) {
    return '<ul class="hist">' + history.map((h) =>
      '<li>' + HighSchool.formatYear(h.y) + '(' + h.g + '年) ' + esc(h.ev) + (h.res ? ':' + esc(h.res) : '')
      + (h.d && Object.keys(h.d).length ? ' <span class="small">' + esc(Core.formatDelta(h.d)) + '</span>' : '') + '</li>'
    ).join('') + '</ul>';
  }
  // 年ごとの能力表。current を渡すと末尾に「現在」の行を付ける
  function snapTable(keys, snaps, current) {
    if (!snaps || !snaps.length) return '';
    let html = '<table class="snap"><tr><th>年</th>' + keys.map((k) => '<th>' + Core.ABILITY_LABEL[k] + '</th>').join('') + '</tr>';
    snaps.forEach((s, i) => {
      const label = i === 0 ? '入学時' : HighSchool.formatYear(s.y) + '末';
      html += '<tr><td>' + label + '</td>' + keys.map((k) => '<td>' + s.a[k] + '</td>').join('') + '</tr>';
    });
    if (current) html += '<tr><td>現在</td>' + keys.map((k) => '<td>' + current[k] + '</td>').join('') + '</tr>';
    return html + '</table>';
  }
  // 適性(見えている能力から計算できる区分だけ表示)
  function aptLine(p) {
    const known = Core.isSubKnown(p);
    const side = Core.mainSide(p);
    const parts = Core.POSITIONS.filter((pos) => known || Core.sideOf(pos) === side)
      .map((pos) => Core.POSITION_SHORT[pos] + ' ' + Core.aptitude(p, pos));
    let s = '適性:' + parts.join(' / ');
    if (p.convert) s += '(' + Core.POSITION_LABEL[p.convert.pos] + 'は転向直後のため -' + p.convert.penalty + ')';
    return '<div class="small">' + s + '</div>';
  }
  // 入学時から一番伸びた項目(名前の横に小さく)
  function growthLabel(p) {
    const t = Core.formatBestGrowth(Core.growthSinceEntry(p));
    return t ? '<span class="gr">' + esc(t) + '</span>' : '';
  }
  function starBtn(p) {
    return '<button class="star' + (p.watched ? ' on' : '') + '" data-watch="' + p.id + '" title="注目">' + (p.watched ? '★' : '☆') + '</button>';
  }
  // 能力の推移のグラフ(インラインSVG)。横軸は学期、縦軸は能力値、能力ごとに線を分ける
  const LINE_COLORS = ['#c0392b', '#2471a3', '#1e8449', '#b9770e', '#7d3c98', '#117a65', '#a04000', '#5d6d7e', '#cb4335'];
  function growthChart(p, keys) {
    const series = Core.growthSeries(p);
    if (series.length < 2) return '';
    const W = 320, H = 150, L = 24, R = 14, T = 6, B = 30;
    const x = (i) => L + (W - L - R) * i / (series.length - 1);
    const y = (v) => T + (H - T - B) * (1 - v / 100);
    let svg = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="能力の推移">';
    for (const v of [0, 20, 40, 60, 80, 100]) {
      svg += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(v) + '" y2="' + y(v) + '" stroke="#e5ddd0" stroke-width="1"/>'
        + '<text x="' + (L - 3) + '" y="' + (y(v) + 3) + '" font-size="8" text-anchor="end" fill="#999">' + v + '</text>';
    }
    series.forEach((pt, i) => {
      svg += '<text x="' + x(i) + '" y="' + (H - B + 10 + (i % 2) * 9) + '" font-size="7.5" text-anchor="middle" fill="#888">' + esc(pt.label) + '</text>';
    });
    keys.forEach((k, ki) => {
      const pts = series.map((pt, i) => x(i).toFixed(1) + ',' + y(pt.a[k]).toFixed(1)).join(' ');
      svg += '<polyline points="' + pts + '" fill="none" stroke="' + LINE_COLORS[ki % LINE_COLORS.length] + '" stroke-width="1.6"/>';
    });
    svg += '</svg>';
    const legend = '<div class="legend">' + keys.map((k, ki) => '<i style="background:' + LINE_COLORS[ki % LINE_COLORS.length] + '"></i>'
      + Core.ABILITY_LABEL[k]).join('') + '</div>';
    return '<div class="sublabel">能力の推移</div>' + svg + legend;
  }
  function detailsOpen(key) { return openDetails.has(key) ? ' open' : ''; }
  // 上限を超えて注目しようとしたときの、外す選手の選択
  function renderWatchChooser() {
    if (pendingWatchId == null) return '';
    const cur = HighSchool.watchedPlayers(state);
    const target = state.players.concat(state.pendingRecruits).find((p) => p.id === pendingWatchId);
    if (!target) return '';
    return '<div class="card chooser"><h2>★ 注目選手は' + CONFIG.watch.max + '人までです</h2>'
      + '<div class="small">' + esc(target.name) + 'を注目にするため、外す選手を選んでください。</div>'
      + cur.map((p) => '<button data-swapwatch="' + p.id + '">★ ' + esc(p.name) + '(' + p.grade + '年・' + Core.POSITION_SHORT[p.position] + ')を外す</button>').join('')
      + '<div><button data-swapwatch="cancel">やめる</button></div></div>';
  }
  // ホームの注目選手欄(0人なら出さない)
  function renderWatchCard() {
    const list = HighSchool.watchedPlayers(state);
    if (!list.length) return '';
    return '<div class="card"><h2>★ 注目選手(' + list.length + '/' + CONFIG.watch.max + ')</h2>' + list.map((p) =>
      '<div class="watchrow">' + starBtn(p) + '<b>' + esc(p.name) + '</b> '
      + '<span class="small">' + (state.pendingRecruits.indexOf(p) >= 0 ? '入学前' : p.grade + '年') + '・' + Core.POSITION_LABEL[p.position] + '</span>'
      + growthLabel(p)
      + '<span class="note">' + (p.lastNotice ? HighSchool.formatYear(p.lastNotice.y) + ':' + esc(p.lastNotice.t) : 'まだ通知はありません') + '</span></div>'
    ).join('') + '</div>';
  }

  function eventCard(ev) {
    return '<div class="card"><h2>' + esc(ev.title) + '</h2><div class="lines">' + ev.lines.map((l) => {
      const o = typeof l === 'string' ? { text: l, cls: '' } : l;
      return '<div class="' + (o.cls || '') + '">' + esc(o.text) + '</div>';
    }).join('') + '</div>' + (ev.lineup ? lineupTable(ev.lineup, 'この大会のスタメン') : '') + '</div>';
  }
  // ---------- 成績の表示 ----------
  function careerOf(p) { return (p && p.stats && p.stats.career) || Core.emptyStatLine(); }
  function batText(l) { return Core.formatAverage(l) + ' ' + l.hr + '本 ' + l.rbi + '点'; }
  function pitchText(l) { return l.w + '勝' + l.l + '敗 防' + Core.formatEra(l); }
  // 一覧の見出しに出す成績(投手は防御率、野手は打率。二刀流は両方)
  function statBrief(p) {
    const l = careerOf(p);
    const parts = [];
    if (p.position === 'P' || l.pg > 0) parts.push('防' + Core.formatEra(l));
    if (p.position !== 'P' || Core.isTwoWayKnown(p) || p.twoWay && p.finalAbilities) parts.push('打率' + Core.formatAverage(l));
    return parts.join(' ');
  }
  // 年度ごとの成績表(通算の行付き)
  function statTable(p) {
    const st = p.stats;
    if (!st || !st.career.g) return '<div class="sublabel">成績:まだ試合に出ていません</div>';
    const years = Object.keys(st.byYear).map(Number).sort((a, b) => a - b);
    const rows = years.map((y) => [HighSchool.formatYear(y), st.byYear[y]]).concat([['通算', st.career]]);
    let html = '';
    if (st.career.pa > 0) {
      html += '<div class="sublabel">打撃成績</div><div class="scroll"><table class="st"><tr><th>年度</th><th>試合</th><th>打席</th><th>打数</th>'
        + '<th>安打</th><th>本塁打</th><th>打点</th><th>三振</th><th>打率</th></tr>'
        + rows.filter((r) => r[1].pa > 0).map((r) => '<tr><td>' + r[0] + '</td><td>' + r[1].g + '</td><td>' + r[1].pa + '</td><td>' + r[1].ab
          + '</td><td>' + r[1].h + '</td><td>' + r[1].hr + '</td><td>' + r[1].rbi + '</td><td>' + r[1].k
          + '</td><td>' + Core.formatAverage(r[1]) + '</td></tr>').join('') + '</table></div>';
    }
    if (st.career.pg > 0) {
      html += '<div class="sublabel">投手成績</div><div class="scroll"><table class="st"><tr><th>年度</th><th>登板</th><th>勝</th><th>敗</th>'
        + '<th>投球回</th><th>自責点</th><th>防御率</th></tr>'
        + rows.filter((r) => r[1].pg > 0).map((r) => '<tr><td>' + r[0] + '</td><td>' + r[1].pg + '</td><td>' + r[1].w + '</td><td>' + r[1].l
          + '</td><td>' + Math.floor(r[1].outs / 3) + (r[1].outs % 3 ? ' ' + (r[1].outs % 3) + '/3' : '') + '</td><td>' + r[1].er
          + '</td><td>' + Core.formatEra(r[1]) + '</td></tr>').join('') + '</table></div>';
    }
    return html;
  }

  // スタメン表。withStats のときは、在籍中の選手の通算成績を表示する
  function lineupTable(lu, title, withStats) {
    const byId = {};
    for (const p of state.players) byId[p.id] = p;
    const head = '<tr><th>打順</th><th>守</th><th>名前</th><th>学年</th>'
      + (withStats ? '<th>打率</th><th>本</th><th>点</th>' : '<th>適性</th>') + '</tr>';
    const rows = lu.map((s) => {
      const p = byId[s.id];
      const isP = s.pos === 'P';
      const ord = isP ? '先発' + (s.order ? '<small>' + s.order + '番</small>' : '') : (s.order || '-');
      let name = esc(s.name) + (withStats && p ? growthLabel(p) : '') + (s.twoWay ? ' <span class="tag twoway">二刀流</span>' : '') + (s.helper ? ' <span class="tag helper">助っ人</span>' : '')
        + (s.outOfPosition && s.primary ? ' <span class="small">(本職:' + Core.POSITION_LABEL[s.primary] + ')</span>' : '');
      let cols;
      if (!withStats) {
        cols = '<td class="num small">' + (s.apt == null ? '-' : s.apt) + '</td>';
      } else {
        const l = careerOf(p);
        if (isP) {
          // 投手は勝敗と防御率。二刀流は打撃成績も添える
          if (s.twoWay) name += '<div class="small">' + batText(l) + '</div>';
          cols = '<td class="num" colspan="3">' + pitchText(l) + '</td>';
        } else {
          cols = '<td class="num">' + Core.formatAverage(l) + '</td><td class="num">' + l.hr + '</td><td class="num">' + l.rbi + '</td>';
        }
      }
      const grade = s.helper ? '助' : (s.grade ? s.grade + '年' : '-');
      return '<tr class="' + (s.outOfPosition ? 'oop' : '') + '"><td class="ord">' + ord + '</td><td class="pos">' + Core.POSITION_SHORT[s.pos]
        + '</td><td class="nm">' + name + '</td><td>' + grade + '</td>' + cols + '</tr>';
    }).join('');
    const table = '<div class="scroll"><table class="lu">' + head + rows + '</table></div>'
      + (withStats ? '<div class="small">成績は通算(大会のみ)。赤字は本職外の起用。</div>' : '');
    if (!title) return table;
    return '<details><summary class="small">' + esc(title) + '</summary>' + table + '</details>';
  }
  // 入学時の第一印象(固定の文章リストから選ぶ)
  function impression(p) {
    const keys = Core.visibleKeys(p);
    const ov = Core.avgOf(p.abilities, keys);
    const mx = Core.maxAbility(p.abilities, keys);
    const pool = ov >= 45 ? ['即戦力の予感がする。', 'いきなり上級生に混ざっても見劣りしない。', '今年の目玉かもしれない。']
      : mx >= 45 ? ['光るものを1つ持っている。', '尖った長所がある。', '何か一芸がありそうだ。']
      : ov >= 28 ? ['素直そうな新入生だ。', 'まだ線が細いが伸びしろはある。', '平凡だが真面目に練習しそう。']
      : ['正直、まだまだこれから。', '体力づくりから始めよう。', '入部動機は「なんとなく」らしい。'];
    return pool[p.id % pool.length];
  }
  function overallText(p) {
    if (Core.isTwoWayKnown(p)) {
      return '投 ' + Core.avgOf(p.abilities, Core.PITCH_KEYS) + ' / 打 ' + Core.avgOf(p.abilities, Core.BAT_KEYS);
    }
    return '総合 ' + Core.avgOf(p.abilities, Core.visibleKeys(p));
  }

  // ---------- 画面 ----------
  function renderHeader() {
    document.getElementById('title').textContent = CONFIG.schoolName + ' 野球部';
    const stage = HighSchool.currentStage(state);
    const mem = HighSchool.members(state).filter((p) => !p.retired).length;
    document.getElementById('meta').innerHTML = '<b>' + HighSchool.formatYear(state.year) + '</b> ・ ' + esc(stage.label)
      + ' ・ チームの強さ <b>' + HighSchool.teamStrength(state) + '</b> ・ 部員 ' + mem + '人';
  }

  function renderCalendar() {
    return '<div class="cal">' + HighSchool.STAGES.map((s, i) =>
      '<span class="' + (i < state.stageIndex ? 'done' : i === state.stageIndex ? 'now' : '') + '">' + esc(s.label) + '</span>'
    ).join('') + '</div>';
  }

  function renderEnrollment() {
    const info = state.newcomerInfo || {};
    const n = state.pendingRecruits.length;
    let html = '<div class="card"><h2>🌸 ' + HighSchool.formatYear(state.year) + ' 4月 新入生がやってきた!</h2>'
      + '<div class="nc">今年の入部希望者は <b>' + n + '人</b>'
      + (info.strength != null ? '(前年夏のチームの強さ ' + info.strength + ')' : '')
      + (info.capped ? '。部員数の上限のため人数を絞った' : '') + '</div>'
      + '<div class="small">育成方針を選んでください。特化:選んだ能力が伸びやすく、他はほとんど伸びない。バランス:全体が少しずつ伸びる。'
      + '表示は本職側の能力だけです。</div>';
    if (!n) html += '<div class="small">今年は新入生がいません。</div>';
    for (const p of state.pendingRecruits) {
      if (!draftPolicies[p.id]) draftPolicies[p.id] = p.policy;
      html += '<div class="player">' + starBtn(p) + '<span class="pname">' + esc(p.name) + '</span>' + posTag(p.position) + extraTags(p)
        + ' <span class="small">' + overallText(p) + '</span>'
        + '<div class="impress">' + esc(impression(p)) + '</div>'
        + mainGrids(p, p.abilities);
      if (p.reincarnation && p.reincarnationRevealed) {
        html += '<div class="reveal">……!? この新入生、ただ者ではない。<br>【' + esc(Core.reincarnationName(p.reincarnation)) + '】の転生者だ!</div>';
      }
      if (p.twoWay && p.twoWayRevealed) {
        html += '<div class="reveal">投げても打っても本職級……! <br>【二刀流】の素質を持っている!</div>';
      }
      const set = Core.POLICIES[Core.policySetOf(p)];
      html += '<select data-pid="' + p.id + '">' + set.map((pol) =>
        '<option value="' + pol.key + '"' + (draftPolicies[p.id] === pol.key ? ' selected' : '') + '>' + pol.label + '</option>'
      ).join('') + '</select></div>';
    }
    html += '</div><div class="btns">'
      + (n ? '<button class="btn sub" id="btnAuto">おまかせ</button>' : '')
      + '<button class="btn" id="btnEnroll">この方針で入部させる</button></div>';
    return html;
  }

  function renderHome() {
    let html = renderCalendar() + renderWatchChooser();
    const evs = state.lastEvents || [];
    if (state.awaiting === 'enrollment') {
      for (const ev of evs) html += eventCard(ev);
      html += renderEnrollment();
    } else {
      html += '<div class="btns"><button class="btn" id="btnNext">次へ進む</button>'
        + '<button class="btn sub" id="btnApril">次の4月まで</button></div>';
      for (const ev of evs) html += eventCard(ev);
      html += renderWatchCard();
      html += '<div class="card"><h2>現在のスタメン</h2>' + lineupTable(HighSchool.lineup(state), null, true) + '</div>';
    }
    const recent = state.log.slice(-8).reverse();
    html += '<div class="card"><h2>最近の出来事</h2><div class="lines">'
      + recent.map((l) => '<div>' + HighSchool.formatYear(l.y) + ':' + esc(l.t) + '</div>').join('') + '</div></div>';
    return html;
  }

  function playerCard(p) {
    const keys = Core.visibleKeys(p);
    let detail = '<div class="small">方針:' + esc(Core.policyLabel(p)) + ' / 試合 ' + p.record.games + '(' + p.record.wins + '勝)'
      + (p.originalPosition !== p.position ? ' / 元:' + Core.POSITION_LABEL[p.originalPosition] : '') + '</div>'
      + aptLine(p)
      + snapTable(keys, p.snapshots, p.abilities);
    if (Core.isSubKnown(p) && !Core.isTwoWayKnown(p)) {
      detail += '<div class="sublabel">副能力(' + Core.SIDE_LABEL[Core.sideOf(p.position) === 'pitch' ? 'bat' : 'pitch'] + '・判明済み)</div>'
        + abilGrid(Core.subKeysOf(p), p.abilities);
    } else if (!Core.isTwoWayKnown(p)) {
      detail += '<div class="sublabel">副能力:未判明(本職でない役割で出場すると分かる)</div>';
    }
    detail = '<div class="small">' + starBtn(p) + (p.watched ? '注目中(タップで外す)' : '注目する') + '</div>'
      + detail + growthChart(p, keys) + statTable(p) + histList(p.history);
    return '<div class="player">' + starBtn(p) + '<details data-open="p' + p.id + '"' + detailsOpen('p' + p.id) + ' style="display:inline-block;width:calc(100% - 32px);vertical-align:top">'
      + '<summary><span class="pname">' + esc(p.name) + '</span>' + growthLabel(p) + ' '
      + '<span class="small">' + (p.helper ? '' : p.grade + '年') + '</span>' + posTag(p.position) + extraTags(p)
      + ' <span class="small">' + overallText(p) + ' / ' + statBrief(p) + ' / ' + esc(Core.policyLabel(p)) + '</span></summary>'
      + detail + '</details>'
      + mainGrids(p, p.abilities) + '</div>';
  }

  function renderRoster() {
    return renderWatchChooser() + renderRosterBody();
  }
  function renderRosterBody() {
    const posOrder = { P: 0, C: 1, IF: 2, OF: 3 };
    const sortFn = (a, b) => posOrder[a.position] - posOrder[b.position]
      || Core.avgOf(b.abilities, Core.visibleKeys(b)) - Core.avgOf(a.abilities, Core.visibleKeys(a));
    const counts = HighSchool.countByPosition(HighSchool.members(state).filter((p) => !p.retired));
    let html = '<div class="card"><h2>部員の構成</h2><div class="small">'
      + Core.POSITIONS.map((pos) => Core.POSITION_LABEL[pos] + ' ' + counts[pos] + '人').join(' / ')
      + '(引退した3年生を除く)</div>' + lineupTable(HighSchool.lineup(state), 'スタメン(自動編成)', true) + '</div>';
    for (const g of [3, 2, 1]) {
      const list = state.players.filter((p) => p.grade === g && !p.helper).sort(sortFn);
      html += '<div class="card"><h2>' + g + '年生(' + list.length + '人)</h2>';
      html += list.length ? list.map(playerCard).join('') : '<div class="small">いません</div>';
      html += '</div>';
    }
    const helpers = state.players.filter((p) => p.helper);
    if (helpers.length) html += '<div class="card"><h2>助っ人(' + helpers.length + '人)</h2>' + helpers.map(playerCard).join('') + '</div>';
    html += '<div class="small">名前をタップすると、年ごとの能力・適性・副能力・成長履歴が見られます。隠れた才能は卒業まで分かりません。</div>';
    return html;
  }

  // 名鑑の通算成績(投手は勝敗と防御率、野手は打率・本塁打・打点。両方あれば両方)
  function alumniStatLine(a) {
    const l = careerOf(a);
    const parts = [];
    if (l.pg > 0) parts.push(pitchText(l));
    if (l.pa > 0 && (a.position !== 'P' || a.twoWay || l.pg === 0)) parts.push('打率 ' + batText(l));
    return parts.length ? parts.join(' / ') : '出場なし';
  }

  function renderAlumni() {
    const minAB = CONFIG.stats.minAtBatsForAverage;
    const filters = [['all', 'すべて'], ['genius', '天才'], ['reinc', '転生'], ['twoway', '二刀流'], ['pro', 'プロ入り'], ['three', '3割打者'], ['watched', '注目だった選手'], ['helper', '助っ人']];
    let list = state.alumni.slice().reverse();
    if (alumniFilter === 'genius') list = list.filter((a) => a.talent === 'genius');
    if (alumniFilter === 'reinc') list = list.filter((a) => a.reincarnation);
    if (alumniFilter === 'twoway') list = list.filter((a) => a.twoWay);
    if (alumniFilter === 'pro') list = list.filter((a) => a.career === CONFIG.career.paths[0].label);
    if (alumniFilter === 'helper') list = list.filter((a) => a.helper);
    if (alumniFilter === 'watched') list = list.filter((a) => a.watched);
    if (alumniFilter === 'three') list = list.filter((a) => careerOf(a).ab >= minAB && Core.battingAverage(careerOf(a)) >= 0.3);
    let html = '<div class="card"><h2>名鑑(' + state.alumni.length + '人)</h2><div class="filters">'
      + filters.map((f) => '<button data-af="' + f[0] + '" class="' + (alumniFilter === f[0] ? 'on' : '') + '">' + f[1] + '</button>').join('')
      + '</div></div>';
    if (alumniFilter === 'three') html += '<div class="card small">3割打者:通算打率 .300以上、通算' + minAB + '打数以上</div>';
    if (!list.length) return html + '<div class="card small">該当する記録がありません。</div>';
    let lastYear = null;
    html += '<div class="card">';
    for (const a of list) {
      if (a.graduatedYear !== lastYear) {
        html += '<h3>' + HighSchool.formatYear(a.graduatedYear) + ' 卒業</h3>';
        lastYear = a.graduatedYear;
      }
      const talent = a.talent === 'genius'
        ? '<span class="tag genius">' + (a.geniusBust ? '天才(開花せず)' : '天才') + '</span>' : '';
      const subKeys = a.twoWay ? [] : Core.ALL_KEYS.filter((k) => a.mainKeys.indexOf(k) < 0);
      const ini = Core.avgOf(a.initialAbilities, a.mainKeys);
      const fin = Core.avgOf(a.finalAbilities, a.mainKeys);
      const gl = Core.formatBestGrowth(Core.growthSinceEntry(a, a.mainKeys));
      html += '<div class="player">' + starBtn(a) + '<details data-open="a' + a.id + '"' + detailsOpen('a' + a.id)
        + ' style="display:inline-block;width:calc(100% - 32px);vertical-align:top"><summary><span class="pname">' + esc(a.name) + '</span>'
        + posTag(a.position) + talent + extraTags(a, true)
        + ' <span class="small">→ ' + esc(a.career) + '</span>'
        + '<div class="small">総合 ' + ini + ' → ' + fin + ' <b style="color:var(--win)">(' + (fin - ini >= 0 ? '+' : '') + (Math.round((fin - ini) * 10) / 10) + ')</b>'
        + (gl ? ' / 一番伸びた:' + esc(gl) : '') + '</div>'
        + '<div class="small">' + alumniStatLine(a) + '</div></summary>'
        + '<div class="small">育成方針:' + esc(a.policyLabel || Core.policyLabelByKey(a.policy))
        + ' / 才能:' + Core.TALENT_LABEL[a.talent] + (a.geniusBust ? '(開花せず)' : '')
        + ' / 転生の型:' + esc(Core.reincarnationName(a.reincarnation))
        + (a.twoWay ? ' / 二刀流' : '')
        + (a.originalPosition && a.originalPosition !== a.position ? ' / 入学時:' + Core.POSITION_LABEL[a.originalPosition] : '')
        + (a.origin === 'initial' ? ' / 就任時の部員' : '') + (a.helper ? ' / 助っ人' : '') + '</div>'
        + '<div class="small">通算成績:' + alumniStatLine(a) + '</div>'
        + '<div class="small">チーム成績:試合 ' + a.record.games + '(' + a.record.wins + '勝)'
        + (a.record.titles.length ? ' / ' + esc(a.record.titles.join('、')) : '') + '</div>'
        + growthChart(a, a.mainKeys)
        + statTable(a)
        + snapTable(a.mainKeys, a.snapshots)
        + (subKeys.length ? '<div class="sublabel">副能力(' + (a.subRevealed ? '在学中に判明' : '在学中は未判明') + ')</div>'
          + abilGrid(subKeys, a.finalAbilities, a.initialAbilities) : '')
        + histList(a.history) + '</details>'
        + mainGrids(a, a.finalAbilities, a.initialAbilities) + '</div>';
    }
    return html + '</div>';
  }

  function renderSettings() {
    const rv = (v) => (v === 'enrollment' ? '入学時' : '最初の合宿');
    return '<div class="card"><h2>ゲーム情報</h2><div class="small">シード:' + state.seed
      + '<br>転生の型の判明:' + rv(CONFIG.reincarnationReveal) + '(config.js の reincarnationReveal で切替)'
      + '<br>二刀流の判明:' + rv(CONFIG.twoWayReveal) + '(config.js の twoWayReveal で切替)'
      + '<br>セーブは自動(このブラウザの localStorage。データ形式 v' + state.version + ')</div></div>'
      + '<div class="card"><h2>リセット</h2><div class="small">シードを入れると同じ展開を再現できます(空欄ならランダム)。</div>'
      + '<input type="text" id="seedInput" inputmode="numeric" placeholder="シード(任意の数字)">'
      + '<div class="btns"><button class="btn danger" id="btnReset">セーブを消して最初から</button></div></div>';
  }

  function render() {
    renderHeader();
    document.querySelectorAll('nav button').forEach((b) => b.classList.toggle('on', b.dataset.tab === tab));
    const main = document.getElementById('main');
    main.innerHTML = tab === 'home' ? renderHome() : tab === 'roster' ? renderRoster()
      : tab === 'alumni' ? renderAlumni() : renderSettings();
  }

  // ---------- 操作 ----------
  document.querySelector('nav').addEventListener('click', (e) => {
    const t = e.target.dataset && e.target.dataset.tab;
    if (t) { tab = t; render(); window.scrollTo(0, 0); }
  });
  document.getElementById('main').addEventListener('toggle', (e) => {
    const key = e.target.dataset && e.target.dataset.open;
    if (!key) return;
    if (e.target.open) openDetails.add(key); else openDetails.delete(key);
  }, true);
  document.getElementById('main').addEventListener('change', (e) => {
    if (e.target.dataset.pid) draftPolicies[e.target.dataset.pid] = e.target.value;
  });
  document.getElementById('main').addEventListener('click', (e) => {
    const id = e.target.id;
    const ds = e.target.dataset || {};
    if (ds.watch) {
      e.preventDefault(); // summary の中でも詳細を開閉しない
      const pid = Number(ds.watch);
      const all = state.players.concat(state.pendingRecruits);
      const p = all.find((q) => q.id === pid) || state.alumni.find((q) => q.id === pid);
      const r = HighSchool.setWatch(state, pid, !(p && p.watched));
      if (!r.ok && r.needRemove.length) pendingWatchId = pid;
      save(); render();
      return;
    }
    if (ds.swapwatch) {
      if (ds.swapwatch !== 'cancel') {
        HighSchool.setWatch(state, Number(ds.swapwatch), false);
        HighSchool.setWatch(state, pendingWatchId, true);
      }
      pendingWatchId = null;
      save(); render();
      return;
    }
    if (id === 'btnAuto') {
      for (const p of state.pendingRecruits) draftPolicies[p.id] = Core.autoPolicy(p);
      render();
    } else if (id === 'btnEnroll') {
      HighSchool.confirmEnrollment(state, draftPolicies);
      clearDraft();
      save(); render(); window.scrollTo(0, 0);
    } else if (id === 'btnNext') {
      HighSchool.advanceToNextStop(state);
      save(); render(); window.scrollTo(0, 0);
    } else if (id === 'btnApril') {
      HighSchool.advanceToApril(state);
      save(); render(); window.scrollTo(0, 0);
    } else if (id === 'btnReset') {
      if (confirm('セーブデータを消して、最初からやり直しますか?')) {
        startNew(document.getElementById('seedInput').value.trim());
        tab = 'home'; render();
      }
    } else if (e.target.dataset && e.target.dataset.af) {
      alumniFilter = e.target.dataset.af; render();
    }
  });

  // 古い形式のセーブは互換を取らずに初期化する
  state = load();
  if (!state || state.version !== CONFIG.saveVersion) startNew();
  render();
})();
</script>
</body>
</html>
