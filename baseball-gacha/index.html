<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>野球ガチャ育成</title>
<style>
  :root {
    --bg: #f4f1ea; --card: #fffdf8; --ink: #222; --sub: #777; --line: #ddd5c6;
    --accent: #1f5f8b; --win: #1d7a3a; --lose: #b03a2e; --gold: #b07d00; --special: #8a2be2;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
    font-size: 15px; line-height: 1.5;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 12px 80px; }
  header { position: sticky; top: 0; background: var(--bg); padding: 10px 0 6px; z-index: 5; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 18px; margin: 0; }
  header .meta { font-size: 13px; color: var(--sub); }
  header .meta b { color: var(--ink); }
  nav { display: flex; gap: 6px; margin-top: 8px; }
  nav button { flex: 1; padding: 8px 0; border: 1px solid var(--line); background: var(--card); border-radius: 6px; font-size: 14px; color: var(--ink); }
  nav button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  .cal { display: flex; flex-wrap: wrap; gap: 4px; margin: 10px 0; }
  .cal span { font-size: 11px; padding: 2px 6px; border-radius: 10px; background: #e8e2d5; color: var(--sub); }
  .cal span.done { color: #aaa; text-decoration: line-through; }
  .cal span.now { background: var(--accent); color: #fff; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin: 10px 0; }
  .card h2 { font-size: 16px; margin: 0 0 6px; }
  .card h3 { font-size: 14px; margin: 8px 0 4px; }
  .lines div { padding: 2px 0; border-bottom: 1px dotted #eee; font-size: 14px; }
  .lines .summary { font-weight: bold; }
  .lines .win { color: var(--win); }
  .lines .lose { color: var(--lose); }
  .lines .big { color: var(--win); font-weight: bold; }
  .lines .none { color: var(--sub); }
  .lines .special { color: var(--special); font-weight: bold; }
  .lines .big { background: #e9f6ec; border-radius: 4px; padding-left: 4px; }
  .lines .watch { color: #9a6a00; }
  .lines .watchhead { color: #9a6a00; font-weight: bold; border-top: 1px solid var(--line); margin-top: 4px; }
  .gr { font-size: 11px; color: var(--win); font-weight: bold; margin-left: 4px; white-space: nowrap; }
  .star { border: none; background: none; font-size: 18px; line-height: 1; padding: 0 4px; color: #bbb; cursor: pointer; vertical-align: middle; }
  .star.on { color: #e0a800; }
  .watchrow { padding: 4px 0; border-bottom: 1px dotted #eee; font-size: 13px; }
  .watchrow .note { display: block; font-size: 12px; color: var(--sub); }
  .chooser { border: 2px solid #e0a800; }
  .chooser button { margin: 3px 4px 3px 0; padding: 6px 10px; border: 1px solid var(--line); background: #fff; border-radius: 6px; font-size: 14px; }
  svg.chart { width: 100%; height: auto; display: block; margin-top: 4px; }
  .legend { font-size: 11px; color: var(--sub); }
  .legend i { display: inline-block; width: 10px; height: 3px; margin: 0 3px 2px 6px; vertical-align: middle; }
  .btns { display: flex; gap: 8px; margin: 10px 0; }
  .btn { flex: 1; padding: 14px 8px; font-size: 16px; border: none; border-radius: 8px; background: var(--accent); color: #fff; font-weight: bold; }
  .btn.sub { background: #fff; color: var(--accent); border: 1px solid var(--accent); }
  .btn.danger { background: #fff; color: var(--lose); border: 1px solid var(--lose); }
  .btn:disabled { opacity: .4; }
  .player { border-top: 1px solid var(--line); padding: 8px 0; }
  .player:first-child { border-top: none; }
  .pname { font-weight: bold; }
  .tag { display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 8px; margin-left: 4px; vertical-align: middle; border: 1px solid var(--line); color: var(--sub); }
  .tag.P { border-color: #c77; color: #a33; }
  .tag.C { border-color: #7a7; color: #363; }
  .tag.IF { border-color: #79c; color: #357; }
  .tag.OF { border-color: #c9a040; color: #8a6400; }
  .tag.twoway { border-color: #d4006a; color: #d4006a; }
  .tag.helper { background: #fde; }
  .tag.conv { border-style: dashed; }
  .tag.genius { border-color: var(--gold); color: var(--gold); }
  .tag.reinc { border-color: var(--special); color: var(--special); }
  .tag.ret { background: #eee; }
  .abil { display: grid; grid-template-columns: repeat(var(--cols, 4), 1fr); gap: 4px; margin-top: 4px; }
  .abil div { background: #f6f2e9; border-radius: 4px; padding: 2px 4px; text-align: center; font-size: 12px; color: var(--sub); }
  .abil b { display: block; font-size: 16px; color: var(--ink); }
  .v80 b { color: #c0392b; } .v60 b { color: #d35400; } .v40 b { color: #222; } .v0 b { color: #999; }
  .small { font-size: 12px; color: var(--sub); }
  select { width: 100%; padding: 8px; font-size: 15px; margin-top: 6px; border-radius: 6px; border: 1px solid var(--line); background: #fff; }
  details summary { cursor: pointer; padding: 6px 0; }
  .hist { font-size: 12px; color: #444; margin: 4px 0 0 0; padding-left: 16px; }
  .hist li { margin: 1px 0; }
  table.snap { border-collapse: collapse; font-size: 12px; margin-top: 4px; width: 100%; }
  table.snap th, table.snap td { border: 1px solid var(--line); padding: 2px 4px; text-align: center; }
  .reveal { margin-top: 6px; padding: 6px; border: 1px dashed var(--special); color: var(--special); font-weight: bold; border-radius: 6px; font-size: 14px; }
  .impress { font-size: 13px; color: #555; margin-top: 2px; }
  input[type=text] { padding: 8px; font-size: 15px; width: 100%; border: 1px solid var(--line); border-radius: 6px; }
  .filters { display: flex; gap: 6px; flex-wrap: wrap; }
  .filters button { padding: 4px 10px; border: 1px solid var(--line); background: #fff; border-radius: 14px; font-size: 13px; }
  .filters button.on { background: var(--ink); color: #fff; }
  .sublabel { font-size: 11px; color: var(--sub); margin-top: 6px; }
  .scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  table.lu { border-collapse: collapse; width: 100%; font-size: 13px; white-space: nowrap; }
  table.lu th { font-size: 11px; color: var(--sub); font-weight: normal; text-align: left; padding: 2px 4px; border-bottom: 1px solid var(--line); }
  table.lu td { border-bottom: 1px dotted #eee; padding: 3px 4px; }
  table.lu td.num { text-align: right; }
  table.lu td.ord { width: 2.4em; font-weight: bold; text-align: center; }
  table.lu td.pos { width: 1.6em; font-weight: bold; }
  table.lu td.nm { white-space: normal; min-width: 7em; }
  table.lu tr.oop td { color: var(--lose); }
  table.lu .ord small { display: block; font-size: 10px; font-weight: normal; color: var(--sub); }
  table.st { border-collapse: collapse; font-size: 12px; margin-top: 4px; white-space: nowrap; }
  table.st th, table.st td { border: 1px solid var(--line); padding: 2px 5px; text-align: right; }
  table.st th { text-align: center; }
  .nc { font-size: 13px; margin: 4px 0; }
  .months { display: grid; grid-template-columns: repeat(12, 1fr); gap: 2px; margin: 10px 0 4px; }
  .months span { font-size: 10px; text-align: center; padding: 3px 0; border-radius: 4px; background: #e8e2d5; color: var(--sub); }
  .months span.done { color: #bbb; }
  .months span.now { background: var(--accent); color: #fff; font-weight: bold; }
  .months span.ev { box-shadow: inset 0 -2px 0 #c9a040; }
  .monthnote { font-size: 12px; color: var(--sub); margin-bottom: 6px; }
  .lead { font-size: 12px; color: var(--sub); }
  .lead b { color: var(--ink); }
  .v100 b { color: #b8860b; text-shadow: 0 0 1px #f5d76e; }
  .rt { font-weight: bold; }
  .rlabel { font-size: 11px; margin-left: 3px; padding: 0 5px; border-radius: 8px; background: #fff4d6; color: #8a6400; border: 1px solid #e6c56a; white-space: nowrap; }
  .rlabel.r200 { background: #fde8e8; color: #b03a2e; border-color: #e6a39b; }
  .rlabel.r400 { background: #2b2b2b; color: #ffd84d; border-color: #2b2b2b; }
  .mline { font-size: 13px; padding: 3px 0; border-bottom: 1px dotted #eee; }
  .mline .ml { display: inline-block; min-width: 3.2em; font-weight: bold; }
  .mline .nt { display: block; font-size: 12px; color: var(--special); padding-left: 3.2em; }
  .mline .wt { display: block; font-size: 12px; color: #9a6a00; padding-left: 3.2em; }
  .changed { background: #fff6dc; border-radius: 6px; }
  .needpol { color: var(--lose); font-size: 12px; font-weight: bold; }
  .capped { font-size: 11px; color: #fff; background: #888; border-radius: 8px; padding: 0 6px; margin-left: 4px; }
  .autosel { display: flex; gap: 6px; align-items: center; font-size: 13px; }
  .autosel select { width: auto; margin: 0; padding: 6px; }
  .btn.small { padding: 10px 6px; font-size: 14px; }
  nav button { font-size: 13px; }
  .gen { font-size: 10px; color: var(--sub); margin-left: 3px; white-space: nowrap; }
  .warnbox { background: #fff3cd; border: 1px solid #e6c56a; color: #7a5a00; border-radius: 8px; padding: 8px 10px; font-size: 13px; margin: 8px 0; }
  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 50; display: flex; align-items: center; justify-content: center; padding: 16px; }
  .modal { background: #fff; border-radius: 10px; padding: 16px; max-width: 420px; width: 100%; }
  .modal p { margin: 0 0 12px; font-size: 15px; }
  table.tune { border-collapse: collapse; width: 100%; font-size: 12px; }
  table.tune th, table.tune td { border-bottom: 1px dotted #ddd; padding: 3px 4px; text-align: left; vertical-align: top; }
  table.tune td.num, table.tune th.num { text-align: right; white-space: nowrap; }
  table.tune input { width: 5.5em; padding: 3px; font-size: 13px; border: 1px solid var(--line); border-radius: 4px; text-align: right; }
  table.tune tr.mod td { background: #fff6dc; }
  table.tune .desc { color: var(--sub); font-size: 11px; display: block; }
  table.tune .path { font-family: ui-monospace, monospace; font-size: 10px; color: #999; display: block; word-break: break-all; }
  .vd { font-weight: bold; } .vd.ok { color: var(--win); } .vd.mid { color: #b07d00; } .vd.ng { color: var(--lose); }
  .minibtn { padding: 3px 8px; font-size: 12px; border: 1px solid var(--line); background: #fff; border-radius: 6px; }
  .progress { height: 8px; background: #eee; border-radius: 4px; overflow: hidden; margin: 6px 0; }
  .progress i { display: block; height: 100%; background: var(--accent); }
  textarea.copy { width: 100%; height: 6em; font-size: 12px; font-family: ui-monospace, monospace; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; margin: 6px 0; }
  .row select { width: auto; margin: 0; padding: 6px; }
  .pw { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .pw .big { font-size: 28px; font-weight: bold; }
  .pw .dlt { font-size: 13px; }
  .up { color: var(--win); } .down { color: var(--lose); }
  table.posp { border-collapse: collapse; width: 100%; font-size: 12px; margin-top: 4px; }
  table.posp td, table.posp th { border-bottom: 1px dotted #eee; padding: 2px 4px; text-align: right; }
  table.posp td:first-child, table.posp th:first-child { text-align: left; }
  .game { border-top: 1px dotted var(--line); padding: 4px 0; font-size: 13px; }
  .game .hl { font-size: 12px; color: #444; padding-left: 8px; }
  .game .hl b { color: var(--win); font-weight: normal; font-size: 11px; margin-left: 4px; }
  .pred { font-size: 11px; color: var(--sub); }
  table.ls { border-collapse: collapse; font-size: 11px; margin: 4px 0; }
  table.ls td, table.ls th { border: 1px solid var(--line); padding: 1px 4px; text-align: center; min-width: 1.4em; }
  table.ls td.t { font-weight: bold; }
  .grow-row { font-size: 13px; padding: 3px 0; border-bottom: 1px dotted #eee; }
  .grow-row .d { font-size: 12px; color: var(--win); }
  .grow-row .dn { font-size: 12px; color: var(--lose); }
  .chip { padding: 4px 10px; border: 1px solid var(--line); background: #fff; border-radius: 14px; font-size: 12px; }
  .chip.on { background: var(--ink); color: #fff; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="title">野球ガチャ育成</h1>
    <div class="meta" id="meta"></div>
    <nav>
      <button data-tab="home" class="on">ホーム</button>
      <button data-tab="roster">選手一覧</button>
      <button data-tab="growth">成長</button>
      <button data-tab="alumni">名鑑</button>
      <button data-tab="settings">設定</button>
      <button data-tab="tune">調整</button>
    </nav>
  </header>
  <main id="main"></main>
</div>

<script src="config.js"></script>
<script src="benchmark.js"></script>
<script src="logic.js"></script>
<script>
(function () {
  'use strict';
  if (!window.Logic) {
    // config.js / logic.js を読み込めなかった(プレビューなどで単体表示された)場合
    document.getElementById('main').innerHTML = '<div class="card"><h2>読み込みエラー</h2>'
      + '<div class="small">config.js と logic.js を読み込めませんでした。index.html と同じフォルダに置いて開くか、'
      + '単一ファイル版の play.html を開いてください。</div></div>';
    return;
  }
  const { CONFIG, Core, HighSchool, Generation, Tuning, Persist, Sim } = window.Logic;
  let state = null;
  let tab = 'home';
  let alumniFilter = 'all';
  let autoTarget = 'new';        // おまかせの対象:'new'(新入生のみ) / 'all'(全員)
  let pendingWatchId = null;     // 上限を超えて注目しようとした選手
  const openDetails = new Set(); // 開いている詳細(描き直しても開いたままにする)
  const draftPolicies = {};      // 方針の選択画面で選択中の方針

  // ---------- セーブ / ロード ----------
  // localStorage が使えない環境(一部のプレビュー)では、メモリ上の保存で代用する
  const storage = (function () {
    try {
      const t = '__bbgacha_test__';
      window.localStorage.setItem(t, '1');
      window.localStorage.removeItem(t);
      return window.localStorage;
    } catch (e) {
      const m = new Map();
      return {
        getItem: (k) => (m.has(k) ? m.get(k) : null), setItem: (k, v) => m.set(k, String(v)), removeItem: (k) => m.delete(k),
        key: (i) => Array.from(m.keys())[i] || null, get length() { return m.size; }, memory: true,
      };
    }
  })();
  let modal = null;              // 確認のダイアログ { text, action }
  const growthView = { serial: null, filter: 'all', changedOnly: false, decimal: false };  // 成長タブ
  let storageWarn = false;       // 保存容量の警告
  let trial = { running: false, progress: 0, result: null, label: '' };   // 試し計算
  let benchJob = { running: false, progress: 0 };                          // 世代の基準の再計算
  let copyText = null;
  let pending = Persist.loadOverrides(storage);                            // 調整画面の上書き設定(次のゲームから)
  function save() {
    Persist.saveGame(storage, state);
    const V = CONFIG.visual;
    if (Persist.usage(storage) > V.storageQuotaChars * V.storageWarnRatio) {
      storageWarn = true;
      if (HighSchool.compressAlumniLogs(state, 0)) Persist.saveGame(storage, state);
    }
  }
  function clearDraft() { for (const k of Object.keys(draftPolicies)) delete draftPolicies[k]; }
  // 画面のメモリ上の状態をすべて初期化する(リセットの後)
  function resetUiState() {
    tab = 'home';
    alumniFilter = 'all';
    autoTarget = 'new';
    pendingWatchId = null;
    openDetails.clear();
    clearDraft();
    modal = null;
    copyText = null;
    growthView.serial = null;
    growthView.filter = 'all';
    growthView.changedOnly = false;
    growthView.decimal = false;
    storageWarn = false;
  }
  // 進行中のゲームに使う設定(作ったときの上書き + 表示だけに使う値は今の上書き)
  function applyGameConfig() { Tuning.applyOverrides(Tuning.effectiveOverrides(state.overrides, pending)); }

  // ---------- 表示ヘルパー ----------
  function esc(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  const int = (v) => Math.round(v);
  function vClass(v) { return v > 100 ? 'v100' : v >= 80 ? 'v80' : v >= 60 ? 'v60' : v >= 40 ? 'v40' : 'v0'; }
  // 能力のマス目。keys の順に並べる。base を渡すと増分も表示。100を超えた項目は金色
  function abilGrid(keys, abilities, base) {
    return '<div class="abil" style="--cols:' + keys.length + '">' + keys.map((k) => {
      const v = abilities[k];
      const diff = base ? int(v) - int(base[k]) : 0;
      return '<div class="' + vClass(v) + '">' + Core.ABILITY_LABEL[k] + '<b>' + int(v) + '</b>'
        + (base ? '<span class="small">' + (diff > 0 ? '+' + diff : '±0') + '</span>' : '') + '</div>';
    }).join('') + '</div>';
  }
  function mainGrids(p, abilities, base) {
    if (Core.isTwoWayKnown(p) || (p.finalAbilities && p.twoWay)) {
      return '<div class="sublabel">投手系</div>' + abilGrid(Core.PITCH_KEYS, abilities, base)
        + '<div class="sublabel">野手系</div>' + abilGrid(Core.BAT_KEYS, abilities, base);
    }
    return abilGrid(Core.sideKeys(Core.sideOf(p.position)), abilities, base);
  }
  // 同世代の上位○%(世代の基準と比べる)。卒業生・引退後の3年生は3年3月、入学前は1年4月の基準
  function genRank(p) {
    const isAlumni = !!p.finalAbilities;
    const pendingNew = state.pendingRecruits.indexOf(p) >= 0;
    const grade = isAlumni || p.retired ? 3 : pendingNew ? 1 : p.grade;
    const month = isAlumni || p.retired ? 3 : pendingNew ? 4 : HighSchool.CALENDAR[state.month].month;
    return Generation.getGenerationRank(p, grade, month);
  }
  // ラベルと「同世代 上位○%」(p50 より下は何も出さない)
  function ratingBadge(p) {
    const r = genRank(p);
    if (!r) return '';
    const cls = r.label === '規格外' ? ' r400' : r.label === '怪物級' ? ' r200' : '';
    return (r.label ? '<span class="rlabel' + cls + '">' + r.label + '</span>' : '')
      + '<span class="gen">同世代 上位' + Generation.formatTop(r.top) + '</span>';
  }
  function ratingHtml(p) {
    if (Core.isTwoWayKnown(p) || (p.finalAbilities && p.twoWay)) {
      const s = Core.ratingSides(p);
      return '総合値 投<span class="rt">' + s.pitch + '</span>/打<span class="rt">' + s.bat + '</span>' + ratingBadge(p);
    }
    const r = p.finalAbilities ? p.rating : Core.rating(p);
    return '総合値 <span class="rt">' + r + '</span>' + ratingBadge(p);
  }
  function staleWarning() {
    if (!Generation.getBenchmark()) return '<div class="warnbox">世代の基準(benchmark.js)がありません。ラベルは表示されません。</div>';
    return Generation.isStale() ? '<div class="warnbox">⚠ 世代の基準が古い可能性があります(再計算してください。調整タブ)</div>' : '';
  }
  function posTag(pos) { return '<span class="tag ' + pos + '">' + Core.POSITION_LABEL[pos] + '</span>'; }
  function extraTags(p, isAlumni) {
    let t = '';
    if (p.twoWay && (p.twoWayRevealed || isAlumni)) t += '<span class="tag twoway">二刀流</span>';
    if (p.reincarnation && (p.reincarnationRevealed || isAlumni)) {
      t += '<span class="tag reinc">転生:' + esc(Core.reincarnationName(p.reincarnation)) + '</span>';
    }
    if (p.helper) t += '<span class="tag helper">助っ人</span>';
    if (p.convert) t += '<span class="tag conv">転向中</span>';
    if (p.retired) t += '<span class="tag ret">引退</span>';
    return t;
  }
  function histList(history) {
    return '<ul class="hist">' + history.map((h) =>
      '<li>' + HighSchool.formatYear(h.y) + '(' + h.g + '年) ' + esc(h.ev) + (h.res ? ':' + esc(h.res) : '')
      + (h.d && Object.keys(h.d).length ? ' <span class="small">' + esc(Core.formatDelta(h.d)) + '</span>' : '') + '</li>'
    ).join('') + '</ul>';
  }
  function snapTable(keys, snaps, current) {
    if (!snaps || !snaps.length) return '';
    let html = '<div class="scroll"><table class="snap"><tr><th>年</th>' + keys.map((k) => '<th>' + Core.ABILITY_LABEL[k] + '</th>').join('') + '<th>総合値</th></tr>';
    const row = (label, a) => '<tr><td>' + label + '</td>' + keys.map((k) => '<td>' + int(a[k]) + '</td>').join('')
      + '<td>' + Core.ratingOfKeys(a, keys) + '</td></tr>';
    snaps.forEach((s, i) => { html += row(i === 0 ? '入学時' : HighSchool.formatYear(s.y) + '末', s.a); });
    if (current) html += row('現在', current);
    return html + '</table></div>';
  }
  function aptLine(p) {
    const known = Core.isSubKnown(p);
    const side = Core.mainSide(p);
    const parts = Core.POSITIONS.filter((pos) => known || Core.sideOf(pos) === side)
      .map((pos) => Core.POSITION_SHORT[pos] + ' ' + int(Core.aptitude(p, pos)));
    let s = '適性:' + parts.join(' / ');
    if (p.convert) s += '(' + Core.POSITION_LABEL[p.convert.pos] + 'は転向直後のため -' + p.convert.penalty + ')';
    return '<div class="small">' + s + '</div>';
  }
  function growthLabel(p) {
    const t = Core.formatBestGrowth(Core.growthSinceEntry(p));
    return t ? '<span class="gr">' + esc(t) + '</span>' : '';
  }
  function starBtn(p) {
    return '<button class="star' + (p.watched ? ' on' : '') + '" data-watch="' + p.id + '" title="注目">' + (p.watched ? '★' : '☆') + '</button>';
  }
  // 能力の推移のグラフ(インラインSVG)。横軸は学期、縦軸は能力値、能力ごとに線を分ける
  const LINE_COLORS = ['#c0392b', '#2471a3', '#1e8449', '#b9770e', '#7d3c98', '#117a65', '#a04000', '#5d6d7e', '#cb4335'];
  // 学期の名前(入学・1年夏・1年冬…卒業)から、月の番号を求める
  function termSerial(p, label) {
    const base = HighSchool.monthSerial(p.enrolledYear, 0);
    if (label === '入学' || label === '加入') return base - 0.5;
    if (label === '卒業') return base + 35;
    const m = /^(\d)年(夏|冬)$/.exec(label);
    if (!m) return null;
    return base + (Number(m[1]) - 1) * 12 + (m[2] === '夏' ? 2 : 8);
  }
  // 能力の推移のグラフ(インラインSVG)。月ごとの点で描き、学期(入学・合宿・卒業)に印を付ける
  function growthChart(p, keys) {
    const pts = [];
    const marks = [];
    for (const t of (p.timeline || [])) {
      const sx = termSerial(p, t.label);
      if (sx == null) continue;
      marks.push({ s: sx, label: t.label.replace('年', '').replace('入学', '入').replace('卒業', '卒') });
      if (!p.mlog || sx < p.mlog.s) pts.push({ s: sx, a: t.a });
    }
    if (p.mlog) p.mlog.a.forEach((arr, i) => pts.push({ s: p.mlog.s + i, a: HighSchool.unpackAbilities(arr) }));
    if (!p.finalAbilities && !p.mlog) pts.push({ s: HighSchool.monthSerial(state.year, state.month), a: p.abilities });
    pts.sort((a, b) => a.s - b.s);
    if (pts.length < 2) return '';
    let top = 100;
    for (const pt of pts) for (const k of keys) top = Math.max(top, pt.a[k]);
    top = top > 100 ? 150 : 100;
    const s0 = pts[0].s;
    const s1 = Math.max(pts[pts.length - 1].s, s0 + 1);
    const W = 320, H = 150, L = 24, R = 10, T = 6, B = 24;
    const x = (sv) => L + (W - L - R) * (sv - s0) / (s1 - s0);
    const y = (v) => T + (H - T - B) * (1 - v / top);
    let svg = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="能力の推移">';
    for (let v = 0; v <= top; v += top > 100 ? 25 : 20) {
      svg += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(v) + '" y2="' + y(v) + '" stroke="' + (v === 100 && top > 100 ? '#e0b84d' : '#e5ddd0') + '" stroke-width="1"/>'
        + '<text x="' + (L - 3) + '" y="' + (y(v) + 3) + '" font-size="8" text-anchor="end" fill="#999">' + v + '</text>';
    }
    for (const m of marks) {
      if (m.s < s0 || m.s > s1) continue;
      svg += '<line x1="' + x(m.s).toFixed(1) + '" x2="' + x(m.s).toFixed(1) + '" y1="' + T + '" y2="' + (H - B) + '" stroke="#d8cfbf" stroke-dasharray="2,2"/>'
        + '<text x="' + x(m.s).toFixed(1) + '" y="' + (H - B + 10) + '" font-size="7.5" text-anchor="middle" fill="#888">' + esc(m.label) + '</text>';
    }
    keys.forEach((k, ki) => {
      const c = LINE_COLORS[ki % LINE_COLORS.length];
      svg += '<polyline points="' + pts.map((pt) => x(pt.s).toFixed(1) + ',' + y(pt.a[k]).toFixed(1)).join(' ') + '" fill="none" stroke="' + c + '" stroke-width="1.4"/>';
      for (const m of marks) {
        const pt = pts.find((q) => Math.abs(q.s - m.s) < 0.6);
        if (pt) svg += '<circle cx="' + x(pt.s).toFixed(1) + '" cy="' + y(pt.a[k]).toFixed(1) + '" r="1.8" fill="' + c + '"/>';
      }
    });
    svg += '</svg>';
    const legend = '<div class="legend">' + keys.map((k, ki) => '<i style="background:' + LINE_COLORS[ki % LINE_COLORS.length] + '"></i>'
      + Core.ABILITY_LABEL[k]).join('') + '</div>';
    return '<div class="sublabel">能力の推移(月ごと。点は学期:入・夏・冬・卒)</div>' + svg + legend;
  }
  function detailsOpen(key) { return openDetails.has(key) ? ' open' : ''; }
  function renderWatchChooser() {
    if (pendingWatchId == null) return '';
    const cur = HighSchool.watchedPlayers(state);
    const target = state.players.concat(state.pendingRecruits).find((p) => p.id === pendingWatchId);
    if (!target) return '';
    return '<div class="card chooser"><h2>★ 注目選手は' + CONFIG.watch.max + '人までです</h2>'
      + '<div class="small">' + esc(target.name) + 'を注目にするため、外す選手を選んでください。</div>'
      + cur.map((p) => '<button data-swapwatch="' + p.id + '">★ ' + esc(p.name) + '(' + p.grade + '年・' + Core.POSITION_SHORT[p.position] + ')を外す</button>').join('')
      + '<div><button data-swapwatch="cancel">やめる</button></div></div>';
  }
  function whenText(n) { return HighSchool.formatYear(n.y) + (n.m ? ' ' + n.m + '月' : ''); }
  function renderWatchCard() {
    const list = HighSchool.watchedPlayers(state);
    if (!list.length) return '';
    return '<div class="card"><h2>★ 注目選手(' + list.length + '/' + CONFIG.watch.max + ')</h2>' + list.map((p) =>
      '<div class="watchrow">' + starBtn(p) + '<b>' + esc(p.name) + '</b> '
      + '<span class="small">' + (state.pendingRecruits.indexOf(p) >= 0 ? '入学前' : p.grade + '年') + '・' + Core.POSITION_LABEL[p.position] + '</span> '
      + '<span class="small">' + ratingHtml(p) + '</span>'
      + growthLabel(p)
      + '<span class="note">' + (p.lastNotice ? whenText(p.lastNotice) + ':' + esc(p.lastNotice.t) : 'まだ通知はありません') + '</span></div>'
    ).join('') + '</div>';
  }

  function linesHtml(lines) {
    return '<div class="lines">' + lines.map((l) => {
      const o = typeof l === 'string' ? { text: l, cls: '' } : l;
      return '<div class="' + (o.cls || '') + '">' + esc(o.text) + '</div>';
    }).join('') + '</div>';
  }
  // ラインスコア・勝敗投手(試合の中身)
  function boxHtml(b) {
    if (!b) return '';
    const row = (name, inn, total) => '<tr><th>' + name + '</th>' + inn.map((v) => '<td>' + v + '</td>').join('') + '<td class="t">' + total + '</td></tr>';
    let html = '<div class="scroll"><table class="ls"><tr><th></th>' + [1, 2, 3, 4, 5, 6, 7, 8, 9].map((i) => '<th>' + i + '</th>').join('') + '<th>計</th></tr>'
      + row('自校', b.line.my, b.my) + row('相手', b.line.opp, b.opp) + '</table></div>';
    if (b.pitcher) html += '<div class="small">' + (b.win ? '勝利投手 ' : '敗戦投手 ') + esc(b.pitcher.name) + '(' + Math.floor(b.pitcher.outs / 3) + '回 ' + b.pitcher.runs + '失点)</div>';
    const hitters = b.batters.filter((x) => x.h || x.rbi).map((x) => esc(x.name) + ' ' + x.ab + '-' + x.h + (x.rbi ? ' ' + x.rbi + '打点' : '') + (x.hr ? ' ' + x.hr + '本' : ''));
    if (hitters.length) html += '<div class="small">打撃:' + hitters.join(' / ') + (b.unearned ? '(打点のつかない得点 ' + b.unearned + ')' : '') + '</div>';
    return html;
  }
  function highlightsHtml(hs) {
    return (hs || []).map((h) => '<div class="hl">☆ ' + esc(h.text) + (h.note ? '<b>' + esc(h.note) + '</b>' : '') + '</div>').join('');
  }
  // 1試合ぶん(勝率予想・結果・活躍選手・中身)
  function gameHtml(g, key) {
    const head = g.text ? esc(g.text)
      : esc(g.title) + ' <span class="pred">勝率予想 ' + Math.round(g.pred * 100) + '%</span> → ' + (g.box ? g.box.my + '対' + g.box.opp : '') + (g.win ? ' 勝利' : ' 敗戦') + (g.tag ? ' 【' + g.tag + '】' : '');
    return '<div class="game"><div class="' + (g.tag ? 'special' : g.win ? 'win' : 'lose') + '" style="color:' + (g.tag ? 'var(--special)' : g.win ? 'var(--win)' : 'var(--lose)') + '">' + head + '</div>'
      + highlightsHtml(g.highlights)
      + (g.box ? '<details data-open="' + key + '"' + detailsOpen(key) + '><summary class="small">試合の中身</summary>' + boxHtml(g.box) + '</details>' : '') + '</div>';
  }
  let cardSeq = 0;
  function eventCard(ev) {
    const id = 'c' + (cardSeq++);
    if (ev.yearSummary) return eventCard(ev.yearSummary) + eventCard(Object.assign({}, ev, { yearSummary: null }));
    let html = '<div class="card"><h2>' + esc(ev.title) + '</h2>' + linesHtml(ev.lines);
    if (ev.games) html += ev.games.map((g, i) => gameHtml(g, id + '-' + i)).join('');
    return html + (ev.lineup ? lineupTable(ev.lineup, 'この大会のスタメン') : '') + '</div>';
  }
  // 月のまとめの1行(練習の成長人数・練習試合など)
  function monthLine(m) {
    const parts = [];
    if (m.note) parts.push(m.note);
    parts.push('成長 ' + m.grown + '人');
    for (const s of m.summaries) parts.push(s);
    return parts.join(' / ');
  }
  // 「次のイベントまで」などで進んだ月の表示。途中の月は1行、最後の月はくわしく
  function renderMonths(list) {
    if (!list.length) return '';
    let html = '';
    const last = list[list.length - 1];
    const mid = list.slice(0, -1);
    if (mid.length) {
      html += '<div class="card"><h2>途中の月</h2>' + mid.map((m) =>
        '<div class="mline"><span class="ml">' + esc(m.label) + '</span>' + esc(monthLine(m))
        + (m.winDelta != null ? ' <span class="' + (m.winDelta >= 0 ? 'up' : 'down') + '">勝率予想 ' + (m.winDelta >= 0 ? '+' : '') + (m.winDelta * 100).toFixed(1) + '%</span>' : '')
        + m.watchLines.map((w) => '<span class="wt">' + esc(w) + '</span>').join('')
        + m.notices.map((n) => '<span class="nt">' + esc(n.text) + '</span>').join('')
        + (m.hidden ? '<span class="nt">ほか ' + m.hidden + '件</span>' : '') + '</div>').join('') + '</div>';
    }
    // 最後の月
    html += '<div class="card"><h2>' + esc(HighSchool.formatYear(last.year) + ' ' + last.label) + 'のまとめ</h2>';
    if (last.watchLines.length) {
      html += '<div class="sublabel">★ 注目選手の成長</div>' + linesHtml(last.watchLines.map((t) => ({ text: t, cls: 'watch' })));
    }
    html += '<div class="mline">' + esc(monthLine(last)) + '</div>';
    if (last.winDelta != null) {
      const d = last.winDelta * 100;
      html += '<div class="mline ' + (d >= 0 ? 'up' : 'down') + '">今月の成長で、対 他校平均の勝率予想 ' + (d >= 0 ? '+' : '') + d.toFixed(1) + '%</div>';
    }
    if (last.topGrowers && last.topGrowers.length) {
      html += '<div class="sublabel">今月よく伸びた選手</div><div class="lines">' + last.topGrowers.map((t, i) =>
        '<div class="small">' + (i + 1) + '位 ' + (t.watched ? '★' : '') + esc(t.name) + '(' + t.grade + '年)総合値 +' + Core.fmtNum(t.gain) + '</div>').join('') + '</div>';
    }
    if (last.serial != null) html += '<div class="row"><button class="minibtn" data-growth-serial="' + last.serial + '">全員の変化を見る</button></div>';
    if (last.practice && last.practice.length) {
      const key = 'pg-' + last.serial;
      html += '<details data-open="' + key + '"' + detailsOpen(key) + '><summary class="small">練習試合の詳細(' + last.practice.length + '試合)</summary>'
        + last.practice.map((g, i) => gameHtml(g, key + '-' + i)).join('') + '</details>';
    }
    if (last.notices.length) {
      html += '<div class="sublabel">通知</div>' + linesHtml(last.notices.map((n) => ({ text: n.text, cls: n.cls }))
        .concat(last.hidden ? [{ text: 'ほか ' + last.hidden + '件', cls: 'none' }] : []));
    }
    html += '</div>';
    for (const c of last.cards) html += eventCard(c);
    // 途中の月の結果(入学など)
    for (const m of mid) for (const c of m.cards) html += eventCard(c);
    return html;
  }

  // ---------- 成績の表示 ----------
  function careerOf(p) { return (p && p.stats && p.stats.career) || Core.emptyStatLine(); }
  function batText(l) { return Core.formatAverage(l) + ' ' + l.hr + '本 ' + l.rbi + '点'; }
  function pitchText(l) { return l.w + '勝' + l.l + '敗 防' + Core.formatEra(l); }
  function statBrief(p) {
    const l = careerOf(p);
    const parts = [];
    if (p.position === 'P' || l.pg > 0) parts.push('防' + Core.formatEra(l));
    if (p.position !== 'P' || Core.isTwoWayKnown(p) || p.twoWay && p.finalAbilities) parts.push('打率' + Core.formatAverage(l));
    return parts.join(' ');
  }
  function statTable(p) {
    const st = p.stats;
    if (!st || !st.career.g) return '<div class="sublabel">成績:まだ大会に出ていません</div>';
    const years = Object.keys(st.byYear).map(Number).sort((a, b) => a - b);
    const rows = years.map((y) => [HighSchool.formatYear(y), st.byYear[y]]).concat([['通算', st.career]]);
    let html = '';
    if (st.career.pa > 0) {
      html += '<div class="sublabel">打撃成績</div><div class="scroll"><table class="st"><tr><th>年度</th><th>試合</th><th>打席</th><th>打数</th>'
        + '<th>安打</th><th>本塁打</th><th>打点</th><th>三振</th><th>打率</th></tr>'
        + rows.filter((r) => r[1].pa > 0).map((r) => '<tr><td>' + r[0] + '</td><td>' + r[1].g + '</td><td>' + r[1].pa + '</td><td>' + r[1].ab
          + '</td><td>' + r[1].h + '</td><td>' + r[1].hr + '</td><td>' + r[1].rbi + '</td><td>' + r[1].k
          + '</td><td>' + Core.formatAverage(r[1]) + '</td></tr>').join('') + '</table></div>';
    }
    if (st.career.pg > 0) {
      html += '<div class="sublabel">投手成績</div><div class="scroll"><table class="st"><tr><th>年度</th><th>登板</th><th>勝</th><th>敗</th>'
        + '<th>投球回</th><th>自責点</th><th>防御率</th></tr>'
        + rows.filter((r) => r[1].pg > 0).map((r) => '<tr><td>' + r[0] + '</td><td>' + r[1].pg + '</td><td>' + r[1].w + '</td><td>' + r[1].l
          + '</td><td>' + Math.floor(r[1].outs / 3) + (r[1].outs % 3 ? ' ' + (r[1].outs % 3) + '/3' : '') + '</td><td>' + r[1].er
          + '</td><td>' + Core.formatEra(r[1]) + '</td></tr>').join('') + '</table></div>';
    }
    return html;
  }
  function lineupTable(lu, title, withStats) {
    const byId = {};
    for (const p of state.players) byId[p.id] = p;
    const head = '<tr><th>打順</th><th>守</th><th>名前</th><th>学年</th>'
      + (withStats ? '<th>総合値</th><th>打率</th><th>本</th><th>点</th>' : '<th>適性</th>') + '</tr>';
    const rows = lu.map((s) => {
      const p = byId[s.id];
      const isP = s.pos === 'P';
      const ord = isP ? '先発' + (s.order ? '<small>' + s.order + '番</small>' : '') : (s.order || '-');
      let name = esc(s.name) + (withStats && p ? growthLabel(p) : '') + (s.twoWay ? ' <span class="tag twoway">二刀流</span>' : '') + (s.helper ? ' <span class="tag helper">助っ人</span>' : '')
        + (s.outOfPosition && s.primary ? ' <span class="small">(本職:' + Core.POSITION_LABEL[s.primary] + ')</span>' : '');
      let cols;
      if (!withStats) {
        cols = '<td class="num small">' + (s.apt == null ? '-' : int(s.apt)) + '</td>';
      } else {
        const l = careerOf(p);
        const r = p ? Core.rating(p) : null;
        const rCol = '<td class="num">' + (r == null ? '-' : r + (p ? ratingBadge(p) : '')) + '</td>';
        if (isP) {
          if (s.twoWay) name += '<div class="small">' + batText(l) + '</div>';
          cols = rCol + '<td class="num" colspan="3">' + pitchText(l) + '</td>';
        } else {
          cols = rCol + '<td class="num">' + Core.formatAverage(l) + '</td><td class="num">' + l.hr + '</td><td class="num">' + l.rbi + '</td>';
        }
      }
      const grade = s.helper ? '助' : (s.grade ? s.grade + '年' : '-');
      return '<tr class="' + (s.outOfPosition ? 'oop' : '') + '"><td class="ord">' + ord + '</td><td class="pos">' + Core.POSITION_SHORT[s.pos]
        + '</td><td class="nm">' + name + '</td><td>' + grade + '</td>' + cols + '</tr>';
    }).join('');
    const table = '<div class="scroll"><table class="lu">' + head + rows + '</table></div>'
      + (withStats ? '<div class="small">成績は通算(大会のみ)。赤字は本職外の起用。</div>' : '');
    if (!title) return table;
    return '<details><summary class="small">' + esc(title) + '</summary>' + table + '</details>';
  }
  // 入学時の第一印象(固定の文章リストから選ぶ)
  function impression(p) {
    const r = Core.rating(p);
    const pool = r >= 200 ? ['……空気が変わった。', '入部初日から格の違いを見せつけた。', 'どこでこんな選手が埋もれていたのか。']
      : r >= 150 ? ['即戦力の予感がする。', 'いきなり上級生に混ざっても見劣りしない。', '今年の目玉かもしれない。']
      : r >= 115 ? ['光るものを持っている。', '尖った長所がある。', '何か一芸がありそうだ。']
      : r >= 95 ? ['素直そうな新入生だ。', 'まだ線が細いが伸びしろはある。', '平凡だが真面目に練習しそう。']
      : ['正直、まだまだこれから。', '体力づくりから始めよう。', '入部動機は「なんとなく」らしい。'];
    return pool[p.id % pool.length];
  }

  // ---------- 画面 ----------
  function renderHeader() {
    document.getElementById('title').textContent = CONFIG.schoolName + ' 野球部';
    const mem = HighSchool.members(state).filter((p) => !p.retired).length;
    document.getElementById('meta').innerHTML = '<b>' + HighSchool.formatYear(state.year) + ' ' + esc(HighSchool.monthLabel(state.month)) + '</b>'
      + ' ・ チームの強さ <b>' + HighSchool.teamStrength(state) + '</b> ・ 部員 ' + mem + '人';

  // 12か月の帯(現在の月を強調。イベントのある月に下線)
  function renderMonthBand() {
    const cal = HighSchool.CALENDAR;
    const band = '<div class="months">' + cal.map((c, i) => {
      const hasEv = c.events.some((e) => CONFIG.eventTypes[e] && CONFIG.stopKinds.indexOf(CONFIG.eventTypes[e].kind) >= 0);

  // 方針の選択画面(4月:新入生と在校生 / 12月:在校生の見直し)
  function policySelect(p) {
    const set = Core.POLICIES[Core.policySetOf(p)];
    const cur = draftPolicies[p.id] != null ? draftPolicies[p.id] : p.policy;
    return '<select data-pid="' + p.id + '">' + set.map((pol) =>
      '<option value="' + pol.key + '"' + (cur === pol.key ? ' selected' : '') + '>' + pol.label + '</option>'
    ).join('') + '</select>';
  }
  function recruitCard(p) {
    let html = '<div class="player">' + starBtn(p) + '<span class="pname">' + esc(p.name) + '</span>' + posTag(p.position) + extraTags(p)
      + ' <span class="small">' + ratingHtml(p) + '</span>'
      + '<div class="impress">' + esc(impression(p)) + '</div>'
      + mainGrids(p, p.abilities);
    if (p.reincarnation && p.reincarnationRevealed) {
      html += '<div class="reveal">……!? この新入生、ただ者ではない。<br>【' + esc(Core.reincarnationName(p.reincarnation)) + '】の転生者だ!</div>';
    }
    if (p.twoWay && p.twoWayRevealed) {
      html += '<div class="reveal">投げても打っても本職級……! <br>【二刀流】の素質を持っている!</div>';
    }
    return html + policySelect(p) + '</div>';
  }
  function reviewRow(p) {
    const changed = draftPolicies[p.id] != null && draftPolicies[p.id] !== p.policy;
    return '<div class="player' + (changed ? ' changed' : '') + '"><span class="pname">' + esc(p.name) + '</span>'

  // チーム戦力(総合値スケール)。現在値・前年同月比・1年目4月比・守備区分別・他校との比較・推移グラフ
  function signed(v) { return (v >= 0 ? '+' : '') + v; }
  function dltSpan(v) { return v == null ? '' : '<span class="dlt ' + (v >= 0 ? 'up' : 'down') + '">' + signed(v) + '</span>'; }
  function renderPowerCard() {
    const PL = state.powerLog;
    const ref = Core.opponentRef();
    const live = Core.getTeamPower(state.players);
    const cur = PL.length ? PL[PL.length - 1] : null;
    const ago = cur ? PL.find((e) => e.s === cur.s - 12) : null;
    const first = PL.length ? PL[0] : null;
    const p = live.power;
    let html = '<div class="card"><h2>チーム戦力</h2><div class="pw"><span class="big">' + p + '</span>'
      + (ago ? '<span class="dlt">前年同月比 ' + dltSpan(cur.p - ago.p) + '</span>' : '')
      + (first && cur && cur.s !== first.s ? '<span class="dlt">1年目4月比 ' + dltSpan(cur.p - first.p) + '</span>' : '') + '</div>';
    html += '<div class="small">他校平均より ' + dltSpan(p - ref.avgPower) + '、他校上位より ' + dltSpan(p - ref.topPower)
      + '(他校平均 ' + ref.avgPower + ' / 他校上位 ' + ref.topPower + ')</div>'
      + '<div class="small">勝率予想:対 他校平均 <b>' + Math.round(Core.winProbability(live.strength, ref.avg) * 100) + '%</b> / 対 他校上位 <b>'
      + Math.round(Core.winProbability(live.strength, ref.top) * 100) + '%</b></div>';
    html += '<table class="posp"><tr><th>守備区分</th><th>現在</th><th>前年同月比</th></tr>' + ['P', 'C', 'IF', 'OF'].map((k) =>
      '<tr><td>' + Core.POSITION_LABEL[k] + '</td><td>' + live.byPos[k] + '</td><td>' + (ago ? dltSpan(live.byPos[k] - ago.pos[k]) : '-') + '</td></tr>').join('') + '</table>';
    html += powerGraph(PL);
    return html + '<div class="small">チーム戦力 = スタメンから計算するチームの強さを、総合値と同じ尺度にしたもの。毎月末に記録します。</div></div>';
  }
  // 月ごとのチーム戦力の折れ線(他校平均・他校上位の線と、年の区切り)
  function powerGraph(PL) {
    if (PL.length < 2) return '';
    const list = PL.slice(-60); // 直近5年
    let lo = Infinity, hi = -Infinity;
    for (const e of list) { lo = Math.min(lo, e.p, e.oa); hi = Math.max(hi, e.p, e.ot); }
    lo = Math.floor((lo - 10) / 20) * 20;
    hi = Math.ceil((hi + 10) / 20) * 20;
    const W = 320, H = 140, L = 28, R = 8, T = 6, B = 16;
    const s0 = list[0].s, s1 = Math.max(list[list.length - 1].s, s0 + 1);
    const x = (sv) => L + (W - L - R) * (sv - s0) / (s1 - s0);
    const y = (v) => T + (H - T - B) * (1 - (v - lo) / (hi - lo));
    let svg = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="チーム戦力の推移">';
    for (let v = lo; v <= hi; v += 20) {
      svg += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(v) + '" y2="' + y(v) + '" stroke="#eee8dc"/>'
        + '<text x="' + (L - 3) + '" y="' + (y(v) + 3) + '" font-size="8" text-anchor="end" fill="#999">' + v + '</text>';
    }
    for (const e of list) {
      if (e.m === 4) {
        svg += '<line x1="' + x(e.s) + '" x2="' + x(e.s) + '" y1="' + T + '" y2="' + (H - B) + '" stroke="#c9bfae" stroke-dasharray="3,2"/>'
          + '<text x="' + (x(e.s) + 2) + '" y="' + (H - 4) + '" font-size="8" fill="#888">' + e.y + '年目</text>';
      }
    }
    const line = (key, color, dash) => '<polyline points="' + list.map((e) => x(e.s).toFixed(1) + ',' + y(e[key]).toFixed(1)).join(' ')
      + '" fill="none" stroke="' + color + '" stroke-width="' + (dash ? 1.2 : 2) + '"' + (dash ? ' stroke-dasharray="4,3"' : '') + '/>';
    svg += line('ot', '#b03a2e', true) + line('oa', '#888', true) + line('p', '#1f5f8b', false) + '</svg>';
    return svg + '<div class="legend"><i style="background:#1f5f8b"></i>自校<i style="background:#888"></i>他校平均<i style="background:#b03a2e"></i>他校上位</div>';
  }

  // ---------- 成長タブ(月ごとの、全在校生の能力の変化) ----------
  function growthSerials() {
    return state.powerLog.map((e) => e.s);
  }
  function renderGrowth() {
    const serials = growthSerials();
    if (!serials.length) return '<div class="card"><h2>成長</h2><div class="small">まだ記録がありません。1か月進めると、毎月末の能力の変化がここに出ます。</div></div>';
    let sv = growthView.serial;
    if (sv == null || serials.indexOf(sv) < 0) sv = serials[serials.length - 1];
    const idx = serials.indexOf(sv);
    const y = Math.floor(sv / 12) + 1;
    // その月に在籍していた選手(在校生と、月ごとの記録が残っている卒業生)
    const people = state.players.filter((p) => !p.helper).concat(state.alumni.filter((a) => a.mlog && !a.helper));
    const rows = [];
    for (const p of people) {
      const md = HighSchool.monthDelta(p, sv);
      if (!md) continue;
      const grade = y - p.enrolledYear + 1;
      if (growthView.filter === 'watched' && !p.watched) continue;
      if (/^g\d$/.test(growthView.filter) && Number(growthView.filter.slice(1)) !== grade) continue;
      const keys = p.finalAbilities ? p.mainKeys : Core.visibleKeys(p);
      const parts = [];
      let sum = 0;
      for (const k of keys) {
        const d = growthView.decimal ? Core.round1(md.d[k]) : Math.round(md.now[k]) - Math.round(md.prev[k]);
        sum += md.d[k];
        if (d !== 0) parts.push({ k: k, d: d });
      }
      if (growthView.changedOnly && !parts.length) continue;
      rows.push({ p: p, grade: grade, parts: parts, gain: sum / keys.length * CONFIG.ratingMultiplier });
    }
    rows.sort((a, b) => b.gain - a.gain || a.p.id - b.p.id);
    const chip = (key, label) => '<button class="chip' + (growthView.filter === key ? ' on' : '') + '" data-gfilter="' + key + '">' + label + '</button>';
    let html = '<div class="card"><h2>成長(' + esc(HighSchool.serialLabel(sv)) + ' 末)</h2>'
      + '<div class="row"><button class="minibtn" data-gstep="-1"' + (idx <= 0 ? ' disabled' : '') + '>◀ 前月</button>'
      + '<button class="minibtn" data-gstep="1"' + (idx >= serials.length - 1 ? ' disabled' : '') + '>次月 ▶</button>'
      + '<button class="minibtn" data-gstep="latest">最新</button></div>'
      + '<div class="row">' + chip('all', '全員') + chip('watched', '★注目') + chip('g1', '1年') + chip('g2', '2年') + chip('g3', '3年') + '</div>'
      + '<div class="row"><label><input type="checkbox" id="gChanged"' + (growthView.changedOnly ? ' checked' : '') + '> 変化があった選手のみ</label>'
      + '<label><input type="checkbox" id="gDecimal"' + (growthView.decimal ? ' checked' : '') + '> 小数で表示</label></div>'
      + '<div class="small">' + rows.filter((r) => r.parts.length).length + '人に変化 / ' + rows.length + '人を表示(前月末、または入学時との差)</div>';
    html += rows.map((r) => '<div class="grow-row">' + (r.p.watched ? '★' : '') + '<b>' + esc(r.p.name) + '</b> <span class="small">' + r.grade + '年・'
      + Core.POSITION_SHORT[r.p.position] + (r.p.finalAbilities ? '・卒業生' : '') + '</span> '
      + (r.parts.length ? r.parts.map((x) => '<span class="' + (x.d > 0 ? 'd' : 'dn') + '">' + Core.ABILITY_LABEL[x.k] + ' ' + (x.d > 0 ? '+' : '') + (growthView.decimal ? x.d.toFixed(1) : x.d) + '</span>').join(' ')
        : '<span class="small">変化なし</span>') + '</div>').join('');
    return html + '</div>';
  }

  // ---------- 調整タブ ----------

  function renderTuneParams() {

  function statsRow(list) {
    if (!list.length) return { n: 0, avg: '-', min: '-', max: '-' };
    const r = list.map((p) => Core.rating(p));
    return { n: r.length, avg: Math.round(r.reduce((a, b) => a + b, 0) / r.length), min: Math.min.apply(null, r), max: Math.max.apply(null, r) };
  }
  function renderTuneState() {
    const players = state.players.filter((p) => !p.helper);
    const monthNum = HighSchool.CALENDAR[state.month].month;
    const bench = Generation.getBenchmark();
    let html = '<div class="card"><h2>(2) 現在の状態(' + esc(HighSchool.formatYear(state.year) + ' ' + HighSchool.monthLabel(state.month)) + ')</h2>';
    html += '<div class="scroll"><table class="tune"><tr><th>学年</th><th class="num">人数</th><th class="num">平均</th><th class="num">最小</th><th class="num">最大</th>'
      + '<th class="num">基準p50</th><th class="num">p90</th><th class="num">p99</th></tr>';
    for (const g of [1, 2, 3]) {
      const list = players.filter((p) => p.grade === g);
      const st = statsRow(list);
      const gm = g === 3 && list.some((p) => p.retired) ? 3 : monthNum;
      const row = bench && bench.rows[g + '-' + (g === 3 && list.length && list.every((p) => p.retired) ? 3 : monthNum)];
      html += '<tr><td>' + g + '年' + (gm === 3 && monthNum !== 3 ? '(引退後)' : '') + '</td><td class="num">' + st.n + '</td><td class="num">' + st.avg + '</td><td class="num">' + st.min
        + '</td><td class="num">' + st.max + '</td><td class="num">' + (row ? row.p50 : '-') + '</td><td class="num">' + (row ? row.p90 : '-') + '</td><td class="num">' + (row ? row.p99 : '-') + '</td></tr>';
    }
    html += '</table></div>';
    // ラベル別の人数と、同世代の上位10人
    const ranked = players.map((p) => ({ p: p, r: genRank(p) })).filter((x) => x.r);
    const cnt = { 規格外: 0, 怪物級: 0, 逸材: 0, 有望: 0 };
    for (const x of ranked) if (cnt[x.r.label] != null) cnt[x.r.label]++;

      + Object.keys(cnt).map((k) => k + ' ' + cnt[k] + '人').join(' / ') + '</div>';
    ranked.sort((a, b) => a.r.top - b.r.top);
    html += '<div class="sublabel">同世代の上位(10人)</div><div class="lines">' + ranked.slice(0, 10).map((x) =>
      '<div class="small">' + esc(x.p.name) + '(' + x.p.grade + '年・' + Core.POSITION_SHORT[x.p.position] + ')総合値 ' + Core.rating(x.p)
      + ' → 同世代 上位' + Generation.formatTop(x.r.top) + (x.r.label ? ' ' + x.r.label : '') + '</div>').join('') + '</div>';
    const capped = players.filter((p) => Core.isCappedOut(p)).length;
    const over = players.filter((p) => Core.growthKeys(p).some((k) => p.abilities[k] > 100)).length;
    const g = players.filter((p) => p.talent === 'genius').length;
    const re = players.filter((p) => p.reincarnation).length;
    const tw = players.filter((p) => p.twoWay).length;
    const L = state.leadership;
    html += '<div class="sublabel">そのほか</div><div class="small">頭打ち ' + capped + '人 / 100を超えた能力を持つ ' + over + '人'
      + '<br>天才 ' + g + '人・転生 ' + re + '人・二刀流 ' + tw + '人(隠れた才能を含む)'
      + '<br>指導力 Lv.' + L.lv + (L.lv < CONFIG.leadership.maxLv ? '(次のLvまで ' + L.exp + '/' + HighSchool.leadershipNeed(L.lv) + ')' : '(最大)');
    const sum = { practice: 0, camp: 0, exp: 0 };
    for (const x of players.concat(state.alumni)) for (const k of Object.keys(sum)) sum[k] += (x.growthBy && x.growthBy[k]) || 0;
    const tot = sum.practice + sum.camp + sum.exp;
    if (tot) html += '<br>これまでの成長の内訳:練習 ' + Math.round(sum.practice / tot * 100) + '% / 合宿 ' + Math.round(sum.camp / tot * 100) + '% / 試合経験値 ' + Math.round(sum.exp / tot * 100) + '%';
    for (const k of ['summer', 'autumn']) {
      const t = state.stats.tournaments[k];
      html += '<br>' + CONFIG.tournaments[k].name + ':' + t.played + '回 優勝 ' + t.champion + ' / 準優勝 ' + (t.runnerUp || 0) + ' / ベスト4 ' + (t.best4 || 0);
    }
    return html + '</div></div>';
  }
  function verdictCls(v) { return v === '✓' ? 'ok' : v === '△' ? 'mid' : v === '−' ? '' : 'ng'; }
  function renderTuneTrial() {
    const last = Persist.readJson(storage, Persist.KEYS.lastTrial);
    let html = '<div class="card"><h2>(3) この設定で試す</h2>'
      + '<div class="small">調整中の設定(未保存の変更を含む)で、sim.js と同じ計算をこの画面の中で行います。進行中のゲームには影響しません。</div>'
      + '<div class="row">年数 <select id="trialYears">' + [10, 30, 50].map((y) => '<option' + (y === 30 ? ' selected' : '') + '>' + y + '</option>').join('') + '</select>'
      + 'シード <select id="trialSeeds"><option>1</option><option selected>3</option></select>'
      + '<button class="btn small" id="btnTrial" style="flex:0 0 auto"' + (trial.running || benchJob.running ? ' disabled' : '') + '>この設定で試す</button></div>';
    if (trial.running) html += '<div class="small">' + esc(trial.label) + '</div><div class="progress"><i style="width:' + Math.round(trial.progress * 100) + '%"></i></div>';
    const res = trial.result || (last && last.current);
    const prev = trial.result ? (last && last.previous) : (last && last.previous);
    if (res) {
      html += '<div class="small">結果:' + esc(res.label) + '</div><div class="scroll"><table class="tune"><tr><th>項目</th><th class="num">結果</th><th class="num">目安</th><th>判定</th><th class="num">前回との差</th></tr>'
        + Object.keys(CONFIG.targets).map((k) => {
          const t = CONFIG.targets[k];
          const v = res.metrics[k];
          const vd = Sim.judgeValue(v, t);
          let diff = '';
          if (prev && prev.metrics && prev.metrics[k] != null && v != null && !Number.isNaN(v)) {
            const d = v - prev.metrics[k];
            diff = (d > 0 ? '+' : '') + Sim.formatMetric(d, t);
            if (Math.abs(d) < 1e-9) diff = '±0';
          }
          return '<tr><td>' + esc(t.label) + '</td><td class="num">' + Sim.formatMetric(v, t) + '</td><td class="num">' + esc(Sim.formatTarget(t)) + '</td>'
            + '<td class="vd ' + verdictCls(vd) + '">' + vd + '</td><td class="num">' + diff + '</td></tr>';
        }).join('') + '</table></div>';
      if (prev) html += '<div class="small">前回:' + esc(prev.label) + '</div>';
    }
    return html + '</div>';
  }
  function renderTuneBench() {
    const b = Generation.getBenchmark();
    const src = Generation.getBenchmarkSource();
    const stale = Tuning.withOverrides(pending, Tuning.effectiveOverrides(state.overrides, pending), () => Generation.isStale());
    let html = '<div class="card"><h2>(4) 世代の基準</h2>'
      + '<div class="small">使用中:' + (src === 'custom' ? '再計算した基準' : src === 'builtin' ? '組み込みの基準(benchmark.js)' : 'なし')
      + (b ? '(' + b.runs.seeds + 'シード × ' + b.runs.years + '年、指導力Lv' + b.coachLv + '、ハッシュ ' + b.hash + ')' : '') + '</div>';
    const staleGame = Generation.isStale();
    if (!b) html += '<div class="warnbox">世代の基準がありません。再計算してください。</div>';
    else if (stale) html += '<div class="warnbox">⚠ 世代の基準が古い可能性があります(調整中の設定と、基準を作ったときの設定が違います)。再計算してください。</div>';
    else html += '<div class="small">✓ 調整中の設定と一致しています。</div>';
    if (b && staleGame) html += '<div class="small">※ 進行中のゲームの設定とは違う基準です(ホームにも注意が出ます)。新しいゲームを始めると一致します。</div>';
    html += '<div class="row"><button class="btn small" id="btnBench" style="flex:0 0 auto"' + (trial.running || benchJob.running ? ' disabled' : '') + '>世代の基準を再計算</button>'
      + (src === 'custom' ? '<button class="minibtn" id="btnBenchBuiltin">組み込みの基準に戻す</button>' : '') + '</div>';
    if (benchJob.running) html += '<div class="progress"><i style="width:' + Math.round(benchJob.progress * 100) + '%"></i></div>';
    return html + '<div class="small">再計算には、調整中の設定を使います(' + CONFIG.benchmarkRuns.seeds + 'シード × ' + CONFIG.benchmarkRuns.years + '年)。</div></div>';
  }
  function renderTune() {
    return renderTuneParams() + renderTuneState() + renderTuneTrial() + renderTuneBench();
  }

  // 少しずつ実行する(画面が固まらないように)。step() が true を返したら終わり
  function runChunked(stepFn, onProgress, onDone) {
    const tick = () => {
      const t0 = Date.now();
      let finished = false;
      while (!finished && Date.now() - t0 < 30) finished = stepFn();
      onProgress();
      if (finished) onDone(); else setTimeout(tick, 0);
    };
    setTimeout(tick, 0);
  }
  function startTrial() {
    const years = Number(document.getElementById('trialYears').value);
    const nSeeds = Number(document.getElementById('trialSeeds').value);
    const seeds = Array.from({ length: nSeeds }, (_, i) => 1 + i);
    const gameOv = Tuning.effectiveOverrides(state.overrides, pending);
    const label = years + '年 × ' + nSeeds + 'シード / 変更 ' + Object.keys(pending).length + '件';
    let runner = null;
    trial = { running: true, progress: 0, result: null, label: label + ' を計算中…' };
    render();
    runChunked(
      () => Tuning.withOverrides(pending, gameOv, () => {
        if (!runner) runner = Sim.createRunner({ seeds: seeds, years: years, policyMode: 'auto' });
        return runner.step();
      }),
      () => { trial.progress = runner ? runner.progress() : 0; updateProgressOnly(); },
      () => {
        const metrics = Tuning.withOverrides(pending, gameOv, () => Sim.analyze(runner.states(), runner.labels));
        const last = Persist.readJson(storage, Persist.KEYS.lastTrial);
        const cur = { label: label + '(' + new Date().toLocaleString() + ')', metrics: metrics, overrides: Object.assign({}, pending) };
        Persist.writeJson(storage, Persist.KEYS.lastTrial, { current: cur, previous: last && last.current ? last.current : null });
        trial = { running: false, progress: 1, result: cur, label: '' };
        render();
      });
  }
  function startBenchmark() {
    const gameOv = Tuning.effectiveOverrides(state.overrides, pending);
    let runner = null;
    benchJob = { running: true, progress: 0 };
    render();
    runChunked(
      () => Tuning.withOverrides(pending, gameOv, () => {
        if (!runner) runner = Sim.createBenchmarkRunner();
        return runner.step();
      }),
      () => { benchJob.progress = runner ? runner.progress() : 0; updateProgressOnly(); },
      () => {
        const b = Tuning.withOverrides(pending, gameOv, () => runner.result());
        Persist.writeJson(storage, Persist.KEYS.benchmark, b);
        Generation.setBenchmark(b, 'custom');
        benchJob = { running: false, progress: 1 };
        render();
      });
  }
  // 進捗バーだけを更新する(入力中の値を消さないように)
  function updateProgressOnly() {
    if (tab !== 'tune') return;
    const bars = document.querySelectorAll('.progress i');
    const v = trial.running ? trial.progress : benchJob.progress;
    bars.forEach((b) => { b.style.width = Math.round(v * 100) + '%'; });
  }
  function renderModal() {
    if (!modal) return '';
    return '<div class="modal-bg"><div class="modal"><p>' + esc(modal.text) + '</p>'
      + '<div class="btns"><button class="btn sub small" id="modalCancel">やめる</button><button class="btn danger small" id="modalOk">' + esc(modal.ok || 'はい') + '</button></div></div></div>';
  }

  function render() {
    renderHeader();
    document.querySelectorAll('nav button').forEach((b) => b.classList.toggle('on', b.dataset.tab === tab));
    const main = document.getElementById('main');
    cardSeq = 0;
    main.innerHTML = (tab === 'home' ? renderHome() : tab === 'roster' ? renderRoster() : tab === 'growth' ? renderGrowth()
      : tab === 'alumni' ? renderAlumni() : tab === 'tune' ? renderTune() : renderSettings()) + renderModal();
  }

  // ---------- 操作 ----------
  function afterAdvance() { save(); render(); window.scrollTo(0, 0); }
  document.querySelector('nav').addEventListener('click', (e) => {
    const t = e.target.dataset && e.target.dataset.tab;
    if (t) { tab = t; render(); window.scrollTo(0, 0); }
  });
  document.getElementById('main').addEventListener('toggle', (e) => {
    const key = e.target.dataset && e.target.dataset.open;
    if (!key) return;
    if (key === 'pol-new') {
      if (e.target.open) openDetails.delete('pol-new-closed'); else openDetails.add('pol-new-closed');
      return;
    }
    if (e.target.open) openDetails.add(key); else openDetails.delete(key);
  }, true);
  document.getElementById('main').addEventListener('change', (e) => {
    if (e.target.id === 'autoTarget') { autoTarget = e.target.value; return; }
    if (e.target.id === 'gChanged') { growthView.changedOnly = e.target.checked; render(); return; }
    if (e.target.id === 'gDecimal') { growthView.decimal = e.target.checked; render(); return; }
    if (e.target.dataset.tune) {
      // 調整:初期値と同じなら上書きを外す
      const path = e.target.dataset.tune;
      const v = Number(e.target.value);
      if (!Number.isFinite(v)) { render(); return; }
      if (v === Tuning.defaultValue(path)) delete pending[path]; else pending[path] = v;
      Persist.saveOverrides(storage, pending);
      applyGameConfig(); // 表示だけに使う値は、すぐ反映
      render();
      return;
    }
    if (e.target.dataset.pid) {
      draftPolicies[e.target.dataset.pid] = e.target.value;
      render();
    }
  });
  document.getElementById('main').addEventListener('click', (e) => {
    const id = e.target.id;
    const ds = e.target.dataset || {};
    if (ds.watch) {
      e.preventDefault(); // summary の中でも詳細を開閉しない
      const pid = Number(ds.watch);
      const all = state.players.concat(state.pendingRecruits);
      const p = all.find((q) => q.id === pid) || state.alumni.find((q) => q.id === pid);
      const r = HighSchool.setWatch(state, pid, !(p && p.watched));
      if (!r.ok && r.needRemove.length) pendingWatchId = pid;
      save(); render();
      return;
    }
    if (ds.swapwatch) {
      if (ds.swapwatch !== 'cancel') {
        HighSchool.setWatch(state, Number(ds.swapwatch), false);
        HighSchool.setWatch(state, pendingWatchId, true);
      }
      pendingWatchId = null;
      save(); render();
      return;
    }
    if (ds.growthSerial != null) {
      growthView.serial = Number(ds.growthSerial);
      tab = 'growth'; render(); window.scrollTo(0, 0);
      return;
    }
    if (ds.gstep != null) {
      const serials = growthSerials();
      let i = serials.indexOf(growthView.serial == null ? serials[serials.length - 1] : growthView.serial);
      if (i < 0) i = serials.length - 1;
      if (ds.gstep === 'latest') i = serials.length - 1; else i = Math.max(0, Math.min(serials.length - 1, i + Number(ds.gstep)));
      growthView.serial = serials[i];
      render();
      return;
    }
    if (ds.gfilter) { growthView.filter = ds.gfilter; render(); return; }
    if (id === 'btnAuto') {
      // おまかせ:新入生のみ(見直しの月は選び直しが必要な選手のみ)/ 全員
      for (const p of state.pendingRecruits) draftPolicies[p.id] = Core.autoPolicy(p);
      for (const p of HighSchool.reviewablePlayers(state)) {
        if (autoTarget === 'all' || p.needsPolicy) draftPolicies[p.id] = Core.autoPolicy(p);
      }
      render();
    } else if (id === 'btnPolicy') {
      HighSchool.confirmPolicies(state, draftPolicies);
      clearDraft();
      // 決めた月の続き(入学の結果、冬合宿など)はボタンで進める
      afterAdvance();
    } else if (id === 'btnNextEvent') {
      HighSchool.advanceToNextEvent(state);
      afterAdvance();
    } else if (id === 'btnNextMonth') {
      HighSchool.advanceMonth(state);
      afterAdvance();
    } else if (id === 'btnApril') {
      HighSchool.advanceToApril(state);
      afterAdvance();
    } else if (id === 'btnResetSame') {
      // 確認は画面の中に出す(プレビューなど、confirm() が使えない環境でも動くように)
      modal = { text: '同じシード(' + state.seed + ')で、最初からやり直しますか?', ok: 'やり直す', action: () => { state = Persist.resetSameSeed(storage, state); } };
      render();
    } else if (id === 'btnResetNew') {
      const v = document.getElementById('seedInput').value.trim();
      const seed = v === '' ? null : Number(v);
      if (v !== '' && !Number.isFinite(seed)) { modal = { text: 'シードは数字で入れてください。', ok: 'OK', action: () => {} }; render(); return; }
      modal = { text: (seed == null ? 'ランダムなシード' : 'シード ' + seed) + 'で、新しく始めますか?', ok: '始める', action: () => { state = Persist.resetNewSeed(storage, seed); } };
      render();
    } else if (id === 'btnWipe') {
      modal = { text: 'このゲームの保存データ(調整タブの設定などを含む)をすべて消して、初期状態に戻しますか?', ok: '完全に消す',
        action: () => { state = Persist.wipeAll(storage); pending = {}; trial = { running: false, progress: 0, result: null, label: '' }; } };
      render();
    } else if (id === 'modalOk' && modal) {
      const act = modal.action;
      resetUiState();
      act();
      applyGameConfig();
      save();
      render();
      window.scrollTo(0, 0);
    } else if (id === 'modalCancel') {
      modal = null; render();
    } else if (id === 'btnTuneResetAll') {
      pending = {};
      Persist.saveOverrides(storage, pending);
      applyGameConfig();
      render();
    } else if (ds.tunereset) {
      delete pending[ds.tunereset];
      Persist.saveOverrides(storage, pending);
      applyGameConfig();
      render();
    } else if (id === 'btnTuneCopy') {
      copyText = Tuning.overridesToText(pending);
      render();
      const ta = document.getElementById('copyArea');
      try {
        if (navigator.clipboard && copyText) navigator.clipboard.writeText(copyText).catch(() => {});
        if (ta) { ta.select(); document.execCommand('copy'); }
      } catch (err) { /* 手でコピーしてもらう */ }
    } else if (id === 'btnTrial') {
      startTrial();
    } else if (id === 'btnBench') {
      startBenchmark();
    } else if (id === 'btnBenchBuiltin') {
      try { storage.removeItem(Persist.KEYS.benchmark); } catch (err) { /* なし */ }
      Generation.setBenchmark(null);
      render();
    } else if (ds.af) {
      alumniFilter = ds.af; render();
    }
  });

  // 起動:?reset=1 なら保存データをすべて消して初期状態から。古い形式のセーブは互換を取らずに初期化する
  const boot = Persist.startup(storage, window.location.search);
  state = boot.state;
  if (boot.reset) {
    pending = {};
    try { window.history.replaceState(null, '', window.location.pathname); } catch (e) { /* 書き換えられない環境 */ }
  }
  pending = Persist.loadOverrides(storage);
  applyGameConfig();
  render();
})();
</script>
</body>
</html>
