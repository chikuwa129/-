<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>打席の試作</title>
<style>
  :root { --bg: #f4f1ea; --card: #fffdf8; --ink: #222; --sub: #777; --line: #ddd5c6; --accent: #1f5f8b; --win: #1d7a3a; --lose: #b03a2e; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; font-size: 15px; line-height: 1.5; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 12px calc(170px + env(safe-area-inset-bottom)); }
  header { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 8px 0 6px; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 16px; margin: 0 0 4px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin: 10px 0; }
  .small { font-size: 12px; color: var(--sub); }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 4px 0; }
  .chip { padding: 5px 10px; border: 1px solid var(--line); background: #fff; border-radius: 14px; font-size: 13px; }
  .chip.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  select, input { font-size: 14px; padding: 5px; border: 1px solid var(--line); border-radius: 6px; background: #fff; min-width: 0; }
  input[type=number] { width: 7em; }
  .scene { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; }
  .sc-big { font-size: 22px; font-weight: bold; }
  .outs span { display: inline-block; width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--lose); margin-right: 3px; vertical-align: middle; }
  .outs span.on { background: var(--lose); }
  .dia { position: relative; width: 84px; height: 84px; }
  .dia i { position: absolute; width: 26px; height: 26px; border: 2px solid #999; background: #fff; transform: rotate(45deg); }
  .dia i.on { background: #e0a800; border-color: #b07d00; }
  .dia .b2 { left: 29px; top: 4px; } .dia .b1 { left: 54px; top: 29px; } .dia .b3 { left: 4px; top: 29px; } .dia .hp { left: 29px; top: 54px; background: #eee; border-color: #ccc; }
  .abil { display: grid; grid-template-columns: repeat(var(--cols, 4), minmax(0, 1fr)); gap: 4px; margin-top: 4px; }
  .abil div { min-width: 0; background: #f6f2e9; border-radius: 4px; padding: 2px; text-align: center; font-size: 11px; color: var(--sub); }
  .abil b { display: block; font-size: 22px; line-height: 1.1; color: var(--ink); }
  .abil i { display: block; font-style: normal; font-size: 13px; color: var(--ink); }
  .abil b small { font-size: 11px; font-weight: normal; }
  .rkS b, .rkA b { color: #c0392b; } .rkB b, .rkC b { color: #d35400; } .rkF b, .rkG b { color: #999; }
  h2 { font-size: 15px; margin: 0 0 2px; }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; background: var(--card); border-top: 1px solid var(--line); box-shadow: 0 -2px 6px rgba(0,0,0,.08); padding-bottom: env(safe-area-inset-bottom); }
  .bar-in { max-width: 560px; margin: 0 auto; padding: 6px 10px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
  .ob { border: 1px solid var(--accent); background: #fff; color: var(--accent); border-radius: 8px; padding: 6px 4px; min-height: 52px; font-size: 14px; font-weight: bold; text-align: center; line-height: 1.25; }
  .ob small { display: block; font-size: 10px; font-weight: normal; color: var(--sub); }
  .ob .ev { display: block; font-size: 11px; font-weight: normal; color: var(--ink); }
  .ob.best { border-width: 2px; box-shadow: 0 0 0 2px #cfe3f2; }
  .ob.next { grid-column: 1 / -1; background: var(--accent); color: #fff; min-height: 48px; font-size: 16px; }
  .res { font-size: 20px; font-weight: bold; }
  .up { color: var(--win); } .dn { color: var(--lose); }
  table { border-collapse: collapse; width: 100%; font-size: 12px; } td, th { border-bottom: 1px dotted #ddd; padding: 2px 3px; text-align: left; }
  .dev { font-family: ui-monospace, monospace; font-size: 10px; word-break: break-all; background: #eef; }
  details summary { cursor: pointer; font-size: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <header><h1>⚾ 打席の試作(T1)</h1><div class="row" id="modes"></div></header>
  <main id="main"></main>
</div>
<div class="bar"><div class="bar-in" id="bar"></div></div>
<script src="atbat-engine.js"></script>
<script>
(function () {
  'use strict';
  const A = window.AtBat;
  const DEV = /[?&]dev=1(&|$)/.test(location.search);
  const esc = (t) => String(t == null ? '' : t).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const pct = (v) => (v * 100).toFixed(1) + '%';
  const sgn = (v, d) => (v >= 0 ? '+' : '') + v.toFixed(d == null ? 2 : d);
  let mode = 'bat';        // 'bat' 野手(自分の打席) / 'pitch' 投手(ピンチ)
  let seed = 1;
  let rng = new A.Rng(seed);
  let sc = null;           // 今の場面
  let result = null;       // 直前の結果
  let presetIdx = -1;
  let bat = 'normal', pit = 'normal';
  let lastEval = null;

  function scenesOfMode() { return A.SCENES.map((s, i) => ({ s: s, i: i })).filter((x) => (x.s.side === 'pitch') === (mode === 'pitch')); }
  function applyPresets(s) {
    s.batter = Object.assign({}, A.PRESETS.batter[bat]);
    s.pitcher = Object.assign({}, A.PRESETS.pitcher[pit]);
    return s;
  }
  function newScene(fromSeed) {
    result = null;
    if (fromSeed || presetIdx < 0) {
      const s = A.randomScene(seed);
      s.side = mode;
      sc = applyPresets(s);
    } else sc = applyPresets(A.makeScene(Object.assign({}, A.SCENES[presetIdx], { side: mode })));
    rng = new A.Rng((seed * 2654435761) >>> 0);
  }
  // 結果のあと:3アウトまでは同じイニングを続ける(次の打者は同じ能力)。3アウトなら、次のシードの場面
  function nextScene() {
    if (result && result.outs < 3) {
      const diff = sc.diff + (mode === 'bat' ? result.runs : -result.runs);
      sc = Object.assign({}, sc, { outs: result.outs, bases: result.bases, diff: diff });
      result = null;
    } else { seed = (seed + 1) >>> 0; presetIdx = -1; newScene(true); }
  }

  const box = (label, v, sub) => '<div class="rk' + A.rankOf(v) + '">' + label + '<b>' + A.rankOf(v) + '</b><i>' + Math.round(v) + '</i>' + (sub || '') + '</div>';
  function abilHtml() {
    const b = sc.batter, p = sc.pitcher;
    const prs = (who, cur) => ['strong', 'normal', 'weak'].map((k) => '<button class="chip' + (cur === k ? ' on' : '') + '" data-' + who + '="' + k + '">' + { strong: '強い', normal: '普通', weak: '弱い' }[k] + '</button>').join('');
    return '<div class="card"><h2>' + (mode === 'bat' ? '自分(打者)' : '相手の打者') + '</h2><div class="row">' + prs('bat', bat) + '</div>'
      + '<div class="abil" style="--cols:3">' + box('ミート', b.contact) + box('パワー', b.power) + box('走力', b.speed) + '</div>'
      + '<h2 style="margin-top:8px">' + (mode === 'bat' ? '相手の投手' : '自分(投手)') + '</h2><div class="row">' + prs('pit', pit) + '</div>'
      + '<div class="abil" style="--cols:4"><div class="rk' + A.rankOf(p.velocity) + '">球速<b>' + A.kmh(p.velocity) + '<small>km/h</small></b><i>' + Math.round(p.velocity) + '</i></div>'
      + box('制球', p.control) + '<div class="rk' + A.rankOf(p.breaking) + '">変化量<b>' + A.breakTotal(p.breaking) + '</b><i>' + Math.round(p.breaking) + '</i></div>' + box('クイック', p.quick) + '</div>'
      + '<div class="small" style="margin-top:4px">守備側:守備 ' + sc.defense + ' / 肩 ' + sc.arm + (sc.bases.some((x) => x != null) ? ' / 走者の走力 ' + sc.bases.map((x, i) => (x == null ? '' : (i + 1) + '塁 ' + x)).filter(Boolean).join('、') : '') + '</div></div>';
  }
  function sceneHtml() {
    const b = sc.bases;
    const diffT = sc.diff === 0 ? '同点' : sc.diff > 0 ? sc.diff + '点リード' : -sc.diff + '点ビハインド';
    return '<div class="card"><div class="scene"><div><div class="sc-big">' + sc.inning + '回 ' + (mode === 'bat' ? '攻撃' : '守備') + '</div>'
      + '<div class="outs">' + [0, 1].map((i) => '<span class="' + (i < sc.outs ? 'on' : '') + '"></span>').join('') + ' ' + sc.outs + 'アウト</div>'
      + '<div>' + esc(diffT) + '(自校から見て)</div><div class="small">' + esc(sc.name || '') + '</div></div>'
      + '<div class="dia"><i class="b2' + (b[1] != null ? ' on' : '') + '"></i><i class="b3' + (b[2] != null ? ' on' : '') + '"></i><i class="b1' + (b[0] != null ? ' on' : '') + '"></i><i class="hp"></i></div></div>'
      + '<div class="small">得点期待値(このイニングの残り。攻撃側):<b>' + A.reOf(sc.outs, sc.bases).toFixed(2) + '</b> ・ 1点以上の確率 ' + pct(A.p1Of(sc.outs, sc.bases)) + '</div></div>';
  }
  function controlsHtml() {
    const opts = '<option value="-1"' + (presetIdx < 0 ? ' selected' : '') + '>(シードで作る)</option>' + scenesOfMode().map((x) => '<option value="' + x.i + '"' + (presetIdx === x.i ? ' selected' : '') + '>' + esc(x.s.name) + '</option>').join('');
    return '<div class="card"><div class="row"><span class="small">場面</span><select id="preset">' + opts + '</select></div>'
      + '<div class="row"><span class="small">シード</span><input type="number" id="seed" value="' + seed + '"><button class="chip" id="useSeed">この場面</button></div></div>';
  }
  // ボタンの小さな文字:確率の変化の大きい順に2つ。特別な指示は成功率
  function deltaText(r) {
    if (r.success != null) return '成功率 ' + Math.round(r.success * 100) + '%';
    if (r.order === 'walk') return '四球にする';
    if (!r.delta) return '';
    const top = A.OUTCOMES.map((k) => [k, r.delta[k]]).filter((x) => Math.abs(x[1]) >= 0.005).sort((a, b) => Math.abs(b[1]) - Math.abs(a[1])).slice(0, 2);
    return top.length ? top.map((x) => A.OUTCOME_LABEL[x[0]].replace('のアウト', '') + (x[1] > 0 ? '+' : '') + Math.round(x[1] * 100) + '%').join(' ') : '基準';
  }
  function barHtml() {
    if (result) return '<button class="ob next" id="next">' + (result.outs >= 3 ? 'チェンジ。次の場面へ' : '次の場面へ(次の打者)') + '</button>';
    lastEval = A.evaluate(sc);
    const m = lastEval.metric;
    return lastEval.rows.map((r) => '<button class="ob' + (DEV && r.order === lastEval.best ? ' best' : '') + '" data-order="' + r.order + '">' + esc(r.label)
      + '<small>' + esc(deltaText(r)) + '</small><span class="ev">' + (m === 'p1' ? '1点以上 ' + pct(r.p1) : '期待 ' + r.ev.toFixed(2)) + '</span></button>').join('');
  }
  function resultHtml() {
    if (!result) return '';
    const runs = result.runs;
    const good = mode === 'bat' ? result.delta >= 0 : result.delta <= 0;
    return '<div class="card"><div class="small">結果(' + esc(result.orderLabel) + ')</div><div class="res ' + (good ? 'up' : 'dn') + '">' + esc(result.label) + '</div>'
      + '<div>' + (runs ? runs + '点' + (mode === 'bat' ? '入った' : '取られた') + '。' : '') + result.outs + 'アウト' + (result.outs < 3 ? '、走者 ' + (result.bases.map((x, i) => (x == null ? '' : (i + 1) + '塁')).filter(Boolean).join('・') || 'なし') : '(チェンジ)') + '</div>'
      + '<div class="small">得点期待値の変化(攻撃側。この打席の得点を含む):<b class="' + (good ? 'up' : 'dn') + '">' + sgn(result.delta) + '</b>(' + result.reBefore.toFixed(2) + ' → ' + result.reAfter.toFixed(2) + (runs ? ' + ' + runs + '点' : '') + ')</div></div>';
  }
  function keyTableHtml() {
    const list = A.SCENES.concat(Array.from({ length: 20 }, (_, i) => A.randomScene(500 + i)));
    const yn = (v) => (v ? '◯' : '−');
    return '<details class="card"><summary>介入場面の判定(確認用。' + list.length + '場面)</summary><table><tr><th>場面</th><th>攻守</th><th>回</th><th>状況</th><th>新入部員</th><th>監督</th></tr>'
      + list.map((s) => '<tr><td>' + esc(s.name) + (s.side === 'bat' ? (s.hero ? ' 主' : '') + (s.focus ? ' 注' : '') : '') + '</td><td>' + (s.side === 'pitch' ? '守' : '攻') + '</td><td>' + s.inning + '</td><td>' + s.outs + '死 ' + (s.bases.map((x, i) => (x == null ? '' : i + 1)).join('') || '無走者') + ' ' + (s.diff > 0 ? '+' : '') + s.diff + '</td><td>' + yn(A.isKeyScene(s, 'success')) + '</td><td>' + yn(A.isKeyScene(s, 'manager')) + '</td></tr>').join('')
      + '</table><div class="small">主=主人公の打席、注=注目選手の打席。新入部員:主人公の打席すべて・ピンチ。監督:注目選手で7回以降のチャンス・7回以降のピンチ。</div></details>';
  }
  function devHtml() {
    if (!DEV) return '';
    const P = lastEval ? lastEval.rows.map((r) => r.order + ': ' + (r.probs ? A.OUTCOMES.map((k) => k + ' ' + pct(r.probs[k])).join(' ') : '成功率 ' + (r.success != null ? pct(r.success) : '-')) + ' / 期待 ' + r.ev.toFixed(3) + ' / 1点以上 ' + pct(r.p1)).join('<br>') : '';
    return '<div class="card dev">dev:最善 ' + (lastEval ? lastEval.best + '(' + lastEval.metric + ')' : '-') + '<br>' + P + '<br><br>設定(仮の値):' + esc(JSON.stringify(A.CONFIG)) + '</div>';
  }
  function render() {
    document.getElementById('modes').innerHTML = [['bat', '野手(自分の打席)'], ['pitch', '投手(ピンチ)']].map((x) => '<button class="chip' + (mode === x[0] ? ' on' : '') + '" data-mode="' + x[0] + '">' + x[1] + '</button>').join('');
    const bar = barHtml();
    document.getElementById('main').innerHTML = sceneHtml() + resultHtml() + abilHtml() + controlsHtml() + keyTableHtml() + devHtml();
    document.getElementById('bar').innerHTML = bar;
  }
  document.addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    const d = b.dataset;
    if (d.mode) { mode = d.mode; presetIdx = -1; newScene(true); render(); return; }
    if (d.bat) { bat = d.bat; sc.batter = Object.assign({}, A.PRESETS.batter[bat]); render(); return; }
    if (d.pit) { pit = d.pit; sc.pitcher = Object.assign({}, A.PRESETS.pitcher[pit]); render(); return; }
    if (d.order) { const r = A.resolve(sc, d.order, rng); r.orderLabel = A.ORDER_LABEL[mode][d.order]; result = r; render(); window.scrollTo(0, 0); return; }
    if (b.id === 'next') { nextScene(); render(); window.scrollTo(0, 0); return; }
    if (b.id === 'useSeed') { const v = Number(document.getElementById('seed').value); seed = (Number.isFinite(v) ? Math.floor(v) : 1) >>> 0; presetIdx = -1; newScene(true); render(); return; }
  });
  document.addEventListener('change', (e) => {
    if (e.target.id === 'preset') { presetIdx = Number(e.target.value); newScene(presetIdx < 0); render(); }
  });
  newScene(true);
  render();
})();
</script>
</body>
</html>
