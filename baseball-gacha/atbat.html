<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>打席の試作</title>
<style>
  /* 色はすべて明示する(テーマや埋め込みの環境に依存しない) */
  :root { color-scheme: light; --bg: #0f2a1a; --stage: #e9e4d6; --card: #fffdf8; --ink: #1d1d1d; --sub: #5f5f5f; --line: #cfc6b4; --accent: #1f5f8b; --win: #1d7a3a; --lose: #b03a2e; --gold: #e0a800; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { background: var(--bg); color: var(--ink); font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; font-size: 14px; line-height: 1.3; }
  button { font: inherit; color: var(--ink); background: #fff; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; }
  button:disabled { color: #8a8a8a; background: #eee; }
  select, input { font: inherit; color: var(--ink); background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 6px; min-height: 44px; }
  .app { height: 100vh; height: 100dvh; display: grid; grid-template-rows: 1fr auto; gap: 4px; padding: 4px; padding-left: max(4px, env(safe-area-inset-left)); padding-right: max(4px, env(safe-area-inset-right)); }
  /* 舞台(中央の線画と、四隅の情報) */
  .stage { position: relative; background: var(--stage); border-radius: 10px; overflow: hidden; min-height: 0; }
  .art { position: absolute; top: 30px; bottom: 2px; left: 17%; right: 17%; display: flex; align-items: center; justify-content: center; }
  @media (orientation: portrait) { .art { top: 118px; bottom: 64px; left: 2px; right: 2px; } }
  .art svg { width: 100%; height: 100%; }
  .pane { position: absolute; background: rgba(255,253,248,.94); border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; color: var(--ink); }
  .st { left: 4px; top: 4px; display: grid; grid-template-columns: auto auto; gap: 0 8px; align-items: center; }
  .st .inn { font-size: 18px; font-weight: 900; color: #111; }
  .st .score { font-size: 13px; color: #111; grid-column: 1 / -1; white-space: nowrap; }
  .st .score b { font-size: 18px; }
  .dia { position: relative; width: 46px; height: 38px; }
  .dia i { position: absolute; width: 14px; height: 14px; border: 2px solid #777; background: #fff; transform: rotate(45deg); }
  .dia i.on { background: var(--gold); border-color: #8a6400; }
  .dia .b2 { left: 16px; top: 2px; } .dia .b1 { left: 29px; top: 15px; } .dia .b3 { left: 3px; top: 15px; }
  .lamps { display: flex; align-items: center; gap: 3px; font-size: 11px; color: var(--sub); grid-column: 1 / -1; }
  .lamps span { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--lose); background: #fff; }
  .lamps span.on { background: var(--lose); }
  .band { left: 50%; top: 4px; transform: translateX(-50%); font-size: 12px; white-space: nowrap; color: #111; }
  .band b { font-size: 15px; }
  .str { display: inline-block; padding: 0 6px; border-radius: 9px; font-size: 11px; font-weight: bold; color: #fff; background: #555; }
  .str.up { background: var(--lose); } .str.dn { background: var(--win); }
  .opp { right: 4px; top: 4px; max-width: 46%; }
  .me { right: 4px; bottom: 4px; max-width: 50%; }
  .who { font-size: 11px; color: var(--sub); } .who b { font-size: 14px; color: #111; }
  .ranks { display: flex; gap: 6px; margin-top: 1px; }
  .ranks span { text-align: center; font-size: 10px; color: var(--sub); }
  .ranks b { display: block; font-size: 20px; line-height: 1.05; color: #111; }
  .me .ranks b { font-size: 26px; }
  .rkS, .rkA { color: #c0392b !important; } .rkB, .rkC { color: #d35400 !important; } .rkF, .rkG { color: #888 !important; }
  .tags { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 2px; }
  .tag { font-size: 11px; padding: 0 6px; border-radius: 9px; border: 1px solid #8a6400; color: #6b4e00; background: #fff6dc; white-space: nowrap; }
  .warn { left: 4px; bottom: 4px; font-size: 12px; font-weight: bold; color: var(--lose); }
  .rot { position: absolute; left: 50%; top: 100px; transform: translateX(-50%); white-space: nowrap; font-size: 11px; color: var(--sub); background: rgba(255,253,248,.9); border-radius: 6px; padding: 0 6px; }
  /* 結果 */
  .result { left: 50%; top: 50%; transform: translate(-50%, -50%); min-width: 56%; text-align: center; box-shadow: 0 4px 16px rgba(0,0,0,.35); padding: 6px 12px; z-index: 3; }
  .result .r1 { font-size: 26px; font-weight: 900; }
  .result .r3 { font-size: 15px; font-weight: bold; color: #111; }
  .result.pop { animation: pop .45s ease-out both; }
  @keyframes pop { from { opacity: 0; transform: translate(-50%, -50%) scale(.85); } to { opacity: 1; transform: translate(-50%, -50%) scale(1); } }
  @media (prefers-reduced-motion: reduce) { .result.pop { animation: none; } }
  .good { color: var(--win); } .bad { color: var(--lose); }
  .note { font-size: 11px; color: var(--sub); }
  /* 下:指示のカード(横に1行。押すと、すぐ結果)と、右端の小さなボタン */
  .bar { background: var(--card); border-radius: 10px; padding: 6px; display: flex; gap: 8px; align-items: stretch; }
  .cards { flex: 1 1 auto; min-width: 0; display: flex; gap: 8px; }
  .cd { flex: 1 1 0; min-width: 0; min-height: 84px; padding: 3px 3px; border: 2px solid var(--accent); background: #fff; color: #111; text-align: center; display: flex; flex-direction: column; justify-content: space-between; gap: 1px; }
  .cd .nm { display: block; font-size: 14px; font-weight: bold; color: var(--accent); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cd .od { display: block; font-size: 10px; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cd .ft { display: block; font-size: 10px; line-height: 1.2; color: #333; min-height: 2.4em; overflow: hidden; }
  .cd .nums { display: flex; justify-content: center; align-items: flex-end; gap: 8px; }
  .cd .pr, .cd .rt { display: flex; flex-direction: column; align-items: center; font-size: 9px; color: var(--sub); line-height: 1; }
  .cd .pr b { font-size: 22px; line-height: 1.05; color: #111; }
  .cd .rt b { font-size: 20px; line-height: 1.1; min-width: 1.4em; border-radius: 6px; border: 2px solid #777; color: #111; background: #f2f2f2; }
  .r1c, .r2c, .r3c { color: #8c2a20 !important; border-color: #b03a2e !important; background: #fbe9e6 !important; }
  .r5c, .r6c, .r7c { color: #135c2b !important; border-color: #1d7a3a !important; background: #e5f4e9 !important; }
  .r7c, .r1c { border-width: 3px !important; }
  .cd.two .nm { font-size: 16px; }
  .cd.sel { border-width: 4px; border-color: #0d3d5f; background: #e8f1f8; }
  .cd:disabled { opacity: .55; color: #111; background: #fff; } .cd.sel:disabled { opacity: 1; background: #e8f1f8; }
  .cd.best { box-shadow: 0 0 0 3px #f4c542; }
  .side { display: flex; flex-direction: column; gap: 6px; flex: 0 0 auto; }
  .side button { min-height: 44px; min-width: 44px; padding: 0 6px; }
  .plain { font-size: 11px; color: #333; max-width: 5.5em; line-height: 1.1; }
  .msgbox { flex: 1 1 auto; min-width: 0; min-height: 84px; font-size: 12px; color: #111; display: flex; flex-direction: column; justify-content: center; padding: 0 6px; }
  .msgbox .sm { font-size: 10px; color: var(--sub); }
  .gear { font-size: 18px; }
  .result .ev { font-size: 11px; color: #333; margin-top: 2px; }
  .result .ev b { font-size: 14px; }
  @media (orientation: portrait) {
    .opp { max-width: 54%; }
    .band { left: 4px; top: auto; bottom: 4px; transform: none; }
    .warn { bottom: 34px; }
    .cards { gap: 5px; } .cd .nm { font-size: 12px; } .cd .pr b { font-size: 18px; } .cd .rt b { font-size: 16px; } .cd .nums { gap: 3px; }
  }
  /* 設定(歯車) */
  .sheet { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.5); display: flex; justify-content: center; padding: 8px; }
  .sheet .box { background: var(--card); color: #111; border-radius: 10px; width: 100%; max-width: 820px; overflow-y: auto; padding: 10px 12px; }
  .sheet h2 { font-size: 15px; margin: 8px 0 4px; color: #111; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 4px 0; }
  .chip { min-height: 44px; padding: 6px 12px; border-radius: 22px; background: #fff; color: #222; border: 1px solid #888; }
  .chip.on { background: #222; color: #fff; border-color: #222; }
  table { border-collapse: collapse; width: 100%; font-size: 12px; color: #111; } td, th { border-bottom: 1px dotted #bbb; padding: 2px 3px; text-align: left; }
  .dev { font-family: ui-monospace, monospace; font-size: 10px; word-break: break-all; background: #eef; color: #111; padding: 6px; border-radius: 6px; }
  .pats { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 6px; }
  .pats div { background: var(--stage); border-radius: 6px; padding: 4px; font-size: 11px; color: #111; }
  .pats svg { width: 100%; height: auto; display: block; }
</style>
</head>
<body>
<div class="app" id="app"></div>
<div id="sheet"></div>
<script src="atbat-engine.js"></script>
<script src="atbat-art.js"></script>
<script>
(function () {
  'use strict';
  const A = window.AtBat, ART = window.AtBatArt, C = A.CONFIG;
  const DEV = /[?&]dev=1(&|$)/.test(location.search);
  const INK = '#1d1d1d', STAGE = '#e9e4d6';
  const esc = (t) => String(t == null ? '' : t).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const pc = (v) => Math.round(v * 100) + '%';
  const sg = (v) => (v >= 0 ? '+' : '−') + Math.abs(Math.round(v * 100));
  const S = { mode: 'bat', seed: 1, presetIdx: -1, bat: 'normal', pit: 'normal', key: 'success', sheet: false, bats: null, throws: null, card: C.ui.cardMode };
  let rng = new A.Rng(1), sc = null, ui = { sel: null, result: null }, result = null, lastEval = null, timer = null, shownAt = 0;
  const NAMES = ['青木', '石川', '上田', '大野', '加藤', '北村', '小林', '佐々木', '高田', '中島', '西村', '原田', '松本', '森', '山口', '渡辺'];
  const nameOf = (k) => NAMES[((S.seed * 7 + k * 13) >>> 0) % NAMES.length];

  function applyPresets(s) { s.batter = Object.assign({}, A.PRESETS.batter[S.bat]); s.pitcher = Object.assign({}, A.PRESETS.pitcher[S.pit]); return s; }
  const inRange = (s) => A.inWinRange(s, C.keyScene[S.key]);
  function newScene(fromSeed) {
    sc = fromSeed || S.presetIdx < 0 ? A.randomScene(S.seed) : Object.assign(A.makeScene(Object.assign({}, A.SCENES[S.presetIdx])), A.handsOf(S.seed));
    sc.side = S.mode;
    sc.half = S.mode === 'pitch' ? 'bottom' : 'top';   // 自校は先攻(攻撃は表、守備は裏)
    applyPresets(sc);
    if (S.bats) sc.bats = S.bats;
    if (S.throws) sc.throws = S.throws;
    // スコア(表示用):点差と同じになるように。自校と相手
    const low = 1 + (S.seed % 3);
    sc.my = low + Math.max(0, sc.diff); sc.op = low + Math.max(0, -sc.diff);
    rng = new A.Rng((S.seed * 2654435761) >>> 0);
    begin();
  }
  // 場面の始まり:勝負にならない試合は、操作なしで「通常」の結果だけ
  function begin() { ui = A.uiStep(null, 'next'); result = null; if (!inRange(sc)) { ui = A.uiStep(ui, 'auto'); resolve(); } }
  // カードを押すと、その指示で、すぐ結果(1タップで確定)
  function pick(order, pickAs) { ui = A.uiStep(ui, 'pick', order); if (ui.result) { ui.result.pickAs = pickAs || null; resolve(); } }
  function resolve() {
    const order = ui.result.order;
    const ev = A.evaluate(sc), row = ev.rows.find((x) => x.order === order), nrow = ev.rows.find((x) => x.order === 'normal');
    const w0 = A.gameWinProb(sc);
    const r = A.resolve(sc, order, rng);
    const bat = S.mode === 'bat';
    const diff = sc.diff + (bat ? r.runs : -r.runs);
    const w1 = A.gameWinProb(sc, { outs: r.outs, bases: r.bases, diff: diff });
    result = Object.assign(r, { order: order, orderLabel: A.ORDER_LABEL[S.mode][order], w0: w0, w1: w1, diff: diff, auto: !!ui.result.auto, fresh: true, pickAs: ui.result.pickAs || null,
      row: row, nrow: nrow, metric: ev.metric,
      my: sc.my + (bat ? r.runs : 0), op: sc.op + (bat ? 0 : r.runs) });
  }
  function nextScene() {
    clearTimeout(timer); timer = null;
    if (result && result.outs < 3) { sc = Object.assign({}, sc, { outs: result.outs, bases: result.bases, diff: result.diff, my: result.my, op: result.op }); begin(); }
    else { S.seed = (S.seed + 1) >>> 0; S.presetIdx = -1; newScene(true); }
  }

  // ---------- 舞台 ----------
  const hand = (h, bat) => (h === 'L' ? '左' : '右') + (bat ? '打ち' : '投げ');
  const rk = (label, v, txt) => '<span>' + label + '<b class="rk' + A.rankOf(v) + '">' + (txt || A.rankOf(v)) + '</b></span>';
  const batRanks = (b) => '<div class="ranks">' + rk('ミート', b.contact) + rk('パワー', b.power) + rk('走力', b.speed) + '</div>';
  const pitRanks = (p) => '<div class="ranks">' + rk('球速', p.velocity) + rk('制球', p.control) + rk('変化球', p.breaking) + '</div>';
  function stageHtml() {
    const bat = S.mode === 'bat';
    const s = result ? { outs: Math.min(2, result.outs), bases: result.outs >= 3 ? [null, null, null] : result.bases, my: result.my, op: result.op } : { outs: sc.outs, bases: sc.bases, my: sc.my, op: sc.op };
    const b = s.bases;
    const lab = A.strengthLabel(sc.winP);
    const wp = result ? result.w1 : A.gameWinProb(sc);
    const st = '<div class="pane st"><span class="inn">' + sc.inning + '回' + (sc.half === 'bottom' ? '裏' : '表') + '</span>'
      + '<div class="dia"><i class="b2' + (b[1] != null ? ' on' : '') + '"></i><i class="b3' + (b[2] != null ? ' on' : '') + '"></i><i class="b1' + (b[0] != null ? ' on' : '') + '"></i></div>'
      + '<div class="lamps">アウト<span class="' + (s.outs >= 1 ? 'on' : '') + '"></span><span class="' + (s.outs >= 2 ? 'on' : '') + '"></span>' + (result && result.outs >= 3 ? ' <b style="color:#b03a2e">チェンジ</b>' : '') + '</div>'
      + '<div class="score">自校 <b>' + s.my + '</b> − <b>' + s.op + '</b> 相手</div></div>';
    // 戦力(試合の前の強さの差)と、いまの勝率を、別のラベルで
    const band = '<div class="pane band">戦力:<span class="str ' + (lab === '格上' ? 'up' : lab === '格下' ? 'dn' : '') + '">相手は' + lab + '</span> ・ いまの勝率:<b>' + pc(wp) + '</b></div>';
    const oppAb = bat ? sc.pitcher : sc.batter;
    const opp = '<div class="pane opp"><div class="who">' + (bat ? '相手の投手' : '相手の打者') + ' <b>' + esc(nameOf(1)) + '</b>(' + hand(bat ? sc.throws : sc.bats, !bat) + ')</div>'
      + (bat ? pitRanks(oppAb) : batRanks(oppAb)) + '<div class="tags">' + A.tagsOf(bat ? 'pitcher' : 'batter', oppAb).map((t) => '<span class="tag">' + esc(t) + '</span>').join('') + '</div></div>';
    const me = '<div class="pane me"><div class="who">' + (bat ? '自分(打者)' : '自分(投手)') + ' <b>' + esc(nameOf(2)) + '</b>(' + hand(bat ? sc.bats : sc.throws, bat) + ')</div>' + (bat ? batRanks(sc.batter) : pitRanks(sc.pitcher)) + '</div>';
    const art = '<div class="art">' + ART.draw({ mode: S.mode, bats: sc.bats, throws: sc.throws, color: INK, bg: STAGE }) + '</div>';
    const warn = !inRange(sc) ? '<div class="pane warn">勝負にならない試合(結果だけ表示)</div>' : '';
    const rot = window.matchMedia && window.matchMedia('(orientation: portrait)').matches ? '<div class="rot">横向きのほうが、遊びやすい</div>' : '';   // 縦持ちのときだけ(上の中央)
    return '<div class="stage" id="stage">' + art + st + band + opp + me + warn + rot + resultHtml() + '</div>';
  }
  function resultHtml() {
    if (!result) return '';
    const r = result;
    const good = S.mode === 'bat' ? r.delta >= 0 : r.delta <= 0;
    const html = '<div class="pane result' + (r.fresh ? ' pop' : '') + '" id="res"><div class="note">' + (r.auto ? '勝負にならない試合:指示は「通常」' : (r.pickAs ? esc(C.ui.two[r.pickAs]) + ':' : '') + esc(r.orderLabel)) + '</div>'
      + '<div class="r1 ' + (good ? 'good' : 'bad') + '">' + esc(r.label) + '</div>'
      + '<div>' + (r.runs ? r.runs + '点' + (S.mode === 'bat' ? '入った' : '取られた') + '。' : '') + (r.outs >= 3 ? 'チェンジ' : r.outs + 'アウト') + '</div>'
      + '<div class="r3">試合の勝率:' + pc(r.w0) + ' → <span class="' + (r.w1 >= r.w0 ? 'good' : 'bad') + '">' + pc(r.w1) + '</span></div>' + evalLine(r) + '</div>';
    r.fresh = false;
    return html;
  }
  // 評価の中身(結果と一緒に、小さく):評価の数字、見込み、通常との差
  function evalLine(r) {
    if (!r.row) return '';
    const x = r.row, n = r.nrow, bat = S.mode === 'bat';
    const what = r.metric === 'p1' ? (bat ? '1点以上取る確率' : '1点以上取られる確率') : (bat ? '得点期待値' : '失点の期待値');
    const v = (row) => (r.metric === 'p1' ? pc(row.p1) : row.ev.toFixed(2));
    const d = r.metric === 'p1' ? (x.p1 - n.p1) * 100 : x.ev - n.ev;
    const ds = x.order === 'normal' ? '' : '(通常 ' + v(n) + '、差 ' + (d >= 0 ? '+' : '−') + (r.metric === 'p1' ? Math.abs(Math.round(d)) + 'pt' : Math.abs(d).toFixed(2)) + ')';
    return '<div class="ev">' + esc(C.ui.ratingLabel) + ' <b>' + x.rating + '</b> ・成功 ' + pc(x.good) + ' ・' + what + ' ' + v(x) + ds + '</div>';
  }
  // ---------- 下:カード(押すと、すぐ結果) ----------
  function cardHtml(c) {
    const sel = result && result.order === c.order;
    return '<button class="cd' + (c.as ? ' two' : '') + (sel ? ' sel' : '') + (DEV && lastEval && c.order === lastEval.best ? ' best' : '') + '" data-order="' + c.order + '"' + (c.as ? ' data-as="' + c.as + '"' : '') + (result ? ' disabled' : '') + '>'
      + '<span class="nm">' + esc(c.name) + '</span>' + (c.sub ? '<span class="od">' + esc(c.sub) + '</span>' : '')
      + '<span class="ft">' + esc(c.feature) + '</span>'
      + '<span class="nums"><span class="pr">成功<b>' + pc(c.good) + '</b></span>' + (c.rating != null ? '<span class="rt">' + esc(C.ui.ratingLabel) + '<b class="r' + c.rating + 'c">' + c.rating + '</b></span>' : '') + '</span></button>';
  }
  const cardsHtml = () => A.cardsOf(lastEval, S.card).map(cardHtml).join('');
  function barHtml() {
    const gear = '<button class="gear" id="gear" aria-label="設定">⚙</button>';
    if (result) {
      // 結果のあと:選んだ指示の中身(四球や長打の重さなど。T1c の説明文)と、通常との差。カードは出さない(押すと次へ)
      const x = result.row;
      const dd = x && x.dGood != null && x.order !== 'normal' ? '通常との差:成功 ' + sg(x.dGood) + 'pt' : '';
      return '<div class="bar"><div class="msgbox">' + (result.auto ? '勝負にならない試合。結果だけを表示します。' : esc(C.orderText[S.mode][result.order] || '')) + '<span class="sm">' + esc(dd) + (dd ? '・' : '') + (result.outs >= 3 ? 'チェンジ。' : '') + '画面を押すと、すぐ次へ</span></div><div class="side">' + gear + '</div></div>';
    }
    lastEval = A.evaluate(sc);
    return '<div class="bar"><div class="cards">' + cardsHtml() + '</div><div class="side"><button class="plain" id="plain">結果だけ見る</button>' + gear + '</div></div>';
  }
  // ---------- 設定(歯車) ----------
  function sheetHtml() {
    if (!S.sheet) return '';
    const chip = (key, val, label, cur) => '<button class="chip' + (cur === val ? ' on' : '') + '" data-set="' + key + '" data-val="' + val + '">' + label + '</button>';
    const scenes = A.SCENES.map((s, i) => ({ s: s, i: i })).filter((x) => (x.s.side === 'pitch') === (S.mode === 'pitch'));
    const opts = '<option value="-1"' + (S.presetIdx < 0 ? ' selected' : '') + '>(シードで作る)</option>' + scenes.map((x) => '<option value="' + x.i + '"' + (S.presetIdx === x.i ? ' selected' : '') + '>' + esc(x.s.name) + '</option>').join('');
    const list = A.SCENES.concat(Array.from({ length: 20 }, (_, i) => A.randomScene(500 + i)));
    const yn = (v) => (v ? '◯' : '−');
    const key = '<table><tr><th>場面</th><th>攻守</th><th>回</th><th>状況</th><th>事前</th><th>新入部員</th><th>監督</th></tr>' + list.map((s) => '<tr><td>' + esc(s.name) + (s.side === 'bat' ? (s.hero ? ' 主' : '') + (s.focus ? ' 注' : '') : '') + '</td><td>' + (s.side === 'pitch' ? '守' : '攻') + '</td><td>' + s.inning + '</td><td>' + s.outs + '死 ' + (s.bases.map((x, i) => (x == null ? '' : i + 1)).join('') || '無走者') + ' ' + (s.diff > 0 ? '+' : '') + s.diff + '</td><td>' + pc(s.winP) + '</td><td>' + yn(A.isKeyScene(s, 'success')) + '</td><td>' + yn(A.isKeyScene(s, 'manager')) + '</td></tr>').join('') + '</table>';
    const b = sc.batter, p = sc.pitcher;
    const nums = '<table><tr><th></th><th>ミート</th><th>パワー</th><th>走力</th><th>球速</th><th>制球</th><th>変化球</th><th>クイック</th><th>守備</th><th>肩</th><th>事前勝率</th></tr><tr><td>今の場面</td><td>' + b.contact + '</td><td>' + b.power + '</td><td>' + b.speed + '</td><td>' + A.kmh(p.velocity) + 'km/h(' + p.velocity + ')</td><td>' + p.control + '</td><td>' + A.breakTotal(p.breaking) + '(' + p.breaking + ')</td><td>' + p.quick + '</td><td>' + sc.defense + '</td><td>' + sc.arm + '</td><td>' + pc(sc.winP) + '</td></tr></table>';
    let dev = '';
    if (DEV) {
      const pats = [];
      for (const mode of ['bat', 'pitch']) for (const bt of ['R', 'L']) for (const th of ['R', 'L']) pats.push('<div>' + (mode === 'bat' ? '打者' : '投手') + 'のモード・' + (bt === 'R' ? '右打席' : '左打席') + '・' + (th === 'R' ? '右投げ' : '左投げ') + ART.draw({ mode: mode, bats: bt, throws: th, color: INK, bg: STAGE }) + '</div>');
      dev = '<h2>線画の全パターン(8通り)</h2><div class="pats">' + pats.join('') + '</div>'
        + '<h2>dev</h2><div class="dev">最善 ' + (lastEval ? lastEval.best + '(' + lastEval.metric + ')' : '-') + '<br>' + (lastEval ? lastEval.rows.map((r) => r.order + ': ' + (r.probs ? A.OUTCOMES.map((k) => k + ' ' + (r.probs[k] * 100).toFixed(1) + '%').join(' ') : '成功率 ' + (r.success != null ? pc(r.success) : '-')) + ' / 期待 ' + r.ev.toFixed(3) + ' / 1点以上 ' + pc(r.p1) + ' / 評価 ' + r.rating + '(差 ' + r.dm.toFixed(3) + ')/ ' + esc(r.feature.text)).join('<br>') : '') + '<br><br>設定(仮の値):' + esc(JSON.stringify(C)) + '</div>';
    }
    return '<div class="sheet" id="sheetbg"><div class="box"><div class="row" style="justify-content:space-between"><b style="font-size:16px">設定(調整用)</b><button class="chip" id="close">閉じる</button></div>'
      + '<h2>モード</h2><div class="row">' + chip('mode', 'bat', '野手(自分の打席)', S.mode) + chip('mode', 'pitch', '投手(ピンチ)', S.mode) + '</div>'
      + '<h2>カードの表示</h2><div class="row">' + chip('card', 'rating', '成功確率と評価', S.card) + chip('card', 'prob-only', '成功確率だけ', S.card) + chip('card', 'two-choice', '2択(' + esc(C.ui.two.attack) + 'と' + esc(C.ui.two.safe) + ')', S.card) + '</div>'
      + '<h2>場面</h2><div class="row"><select id="preset">' + opts + '</select></div>'
      + '<div class="row"><span>シード</span><input type="number" id="seed" value="' + S.seed + '" style="width:8em"><button class="chip" id="useSeed">この場面</button></div>'
      + '<h2>打者の能力</h2><div class="row">' + chip('bat', 'strong', '強い', S.bat) + chip('bat', 'normal', '普通', S.bat) + chip('bat', 'weak', '弱い', S.bat) + '</div>'
      + '<h2>投手の能力</h2><div class="row">' + chip('pit', 'strong', '強い', S.pit) + chip('pit', 'normal', '普通', S.pit) + chip('pit', 'weak', '弱い', S.pit) + '</div>'
      + '<h2>左右(確認用。表示だけで、結果には効かない)</h2><div class="row">打席 ' + chip('bats', 'R', '右', sc.bats) + chip('bats', 'L', '左', sc.bats) + ' 投げ ' + chip('throws', 'R', '右', sc.throws) + chip('throws', 'L', '左', sc.throws) + '</div>'
      + '<h2>介入の範囲(事前勝率)</h2><div class="row">' + chip('key', 'success', '新入部員', S.key) + chip('key', 'manager', '監督', S.key) + '<span style="font-size:12px">' + pc(C.keyScene[S.key].winRange[0]) + '〜' + pc(C.keyScene[S.key].winRange[1]) + ' の外は「勝負にならない試合」</span></div>'
      + '<h2>能力の数値</h2>' + nums
      + '<h2>介入場面の判定(確認用)</h2>' + key + '<div style="font-size:11px;color:#555">主=主人公の打席、注=注目選手の打席。事前勝率が範囲の外の場面は、介入しない。</div>' + dev + '</div></div>';
  }
  function render() {
    document.getElementById('app').innerHTML = stageHtml() + barHtml();
    document.getElementById('sheet').innerHTML = sheetHtml();
    // 結果は、resultMs のあとに自動で次の場面へ(設定を開いている間は止める)
    if (result && !S.sheet) { if (!timer) { shownAt = Date.now(); timer = setTimeout(() => { timer = null; nextScene(); render(); }, C.ui.resultMs); } }
    else { clearTimeout(timer); timer = null; }
  }
  document.addEventListener('click', (e) => {
    const t = e.target;
    if (S.sheet && t.id === 'sheetbg') { S.sheet = false; render(); return; }
    const b = t.closest('button');
    if (b && b.id === 'gear') { S.sheet = true; render(); return; }
    // 結果の表示中:画面のどこを押しても、すぐ次へ(押した直後の誤タップは無視)
    if (result && !S.sheet) { if (Date.now() - shownAt >= C.ui.tapGuardMs) { nextScene(); render(); } return; }
    if (!b) return;
    const d = b.dataset;
    if (b.id === 'close') { S.sheet = false; render(); return; }
    if (d.set === 'mode') { S.mode = d.val; S.presetIdx = -1; newScene(true); render(); return; }
    if (d.set === 'bat') { S.bat = d.val; sc.batter = Object.assign({}, A.PRESETS.batter[S.bat]); render(); return; }
    if (d.set === 'pit') { S.pit = d.val; sc.pitcher = Object.assign({}, A.PRESETS.pitcher[S.pit]); render(); return; }
    if (d.set === 'bats') { S.bats = d.val; sc.bats = d.val; render(); return; }
    if (d.set === 'throws') { S.throws = d.val; sc.throws = d.val; render(); return; }
    if (d.set === 'key') { S.key = d.val; render(); return; }
    if (d.set === 'card') { S.card = d.val; render(); return; }
    if (b.id === 'useSeed') { const v = Number(document.getElementById('seed').value); S.seed = (Number.isFinite(v) ? Math.floor(v) : 1) >>> 0; S.presetIdx = -1; newScene(true); render(); return; }
    // カードを押すと、すぐ結果(「選択」と「決定」の2段階にしない)
    if (d.order) { pick(d.order, d.as); render(); return; }
    if (b.id === 'plain') { pick('normal'); render(); return; }
  });
  document.addEventListener('change', (e) => { if (e.target.id === 'preset') { S.presetIdx = Number(e.target.value); newScene(S.presetIdx < 0); render(); } });
  window.addEventListener('resize', () => { if (!S.sheet) render(); });
  // 最初の場面:介入できる(勝負になる)場面から始める
  for (let i = 0; i < 50 && !inRange(A.randomScene(S.seed)); i++) S.seed++;
  newScene(true);
  render();
})();
</script>
</body>
</html>
