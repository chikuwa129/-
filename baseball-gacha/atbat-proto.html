<head>
<meta charset="utf-8">

<title>打席の試作</title>
<style>
  /* 色はすべて明示する(テーマや埋め込みの環境に依存しない) */
  :root { color-scheme: light; --bg: #0f2a1a; --stage: #e9e4d6; --card: #fffdf8; --ink: #1d1d1d; --sub: #5f5f5f; --line: #cfc6b4; --accent: #1f5f8b; --win: #1d7a3a; --lose: #b03a2e; --gold: #e0a800; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { background: var(--bg); color: var(--ink); font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; font-size: 14px; line-height: 1.3; }
  button { font: inherit; color: var(--ink); background: #fff; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; }
  button:disabled { color: #8a8a8a; background: #eee; }
  select, input { font: inherit; color: var(--ink); background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 6px; min-height: 44px; }
  .app { height: 100vh; height: 100dvh; display: grid; grid-template-rows: 1fr auto; gap: 4px; padding: 4px; padding-left: max(4px, env(safe-area-inset-left)); padding-right: max(4px, env(safe-area-inset-right)); }
  /* 舞台(中央の線画と、四隅の情報) */
  .stage { position: relative; background: var(--stage); border-radius: 10px; overflow: hidden; min-height: 0; }
  .art { position: absolute; top: 30px; bottom: 2px; left: 17%; right: 17%; display: flex; align-items: center; justify-content: center; }
  @media (orientation: portrait) { .art { top: 118px; bottom: 64px; left: 2px; right: 2px; } }
  .art svg { width: 100%; height: 100%; }
  .pane { position: absolute; background: rgba(255,253,248,.94); border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; color: var(--ink); }
  .st { left: 4px; top: 4px; display: grid; grid-template-columns: auto auto; gap: 0 8px; align-items: center; }
  .st .inn { font-size: 18px; font-weight: 900; color: #111; }
  .st .score { font-size: 13px; color: #111; grid-column: 1 / -1; white-space: nowrap; }
  .st .score b { font-size: 18px; }
  .dia { position: relative; width: 46px; height: 38px; }
  .dia i { position: absolute; width: 14px; height: 14px; border: 2px solid #777; background: #fff; transform: rotate(45deg); }
  .dia i.on { background: var(--gold); border-color: #8a6400; }
  .dia .b2 { left: 16px; top: 2px; } .dia .b1 { left: 29px; top: 15px; } .dia .b3 { left: 3px; top: 15px; }
  .lamps { display: flex; align-items: center; gap: 3px; font-size: 11px; color: var(--sub); grid-column: 1 / -1; }
  .lamps span { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--lose); background: #fff; }
  .lamps span.on { background: var(--lose); }
  .band { left: 50%; top: 4px; transform: translateX(-50%); font-size: 12px; white-space: nowrap; color: #111; }
  .band b { font-size: 15px; }
  .str { display: inline-block; padding: 0 6px; border-radius: 9px; font-size: 11px; font-weight: bold; color: #fff; background: #555; }
  .str.up { background: var(--lose); } .str.dn { background: var(--win); }
  .opp { right: 4px; top: 4px; max-width: 46%; }
  .me { right: 4px; bottom: 4px; max-width: 50%; }
  .who { font-size: 11px; color: var(--sub); } .who b { font-size: 14px; color: #111; }
  .ranks { display: flex; gap: 6px; margin-top: 1px; }
  .ranks span { text-align: center; font-size: 10px; color: var(--sub); }
  .ranks b { display: block; font-size: 20px; line-height: 1.05; color: #111; }
  .me .ranks b { font-size: 26px; }
  .rkS, .rkA { color: #c0392b !important; } .rkB, .rkC { color: #d35400 !important; } .rkF, .rkG { color: #888 !important; }
  .tags { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 2px; }
  .tag { font-size: 11px; padding: 0 6px; border-radius: 9px; border: 1px solid #8a6400; color: #6b4e00; background: #fff6dc; white-space: nowrap; }
  .warn { left: 4px; bottom: 4px; font-size: 12px; font-weight: bold; color: var(--lose); }
  .rot { position: absolute; left: 50%; top: 100px; transform: translateX(-50%); white-space: nowrap; font-size: 11px; color: var(--sub); background: rgba(255,253,248,.9); border-radius: 6px; padding: 0 6px; }
  /* 結果 */
  .result { left: 50%; top: 50%; transform: translate(-50%, -50%); min-width: 56%; text-align: center; box-shadow: 0 4px 16px rgba(0,0,0,.35); padding: 6px 12px; z-index: 3; }
  .result .r1 { font-size: 26px; font-weight: 900; }
  .result .r3 { font-size: 15px; font-weight: bold; color: #111; }
  .result.pop { animation: pop .45s ease-out both; }
  @keyframes pop { from { opacity: 0; transform: translate(-50%, -50%) scale(.85); } to { opacity: 1; transform: translate(-50%, -50%) scale(1); } }
  @media (prefers-reduced-motion: reduce) { .result.pop { animation: none; } }
  .good { color: var(--win); } .bad { color: var(--lose); }
  .note { font-size: 11px; color: var(--sub); }
  /* 下:指示のカード(横に1行。押すと、すぐ結果)と、右端の小さなボタン */
  .bar { background: var(--card); border-radius: 10px; padding: 6px; display: flex; gap: 8px; align-items: stretch; }
  .cards { flex: 1 1 auto; min-width: 0; display: flex; gap: 8px; }
  .cd { flex: 1 1 0; min-width: 0; min-height: 84px; padding: 3px 3px; border: 2px solid var(--accent); background: #fff; color: #111; text-align: center; display: flex; flex-direction: column; justify-content: space-between; gap: 1px; }
  .cd .nm { display: block; font-size: 14px; font-weight: bold; color: var(--accent); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cd .od { display: block; font-size: 10px; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cd .ft { display: block; font-size: 10px; line-height: 1.2; color: #333; min-height: 2.4em; overflow: hidden; }
  .cd .nums { display: flex; justify-content: center; align-items: flex-end; gap: 8px; }
  .cd .pr, .cd .rt { display: flex; flex-direction: column; align-items: center; font-size: 9px; color: var(--sub); line-height: 1; }
  .cd .pr b { font-size: 22px; line-height: 1.05; color: #111; }
  .cd .rt b { font-size: 20px; line-height: 1.1; min-width: 1.4em; border-radius: 6px; border: 2px solid #777; color: #111; background: #f2f2f2; }
  .r1c, .r2c, .r3c { color: #8c2a20 !important; border-color: #b03a2e !important; background: #fbe9e6 !important; }
  .r5c, .r6c, .r7c { color: #135c2b !important; border-color: #1d7a3a !important; background: #e5f4e9 !important; }
  .r7c, .r1c { border-width: 3px !important; }
  .cd.two .nm { font-size: 16px; }
  .cd.sel { border-width: 4px; border-color: #0d3d5f; background: #e8f1f8; }
  .cd:disabled { opacity: .55; color: #111; background: #fff; } .cd.sel:disabled { opacity: 1; background: #e8f1f8; }
  .cd.best { box-shadow: 0 0 0 3px #f4c542; }
  .side { display: flex; flex-direction: column; gap: 6px; flex: 0 0 auto; }
  .side button { min-height: 44px; min-width: 44px; padding: 0 6px; }
  .plain { font-size: 11px; color: #333; max-width: 5.5em; line-height: 1.1; }
  .msgbox { flex: 1 1 auto; min-width: 0; min-height: 84px; font-size: 12px; color: #111; display: flex; flex-direction: column; justify-content: center; padding: 0 6px; }
  .msgbox .sm { font-size: 10px; color: var(--sub); }
  .gear { font-size: 18px; }
  /* 試合のモード(T1e):スコアボード、ログ、開始と終了 */
  .app.game { grid-template-rows: auto 1fr auto; }
  .sb { background: var(--card); border-radius: 10px; padding: 2px 4px; overflow: hidden; }
  .sb table { width: 100%; table-layout: fixed; border-collapse: collapse; font-size: 11px; color: #111; }
  .sb th { text-align: center; color: var(--sub); font-weight: normal; padding: 0; border: none; }
  .sb tr th:first-child { width: 3em; text-align: left; color: #111; }
  .sb td.c, .sb td.t { text-align: center; font-size: 18px; font-weight: bold; line-height: 1.15; border: 1px solid var(--line); padding: 0; color: #111; }
  .sb td.t { background: #f2efe6; } .sb td.h { font-size: 15px; color: #444; }
  .sb td.cur { outline: 3px solid var(--accent); outline-offset: -3px; }
  .sb td.sc { background: #fff1c9; text-decoration: underline; }
  .sb td.blink { animation: blink .8s steps(2, start) infinite; }
  .sb td.nw { animation: cellin .35s ease-out both; }
  @keyframes cellin { from { opacity: 0; transform: scale(1.6); } to { opacity: 1; transform: scale(1); } }
  @keyframes blink { to { background: #ffd34d; } }
  @media (prefers-reduced-motion: reduce) { .sb td.blink { animation: none; background: #ffd34d; } .sb td.nw { animation: none; } }
  .log { flex: 1 1 auto; min-width: 0; height: 84px; overflow-y: auto; font-size: 12px; line-height: 1.35; color: #111; padding: 2px 6px; }
  .log .hl { font-weight: bold; } .log .key { color: #0d3d5f; } .log .end { color: var(--lose); }
  .log .sm { color: var(--sub); }
  .gov { left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 4; width: min(96%, 560px); max-height: 96%; overflow-y: auto; box-shadow: 0 4px 16px rgba(0,0,0,.35); padding: 6px 10px; }
  .gov .gt { font-size: 18px; } .gov .row { gap: 4px; } .gov .row { margin: 3px 0; font-size: 13px; } .gov .chip { min-height: 40px; padding: 4px 10px; }
  .gov .sm { font-size: 12px; color: var(--sub); }
  .ok2 { min-height: 44px; padding: 0 16px; font-size: 16px; font-weight: bold; color: #fff !important; background: var(--accent) !important; border-color: var(--accent) !important; }
  .kt { font-size: 11px; margin: 4px 0; }
  .result .ev { font-size: 11px; color: #333; margin-top: 2px; }
  .result .ev b { font-size: 14px; }
  @media (orientation: portrait) {
    .opp { max-width: 54%; }
    .band { left: 4px; top: auto; bottom: 4px; transform: none; }
    .warn { bottom: 34px; }
    .cards { gap: 5px; } .cd .nm { font-size: 12px; } .cd .pr b { font-size: 18px; } .cd .rt b { font-size: 16px; } .cd .nums { gap: 3px; }
  }
  /* 設定(歯車) */
  .sheet { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.5); display: flex; justify-content: center; padding: 8px; }
  .sheet .box { background: var(--card); color: #111; border-radius: 10px; width: 100%; max-width: 820px; overflow-y: auto; padding: 10px 12px; }
  .sheet h2 { font-size: 15px; margin: 8px 0 4px; color: #111; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 4px 0; }
  .chip { min-height: 44px; padding: 6px 12px; border-radius: 22px; background: #fff; color: #222; border: 1px solid #888; }
  .chip.on { background: #222; color: #fff; border-color: #222; }
  table { border-collapse: collapse; width: 100%; font-size: 12px; color: #111; } td, th { border-bottom: 1px dotted #bbb; padding: 2px 3px; text-align: left; }
  .dev { font-family: ui-monospace, monospace; font-size: 10px; word-break: break-all; background: #eef; color: #111; padding: 6px; border-radius: 6px; }
  .pats { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 6px; }
  .pats div { background: var(--stage); border-radius: 6px; padding: 4px; font-size: 11px; color: #111; }
  .pats svg { width: 100%; height: auto; display: block; }
</style>

<body>
<div class="app" id="app"></div>
<div id="sheet"></div>
<script>
// ---- atbat-engine.js(build-play.js で埋め込み)----
// =============================================================
// atbat-engine.js : 打席の試作(T1)の計算の部品
//   能力と場面と指示から、打席の結果の確率を出し、抽選し、走者と得点を更新する。
//   得点期待値(走者とアウトの24通り)、指示ごとの見込み、介入場面の判定(isKeyScene)も持つ。
//   画面・保存・本編の設定に依存しない(本編・監督モードへ、あとで使えるように)。数値はすべて仮。
// =============================================================
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.AtBat = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  // ---------- 設定(すべて仮の値) ----------
  const CONFIG = {
    // 打席の結果の基準の確率(高校野球の水準の仮置き。合計 1)
    base: { K: 0.17, BB: 0.09, GO: 0.31, FO: 0.21, S: 0.16, XB: 0.05, HR: 0.01 },
    // 能力の差の補正:w = 基準 × exp(clamp(Σ 係数 × z, ±expCap))、z = (能力 − 50) ÷ 50。最後に合計 1 に割り直す
    expCap: 1.6,
    coef: {
      K:  { stuff: 0.6, con: -0.7 },
      BB: { ctl: -0.7, con: 0.25 },
      GO: { brk: 0.25, def: 0.2, pow: -0.1 },
      FO: { def: 0.2 },
      S:  { con: 0.5, stuff: -0.3, def: -0.35, spd: 0.15 },
      XB: { pow: 0.6, stuff: -0.25, ctl: -0.25, def: -0.2, spd: 0.1 },
      HR: { pow: 1.0, stuff: -0.3, ctl: -0.35 },
    },
    // 指示の効き:結果ごとの log 倍率(m)と、能力による追加(z の係数)。方向は設計メモの 6 に従う。大きさは仮
    orders: {
      bat: {
        normal: {},
        // 長打狙い:パワーが高いほど長打が増える。ミートが低いほど空振りが増える
        power:  { K: { m: 0.25, con: -0.35 }, S: { m: -0.15 }, GO: { m: -0.15 }, FO: { m: 0.15 }, XB: { m: 0.15, pow: 0.35 }, HR: { m: 0.25, pow: 0.5 } },
        // 短打狙い:三振が減り、単打が増える(ミートが高いほど)。長打は減る(パワーが高いほど損)
        contact: { K: { m: -0.35 }, BB: { m: -0.1 }, GO: { m: 0.1 }, S: { m: 0.12, con: 0.2 }, XB: { m: -0.25 }, HR: { m: -0.6, pow: -0.3 } },
      },
      pitch: {
        normal: {},
        // 直球中心:球速が高いほど三振が増え、長打が減る。球速・制球が低いと打ち込まれる
        fast:   { K: { m: 0.05, vel: 0.5 }, GO: { m: -0.1 }, XB: { m: 0.1, vel: -0.3, ctl: -0.25 }, HR: { m: 0.15, vel: -0.4, ctl: -0.3 } },
        // 変化球中心:変化量が大きいほど三振・ゴロが増える。制球が低いと四球が増える
        breaking: { K: { brk: 0.4 }, GO: { m: 0.1, brk: 0.2 }, BB: { m: 0.15, ctl: -0.4 }, XB: { m: 0.05, brk: -0.2 } },
        // 外角中心:長打が減る(強打者ほど効く)。四球が増える(制球が低いほど)
        outside: { XB: { m: -0.15, pow: -0.2 }, HR: { m: -0.25, pow: -0.3 }, BB: { m: 0.15, ctl: -0.4 }, S: { m: 0.1 } },
        // 内角中心:ミートの低い打者を詰まらせる。制球が低いと、死球(四球)と長打の危険が増える
        inside: { K: { m: 0.05, con: -0.3 }, FO: { m: 0.1 }, BB: { m: 0.15, ctl: -0.35 }, XB: { m: 0.1, ctl: -0.35 }, HR: { m: 0.15, ctl: -0.5 }, S: { m: -0.1, con: -0.15 } },
      },
    },
    // 送りバント:成功率 = clamp(base + con × z(ミート) + spd × z(走力) − def × z(守備))。成功で走者が1つ進み、打者はアウト
    bunt: { base: 0.85, con: 0.1, spd: 0.06, def: 0.08, min: 0.4, max: 0.9, hitBase: 0.04, hitSpd: 0.06, hitMax: 0.15 },
    // スクイズ:成功率 = clamp(base + con × z(ミート) − def × z(守備))。成功で三塁走者が生還し、打者はアウト(他の走者は1つ進む)
    //   失敗:三塁走者が本塁でアウト。打者は一塁へ(野選)、他の走者は進まない
    squeeze: { base: 0.58, con: 0.25, def: 0.08, min: 0.3, max: 0.9 },
    // 盗塁(一塁走者だけ):成功率 = clamp(base + spd × z(走者の走力) − arm × z(肩) − quick × z(クイック))
    steal: { base: 0.57, spd: 0.3, arm: 0.15, quick: 0.12, min: 0.15, max: 0.9, ds3: 0.4 },   // ds3:三塁に走者がいるとき、盗塁失敗の間に三塁走者が生還する確率,
    // 走者の進塁(z は走者の走力、肩は守備側)
    run: {
      goAdv: 0.35,                                 // (三塁に走者がいるときは go3)
      go3: 0.6,                                    // ゴロのアウト(2アウト未満):三塁走者がいるとき、走者がそろって1つ進む(三塁走者は生還)確率
                                      // ゴロのアウト(2アウト未満):走者が、そろって1つ進む確率(内野ゴロの進塁打)
      s2home: { base: 0.7, spd: 0.3, arm: 0.2 },   // 単打:二塁走者が生還する確率(残りは三塁へ)
      s1third: { base: 0.25, spd: 0.3, arm: 0.2 }, // 単打:一塁走者が三塁まで進む確率(三塁が空いたとき。残りは二塁へ)
      x1home: { base: 0.45, spd: 0.3, arm: 0.2 },  // 長打:一塁走者が生還する確率(残りは三塁へ)
      triple: { base: 0.1, spd: 0.1 },             // 長打のうち、三塁打の割合(打者の走力)
      pMin: 0.05, pMax: 0.95,
    },
    // 得点期待値の基準の打者・投手・守備(能力はすべて中位)
    reBase: 50,
    // 終盤の接戦(inning 回以降、点差が diff 以内)は、最善の指示を「1点以上取る(取られる)確率」で選ぶ。それ以外は得点期待値
    lateClose: { inning: 7, diff: 2 },
    // 介入場面の判定(isKeyScene)のプリセット。winRange:試合の事前勝率がこの範囲の外なら、介入しない(勝負にならない試合)
    keyScene: {
      success: { bat: { who: 'all', minInning: 1, chance: false }, pitch: { pinch: true, maxDiff: 3, minInning: 1 }, winRange: [0.3, 0.8] },
      manager: { bat: { who: 'focus', minInning: 7, chance: true }, pitch: { pinch: true, maxDiff: 3, minInning: 7 }, winRange: [0.3, 0.8] },
    },
    // 成功と失敗の定義(打席の7つの結果を、どちらかに必ず入れる。補数で合計 1。バント・スクイズ・盗塁は、成功と失敗)
    //   T1d:投手の失敗に単打を入れた(T1b は、単打をどちらにも入れていなかった)
    goodBad: {
      bat: { good: ['BB', 'S', 'XB', 'HR'], bad: ['K', 'GO', 'FO'] },     // 打者:成功=出塁(四球・単打・長打・本塁打)、失敗=アウト
      pitch: { good: ['K', 'GO', 'FO'], bad: ['BB', 'S', 'XB', 'HR'] },   // 投手:成功=アウト(三振を含む)、失敗=出塁を許す
    },
    // 成功確率の上限と下限(100% の選択肢を作らない)。表示も内部も、成功確率を min〜max に収める(バント・スクイズ・盗塁も)
    cap: { min: 0.05, max: 0.9 },
    // 期待値の評価(1〜7):通常を base にし、通常との差を step ごとに1段階(ev:得点期待値の点、p1:1点以上の確率)。投手は、失点が小さいほど高い
    //   round:'round'(四捨五入)か 'trunc'(切り捨て。差が step に届くまで同じ段階)
    //   仕様の仮の値(ev 0.05・p1 0.02)では、4 が 7 割を超えたため、細かくした(T1d)
    rating: { base: 4, min: 1, max: 7, step: { ev: 0.02, p1: 0.008 }, round: 'round' },
    // カードの特徴の一言:通常との差が min(ポイント)以上、または相対で rel 以上(ただし floor ポイント以上)の結果を、増える・減るから各 maxEach 個まで(変化の相対の大きい順)
    //   rel を 0 にすると、仕様の仮の値(2ポイント以上だけ)になる

  // o:{ seed, mode:'bat'|'pitch', my, op(強さ), winP(省略で見積もる) }
  function newGame(o, cfg) {

  const capBack = (m) => P('cap', 'M' + m.h(-5.8, -28.6) + ' Q' + m.h(0, -30.4) + ' ' + m.h(5.8, -28.6) + ' Q' + m.h(0, -27.6) + ' ' + m.h(-5.8, -28.6) + ' Z')
    + P('cap', 'M' + m.h(-4.6, -28.2) + ' Q' + m.h(-4.7, -33.2) + ' ' + m.h(0, -33.2) + ' Q' + m.h(4.7, -33.2) + ' ' + m.h(4.6, -28.2) + ' Z M' + m.h(-1.6, -28.6) + ' Q' + m.h(0, -30) + ' ' + m.h(1.6, -28.6));
  // ヘルメット:つば(front:正面に見える / 後ろ姿は、山の両側にのぞく)、山、耳あて(side:-1 で画面の左、+1 で右)
  function helmet(m, front, side) {
    const q = -(side || -1);
    const brim = front ? 'M' + m.h(-5.8, -28.2) + ' Q' + m.h(0, -29.2) + ' ' + m.h(5.8, -28.2) + ' Q' + m.h(0, -25.8) + ' ' + m.h(-5.8, -28.2) + ' Z'
      : 'M' + m.h(-6.2, -28.3) + ' Q' + m.h(0, -30.2) + ' ' + m.h(6.2, -28.3) + ' Q' + m.h(0, -27.2) + ' ' + m.h(-6.2, -28.3) + ' Z';
    const dome = 'M' + m.h(-5, -27.4) + ' Q' + m.h(-5.2, -34) + ' ' + m.h(0, -34) + ' Q' + m.h(5.2, -34) + ' ' + m.h(5, -27.4) + (front ? ' Z' : ' L' + m.h(5, -26.4) + ' L' + m.h(-5, -26.4) + ' Z');
    const flap = 'M' + m.h(-5 * q, -27.6) + ' Q' + m.h(-6.9 * q, -27) + ' ' + m.h(-6.2 * q, -24.2) + ' Q' + m.h(-5.2 * q, -23.4) + ' ' + m.h(-4.1 * q, -24.6) + ' Z';
    return front ? P('helmet', dome) + P('helmet', brim) + P('helmet', flap) : P('helmet', brim) + P('helmet', dome) + P('helmet', flap);
  }

  // ---------- 骨格で描く人物(T1f:打者と、自分の投手) ----------
  //   座標は、幅100・高さ180の枠(x は右、y は下。足もとが y=180)。各部位を、太い線(丸い端)で描く:
  //   黒の線(幅 w+2t)を描き、その上に背景色の線(幅 w)を重ねて、輪郭にする。奥から手前の順に描く
  //   面の部位(胴の台形、ヘルメット、グラブ)は、黒の輪郭(幅 2t)で塗り、内側を背景色で塗り直す
  let COLOR = '#222', BG = '#fff', SW = 1.7;
  function skel(fx, fy, sf) {
    const X = (x) => f(fx + (x - SKEL_O[0]) * sf), Y = (y) => f(fy - (180 - y) * sf);
    const pts = (a) => a.map((q, i) => (i ? 'L' : 'M') + X(q[0]) + ' ' + Y(q[1])).join(' ');
    const sp = (el, d, w, stroke) => '<path data-el="' + el + '" d="' + d + '" fill="none" stroke="' + stroke + '" stroke-width="' + f(w) + '"/>';
    const seg = (el, a, w) => sp(el, pts(a), w * sf + 2 * SW, COLOR) + sp(el, pts(a), w * sf, BG);
    const area = (el, d) => '<path data-el="' + el + '" d="' + d + '" fill="' + BG + '" stroke="' + COLOR + '" stroke-width="' + f(2 * SW) + '"/><path data-el="' + el + '" d="' + d + '" fill="' + BG + '" stroke="none"/>';
    return {
      X: X, Y: Y, pts: pts, seg: seg, area: area,
      dot: (el, x, y, r) => seg(el, [[x, y], [x + 0.01, y]], 2 * r),
      line: (el, a) => sp(el, pts(a), SW, COLOR),
      // 細いほうから太いほうへの棒(バット):握り a(幅 w1)→ 先 b(幅 w2)。両端は丸い
      taper: (el, a, b, w1, w2) => {
        const dx = b[0] - a[0], dy = b[1] - a[1], L = Math.hypot(dx, dy), ux = -dy / L, uy = dx / L;
        const r1 = f(w1 / 2 * sf), r2 = f(w2 / 2 * sf), q = (x, y) => X(x) + ' ' + Y(y);
        const d = 'M' + q(a[0] + ux * w1 / 2, a[1] + uy * w1 / 2) + ' L' + q(b[0] + ux * w2 / 2, b[1] + uy * w2 / 2) + ' A' + r2 + ' ' + r2 + ' 0 0 0 ' + q(b[0] - ux * w2 / 2, b[1] - uy * w2 / 2)
          + ' L' + q(a[0] - ux * w1 / 2, a[1] - uy * w1 / 2) + ' A' + r1 + ' ' + r1 + ' 0 0 0 ' + q(a[0] + ux * w1 / 2, a[1] + uy * w1 / 2) + ' Z';
        return area(el, d);
      },
      ellipse: (el, cx, cy, rx, ry) => area(el, 'M' + X(cx - rx) + ' ' + Y(cy) + ' A' + f(rx * sf) + ' ' + f(ry * sf) + ' 0 1 1 ' + X(cx + rx) + ' ' + Y(cy) + ' A' + f(rx * sf) + ' ' + f(ry * sf) + ' 0 1 1 ' + X(cx - rx) + ' ' + Y(cy) + ' Z'),
    };
  }
  let SKEL_O = [45, 180];   // 枠の基準点(この点を、場面の (fx, fy) に置く)
  // 打者の骨格(右打席。右向き=胸がホームベースの方。左打席は鏡像)
  const BAT = {
    head: [46, 26], headR: 20, neck: [46, 48], torso: [[44, 62], [42, 112]], torsoW: 28,
    frontLeg: [[42, 112], [56, 142], [62, 170]], frontToe: [76, 176], backLeg: [[42, 112], [30, 142], [26, 170]], backToe: [40, 176], legW: 16,
    arm: [[44, 62], [54, 84], [34, 52]], armW: 12, hands: [34, 52], batTip: [4, 0], batW: [4, 10],
  };
  // 自分の投手の骨格(後ろ姿。右投げ=投げる腕は画面の右。左投げは鏡像)
  const PIT = {
    head: [50, 24], headR: 20, neck: [50, 46], torso: [[24, 60], [76, 60], [68, 112], [32, 112]],
    legL: [[40, 112], [38, 142], [36, 172]], legR: [[60, 112], [62, 142], [64, 172]], legW: 16,
    throwArm: [[76, 60], [90, 44], [84, 16]], gloveArm: [[24, 60], [12, 80], [22, 98]], armW: 12, ballR: 6, glove: [22, 98, 11, 13],
  };
  // テスト用(頭1つ分を 10 とした単位):胴の厚み(横向き)
  const POSE = { torso: [-BAT.torsoW / 8, BAT.torsoW / 8], frame: BAT };
  function skelBatter(fx, fy, sf) {
    SKEL_O = [45, 180];
    const k = skel(fx, fy, sf), B = BAT, X = k.X, Y = k.Y;
    const toe = (a, t) => k.seg('shoe', [a, t], 10);
    const [hx, hy] = B.head, r = B.headR;
    // ヘルメット:頭の上半分と後ろ(左)を覆う。耳当ては左。つばは右(前)に短く
    const helmet = 'M' + X(hx + r + 2) + ' ' + Y(hy + 2) + ' A' + f((r + 2) * sf) + ' ' + f((r + 2) * sf) + ' 0 0 0 ' + X(hx - r - 2) + ' ' + Y(hy + 2)
      + ' L' + X(hx - r - 1) + ' ' + Y(hy + 14) + ' Q' + X(hx - r + 4) + ' ' + Y(hy + 20) + ' ' + X(hx - r + 10) + ' ' + Y(hy + 15) + ' L' + X(hx - r + 11) + ' ' + Y(hy + 3) + ' Z';
    return k.seg('leg', B.backLeg, B.legW) + toe(B.backLeg[2], B.backToe)                           // 奥の足
      + k.seg('neck', [[B.neck[0], B.neck[1] - 8], [B.neck[0] - 1, B.neck[1] + 8]], 12)
      + k.seg('torso', B.torso, B.torsoW) + k.line('uniform', [[30, 104], [56, 104]])                // 胴(横向き)とベルト
      + k.seg('leg', B.frontLeg, B.legW) + toe(B.frontLeg[2], B.frontToe)                           // 手前の足
      + k.dot('head', hx, hy, r) + k.area('helmet', helmet) + k.seg('helmet', [[hx + r - 2, hy + 3], [hx + r + 6, hy + 4]], 5)
      + k.taper('bat', B.hands, B.batTip, B.batW[0], B.batW[1])                                     // バット(両手から後ろ上方へ)
      + k.seg('arm', B.arm, B.armW) + k.dot('hand', B.hands[0], B.hands[1], 7);                      // 手前の腕(肘は下)と両手
  }
  function skelPitcher(fx, fy, sf) {
    SKEL_O = [50, 180];
    const k = skel(fx, fy, sf), Q = PIT, X = k.X, Y = k.Y;
    const shoe = (a) => k.seg('shoe', [[a[0] - 7, a[1] + 2], [a[0] + 7, a[1] + 2]], 9);
    const torso = 'M' + Q.torso.map((q) => X(q[0]) + ' ' + Y(q[1])).join(' L') + ' Z';
    const [hx, hy] = Q.head, r = Q.headR;
    const cap = 'M' + X(hx - r - 1.5) + ' ' + Y(hy + 1) + ' A' + f((r + 1.5) * sf) + ' ' + f((r + 1.5) * sf) + ' 0 0 1 ' + X(hx + r + 1.5) + ' ' + Y(hy + 1) + ' Z';
    return k.seg('leg', Q.legL, Q.legW) + k.seg('leg', Q.legR, Q.legW) + shoe(Q.legL[2]) + shoe(Q.legR[2])
      + k.seg('neck', [[Q.neck[0], Q.neck[1] - 6], [Q.neck[0], Q.neck[1] + 8]], 14)
      + k.area('torso', torso) + k.line('uniform', [[33, 104], [67, 104]])                           // 背中とベルト
      + k.dot('head', hx, hy, r) + k.area('cap', cap)   // 後頭部と帽子(つばは見えない。顔は描かない)
      + k.seg('arm', Q.gloveArm, Q.armW) + k.ellipse('glove', Q.glove[0], Q.glove[1], Q.glove[2], Q.glove[3])
      + k.seg('arm', Q.throwArm, Q.armW) + k.dot('hand', Q.throwArm[2][0], Q.throwArm[2][1], 6.5) + k.dot('ball', Q.throwArm[2][0] + 1, Q.throwArm[2][1] - 7, Q.ballR);
  }

  // ---------- 打者のモード(打席から、投手を見る) ----------
  // 奥の投手(正面。基準:右投げ。投手は打者の方を向くので、投げる腕は画面の左に出る)
  function farPitcher() {
    const m = mapper(100, 54, 1.35, K);
    return body(m, false, 1)
      + P('arm', limb(m, 6.2, -19.8, 10, -15.6, 3.4)) + P('arm', limb(m, 10, -15.6, 8.2, -19.2, 3))      // グラブの腕(胸の前に構える)
      + glove(m.at(8, -20.2), 3.6 * m.s)
      + head(m) + cap(m)
      + P('arm', limb(m, -6.2, -19.8, -10.6, -23.4, 3.4)) + P('arm', limb(m, -10.6, -23.4, -9.8, -29.6, 3))   // 投げる腕(振りかぶる)
      + mitten(m.at(-9.8, -30.6), 1.9 * m.s) + ball(m.at(-9.6, -32.6), 1.1 * m.s);
  }
  // 手前の自分の打者(横向き・後ろ寄り。やや大きめ。基準:右打席=ホームベースの左)
  const NEAR_BATTER = { ox: 58, oy: 117, s: 0.55 };   // 枠の倍率(高さ 180 → 約 99)
  const nearBatter = () => skelBatter(NEAR_BATTER.ox, NEAR_BATTER.oy, NEAR_BATTER.s);
  function homePlate() { return P('plate', 'M86 104 L114 104 L114 110 L100 116 L86 110 Z'); }
  function mound() { return P('mound', 'M78 58 Q100 50 122 58 Z'); }

  // ---------- 投手のモード(マウンドの後ろから、自分の投手の背中ごしに、打者を見る) ----------
  // 奥の打者(横向き。顔をこちらへ。基準の位置はホームベースの左。右打者は反転して右に立つ)
  const FAR_BATTER = { ox: 80, oy: 57, s: 0.2 };
  const farBatter = () => skelBatter(FAR_BATTER.ox, FAR_BATTER.oy, FAR_BATTER.s);
  // 捕手(ホームベースの後ろに、しゃがむ):マスクとミット。ホームベースは手前
  function farCatcher() {
    const m = mapper(100, 51, 0.8, K);
    const legs = P('leg', limb(m, -3.2, -9.5, -8.4, -7.5, 4.6)) + P('leg', limb(m, -8.4, -7.5, -6.2, -1.4, 4.2))
      + P('leg', limb(m, 3.2, -9.5, 8.4, -7.5, 4.6)) + P('leg', limb(m, 8.4, -7.5, 6.2, -1.4, 4.2));
    const torso = P('torso', 'M' + m.p(-6.8, -17.5) + ' Q' + m.p(-7.8, -13) + ' ' + m.p(-5, -9) + ' L' + m.p(5, -9) + ' Q' + m.p(7.8, -13) + ' ' + m.p(6.8, -17.5) + ' Q' + m.p(0, -19.2) + ' ' + m.p(-6.8, -17.5) + ' Z');
    const hm = mapper(100, 51 + 6.5 * 0.8, 0.8, K);   // 頭は、しゃがんだぶん低い
    const mask = P('mask', 'M' + hm.h(-3.4, -27) + ' L' + hm.h(3.4, -27) + ' M' + hm.h(-3.6, -25) + ' L' + hm.h(3.6, -25) + ' M' + hm.h(0, -29.5) + ' L' + hm.h(0, -23.4));
    return legs + torso + head(hm) + mask + glove(m.at(1.5, -13), 3.8 * m.s).replace(/data-el="glove"/g, 'data-el="mitt"')
      + P('plate', 'M90 52 L110 52 L110 55 L100 58.5 L90 55 Z');
  }
  // 手前の自分の投手(引きの後ろ姿。全身。基準:右投げ=投げる腕は画面の右、グラブは左。左投げは、その場で反転)
  const NEAR_PITCHER = { ox: 100, oy: 117, s: 0.3 };
  function nearPitcher() {
    return P('mound', 'M' + f(NEAR_PITCHER.ox - 40) + ' 121 Q' + f(NEAR_PITCHER.ox) + ' 104 ' + f(NEAR_PITCHER.ox + 40) + ' 121 Z')
      + skelPitcher(NEAR_PITCHER.ox, NEAR_PITCHER.oy, NEAR_PITCHER.s);
  }

  let K = 1;
  // 打者の反転:打者のモードは左打席だけ。投手のモードは、右打者を画面の右に立てる(pitchRightyOn:'right')
  const batterFlip = (mode, bats, o) => (mode === 'bat' ? bats === 'L' : (bats === 'L') !== ((o.pitchRightyOn || DEF.pitchRightyOn) === 'right'));
  function draw(o) {
    o = o || {};
    const mode = o.mode === 'pitch' ? 'pitch' : 'bat';
    const bats = o.bats === 'L' ? 'L' : 'R', throws = o.throws === 'L' ? 'L' : 'R';
    const color = o.color || '#222', bg = o.bg || '#fff', sw = o.strokeWidth || DEF.strokeWidth;
    K = 3 / Math.max(2, Math.min(8, o.heads || DEF.heads));
    COLOR = color; BG = bg; SW = sw;   // 頭身:3 で頭の大きさがそのまま。大きいほど頭が小さい
    let body;
    if (mode === 'bat') body = mound() + group('pitcher', throws === 'L', farPitcher(), null, 'front') + homePlate() + group('batter', batterFlip(mode, bats, o), nearBatter(), null, 'side');
    else body = group('plate', false, farCatcher()) + group('batter', batterFlip(mode, bats, o), farBatter(), null, 'side') + group('pitcher', throws === 'L', nearPitcher(), NEAR_PITCHER.ox, 'back');
    const size = (o.width ? ' width="' + o.width + '"' : '') + (o.height ? ' height="' + o.height + '"' : '');
    return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + W + ' ' + H + '"' + size + ' preserveAspectRatio="xMidYMid meet" role="img" aria-label="' + (mode === 'bat' ? '打席から投手を見る' : 'マウンドの後ろから打者を見る') + '"'
      + ' data-mode="' + mode + '" data-bats="' + bats + '" data-throws="' + throws + '">'
      + '<g fill="' + bg + '" stroke="' + color + '" stroke-width="' + sw + '" stroke-linecap="round" stroke-linejoin="round">' + body + '</g></svg>';
  }
  // 打者の立ち方(テスト用。画面の座標):胴の中心、胸の向き(+1 右 / −1 左)、握り、バットの先、両足、ホームベースの中心
  function batterModel(o) {
    o = o || {};
    const mode = o.mode === 'pitch' ? 'pitch' : 'bat', flip = batterFlip(mode, o.bats === 'L' ? 'L' : 'R', o);
    const Bm = mode === 'bat' ? NEAR_BATTER : FAR_BATTER, B = BAT;
    const pt = (x, y) => { const X = Bm.ox + Bm.s * (x - 45); return [flip ? W - X : X, Bm.oy - Bm.s * (180 - y)]; };
    return { flip: flip, center: pt((B.torso[0][0] + B.torso[1][0]) / 2, 87), facing: flip ? -1 : 1, grip: pt(B.hands[0], B.hands[1]), batTip: pt(B.batTip[0], B.batTip[1]),
      backFoot: pt(B.backLeg[2][0], 180), frontFoot: pt(B.frontLeg[2][0], 180), headTop: pt(B.head[0], B.head[1] - B.headR), torsoDepth: B.torsoW * Bm.s, plateX: 100 };
  }
  return { draw: draw, batterModel: batterModel, VIEWBOX: [W, H], DEFAULTS: DEF, POSE: POSE };
});
</script>
<script>
(function () {
  'use strict';
  const A = window.AtBat, ART = window.AtBatArt, C = A.CONFIG;
  const DEV = /[?&]dev=1(&|$)/.test(location.search);
  const INK = '#1d1d1d', STAGE = '#e9e4d6';
  const esc = (t) => String(t == null ? '' : t).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const pc = (v) => Math.round(v * 100) + '%';
  const sg = (v) => (v >= 0 ? '+' : '−') + Math.abs(Math.round(v * 100));
  const S = { mode: 'bat', seed: 1, presetIdx: -1, bat: 'normal', pit: 'normal', key: 'success', sheet: false, bats: null, throws: null, card: C.ui.cardMode };
  let rng = new A.Rng(1), sc = null, ui = { sel: null, result: null }, result = null, lastEval = null, timer = null, shownAt = 0;
  const NAMES = ['青木', '石川', '上田', '大野', '加藤', '北村', '小林', '佐々木', '高田', '中島', '西村', '原田', '松本', '森', '山口', '渡辺'];
  const nameOf = (k) => NAMES[((S.seed * 7 + k * 13) >>> 0) % NAMES.length];
  // 画面の向き(打者か投手か):試合のモードでは、試合の設定(野手 / 投手)
  const VM = () => (S.mode === 'game' ? GM.cfg.mode : S.mode);

  function applyPresets(s) { s.batter = Object.assign({}, A.PRESETS.batter[S.bat]); s.pitcher = Object.assign({}, A.PRESETS.pitcher[S.pit]); return s; }
  const inRange = (s) => A.inWinRange(s, C.keyScene[S.key]);
  function newScene(fromSeed) {
    sc = fromSeed || S.presetIdx < 0 ? A.randomScene(S.seed) : Object.assign(A.makeScene(Object.assign({}, A.SCENES[S.presetIdx])), A.handsOf(S.seed));
    sc.side = S.mode;
    sc.half = S.mode === 'pitch' ? 'bottom' : 'top';   // 自校は先攻(攻撃は表、守備は裏)
    applyPresets(sc);
    if (S.bats) sc.bats = S.bats;
    if (S.throws) sc.throws = S.throws;
    // スコア(表示用):点差と同じになるように。自校と相手
    const low = 1 + (S.seed % 3);
    sc.my = low + Math.max(0, sc.diff); sc.op = low + Math.max(0, -sc.diff);
    rng = new A.Rng((S.seed * 2654435761) >>> 0);
    begin();
  }
  // 場面の始まり:勝負にならない試合は、操作なしで「通常」の結果だけ
  function begin() { ui = A.uiStep(null, 'next'); result = null; if (!inRange(sc)) { ui = A.uiStep(ui, 'auto'); resolve(); } }
  // カードを押すと、その指示で、すぐ結果(1タップで確定)
  function pick(order, pickAs) { ui = A.uiStep(ui, 'pick', order); if (ui.result) { ui.result.pickAs = pickAs || null; resolve(); } }
  function resolve() {
    const order = ui.result.order;
    const ev = A.evaluate(sc), row = ev.rows.find((x) => x.order === order), nrow = ev.rows.find((x) => x.order === 'normal');
    const w0 = A.gameWinProb(sc);
    const r = A.resolve(sc, order, rng);
    const bat = S.mode === 'bat';
    const diff = sc.diff + (bat ? r.runs : -r.runs);
    const w1 = A.gameWinProb(sc, { outs: r.outs, bases: r.bases, diff: diff });
    result = Object.assign(r, { order: order, orderLabel: A.ORDER_LABEL[S.mode][order], w0: w0, w1: w1, diff: diff, auto: !!ui.result.auto, fresh: true, pickAs: ui.result.pickAs || null,
      row: row, nrow: nrow, metric: ev.metric,
      my: sc.my + (bat ? r.runs : 0), op: sc.op + (bat ? 0 : r.runs) });
  }
  function nextScene() {
    clearTimeout(timer); timer = null;
    if (result && result.outs < 3) { sc = Object.assign({}, sc, { outs: result.outs, bases: result.bases, diff: result.diff, my: result.my, op: result.op }); begin(); }
    else { S.seed = (S.seed + 1) >>> 0; S.presetIdx = -1; newScene(true); }
  }

  // ---------- 舞台 ----------
  const hand = (h, bat) => (h === 'L' ? '左' : '右') + (bat ? '打ち' : '投げ');
  const rk = (label, v, txt) => '<span>' + label + '<b class="rk' + A.rankOf(v) + '">' + (txt || A.rankOf(v)) + '</b></span>';

      return '<div class="pane gov"><b class="gt ' + (G.result === 'win' ? 'good' : G.result === 'lose' ? 'bad' : '') + '">' + res + ' ' + G.score.my + '-' + G.score.op + '</b>'
        + '<div class="sm">事前勝率 ' + pc(G.winP) + '(戦力:相手は' + A.strengthLabel(G.winP) + ')</div>'
        + (rows ? '<table class="kt"><tr><th>回</th><th>状況</th><th>指示</th><th>評価</th><th>結果</th><th>勝率</th></tr>' + rows + '</table>' : '<div class="sm">操作した場面は、ありませんでした。</div>')
        + '<div class="row"><button class="ok2" id="gagain">同じシードで、もう一度</button><button class="chip" id="gnew">新しいシード</button><button class="chip" id="gback">設定を変える</button></div></div>';
    }
    return '';
  }
  function gameBarHtml() {
    const gear = '<button class="gear" id="gear" aria-label="設定">⚙</button>';
    if (GM.phase === 'key') {
      lastEval = GM.G.pending.ev;
      return '<div class="bar"><div class="cards">' + cardsHtml() + '</div><div class="side"><button class="plain" id="gplain">結果だけ見る</button>' + gear + '</div></div>';
    }
    if (GM.phase === 'res') return barHtml();
    return '<div class="bar">' + logHtml() + '<div class="side">' + (GM.phase === 'run' ? '<button class="plain" id="gplain">結果だけ見る</button>' : '') + gear + '</div></div>';
  }
  function gameRender() {
    const app = document.getElementById('app');
    app.className = 'app game';
    if (!GM.G && GM.phase !== 'start') GM.phase = 'start';
    if (GM.phase === 'start') { const P = gamePreview(); sc = A.curScene(P); sc.my = 0; sc.op = 0; }
    app.innerHTML = scoreboardHtml() + stageHtml() + gameBarHtml();
    const lg = document.getElementById('log'); if (lg) lg.scrollTop = lg.scrollHeight;
    document.getElementById('sheet').innerHTML = sheetHtml();
    if (GM.phase === 'run') gameSchedule();
    if (GM.phase === 'res' && !S.sheet && !timer) timer = setTimeout(() => { timer = null; gameResume(); render(); }, C.ui.resultMs);
  }

  function render() {
    if (S.mode === 'game') return gameRender();
    document.getElementById('app').className = 'app';
    document.getElementById('app').innerHTML = stageHtml() + barHtml();
    document.getElementById('sheet').innerHTML = sheetHtml();
    // 結果は、resultMs のあとに自動で次の場面へ(設定を開いている間は止める)
    if (result && !S.sheet) { if (!timer) { shownAt = Date.now(); timer = setTimeout(() => { timer = null; nextScene(); render(); }, C.ui.resultMs); } }
    else { clearTimeout(timer); timer = null; }
  }
  document.addEventListener('click', (e) => {
    const t = e.target;
    if (S.sheet && t.id === 'sheetbg') { S.sheet = false; render(); return; }
    const b = t.closest('button');
    if (b && b.id === 'gear') { S.sheet = true; render(); return; }
    if (S.mode === 'game' && !S.sheet && gameClick(b, t)) return;
    // 結果の表示中:画面のどこを押しても、すぐ次へ(押した直後の誤タップは無視)
    if (result && !S.sheet) { if (Date.now() - shownAt >= C.ui.tapGuardMs) { nextScene(); render(); } return; }
    if (!b) return;
    const d = b.dataset;
    if (b.id === 'close') { S.sheet = false; render(); return; }
    if (d.set === 'mode') { clearTimeout(timer); timer = null; result = null; S.mode = d.val; if (d.val !== 'game') { S.presetIdx = -1; newScene(true); } else if (!GM.G) GM.phase = 'start'; render(); return; }
    if (d.set === 'glog') { GM.logMode = d.val; render(); return; }
    if (d.set === 'bat') { S.bat = d.val; sc.batter = Object.assign({}, A.PRESETS.batter[S.bat]); render(); return; }
    if (d.set === 'pit') { S.pit = d.val; sc.pitcher = Object.assign({}, A.PRESETS.pitcher[S.pit]); render(); return; }
    if (d.set === 'bats') { S.bats = d.val; sc.bats = d.val; render(); return; }
    if (d.set === 'throws') { S.throws = d.val; sc.throws = d.val; render(); return; }
    if (d.set === 'key') { S.key = d.val; render(); return; }
    if (d.set === 'card') { S.card = d.val; render(); return; }
    if (b.id === 'useSeed') { const v = Number(document.getElementById('seed').value); S.seed = (Number.isFinite(v) ? Math.floor(v) : 1) >>> 0; S.presetIdx = -1; newScene(true); render(); return; }
    // カードを押すと、すぐ結果(「選択」と「決定」の2段階にしない)
    if (d.order) { pick(d.order, d.as); render(); return; }
    if (b.id === 'plain') { pick('normal'); render(); return; }
  });
  // 試合のモードの操作。処理したら true
  function gameClick(b, t) {
    if (GM.phase === 'res') { if (Date.now() - shownAt >= C.ui.tapGuardMs) { clearTimeout(timer); timer = null; gameResume(); render(); } return true; }
    if (!b) return GM.phase === 'run';
    const d = b.dataset;
    if (d.gset) { GM.cfg[d.gset] = d.val; render(); return true; }
    if (b.id === 'gseedSet') { const v = Number(document.getElementById('gseed').value); GM.cfg.seed = (Number.isFinite(v) ? Math.floor(v) : 1) >>> 0; render(); return true; }
    if (b.id === 'gstart') { gameStart(false); render(); return true; }
    if (b.id === 'gplain0') { gameStart(true); render(); return true; }
    if (b.id === 'gplain') { clearTimeout(GM.tick); GM.tick = null; A.finishPlain(GM.G); GM.phase = 'end'; result = null; render(); return true; }
    if (b.id === 'gagain') { gameStart(false); render(); return true; }
    if (b.id === 'gnew') { GM.cfg.seed = (GM.cfg.seed + 1) >>> 0; gameStart(false); render(); return true; }
    if (b.id === 'gback') { GM.G = null; GM.phase = 'start'; render(); return true; }
    if (d.order && GM.phase === 'key') { gamePick(d.order, d.as); render(); return true; }
    return false;
  }
  // 画面を押している間は、自動の進みが速くなる
  const holdOn = (v) => { GM.hold = v; };
  document.addEventListener('pointerdown', () => holdOn(true));
  ['pointerup', 'pointercancel', 'pointerleave'].forEach((k) => document.addEventListener(k, () => holdOn(false)));
  document.addEventListener('change', (e) => { if (e.target.id === 'preset') { S.presetIdx = Number(e.target.value); newScene(S.presetIdx < 0); render(); } });
  window.addEventListener('resize', () => { if (!S.sheet) render(); });
  // 最初の場面:介入できる(勝負になる)場面から始める
  for (let i = 0; i < 50 && !inRange(A.randomScene(S.seed)); i++) S.seed++;
  newScene(true);
  render();
})();
</script>
</body>
</html>
