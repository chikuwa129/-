<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>野球ガチャ 新入部員モード</title>
<style>
  :root {
    --bg: #f4f1ea; --card: #fffdf8; --ink: #222; --sub: #777; --line: #ddd5c6;
    --accent: #1f5f8b; --win: #1d7a3a; --lose: #b03a2e; --gold: #b07d00; --special: #8a2be2;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; font-size: 15px; line-height: 1.5; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 12px 80px; }
  header { position: sticky; top: 0; background: var(--bg); padding: 10px 0 6px; z-index: 5; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 8px; }
  header .t { flex: 1; min-width: 0; }
  header h1 { font-size: 17px; margin: 0; }
  header .meta { font-size: 13px; color: var(--sub); }
  header .meta b { color: var(--ink); }
  .gear { border: 1px solid var(--line); background: var(--card); border-radius: 6px; padding: 6px 10px; font-size: 13px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin: 10px 0; }
  .card h2 { font-size: 16px; margin: 0 0 6px; }
  .btns { display: flex; gap: 8px; margin: 10px 0; }
  .btn { flex: 1; padding: 14px 8px; font-size: 16px; border: none; border-radius: 8px; background: var(--accent); color: #fff; font-weight: bold; }
  .btn.sub { background: #fff; color: var(--accent); border: 1px solid var(--accent); }
  .btn.danger { background: #fff; color: var(--lose); border: 1px solid var(--lose); }
  .btn.small { padding: 10px 6px; font-size: 14px; }
  .btn:disabled { opacity: .4; }
  .minibtn { font-size: 12px; padding: 3px 8px; border: 1px solid var(--line); background: #fff; border-radius: 6px; margin-left: 6px; }
  .player { border-top: 1px solid var(--line); padding: 8px 0; }
  .player:first-child { border-top: none; }
  .pname { font-weight: bold; }
  .pnamebtn { border: none; background: none; padding: 0; font-size: 16px; font-weight: bold; color: var(--accent); text-decoration: underline dotted; cursor: pointer; }
  .tag { display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 8px; margin-left: 4px; vertical-align: middle; border: 1px solid var(--line); color: var(--sub); }
  .tag.P { border-color: #c77; color: #a33; } .tag.C { border-color: #7a7; color: #363; } .tag.IF { border-color: #79c; color: #357; } .tag.OF { border-color: #c9a040; color: #8a6400; }
  .tag.twoway { border-color: #d4006a; color: #d4006a; } .tag.reinc { border-color: var(--special); color: var(--special); } .tag.conv { border-style: dashed; }
  .abil { display: grid; grid-template-columns: repeat(var(--cols, 4), minmax(0, 1fr)); gap: 4px; margin-top: 4px; }
  .abil div { min-width: 0; overflow-wrap: anywhere; background: #f6f2e9; border-radius: 4px; padding: 2px 4px; text-align: center; font-size: 12px; color: var(--sub); }
  .abil b { display: block; font-size: 16px; color: var(--ink); }
  .v80 b { color: #c0392b; } .v60 b { color: #d35400; } .v40 b { color: #222; } .v0 b { color: #999; }
  .v100 b { color: #b8860b; text-shadow: 0 0 1px #f5d76e; }
  .abil div.v100 { box-shadow: inset 0 0 0 1px #e0b84d; }
  .small { font-size: 12px; color: var(--sub); }
  .sublabel { font-size: 11px; color: var(--sub); margin-top: 6px; }
  .rt { font-weight: bold; }
  .rlabel { font-size: 11px; margin-left: 3px; padding: 0 5px; border-radius: 8px; background: #fff4d6; color: #8a6400; border: 1px solid #e6c56a; white-space: nowrap; }
  .rlabel.r200 { background: #fde8e8; color: #b03a2e; border-color: #e6a39b; }
  .rlabel.r400 { background: #2b2b2b; color: #ffd84d; border-color: #2b2b2b; }
  .gen { font-size: 10px; color: var(--sub); margin-left: 3px; white-space: nowrap; }
  .reveal { margin-top: 6px; padding: 6px; border: 1px dashed var(--special); color: var(--special); font-weight: bold; border-radius: 6px; font-size: 14px; }
  .impress { font-size: 13px; color: #555; margin-top: 2px; }
  .needpol { color: var(--lose); font-size: 12px; font-weight: bold; }
  .months { display: grid; grid-template-columns: repeat(12, 1fr); gap: 2px; margin: 10px 0 4px; }
  .months span { font-size: 10px; text-align: center; padding: 3px 0; border-radius: 4px; background: #e8e2d5; color: var(--sub); }
  .months span.done { color: #bbb; }
  .months span.now { background: var(--accent); color: #fff; font-weight: bold; }
  .status { font-size: 11px; padding: 0 6px; border-radius: 8px; background: #e8f0f7; color: var(--accent); white-space: nowrap; }
  .story { font-size: 15px; margin: 4px 0; }
  .story.quiet { color: var(--sub); }
  .row2 { display: flex; align-items: center; gap: 8px; margin: 6px 0; flex-wrap: wrap; }
  .row2 > span { min-width: 5.5em; font-size: 13px; color: var(--sub); }
  .row2 select { flex: 1; min-width: 0; padding: 6px; font-size: 15px; border-radius: 6px; border: 1px solid var(--line); background: #fff; }
  .info { margin-top: 8px; padding: 6px 8px; background: #f6f2e9; border-radius: 6px; font-size: 13px; }
  label.rv { display: block; padding: 6px 0; border-top: 1px solid #eee; font-size: 14px; }
  .axis { font-size: 11px; color: var(--lose); white-space: nowrap; }
  .col { margin: 2px 0; }
  .colhead { display: block; width: 100%; text-align: left; background: none; border: none; padding: 5px 0; font-size: 14px; color: var(--ink); cursor: pointer; }
  .colhead .ar { display: inline-block; width: 1.1em; color: var(--accent); }
  .colhead .more { font-size: 11px; color: var(--accent); margin-left: 4px; }
  .colbody { padding: 2px 0 6px; }
  .scroll { overflow-x: auto; }
  table.lu { border-collapse: collapse; width: 100%; font-size: 13px; }
  table.lu th { font-size: 11px; color: var(--sub); font-weight: normal; text-align: left; padding: 2px 4px; border-bottom: 1px solid var(--line); }
  table.lu td { border-bottom: 1px dotted #eee; padding: 3px 4px; }
  table.lu td.num { text-align: right; }
  table.lu tr.oop td { color: var(--lose); }
  table.lu tr.me td { font-weight: bold; background: #fff6dc; }
  .hist { font-size: 12px; color: #444; margin: 4px 0 0 0; padding-left: 16px; }
  .grad { display: flex; align-items: center; justify-content: center; gap: 12px; margin: 10px 0; text-align: center; }
  .bignum b { font-size: 26px; }
  .arrow { font-size: 20px; color: var(--sub); }
  .dev { background: #eef; font-family: ui-monospace, monospace; font-size: 10px; word-break: break-all; }
  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 50; display: flex; align-items: center; justify-content: center; padding: 16px; }
  .modal { background: #fff; border-radius: 10px; padding: 16px; max-width: 420px; width: 100%; }
  .modal p { margin: 0 0 12px; font-size: 15px; }
  .modal.pdetail { max-height: 85vh; overflow-y: auto; }
  /* パワプロ式:項目名(小)・ランク文字(大)・数値(中) */
  .abil div.pw b { font-size: 22px; line-height: 1.1; }
  .abil div.pw i { display: block; font-style: normal; font-size: 13px; color: var(--ink); }
  .abil div.kmh b { font-size: 20px; }
  .abil div.kmh b small { font-size: 11px; font-weight: normal; }
  .rkS b, .rkA b { color: #c0392b; } .rkB b, .rkC b { color: #d35400; } .rkD b, .rkE b { color: #222; } .rkF b, .rkG b { color: #999; }
  .brk { font-size: 13px; margin-top: 4px; padding: 3px 6px; background: #f6f2e9; border-radius: 4px; }
  .brk b { font-size: 16px; }
  .crow { padding: 3px 0; border-top: 1px dotted #eee; font-size: 13px; }
  .namebtn { border: none; background: none; padding: 0; font-size: 14px; font-weight: bold; color: var(--accent); text-decoration: underline dotted; cursor: pointer; }
  .mk { font-size: 10px; padding: 0 5px; border-radius: 8px; white-space: nowrap; margin-left: 2px; }
  .rvchart { width: 100%; max-width: 360px; height: auto; display: block; }
  .rvchart .ln-h { stroke: var(--accent); stroke-width: 2.5; } .rvchart .ln-r { stroke: var(--lose); stroke-width: 2; stroke-dasharray: 5 3; }
  .rvchart .gl { stroke: var(--line); stroke-width: 1; } .rvchart .tk { font-size: 10px; fill: var(--sub); }
  .key { display: inline-block; width: 14px; height: 0; border-top: 3px solid var(--accent); vertical-align: middle; margin: 0 3px 0 6px; } .key.kr { border-top: 2px dashed var(--lose); }
  .topmate { margin-top: 6px; }
  table.stm { font-size: 12px; } table.stm th, table.stm td { padding: 2px 3px; } table.stm th { white-space: nowrap; }
  table.stm th.th2 { line-height: 1.1; text-align: center; } table.stm th.th2 span { display: block; font-size: 9px; }
  table.stm td.rc { text-align: center; line-height: 1.05; } table.stm td.rc b { display: block; font-size: 14px; } table.stm td.rc span { display: block; font-size: 10px; color: var(--sub); } table.stm td.rc i { font-style: normal; font-size: 8px; }
  table.stm td.nm { line-height: 1.2; } table.stm td.nm .gr { font-size: 10px; color: var(--sub); font-weight: normal; }
  .faint { opacity: 0.45; }
  .pbar { position: fixed; left: 0; right: 0; z-index: 40; background: var(--card); }
  .pbar-bottom { bottom: 0; border-top: 1px solid var(--line); box-shadow: 0 -2px 6px rgba(0,0,0,.08); padding-bottom: env(safe-area-inset-bottom); }
  .pbar-top { top: 0; border-bottom: 1px solid var(--line); box-shadow: 0 2px 6px rgba(0,0,0,.08); padding-top: env(safe-area-inset-top); }
  .pbar-in { max-width: 560px; margin: 0 auto; padding: 6px 12px; display: flex; gap: 8px; box-sizing: border-box; }
  .pbar .btn { min-height: 44px; padding: 10px 8px; }
  body.has-pbar-bottom .wrap { padding-bottom: calc(84px + env(safe-area-inset-bottom)); }
  body.has-pbar-top .wrap { padding-top: calc(64px + env(safe-area-inset-top)); }
  .mk.ret { background: #eee; color: var(--sub); }
  .subst { color: var(--accent); }
  .impress.hint { color: var(--special); } .mk.awk { background: #f3e8ff; color: var(--special); }
  .linkbtn { background: none; border: none; color: var(--accent); font-size: 12px; padding: 4px 0; cursor: pointer; text-decoration: underline; }
  .result1 { margin: 2px 0 4px; }
  .rrow .r1 { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 4px; } .rrow .r2 { padding-left: 2px; }
  .rst { margin-left: auto; font-size: 12px; white-space: nowrap; } .rst b { font-size: 13px; margin-left: 1px; } .rst i { font-style: normal; font-size: 9px; }
  @media (max-width: 340px) { table.stm:not(.wide) .col-r { display: none; } }
  table.tot { font-size: 12px; line-height: 1.3; } table.tot td, table.tot th { padding: 2px 4px; vertical-align: top; } table.tot td:first-child { white-space: nowrap; color: var(--sub); }
  .mk.on { color: var(--win); font-size: 12px; } .mk.me { background: #fff6dc; } .mk.rv { background: #fde8e8; color: #b03a2e; } .mk.sp { background: #e8f0f7; color: var(--accent); }
  .chip { padding: 4px 10px; border: 1px solid var(--line); background: #fff; border-radius: 14px; font-size: 12px; }
  .chip.on { background: var(--ink); color: #fff; }
  .scard { border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; margin: 4px 0; }
  .game { border-top: 1px dotted #eee; padding: 4px 0; font-size: 14px; }
  .game .win { color: var(--win); } .game .lose { color: var(--lose); }
  .appear { font-size: 13px; margin-top: 4px; }
  .cmp { font-size: 14px; color: var(--ink); } .cmp b { font-size: 16px; }
  .arrow2 { font-size: 12px; color: var(--accent); white-space: nowrap; }
  .wnote { color: #9a6a00; margin-top: 4px; }
  .star { border: none; background: none; font-size: 18px; line-height: 1; padding: 0 4px; color: #bbb; cursor: pointer; vertical-align: middle; }
  .star.on { color: #e0a800; }
  .scard.rival { border-color: #e6a39b; background: #fffaf8; }
  .reason { color: var(--lose); }
  .rvblock { border: 1px solid #e6a39b; border-radius: 6px; padding: 6px 8px; margin-top: 4px; }
  .reveal2 { color: var(--special); font-weight: bold; }
  .btn.small { color: #fff; } .btn.sub.small { color: var(--accent); } .btn.danger.small { color: var(--lose); }
  .bignum { white-space: nowrap; } .bignum b { font-size: 22px; }
  /* H1.7:演出(heroMode.fx。CSS のアニメーションが中心。外部の画像・音・フォントは使わない) */
  .player.fxc { position: relative; border-radius: 8px; padding: 8px 6px; margin: 2px -6px; }
  .player.fxc + .player.fxc { border-top-color: transparent; }
  .fxc.fx-g1 { box-shadow: 0 0 0 1px #e6c56a, 0 0 var(--gl1, 8px) rgba(230,197,106,.55); }
  .fxc.fx-g2 { box-shadow: 0 0 0 2px #d4a017, 0 0 var(--gl2, 14px) rgba(212,160,23,.7); background: #fffaf0; }
  .fxc.fx-g3 { box-shadow: 0 0 0 2px #e05a2b, 0 0 0 4px #ffd84d, 0 0 var(--gl3, 22px) rgba(255,190,60,.9); background: #fff8ec; }
  .fxc.fx-hint::after { content: ''; position: absolute; inset: -3px; border-radius: 10px; pointer-events: none; box-shadow: 0 0 0 1px rgba(138,43,226,.6), 0 0 var(--glh, 12px) rgba(138,43,226,.55); }
  .fx-in { opacity: 0; animation-name: fxIn; animation-timing-function: ease-out; animation-fill-mode: both; }
  .fx-in.fx-g2, .fx-in.fx-g3 { animation-name: fxBounce; }
  @keyframes fxIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @keyframes fxBounce { 0% { opacity: 0; transform: translateY(18px) scale(.94); } 60% { opacity: 1; transform: translateY(-4px) scale(1.04); } 100% { opacity: 1; transform: none; } }
  .fx-flash { position: fixed; inset: 0; z-index: 61; background: #fff; pointer-events: none; opacity: 0; animation: fxFlash .5s ease-out both; }
  @keyframes fxFlash { 0% { opacity: 0; } 15% { opacity: .95; } 100% { opacity: 0; } }
  .fx-skip { position: fixed; inset: 0; z-index: 60; touch-action: none; display: flex; align-items: flex-end; justify-content: center; padding-bottom: calc(14px + env(safe-area-inset-bottom)); }
  .fx-skip span { font-size: 12px; color: #fff; background: rgba(0,0,0,.55); padding: 4px 12px; border-radius: 12px; }
  /* 覚醒の瞬間(全画面) */
  .awfx { position: fixed; inset: 0; z-index: 70; background: rgba(8,4,20,.94); color: #fff; overflow-y: auto; animation: fxDark .5s ease-out both; }
  .awfx-in { max-width: 480px; margin: 0 auto; padding: 24px 16px calc(96px + env(safe-area-inset-bottom)); text-align: center; }
  .awfx-frame { border: 3px solid #ffd84d; border-radius: 14px; padding: 14px 10px; box-shadow: 0 0 24px rgba(255,216,77,.6), inset 0 0 18px rgba(255,216,77,.25); animation: fxFrame 1.2s ease-out both; }
  .awfx-title { font-size: 52px; font-weight: 900; letter-spacing: .2em; line-height: 1.1; color: #ffe27a; text-shadow: 0 0 12px #b16cff, 0 0 26px #ffcc33; animation: fxTitle .9s cubic-bezier(.2,1.4,.4,1) both; }
  .awfx-name { font-size: 22px; font-weight: bold; margin-top: 4px; }
  .awfx-head { font-size: 15px; color: #e8dcff; margin-top: 6px; }
  .awfx-items { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 6px; margin-top: 14px; }
  .awfx-it { min-width: 0; background: rgba(255,255,255,.08); border: 1px solid rgba(255,216,77,.45); border-radius: 8px; padding: 6px 4px; }
  .awfx-it .lb { font-size: 12px; color: #cdbdf5; }
  .awfx-it .rk { font-size: 30px; font-weight: 900; line-height: 1.05; color: #ffe27a; }
  .awfx-it .rk.chg { color: #ff8c5a; text-shadow: 0 0 10px #ffcc33; }
  .awfx-it .rk.chg.pop { animation: fxPop .5s ease-out both; }
  .awfx-it .nv { font-size: 24px; font-weight: bold; line-height: 1.1; }
  .awfx-it .nv small { font-size: 11px; font-weight: normal; }
  .awfx-it .ov { font-size: 11px; color: #aaa; }
  .awfx-sum { margin-top: 14px; font-size: 13px; color: #ddd; }
  .awfx-sum b { font-size: 26px; color: #fff; }
  .awfx-sum .ar { color: #ffd84d; margin: 0 4px; }
  .awfx-hint { margin-top: 12px; padding: 8px; border: 1px dashed #c79bff; border-radius: 8px; color: #e7d2ff; font-size: 14px; }
  .awfx-hint .ht { font-weight: bold; color: #ffe27a; margin-top: 2px; }
  .awfx-late { opacity: 0; animation: fxIn .5s ease-out both; }
  .awfx-bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 71; padding: 8px 12px calc(8px + env(safe-area-inset-bottom)); background: rgba(8,4,20,.96); }
  .awfx-bar .pbar-in { padding: 0; }
  .awfx-bar .skiphint { flex: 1; text-align: center; font-size: 12px; color: #bbb; padding: 12px 0; }
  .awfx-bar .btn { background: linear-gradient(90deg, #8a2be2, #d4a017); }
  @keyframes fxDark { from { opacity: 0; } to { opacity: 1; } }
  @keyframes fxFrame { 0% { border-color: #8a2be2; box-shadow: 0 0 30px rgba(138,43,226,.9); } 100% { border-color: #ffd84d; box-shadow: 0 0 24px rgba(255,216,77,.6), inset 0 0 18px rgba(255,216,77,.25); } }
  @keyframes fxTitle { 0% { opacity: 0; transform: scale(2.2); } 100% { opacity: 1; transform: none; } }
  @keyframes fxPop { 0% { transform: scale(1); } 40% { transform: scale(1.5); } 100% { transform: scale(1); } }
  .awfx.final, .awfx.final * { animation: none !important; }
  .awfx.final .awfx-late { opacity: 1; }
  @media (prefers-reduced-motion: reduce) {
    .fx-in, .awfx, .awfx *, .fx-flash { animation: none !important; opacity: 1; transform: none; }
    .fx-flash { display: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="t"><h1>野球ガチャ 新入部員モード</h1><div class="meta" id="meta"></div></div>
    <button class="gear" id="hSettings">設定</button>
  </header>
  <main id="main"></main>
</div>
<script src="config.js"></script>
<script src="benchmark.js"></script>
<script src="logic.js"></script>
<script src="story.js"></script>
<script src="hero.js"></script>
<script>
  window.Hero.mountUI();
</script>
</body>
</html>
