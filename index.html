<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>ロボット遺跡探索</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #101114; --panel: #1a1b20; --line: #34363e; --fg: #dcdde2; --dim: #8a8c96;
    --hp: #e5534b; --en: #43b4f0; --accent: #ffd447; --ok: #3fae6a; --boss: #ff5a5a;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font-family: "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Meiryo", sans-serif;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  button { font-family: inherit; color: var(--fg); touch-action: manipulation; cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  button:disabled { opacity: 0.35; cursor: default; }
  canvas.px, #cv { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
  #app {
    max-width: 520px; margin: 0 auto; min-height: 100%;
    display: flex; flex-direction: column; align-items: center;
    padding: 8px 12px;
  }
  .screen { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  [hidden] { display: none !important; }

  .bar { display: inline-block; height: 8px; background: #2c2d33; border-radius: 2px; overflow: hidden; }
  .bar i { display: block; height: 100%; }
  .bar.hp i { background: var(--hp); }
  .bar.en i { background: var(--en); }
  .bar.ehp i { background: #e8a33a; }
  .low { color: var(--hp) !important; }

  /* タイプ選択 */
  #select h1 { font-size: 22px; margin: 12px 0 0; letter-spacing: .04em; }
  #select p.lead { margin: 0; color: var(--dim); font-size: 13px; text-align: center; }
  #typeList { width: 100%; display: grid; gap: 10px; }
  .typeCard {
    width: 100%; text-align: left; padding: 10px 12px; border-radius: 10px;
    background: var(--panel); border: 1px solid #50525c;
    display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 12px; align-items: center;
  }
  .typeCard:hover, .typeCard:focus-visible { border-color: var(--accent); }
  .typeCard canvas { grid-row: 1 / 4; }
  .typeCard .tname { font-size: 18px; font-weight: bold; }
  .typeCard .tname small { font-size: 12px; color: var(--dim); font-weight: normal; margin-left: 6px; }
  .typeCard .k { color: var(--accent); font-size: 12px; margin-right: 6px; }
  .typeCard .desc { font-size: 12px; color: #c4c5cc; }
  .typeCard .stats { display: flex; flex-wrap: wrap; gap: 2px 12px; font-size: 12px; font-variant-numeric: tabular-nums; }
  .typeCard .stats b { color: #fff; }
  .typeCard .role { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 4px; background: #3d8fd9; color: #fff; margin-left: 6px; vertical-align: 3px; font-weight: normal; }
  .typeCard .sw { font-size: 12px; color: #c4c5cc; }
  .typeCard .sw b { color: #8fe08f; font-weight: normal; } .typeCard .sw i { color: #ff9a8a; font-style: normal; }

  /* マップ画面 */
  #status { width: 100%; display: grid; gap: 3px; font-size: 13px; font-variant-numeric: tabular-nums; }
  #floorLabel { font-size: 15px; font-weight: bold; }
  #teamRows { display: grid; gap: 3px; min-height: calc(3 * 19px + 6px); align-content: start; }
  #floorLabel.bossfl { color: var(--boss); }
  .trow { display: grid; grid-template-columns: minmax(0, 1fr) 70px 64px 66px; align-items: center; gap: 6px; }
  .trow .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .trow .nm small { color: var(--dim); }
  .trow .bar { width: 100%; }
  .trow .num { text-align: right; }
  #cv { background: #000; }

  /* 高さを固定して、長い行が折り返しても画面がずれないようにする（新しい行が下に残る） */
  .log {
    width: 100%; height: calc(4 * 1.45em + 10px); padding: 4px 8px; overflow: hidden;
    display: flex; flex-direction: column; justify-content: flex-end;
    background: var(--panel); border: 1px solid var(--line); font-size: 13px; line-height: 1.45em;
  }
  .log div { min-height: 1.45em; flex-shrink: 0; }
  .log div:nth-child(1) { opacity: .5; }
  .log div:nth-child(2) { opacity: .75; }

  #controls { display: flex; align-items: center; gap: 18px; }
  #pad { display: grid; grid-template-columns: repeat(3, 58px); grid-template-rows: repeat(3, 48px); gap: 6px; }
  #pad button, #menuBtn { font-size: 20px; background: #26272d; border: 1px solid #50525c; border-radius: 10px; }
  #pad button:active, #menuBtn:active { background: #3a3c44; }
  #pad .wait { font-size: 13px; }
  #menuBtn { width: 76px; height: 62px; font-size: 15px; }
  #help { font-size: 12px; color: #666; text-align: center; }
  @media (hover: hover) and (pointer: fine) {
    #pad { grid-template-columns: repeat(3, 46px); grid-template-rows: repeat(3, 40px); }
    #pad button { font-size: 16px; }
    #menuBtn { height: 52px; }
  }
  @media (pointer: coarse) { #help { display: none; } }

  /* バトル画面 */
  .ehead { width: 100%; display: flex; flex-direction: column; gap: 4px; }
  .ehead .row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-variant-numeric: tabular-nums; }
  #eName { font-size: 17px; font-weight: bold; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #eName.boss { color: var(--boss); }
  #eHpText { flex-shrink: 0; }
  #charge { color: #1a1206; background: #ffb02e; font-weight: bold; font-size: 13px; padding: 2px 8px; border-radius: 4px; align-self: flex-start; }
  .wide { width: 100%; height: 12px; }
  .arena {
    position: relative; width: 100%;
    display: flex; align-items: center; justify-content: space-between; gap: 6px; padding: 6px 8px;
    background: linear-gradient(#17181d 0 62%, #24221e 62% 100%);
    border: 1px solid var(--line); border-radius: 6px; overflow: hidden;
  }
  .arena.bossArena { background: linear-gradient(#1d1214 0 62%, #2a1a1a 62% 100%); }
  #allies { display: flex; flex-direction: column; gap: 4px; }
  .ally { padding: 2px; border: 2px solid transparent; border-radius: 6px; }
  .ally.active { border-color: var(--accent); background: rgba(255, 212, 71, .12); }
  .ally.down { opacity: 0.25; }
  .hit { animation: shake .2s; }
  @keyframes shake { 0%,100% { transform: translateX(0); } 50% { transform: translateX(5px); } }
  @media (prefers-reduced-motion: reduce) { .hit { animation: none; } }
  /* 演出：ダメージの数字（跳ねる）、技名、閃光、揺れ */
  #fx { position: absolute; top: 30%; font-size: 20px; font-weight: bold; pointer-events: none; text-shadow: 0 2px 4px #000; z-index: 2; }
  #fx.enemy { right: 18%; } #fx.miss { right: 42%; } #fx.ally { left: 22%; top: 45%; } #fx.center { left: 0; right: 0; text-align: center; }
  #fx.critNum { font-size: 30px; }
  #fx.pop { animation: pop .4s ease-out; }
  @keyframes pop { 0% { transform: translateY(6px) scale(.8); } 40% { transform: translateY(-14px) scale(1.15); } 100% { transform: translateY(-6px) scale(1); } }
  #banner { position: absolute; left: 0; right: 0; top: 6px; text-align: center; font-size: 22px; font-weight: bold; color: #fff;
    text-shadow: 0 2px 6px #000, 0 0 2px #000; pointer-events: none; opacity: 0; z-index: 3; }
  #banner.show { animation: banner .5s ease-out forwards; }
  @keyframes banner { 0% { opacity: 0; transform: scale(.9); } 15% { opacity: 1; transform: scale(1); } 80% { opacity: 1; } 100% { opacity: 0; } }
  #flash { position: fixed; inset: 0; pointer-events: none; opacity: 0; z-index: 20; }
  #flash.show { animation: flash1 .1s linear; }
  @keyframes flash1 { 0% { opacity: 0; } 30% { opacity: 1; } 100% { opacity: 0; } }
  .shake2 { animation: shake2 .2s linear; }
  @keyframes shake2 { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 50% { transform: translateX(5px); } 75% { transform: translateX(-5px); } }
  @media (prefers-reduced-motion: reduce) { #fx.pop, #banner.show, .shake2 { animation: none; } #banner.show { opacity: 1; } }

  #party { width: 100%; display: grid; gap: 3px; font-size: 13px; font-variant-numeric: tabular-nums; }
  .prow {
    display: grid; grid-template-columns: minmax(0, 1fr) 80px 54px 66px; align-items: center; gap: 6px;
    padding: 3px 6px; border: 1px solid transparent; border-radius: 6px;
  }
  .prow.active { border-color: var(--accent); background: #26231a; }
  .prow.down { opacity: 0.45; }
  .prow .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .prow .nm small { color: var(--dim); }
  .prow .bar { width: 100%; height: 8px; }
  .bars { display: grid; gap: 2px; }
  .bars .bar.en { height: 5px; }
  .bar.en i { background: var(--en); }
  .prow .num { text-align: right; }
  .prow .st { grid-column: 1 / -1; font-size: 11px; color: #8fd; }

  #cmdTitle { width: 100%; font-size: 12px; color: var(--dim); letter-spacing: .06em; }
  #cmdTitle b { color: var(--accent); font-weight: normal; }
  #cmds { width: 100%; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 6px; }
  #cmds button { min-width: 0; }
  #cmds button {
    min-height: 48px; padding: 5px 8px; text-align: left;
    background: #24252b; border: 1px solid #50525c; border-radius: 8px; font-size: 15px;
    display: flex; flex-direction: column; justify-content: center; gap: 2px;
  }
  #cmds button:active:not(:disabled) { background: #3a3c44; }
  #cmds button .k { color: var(--accent); font-size: 12px; margin-right: 4px; }
  #cmds button small { color: var(--dim); font-size: 11px; }
  #cmds button.back { background: #1c1d22; }
  #cmds button.noen { opacity: .4; filter: grayscale(1); }
  /* わざの一覧は1行に収めて、スマホでも決定ボタンまで1画面に入るようにする */
  #cmds.moveList button { min-height: 42px; padding: 4px 8px; font-size: 14px; }
  #cmds.moveList button > span:first-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; display: block; }
  #cmds.moveList button small { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #cmds button.sel { border-color: var(--accent); background: #2e2a1a; }
  .mk { display: inline-block; font-size: 10px; padding: 0 4px; border-radius: 3px; margin-right: 4px; color: #111; vertical-align: 2px; }
  .mk-gun { background: #e8c25a; } .mk-missile { background: #e98a5a; } .mk-laser { background: #6fd6f2; } .mk-unique { background: #b8e986; }
  #moveInfo { width: 100%; min-height: calc(4 * 1.45em + 10px); background: var(--panel); border: 1px solid var(--accent); border-radius: 8px; padding: 6px 10px; font-size: 13px;
    display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; align-items: center; }
  #moveInfo .miName { font-weight: bold; grid-column: 1; }
  #moveInfo .miDesc, #moveInfo .miLine { grid-column: 1; }
  #moveInfo .miLine { color: var(--accent); font-variant-numeric: tabular-nums; }
  #moveInfo .miGo { grid-column: 2; grid-row: 1 / 4; min-width: 76px; min-height: 52px; font-size: 16px; background: var(--ok); color: #fff; border: none; border-radius: 8px; }

  /* オーバーレイ */
  .overlay {
    position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,0.82); padding: 16px;
  }
  .dialog {
    width: 100%; max-width: 480px; max-height: 100%; overflow-y: auto;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px;
  }
  .center { text-align: center; }
  .dialog h2 { margin: 0 0 8px; font-size: 21px; }
  .dialog h3 { margin: 14px 0 4px; font-size: 13px; color: var(--dim); letter-spacing: .06em; font-weight: normal; }
  .big { font-size: 17px; padding: 10px 28px; background: var(--ok); color: #fff; border: none; border-radius: 8px; margin-top: 12px; }
  .mhead {
    position: sticky; top: -14px; z-index: 1; margin: -14px -16px 8px; padding: 12px 16px 8px;
    display: flex; align-items: center; justify-content: space-between; background: var(--panel); border-bottom: 1px solid var(--line);
  }
  .mhead h2 { margin: 0; }
  #menuClose { padding: 8px 18px; font-size: 15px; background: var(--ok); color: #fff; border: none; border-radius: 8px; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; }
  .tabs button { padding: 7px 12px; background: #24252b; border: 1px solid #50525c; border-radius: 6px; font-size: 14px; }
  .tabs button.on { border-color: var(--accent); color: var(--accent); background: #2a2618; }
  .unitHead { display: flex; gap: 12px; align-items: center; margin-top: 10px; }
  .unitHead canvas { flex-shrink: 0; background: #22232a; border-radius: 6px; }
  .sgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 3px 12px; font-size: 13px; font-variant-numeric: tabular-nums; flex: 1; min-width: 0; }
  .sgrid b { color: #fff; font-weight: normal; }
  .mrow {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 7px 6px; border-bottom: 1px solid #2a2b31; font-size: 14px;
  }
  .mrow .info { min-width: 0; }
  .mrow small { display: block; color: var(--dim); font-size: 11px; font-variant-numeric: tabular-nums; }
  .mrow .btns { display: flex; gap: 4px; flex-shrink: 0; }
  .mrow button { padding: 6px 10px; background: #2c2d34; border: 1px solid #50525c; border-radius: 6px; font-size: 13px; }
  .mrow button.danger { border-color: #8a3a3a; color: #ff9a9a; }
  .omakase { width: 100%; margin-top: 8px; padding: 9px; background: #23324a; border: 1px solid #3d8fd9; border-radius: 8px; font-size: 14px; }
  .tag { display: inline-block; font-size: 10px; padding: 1px 5px; border-radius: 3px; margin-right: 4px; vertical-align: 1px; color: #111; }
  .tag.gun { background: #e8c25a; }
  .tag.missile { background: #e98a5a; }
  .tag.laser { background: #6fd6f2; }
  .eq { color: var(--accent); font-size: 11px; margin-left: 4px; }
  .empty { color: #666; }
  /* 村・タイトル */
  #villageScene { width: 100%; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #2a3a2e; }
  #villageScene canvas { margin: 0 auto; }
  .vstats { width: 100%; display: grid; gap: 3px; font-size: 13px; font-variant-numeric: tabular-nums; }
  .vinv { font-size: 13px; color: var(--dim); width: 100%; }
  .vbtns { width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .vbtns button { min-height: 52px; font-size: 16px; border-radius: 10px; background: #26272d; border: 1px solid #50525c; }
  .vbtns button.primary { grid-column: 1 / -1; background: var(--ok); color: #fff; border: none; font-size: 18px; }
  .vbtns button.danger, .dlgBtns button.danger { border-color: #8a3a3a; color: #ff9a9a; }
  #saveNote { font-size: 12px; color: #e8a33a; width: 100%; }
  #title h1 { font-size: 24px; margin: 40px 0 4px; }
  #title p { color: var(--dim); font-size: 13px; margin: 0 0 12px; text-align: center; }
  #title .vbtns { max-width: 360px; }
  .dlgBtns { display: grid; gap: 8px; margin-top: 12px; }
  .dlgBtns button { min-height: 48px; font-size: 15px; border-radius: 8px; background: #26272d; border: 1px solid #50525c; }
  .dlgBtns button.primary { background: var(--ok); color: #fff; border: none; }
  .mheadBtns { display: flex; gap: 8px; }
  #btnBackVillage { padding: 8px 12px; font-size: 14px; background: #3a2a1c; border: 1px solid #a8743a; border-radius: 8px; }
  .debug { position: fixed; right: 6px; bottom: 6px; font-size: 11px; color: #f5d; }
</style>
</head>
<body>
<div id="app">

  <!-- タイトル（セーブデータがあるとき） -->
  <section id="title" class="screen" hidden>
    <h1>ロボット遺跡探索</h1>
    <p id="titleNote"></p>
    <div class="vbtns">
      <button id="btnContinue" class="primary">つづきから</button>
      <button id="btnNewFromTitle" class="danger" style="grid-column: 1 / -1">はじめから</button>
    </div>
  </section>

  <!-- 村 -->
  <section id="village" class="screen" hidden>
    <div id="floorLabelV" style="width:100%;font-size:15px;font-weight:bold">ベースキャンプの村</div>
    <div id="villageScene"></div>
    <div class="vstats" id="villageTeam"></div>
    <div class="vinv" id="villageInv"></div>
    <div class="log" id="villageLog"><div></div><div></div><div></div></div>
    <div class="vbtns">
      <button id="btnDepart" class="primary">出発</button>
      <button id="btnVillageMenu">メニュー</button>
      <button id="btnNewFromVillage" class="danger">はじめから</button>
    </div>
    <div id="saveNote" hidden>保存できませんでした（このまま遊べます）</div>
  </section>

  <!-- タイプ選択画面 -->
  <section id="select" class="screen">
    <h1>ロボット遺跡探索</h1>
    <p class="lead">最初の機体のタイプを選んでください</p>
    <div id="typeList"></div>
  </section>

  <!-- マップ画面 -->
  <section id="mapScreen" class="screen" hidden>
    <div id="status">
      <div id="floorLabel">1F</div>
      <div id="teamRows"></div>
    </div>
    <canvas id="cv"></canvas>
    <div class="log" id="mapLog"><div></div><div></div><div></div></div>
    <div id="controls">
      <div id="pad">
        <span></span><button data-dir="up" aria-label="上">▲</button><span></span>
        <button data-dir="left" aria-label="左">◀</button><button data-dir="wait" class="wait">待機</button><button data-dir="right" aria-label="右">▶</button>
        <span></span><button data-dir="down" aria-label="下">▼</button><span></span>
      </div>
      <button id="menuBtn">メニュー</button>
    </div>
    <div id="help">矢印キー / WASD：移動　スペース：待機　M：メニュー</div>
  </section>

  <!-- バトル画面 -->
  <section id="battle" class="screen" hidden>
    <div class="ehead">
      <div class="row"><span id="eName">ロールバグ</span><span id="eHpText">8/8</span></div>
      <span class="bar ehp wide" id="eHpBar"><i></i></span>
      <div id="charge" hidden></div>
    </div>
    <div class="arena" id="arena">
      <div id="allies"></div>
      <div id="eWrap"></div>
      <div id="fx"></div>
      <div id="banner"></div>
    </div>
    <div id="party"></div>
    <div class="log" id="battleLog"><div></div><div></div><div></div></div>
    <div id="moveInfo" hidden></div>
    <div id="cmdTitle">コマンド</div>
    <div id="cmds"></div>
  </section>
</div>

<div id="flash"></div>

<!-- メニュー -->
<div class="overlay" id="menu" hidden>
  <div class="dialog">
    <div class="mhead"><h2>メニュー</h2><span class="mheadBtns"><button id="btnBackVillage" hidden>村に戻る</button><button id="menuClose">とじる</button></span></div>
    <div class="tabs" id="menuTabs"></div>
    <div id="menuBody"></div>
  </div>
</div>

<!-- 確認・選択ダイアログ -->
<div class="overlay" id="dialog" hidden>
  <div class="dialog">
    <h2 id="dlgTitle"></h2>
    <p id="dlgText" style="margin:0;font-size:14px"></p>
    <div class="dlgBtns" id="dlgBtns"></div>
  </div>
</div>

<!-- クリア -->
<div class="overlay" id="endScreen" hidden>
  <div class="dialog center">
    <h2 id="endTitle">機能停止…</h2>
    <p id="endText"></p>
    <p id="endLoot"></p>
    <button class="big" id="retry">村に戻る</button>
  </div>
</div>

<script>
"use strict";

// ================================================================
//  調整用の定数・データ
// ================================================================
// ?debug=1 を付けたときだけ、全機体のHPを大きくする（テスト用）
const DEBUG = /[?&]debug=1(&|$)/.test(location.search);
const DEBUG_HP_BONUS = 1500;

const STAIRS_ENERGY_BONUS = 30;    // 次の階へ進んだとき、全員のエネルギー回復
const WIN_ENERGY_BONUS = 5;        // 戦闘に勝ったとき、生きている全員のエネルギー回復
const REVIVE_HP_RATE = 0.25;       // バトル後、HP0の機体が復活するときのHP（最大HP比）
const DAMAGE_VARIANCE = 1;         // ダメージのぶれ（±）
const BATTLE_WAIT = 300;           // バトル中のメッセージ待ち時間(ms)。タップで飛ばせる

const TACKLE_BASE = 3;             // たいあたりの基本威力（主人公機）
const TACKLE_ACC = 95;
const ESCAPE_RATE = 50;            // にげる成功率(%)
const ESCAPE_STUN_TURNS = 3;       // 逃げた後、敵が追ってこないターン数
const TEAM_MAX = 3;

// 機体レベル
const LEVEL_MAX = 20;
const expToNext = lv => 8 + 4 * lv;          // 次のレベルに必要な経験値
const LEVEL_HP_GROWTH = 5;

// ================================================================
//  グラフィック（図形の組み合わせからドット絵を作る）
// ================================================================
function makeGrid(w,h){return Array.from({length:h},()=>Array(w).fill(0));}
function inPoly(x,y,p){let c=false;for(let i=0,j=p.length-1;i<p.length;j=i++){const[xi,yi]=p[i],[xj,yj]=p[j];if((yi>y)!==(yj>y)&&x<(xj-xi)*(y-yi)/(yj-yi)+xi)c=!c;}return c;}
function applyOp(g,w,h,op){
  const t=op[0];
  if(t==="P"){for(let y=0;y<h;y++)for(let x=0;x<w;x++)if(inPoly(x+0.5,y+0.5,op[1]))g[y][x]=op[2];}
  else if(t==="E"){const m=op[6]===undefined?99:op[6];for(let y=0;y<h;y++)for(let x=0;x<w;x++){const dx=(x+0.5-op[1])/op[3],dy=(y+0.5-op[2])/op[4];if(dx*dx+dy*dy<=1&&y+0.5<=m)g[y][x]=op[5];}}
  else if(t==="R"){for(let y=op[2];y<op[2]+op[4];y++)for(let x=op[1];x<op[1]+op[3];x++)if(y>=0&&y<h&&x>=0&&x<w)g[y][x]=op[5];}
}
function buildSprite(def,w,h){
  const a=makeGrid(w,h),b=makeGrid(w,h);
  def.o.forEach(op=>applyOp(a,w,h,op));
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    if(a[y][x]){b[y][x]=a[y][x];}
    else{const nb=(y>0&&a[y-1][x])||(y<h-1&&a[y+1][x])||(x>0&&a[y][x-1])||(x<w-1&&a[y][x+1]);if(nb)b[y][x]="k";}
  }
  def.a.forEach(q=>{b[q[1]][q[0]]=q[2];});
  return b;
}

// 床・壁（輪郭なしのタイル）
function tileGrid(fill, marks) {
  const g = Array.from({ length: MAP_N }, () => Array(MAP_N).fill(fill));
  marks.forEach(([x, y, w, h, c]) => { for (let yy = y; yy < y + h; yy++) for (let xx = x; xx < x + w; xx++) g[yy][xx] = c; });
  return g;
}
const TILES = {
  floor:     { g: tileGrid("f", [[3, 3, 1, 1, "g"], [9, 8, 1, 1, "g"]]), p: { f: "#d8d4b8", g: "#cbc7a8" } },
  bossfloor: { g: tileGrid("f", [[3, 3, 1, 1, "g"], [9, 8, 1, 1, "g"]]), p: { f: "#8a6a68", g: "#7a5a58" } },
  wall:      { g: tileGrid("w", [[0, 3, 12, 1, "l"], [0, 8, 12, 1, "l"], [5, 0, 1, 3, "l"], [2, 4, 1, 4, "l"], [8, 4, 1, 4, "l"]]), p: { w: "#4b4a5c", l: "#5d5c70" } },
  // 準備部屋の出口の目印：床に黄色と黒のしま模様の柱

const SPR = {};
function prepareSprites() {

// 整数倍に拡大した画像（キャッシュ）。flip=左右反転
const spriteCache = new Map();
function spriteImage(key, s, flip) {
  const ck = `${key}|${s}|${flip ? 1 : 0}`;
  if (spriteCache.has(ck)) return spriteCache.get(ck);
  const sp = SPR[key], c = document.createElement("canvas");
  c.width = sp.w * s; c.height = sp.h * s;
  const x2 = c.getContext("2d");
  for (let y = 0; y < sp.h; y++) for (let x = 0; x < sp.w; x++) {
    const col = sp.p[sp.g[y][x]];
    if (!col) continue;
    x2.fillStyle = col;
    x2.fillRect((flip ? sp.w - 1 - x : x) * s, y * s, s, s);
  }
  spriteCache.set(ck, c);
  return c;
}
// DOMに置く用のキャンバス
function spriteEl(key, s, flip) {
  const src = spriteImage(key, s, flip), c = document.createElement("canvas");
  c.width = src.width; c.height = src.height; c.className = "px";
  c.dataset.sprite = key; c.dataset.scale = s; c.dataset.flip = flip ? "1" : "0";
  const x2 = c.getContext("2d");
  x2.imageSmoothingEnabled = false;
  x2.drawImage(src, 0, 0);
  return c;
}

  let r = Math.random();
  for (let i = 0; i < rates.length; i++) { if ((r -= rates[i]) < 0) return i; }

// ---- パーツ（共有の持ち物）。装備は持ち物の要素そのものを指す ----
const partOf = item => partById(item.id);
const isEquipped = item => team.some(u => u.equip.includes(item));
const partText = p => `${p.name}${RARITY[p.rarity].stars}`;

// 持ち物に入れて、自動装備する。prefer=最初に空き枠を探す機体（仲間の初期パーツ用）
function addPart(id, prefer) {
  const item = { id, uid: ++partUid };
  inv.parts.push(item);
  const p = partById(id);
  let res = { item, unit: null, swapped: null };
  // 1. 空き枠に装備（prefer → チームの並び順）
  const order = prefer ? [prefer, ...team.filter(u => u !== prefer)] : team;
  const free = order.find(u => u.equip.includes(null));
  if (free) {
    free.equip[free.equip.indexOf(null)] = item;
    res.unit = free;
  } else {
    // 2. 手動で付け替えていない機体の装備で一番弱いものより強ければ入れ替え
    let worst = null;
    for (const u of team) {
      if (u.manual) continue;
      u.equip.forEach((e, slot) => {
        if (e && (!worst || expectedDamage(partOf(e)) < expectedDamage(partOf(worst.e)))) worst = { u, slot, e };
      });
    }
    if (worst && expectedDamage(p) > expectedDamage(partOf(worst.e))) {
      worst.u.equip[worst.slot] = item;
      res.unit = worst.u; res.swapped = worst.e;
    }
  }
  res.discarded = trimInventory();
  return res;
}
// 持ち物が上限を超えたら、装備していないパーツで期待ダメージが一番低いものを捨てる
function trimInventory() {
  const out = [];
  while (inv.parts.length > INVENTORY_MAX) {
    const free = inv.parts.filter(i => !isEquipped(i));
    if (!free.length) break;
    free.sort((a, b) => expectedDamage(partOf(a)) - expectedDamage(partOf(b)));
    const drop = free[0];
    inv.parts = inv.parts.filter(i => i !== drop);
    out.push(drop);
  }
  return out;
}
// パーツを手に入れたときのメッセージ（レア度の色）
function logPartGain(res, verb) {
  const p = partOf(res.item), r = RARITY[p.rarity];
  const rareTag = p.rarity > 0 ? `（${r.name}${r.stars}）` : "";
  let tail = "";
  if (res.swapped) tail = `${res.unit.name}の『${partOf(res.swapped).name}』と入れ替えた`;
  else if (res.unit) tail = `${res.unit.name}に装備`;
  log(`『${p.name}』${rareTag}を${verb}！${tail ? `（${tail}）` : ""}`, r.color);
  for (const d of res.discarded || []) log(`持ち物がいっぱいなので『${partText(partOf(d))}』を捨てた。`);
}
// おまかせ装備：期待ダメージの高い順（同じなら消費ENの低い順）に、並び順の機体へ2つずつ
function autoEquipAll() {
  const sorted = inv.parts.slice().sort((a, b) => {
    const pa = partOf(a), pb = partOf(b);
    return expectedDamage(pb) - expectedDamage(pa) || pa.en - pb.en;
  });
  let k = 0;
  for (const u of team) {
    u.manual = false;
    for (let s = 0; s < SLOT_COUNT; s++) u.equip[s] = sorted[k++] || null;
  }
}

function addExp(u, amount) {
  if (u.lv >= LEVEL_MAX) return;
  u.exp += amount;
}
// レベルアップはバトルが終わってから処理する
function processLevelUps() {
  for (const u of team) {
    const before = u.lv;
    while (u.lv < LEVEL_MAX && u.exp >= expToNext(u.lv)) {
      u.exp -= expToNext(u.lv);
      u.lv++;
    }
    if (u.lv >= LEVEL_MAX) u.exp = 0;
    if (u.lv !== before) {
      const hpUp = maxHpOf(u) - u.maxHp, enUp = maxEnOf(u) - u.maxEn;
      u.maxHp += hpUp; u.maxEn += enUp;
      if (u.hp > 0) u.hp += hpUp;
      u.en += enUp;
      log(`${u.name}はLv${u.lv}になった！`);
      bestLevel = Math.max(bestLevel, u.lv);
    }
  }
}

function blankMap() {
  map = []; seen = []; visible = [];
  for (let y = 0; y < MAP_H; y++) {
    map.push(new Array(MAP_W).fill(WALL));
    seen.push(new Array(MAP_W).fill(false));
    visible.push(new Array(MAP_W).fill(false));
  }
}
function fillRect(x, y, w, h, t) { for (let yy = y; yy < y + h; yy++) for (let xx = x; xx < x + w; xx++) map[yy][xx] = t; }

function generateMap() {
  blankMap();
  const rooms = [];
  for (let i = 0; i < ROOM_TRIES && rooms.length < ROOM_MAX; i++) {
    const w = rndRange(4, 8), h = rndRange(3, 6);
    const x = rndRange(1, MAP_W - w - 2), y = rndRange(1, MAP_H - h - 2);
    if (rooms.some(o => x <= o.x + o.w && x + w >= o.x && y <= o.y + o.h && y + h >= o.y)) continue;
    rooms.push({ x, y, w, h });
    fillRect(x, y, w, h, FLOOR);
  }
  for (let i = 1; i < rooms.length; i++) {
    const a = center(rooms[i - 1]), b = center(rooms[i]);
    if (Math.random() < 0.5) { hCorr(a.x, b.x, a.y); vCorr(a.y, b.y, b.x); }
    else { vCorr(a.y, b.y, a.x); hCorr(a.x, b.x, b.y); }
  }
  return rooms;
}
function center(r) { return { x: r.x + (r.w >> 1), y: r.y + (r.h >> 1) }; }
function hCorr(x1, x2, y) { for (let x = Math.min(x1, x2); x <= Math.max(x1, x2); x++) map[y][x] = FLOOR; }
function vCorr(y1, y2, x) { for (let y = Math.min(y1, y2); y <= Math.max(y1, y2); y++) map[y][x] = FLOOR; }

const covers = (e, x, y) => x >= e.x && x < e.x + e.size && y >= e.y && y < e.y + e.size;
const enemyAt = (x, y) => enemies.find(e => covers(e, x, y));

function occupied(x, y) {
  return (pos.x === x && pos.y === y) || !!enemyAt(x, y) ||
         groundItems.some(it => it.x === x && it.y === y) || map[y][x] !== FLOOR;
}
function freeCellIn(r) {
  for (let t = 0; t < 60; t++) {
    const x = rndRange(r.x, r.x + r.w - 1), y = rndRange(r.y, r.y + r.h - 1);
    if (!occupied(x, y)) return { x, y };
  }
  return null;
}

function scaled(base, s) { return Math.max(1, Math.ceil(base * (s.base + s.perFloor * (floorNo - 1)))); }
// 動物（絵と名前）はバトルに入るときに決める
function makeEnemy(def, x, y) {
  const hp = scaled(def.hp, ENEMY_HP_SCALE);
  return { def, sprite: null, name: def.label + "の敵", x, y, size: 1,
           hp, maxHp: hp, atk: scaled(def.atk, ENEMY_ATK_SCALE),
           acc: def.acc - (floorNo <= EARLY_FLOORS ? EARLY_ACC_PENALTY : 0),
           exp: Math.ceil(def.exp * (1 + EXP_FLOOR_SCALE * (floorNo - 1))),
           boss: false, awake: false, stun: 0 };
}
function makeBoss(def, x, y) {
  return { def, sprite: "boss", name: def.name, x, y, size: 2,
           hp: def.hp, maxHp: def.hp, atk: def.atk, acc: def.acc, exp: def.exp,
           boss: true, awake: true, stun: 0 };
}
function chooseAnimal(e) {
  if (e.sprite) return;
  const list = e.def.animals.filter(a => floorNo >= a.minFloor);
  e.sprite = list[rnd(list.length)].sprite;
  e.name = animalName(e.sprite);
}

function pickEnemyType() {
  const pool = ENEMY_TYPES.filter(t => floorNo >= t.minFloor);
  let r = Math.random() * pool.reduce((s, t) => s + t.weight, 0);
  for (const t of pool) { if ((r -= t.weight) < 0) return t; }
  return pool[0];
}

function newFloor() {
  enemies = []; groundItems = [];
  if (isBossFloor(floorNo)) { bossFloor(); return; }

  let rooms = generateMap();
  while (rooms.length < 4) rooms = generateMap();
  const start = center(rooms[0]);
  pos = { x: start.x, y: start.y };
  const s = freeCellIn(rooms[rooms.length - 1]);
  map[s.y][s.x] = STAIRS;

  const count = floorNo <= EARLY_FLOORS ? rndRange(...EARLY_ENEMY_COUNT) : enemyCountFor(floorNo);
  for (let i = 0; i < count; i++) {
    const p = freeCellIn(rooms[1 + rnd(rooms.length - 1)]);
    if (p) enemies.push(makeEnemy(pickEnemyType(), p.x, p.y));
  }
  const itemCount = rndRange(MAP_ITEM_MIN, MAP_ITEM_MAX);
  for (let i = 0; i < itemCount; i++) {
    const p = freeCellIn(rooms[rnd(rooms.length)]);
    if (p) groundItems.push({ x: p.x, y: p.y, key: Math.random() < 0.5 ? "repair" : "cell" });
  }
  updateFov();
}

// ボス階：準備部屋 → 1本道の通路 → ボス部屋 → ボスの後ろに階段（左から右へ）
const BOSS_LAYOUT = {
  prep: { x: 2, y: 10, w: 7, h: 7 },     // 準備部屋
  corridorY: 13, corridorX: [9, 13],      // 通路（9 が出口の目印）
  room: { x: 14, y: 6, w: 10, h: 15 },    // ボス部屋（準備部屋より大きい）
  boss: { x: 22, y: 12 },                 // ボス（2×2）
  stairs: { x: 25, y: 13 },               // ボスの真後ろ。(24,13) はボスの横からしか入れない
  start: { x: 3, y: 13 },
  heal: { x: 5, y: 13 },
  items: [[3, 11], [7, 11], [3, 15], [7, 15]],
};
function bossFloor() {
  blankMap();
  const L = BOSS_LAYOUT;
  fillRect(L.prep.x, L.prep.y, L.prep.w, L.prep.h, FLOOR);
  for (let x = L.corridorX[0]; x <= L.corridorX[1]; x++) map[L.corridorY][x] = FLOOR;
  map[L.corridorY][L.corridorX[0]] = GATE;
  fillRect(L.room.x, L.room.y, L.room.w, L.room.h, BOSSFLOOR);
  map[L.stairs.y][L.stairs.x - 1] = BOSSFLOOR;
  map[L.stairs.y][L.stairs.x] = STAIRS;
  map[L.heal.y][L.heal.x] = HEAL;
  pos = { ...L.start };
  if (!progress.bossDefeated[floorNo]) enemies.push(makeBoss(BOSSES[floorNo], L.boss.x, L.boss.y));
  const keys = [];
  for (const [k, n] of Object.entries(BOSS_PREP_ITEMS)) for (let i = 0; i < n; i++) keys.push(k);
  keys.forEach((k, i) => { const [x, y] = L.items[i % L.items.length]; groundItems.push({ x, y, key: k }); });
  // ボス階は全体を見せる
  for (let y = 0; y < MAP_H; y++) { seen[y].fill(true); visible[y].fill(true); }
}

// ================================================================
//  視界
// ================================================================
function updateFov() {
  if (isBossFloor(floorNo)) return;
  for (let y = 0; y < MAP_H; y++) visible[y].fill(false);
  for (let dy = -FOV_RADIUS; dy <= FOV_RADIUS; dy++) {
    for (let dx = -FOV_RADIUS; dx <= FOV_RADIUS; dx++) {
      if (dx * dx + dy * dy > FOV_RADIUS * FOV_RADIUS + 1) continue;
      const tx = pos.x + dx, ty = pos.y + dy;
      if (tx < 0 || ty < 0 || tx >= MAP_W || ty >= MAP_H) continue;
      if (lineOfSight(pos.x, pos.y, tx, ty)) { visible[ty][tx] = true; seen[ty][tx] = true; }
    }
  }
}
function lineOfSight(x0, y0, x1, y1) {
  const dx = Math.abs(x1 - x0), dy = Math.abs(y1 - y0);
  const sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
  let err = dx - dy, x = x0, y = y0;
  while (!(x === x1 && y === y1)) {
    if (!(x === x0 && y === y0) && map[y][x] === WALL) return false;
    const e2 = 2 * err;
    if (e2 > -dy) { err -= dy; x += sx; }
    if (e2 < dx) { err += dx; y += sy; }
  }
  return true;
}

function log(msg, color) {
  logLines.push({ t: msg, c: color || "" });
  while (logLines.length > 3) logLines.shift();
  renderLog();
}
function renderLog() {
  for (const id of ["mapLog", "battleLog", "villageLog"]) {
    const divs = $(id).children, pad = 3 - logLines.length;
    for (let i = 0; i < 3; i++) {
      const l = i < pad ? null : logLines[i - pad];
      divs[i].textContent = l ? l.t : "";
      divs[i].style.color = l && l.c ? l.c : (i === 2 ? "#fff" : "");
    }
  }
}
const logText = () => logLines.map(l => l.t);

// ================================================================
//  マップでの行動
// ================================================================
const DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0], wait: [0, 0] };

function playerMove(dir) {
  if (mode !== "map") return;
  const [dx, dy] = DIRS[dir];
  const nx = pos.x + dx, ny = pos.y + dy;

  if (dx || dy) {
    const target = enemyAt(nx, ny);
    if (target) { startBattle(target); return; }
    if (map[ny][nx] === WALL) return;
    const wasBossRoom = map[pos.y][pos.x] === BOSSFLOOR;
    pos.x = nx; pos.y = ny;
    pickUpGround();
    const t = map[ny][nx];
    if (t === STAIRS) { descend(); return; }
    if (t === HEAL) healAll();
    if (t === GATE && dx > 0) log("この先はボス部屋。準備はいいか？");
    if (t === BOSSFLOOR && !wasBossRoom && enemies.some(e => e.boss)) {
      log(`強敵の気配がする…「${enemies.find(e => e.boss).name}」がいる！`);
    }
  }
  enemiesAct();
  updateFov();
  renderMap();
}

function healAll() {
  for (const u of team) { u.hp = u.maxHp; u.en = u.maxEn; }
  log("回復ポイント：全員のHPとENが全回復した。");
}

function pickUpGround() {
  const it = groundItems.find(i => i.x === pos.x && i.y === pos.y);
  if (!it) return;
  groundItems = groundItems.filter(i => i !== it);
  if (it.key === "part") {
    logPartGain(addPart(it.part), "拾った");
  } else {
    inv.items[it.key]++;
    log(`${ITEMS[it.key].name}を拾った。（所持${inv.items[it.key]}）`);
  }
}

function descend() {
  // 10階（最深部）の階段は村へ戻る道
  if (floorNo >= FINAL_FLOOR) { goVillage(["遺跡の最深部から地上へ戻った。"]); return; }
  floorNo++;
  progress.maxFloor = Math.max(progress.maxFloor, floorNo);
  for (const u of team) u.en = Math.min(u.maxEn, u.en + STAIRS_ENERGY_BONUS);
  if (DEBUG) for (const u of team) u.hp = u.maxHp;   // テスト用：階を降りるたびにHP全回復
  newFloor();
  if (isBossFloor(floorNo)) {
    log(`${floorNo}F ボスフロアに着いた。（全員EN+${STAIRS_ENERGY_BONUS}）`);
    log("準備部屋だ。回復ポイントで全回復できる。");
  } else {
    log(`${floorNo}Fへ降りた。（全員EN+${STAIRS_ENERGY_BONUS}）`);
  }
  renderMap();
}

function enemiesAct() {
  for (const e of enemies) {
    if (e.boss) continue;               // ボスは動かない
    if (e.stun > 0) { e.stun--; continue; }
    const dist = Math.abs(e.x - pos.x) + Math.abs(e.y - pos.y);
    if (!e.awake && dist <= ENEMY_SIGHT && lineOfSight(e.x, e.y, pos.x, pos.y)) e.awake = true;
    if (e.awake) {
      if (dist === 1) { startBattle(e); return; }
      const sx = Math.sign(pos.x - e.x), sy = Math.sign(pos.y - e.y);
      const tries = Math.abs(pos.x - e.x) >= Math.abs(pos.y - e.y) ? [[sx, 0], [0, sy]] : [[0, sy], [sx, 0]];
      for (const [mx, my] of tries) {
        if ((mx || my) && canEnemyMove(e.x + mx, e.y + my)) { e.x += mx; e.y += my; break; }
      }
    } else if (Math.random() < 0.3) {
      const d = Object.values(DIRS)[rnd(4)];
      if (canEnemyMove(e.x + d[0], e.y + d[1])) { e.x += d[0]; e.y += d[1]; }
    }
  }
}
function canEnemyMove(x, y) {
  if (map[y][x] !== FLOOR) return false;
  if (pos.x === x && pos.y === y) return false;
  return !enemyAt(x, y);
}

// ================================================================
//  バトル
// ================================================================
let skipWait = null;
function pause(ms = BATTLE_WAIT) {
  return new Promise(res => {
    const t = setTimeout(done, ms);
    function done() { clearTimeout(t); skipWait = null; res(); }
    skipWait = done;
  });
}

// バトル画面の絵の倍率。ボスは画面の半分の幅に収まる最大の整数倍（上限7）、通常の敵は5倍まで
function battleScales() {
  const w = Math.min(window.innerWidth, 520) - 24 - 20;
  const boss = Math.max(3, Math.min(7, Math.floor(w / 2 / BATTLE_W)));
  return { boss, enemy: Math.min(5, boss - 1), ally: 2 };
}

function startBattle(e) {
  mode = "battle";
  e.awake = true;
  chooseAnimal(e);
  for (const u of team) u.bs = freshBattleState();
  battle = { enemy: e, menu: "main", busy: false, actor: team.findIndex(u => u.hp > 0),
             round: 1, bossTurn: 0, heavyReady: false, itemKey: null, downs: 0, selected: null,
             roarTurns: 0, roarRate: 0, stunned: false, stats: { moves: {} } };
  log(e.boss ? `ボス「${e.name}」との戦闘！` : `${e.name}が現れた！`);
  $("mapScreen").hidden = true;
  $("battle").hidden = false;
  $("eName").className = e.boss ? "boss" : "";
  $("arena").classList.toggle("bossArena", e.boss);
  $("fx").textContent = "";
  // 絵：敵は右側で左向き（反転）、味方は左側に縦に並べて右向き
  const sc = battleScales();
  const ew = $("eWrap");
  ew.textContent = "";
  const ec = spriteEl(e.sprite, e.boss ? sc.boss : sc.enemy, true);
  ec.id = "eSprite";
  ew.append(ec);
  const allies = $("allies");
  allies.textContent = "";
  team.forEach((u, i) => {
    const d = document.createElement("div");
    d.className = "ally"; d.id = "ally" + i;
    d.append(spriteEl(u.sprite, sc.ally, false));
    allies.append(d);
  });
  renderBattle();
}

// バトル終了後の後片付け（勝ち・逃げ共通）
function afterBattle() {
  for (const u of team) {
    u.bs = freshBattleState();
    if (u.hp <= 0) { u.hp = Math.max(1, Math.floor(u.maxHp * REVIVE_HP_RATE)); log(`${u.name}が再起動した。（HP${u.hp}）`); }
  }
  processLevelUps();
}

function endBattle() {
  battle = null;
  mode = "map";
  $("battle").hidden = true;
  $("mapScreen").hidden = false;
  afterBattle();
  updateFov();
  resize();
}

const varied = power => Math.max(1, power + rndRange(-DAMAGE_VARIANCE, DAMAGE_VARIANCE));

// ---- 演出（設定でオフにできる。ダメージの数字とメッセージは常に出す） ----
function restartAnim(el, cls) { if (!el) return; el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }
function showBanner(text) {
  if (!settings.fx) return false;
  const b = $("banner"); b.textContent = text; restartAnim(b, "show");
  return true;
}
function flashScreen(kind) {
  if (!settings.fx || !kind) return;   // 1行動で1回だけ。点滅はしない
  const f = $("flash"); f.style.background = FLASH_COLORS[kind]; restartAnim(f, "show");
}
function shake(el) { if (settings.fx) restartAnim(el, "shake2"); }
function popNumber(text, color, where = "enemy", big = false) {
  const f = $("fx");
  f.textContent = text; f.style.color = color;
  f.className = `${where}${big ? " critNum" : ""}`;
  restartAnim(f, "pop");
}

function levelUpSkill(u, key) {
  if (key !== "guard" && key !== "unique") return;   // たいあたりとパーツにはスキルレベルがない
  if (u.skills[key] < SKILL_MAX_LEVEL) u.skills[key]++;
}

function useItem(key, target) {
  inv.items[key]--;
  if (key === "repair") {
    const before = target.hp;
    target.hp = Math.min(target.maxHp, target.hp + ITEMS.repair.value);
    log(`${ITEMS.repair.name}で${target.name}のHPが${target.hp - before}回復。`);
  } else {
    const before = target.en;
    target.en = Math.min(target.maxEn, target.en + ITEMS.cell.value);
    log(`${ITEMS.cell.name}で${target.name}のENが${target.en - before}回復。`);
  }
}

// ---- わざの計算 ----
const lerp = (a, b, lv) => a + (b - a) * (Math.min(SKILL_MAX_LEVEL, Math.max(1, lv)) - 1) / (SKILL_MAX_LEVEL - 1);
const lerpInt = (a, b, lv) => Math.floor(lerp(a, b, lv) + 1e-9);
const lerpMul = (a, b, lv) => Math.floor(lerp(a, b, lv) * 100 + 1e-9) / 100;

// その機体が使えるわざ（一覧の順：たいあたり、防御、固有技、自由枠1、自由枠2）
function moveKeys(u) {
  const keys = ["tackle", "guard", "unique"];
  u.equip.forEach((it, i) => { if (it) keys.push("part" + i); });
  return keys;
}
function moveDef(u, key) {
  if (key === "tackle" || key === "guard") return MOVES[key];
  if (key === "unique") return MOVES[u.unique];
  const p = partOf(u.equip[+key.slice(4)]);
  return { id: key, name: p.name, kind: "part", en: p.en, acc: p.acc, target: "enemy", effect: "damage", element: null, part: p };
}
function partEnCost(u, p) {
  const t = typeOf(u);
  let c = p.en;
  if (t && t.partEnRate) c = Math.max(1, Math.ceil(c * t.partEnRate));   // 砲撃型の割引
  if (u.bs.barrage) c = Math.max(1, Math.ceil(c / 2));                    // 集中砲火
  return c;
}
// 味方の命中率（型の補正、鷹の目、連続ミスの補正、下限50%）
function hitChance(u, base, opts = {}) {
  if (opts.sure) return 100;
  const t = typeOf(u);
  let a = base + u.accBonus + (opts.mod || 0) + u.bs.accUp + Math.min(MISS_STREAK_CAP, u.bs.missStreak * MISS_STREAK_BONUS);
  if (opts.part && t && t.heavyAccBonus && opts.part.type !== "gun") a += t.heavyAccBonus;
  return Math.max(PLAYER_ACC_MIN, Math.min(100, a));
}
function critRateOf(u) {
  const t = typeOf(u);
  let r = (t && t.critRate) || 0;
  if (r && battle && battle.enemy.boss && battle.heavyReady) r += CRIT_CHARGE_BONUS;
  return r + u.bs.critUp;
}
// わざの中身（一覧の表示、予測、実行、ボットで共通に使う）
function moveInfo(u, key) {
  const d = moveDef(u, key);
  const lv = key === "guard" ? u.skills.guard : key === "unique" ? u.skills.unique : 0;
  const info = { key, def: d, name: d.name, kind: d.kind, lv, en: 0, damaging: false, hits: 1, power: 0, acc: null, sure: false, desc: "", short: "" };
  const tk = tackleOf(u), vsBoss = !!(battle && battle.enemy.boss);
  if (key === "tackle") {
    Object.assign(info, { damaging: true, power: tk, acc: hitChance(u, TACKLE_ACC), short: `威力${tk}`, desc: d.desc });
  } else if (key === "guard") {
    const rec = guardRecover(lv);
    Object.assign(info, { short: `EN+${rec}`, desc: `次に受けるダメージを半分にし、ENを${rec}回復する。攻撃はしない。` });
  } else if (d.kind === "part") {
    const p = d.part;
    info.en = partEnCost(u, p);
    info.power = u.bs.barrage ? Math.floor(p.power * u.bs.barrage) : p.power;
    Object.assign(info, { damaging: true, acc: hitChance(u, p.acc, { part: p }), short: `威力${info.power}`,
      desc: `${PART_TYPE_LABEL[p.type]}（${RARITY[p.rarity].name}）。${p.type === "gun" ? "外れにくい堅実な武器。" : p.type === "missile" ? "当たれば大きい一発逆転の武器。" : "強いがENを多く使う武器。"}${u.bs.barrage ? `集中砲火で威力×${u.bs.barrage}、EN半分。` : ""}` });
  } else {
    info.en = d.en;
    switch (d.id) {
      case "crit": { const v = lerpInt(d.lv1, d.lv10, lv); info.value = v; info.short = `会心+${v}%`; info.desc = `次の攻撃の会心率が+${v}%（1回限り）。`; break; }
      case "barrage": { const m = lerpMul(d.lv1, d.lv10, lv); info.value = m; info.short = `次の武器×${m}`; info.desc = `次のパーツのわざの消費ENが半分、威力×${m}（1回限り）。`; break; }
      case "blind": { const n = lv >= d.twoAtLv ? 2 : 1; info.value = n; info.short = `回避${n}回`; info.desc = `次の敵の攻撃を${n}回、確実にかわす。ボスの強攻撃はかわせない。`; break; }
      case "curl": { const v = lerpInt(d.lv1, d.lv10, lv); info.value = v; info.short = `HP+${v}%`; info.desc = `次の被ダメージ−${d.cut}%。HPを最大の${v}%回復。`; break; }
      case "cover": { const v = lerpInt(d.lv1, d.lv10, lv); info.value = v; info.short = `かばう−${v}%`; info.desc = `次の敵の攻撃を、狙われた相手に関係なく自分が受ける。受けるダメージ−${v}%。`; break; }
      case "roar": { const v = lerpInt(d.lv1, d.lv10, lv); info.value = vsBoss ? Math.floor(v / 2) : v; info.short = `攻撃−${info.value}%`; info.desc = `敵の攻撃力を${d.turns}ターンの間−${v}%（ボスには半分）。`; break; }
      case "hawkeye": { const v = lerpInt(d.lv1, d.lv10, lv); info.value = v; info.short = `全員命中+${v}%`; info.desc = `味方全員の次の攻撃の命中+${v}%（1人1回ずつ）。`; break; }
      case "claws": { const m = lerpMul(d.lv1, d.lv10, lv); const per = Math.max(1, Math.round(tk * m / 2));
        Object.assign(info, { damaging: true, hits: 2, power: per, acc: hitChance(u, TACKLE_ACC, { mod: d.accMod }), short: `威力${per}×2`, desc: `2回攻撃（合計はたいあたりの×${m}）。命中+${d.accMod}%。` }); break; }
      case "dive": { const m = lerpMul(d.lv1, d.lv10, lv); const pw = Math.max(1, Math.floor(tk * m));
        Object.assign(info, { damaging: true, power: pw, sure: true, acc: 100, short: `威力${pw}`, desc: `たいあたりの×${m}。必ず当たる。` }); break; }
      case "bite": { const m = lerpMul(d.lv1, d.lv10, lv); let pw = Math.max(1, Math.floor(tk * m)); if (vsBoss) pw = Math.floor(pw * d.bossBonus);
        Object.assign(info, { damaging: true, power: pw, acc: hitChance(u, TACKLE_ACC, { mod: d.accMod }), short: `威力${pw}`,
          desc: `たいあたりの×${m}、命中${d.accMod}%。当たると敵は次のターン動けない（ボスには効かず、代わりにダメージ+20%）。` }); break; }
    }
  }
  return info;
}

// 攻撃の処理（ダメージの式はパーツもたいあたりも固有技も同じ）
function doDamage(u, info) {
  const e = battle.enemy;
  let hitAny = false;
  for (let h = 0; h < info.hits && e.hp > 0; h++) {
    const label = info.hits > 1 ? `${info.name}(${h + 1})` : info.name;
    if (!info.sure && !roll(info.acc)) {
      u.bs.missStreak = Math.min(MISS_STREAK_CAP / MISS_STREAK_BONUS, u.bs.missStreak + 1);
      battle.stats.maxMissStreak = Math.max(battle.stats.maxMissStreak || 0, u.bs.missStreak);
      log(`${u.name}の${label}！ 外れた。`);
      popNumber("ミス", "#bbb", "miss");
      continue;
    }
    u.bs.missStreak = 0;
    let dmg = varied(info.power);
    const crit = roll(critRateOf(u));
    if (crit) dmg = Math.floor(dmg * CRIT_MULT);
    e.hp = Math.max(0, e.hp - dmg);
    hitAny = true;
    log(`${u.name}の${label}！ ${crit ? "会心！ " : ""}${dmg}ダメージ。`, crit ? "#ffd447" : "");
    popNumber(`-${dmg}`, crit ? "#ffd447" : "#fff", "enemy", crit);
    shake($("eSprite"));
  }
  // 1回限りの効果はここで使い切る
  u.bs.critUp = 0; u.bs.accUp = 0;
  if (info.kind === "part") u.bs.barrage = 0;
  if (hitAny && info.def.stun && !e.boss) { battle.stunned = true; log(`${e.name}はひるんで動けない！`); }
}

// わざを使う
function executeMove(u, key) {
  const info = moveInfo(u, key), d = info.def;
  u.en -= info.en;
  // 集計（テストと調整用）：わざの種類、攻撃の種類、固有技ごとの回数
  const st = battle.stats;
  st.moves[d.kind] = (st.moves[d.kind] || 0) + 1;
  if (info.damaging) (st.attacks ||= {})[d.kind] = (st.attacks[d.kind] || 0) + 1;
  if (d.kind === "unique") (st.uniques ||= {})[d.id] = (st.uniques[d.id] || 0) + 1;
  showBanner(info.name);
  if (d.kind === "unique") flashScreen(d.flash);
  if (key === "guard") {
    u.bs.guard = GUARD_CUT;
    const rec = guardRecover(u.skills.guard), before = u.en;
    u.en = Math.min(u.maxEn, u.en + rec);
    log(`${u.name}は防御の構え。EN+${u.en - before}。`);
  } else if (info.damaging) {
    doDamage(u, info);
  } else {
    switch (d.id) {
      case "crit": u.bs.critUp = info.value; log(`${u.name}は力をためた。次の攻撃の会心率+${info.value}%！`); break;
      case "barrage": u.bs.barrage = info.value; log(`${u.name}は照準を合わせた。次のパーツはEN半分・威力×${info.value}！`); break;
      case "blind": u.bs.blind = info.value; log(`${u.name}の目くらまし！ 次の攻撃を${info.value}回かわす。`); break;
      case "curl": { u.bs.curl = d.cut; const before = u.hp; u.hp = Math.min(u.maxHp, u.hp + Math.floor(u.maxHp * info.value / 100));
        log(`${u.name}はまるまった。HP+${u.hp - before}、次の被ダメージ−${d.cut}%。`); popNumber(`+${u.hp - before}`, "#5fe07a", "ally"); break; }
      case "cover": u.bs.cover = info.value; log(`${u.name}は仲間をかばう構え。`); break;
      case "roar": battle.roarTurns = d.turns; battle.roarRate = info.value; log(`${u.name}のほえる！ ${battle.enemy.name}の攻撃力が${d.turns}ターン−${info.value}%。`); break;
      case "hawkeye": for (const a of alive()) a.bs.accUp = info.value; log(`${u.name}の鷹の目！ 味方全員の次の攻撃の命中+${info.value}%。`); break;
    }
  }
  levelUpSkill(u, key === "guard" ? "guard" : d.kind === "unique" ? "unique" : null);
}

// 各コマンド。"escaped" を返すとバトル終了
const ACTIONS = {
  move(u, key) { executeMove(u, key); },
  tackle(u) { executeMove(u, "tackle"); },      // 互換用
  item(u, arg) { useItem(arg.key, arg.target); },
  escape(u) {
    if (roll(ESCAPE_RATE)) {
      log("うまく逃げ切った！");
      battle.enemy.stun = ESCAPE_STUN_TURNS;
      return "escaped";
    }
    log(`${u.name}は逃げようとしたが、失敗した！`);
  },
};

function nextActor(from) {
  for (let i = from + 1; i < team.length; i++) if (team[i].hp > 0) return i;
  return -1;
}

async function runCommand(action, arg) {
  if (!battle || battle.busy) return;
  battle.busy = true;
  battle.menu = "main";
  battle.selected = null;
  const u = team[battle.actor];
  const result = ACTIONS[action](u, arg);
  renderBattle();
  // 技名の表示があるときだけ、待ち時間を少し延ばす（追加は最大0.5秒）
  const extra = settings.fx && (action === "move" || action === "tackle") ? Math.min(FX_EXTRA_WAIT_MAX, Math.max(0, FX_BANNER_MS - BATTLE_WAIT)) : 0;
  await pause(BATTLE_WAIT + extra);

  if (result === "escaped") { endBattle(); return; }
  if (battle.enemy.hp <= 0) { winBattle(); return; }

  const next = nextActor(battle.actor);
  if (next >= 0) {
    battle.actor = next;
    battle.busy = false;
    renderBattle();
    return;
  }
  // 味方全員が行動したら、敵の番
  battle.actor = -1;
  renderBattle();
  await enemyPhase();
  if (alive().length === 0) {
    await pause(500);
    onDefeat();
    return;
  }
  battle.round++;
  battle.actor = nextActor(-1);
  battle.busy = false;
  renderBattle();
}

function randomAlive() { const a = alive(); return a.length ? a[rnd(a.length)] : null; }

// 敵の攻撃。heavy=ボスの強攻撃（必中：回避も目くらましも無視。防御と軽減は有効）
function enemyStrike(e, target, power, acc, label, heavy = false) {
  // かくれがえし：狙われた相手に関係なく、構えている機体が受ける
  let u = target, coverCut = 0;
  const coverer = alive().find(a => a.bs.cover);
  if (coverer) {
    u = coverer; coverCut = coverer.bs.cover; coverer.bs.cover = 0;
    if (coverer !== target) log(`${coverer.name}が${target.name}をかばった！`);
  }
  if (!heavy) {
    if (u.bs.blind > 0) {
      u.bs.blind--;
      log(`${label}！ ${u.name}は目くらましでかわした。`);
      popNumber("回避", "#8fd", "ally");
      return;
    }
    const ev = Math.min(EVADE_CAP, u.evade);
    const chance = Math.max(ENEMY_ACC_MIN, acc - ev) + u.bs.evadeStreak * EVADE_STREAK_BONUS;
    if (!roll(chance)) {
      if (ev > 0) { u.bs.evadeStreak++; log(`${label}！ ${u.name}はひらりとかわした。`); popNumber("回避", "#8fd", "ally"); }
      else { log(`${label}！ ${u.name}への攻撃は外れた。`); popNumber("ミス", "#8fd", "ally"); }
      return;
    }
  }
  u.bs.evadeStreak = 0;
  let dmg = varied(power);
  const cut = [];
  if (u.bs.guard) { dmg *= u.bs.guard; u.bs.guard = 0; cut.push("防御"); }
  if (u.bs.curl) { dmg *= 1 - u.bs.curl / 100; u.bs.curl = 0; cut.push("まるまる"); }
  if (coverCut) { dmg *= 1 - coverCut / 100; cut.push("かくれがえし"); }
  dmg = Math.max(1, Math.round(dmg));
  u.hp = Math.max(0, u.hp - dmg);
  log(`${label}！ ${u.name}に${dmg}ダメージ${cut.length ? `（${cut.join("・")}）` : ""}。`);
  popNumber(`-${dmg}`, "#ff6a6a", "ally");
  shake($("ally" + team.indexOf(u)));
  if (u.hp === 0) { battle.downs++; log(`${u.name}は動けなくなった！`); }
}

// ほえるで下がった攻撃力
function enemyPower(e, mult = 1) {
  let p = e.atk * mult;
  if (battle.roarTurns > 0) p = p * (1 - battle.roarRate / 100);
  return Math.max(1, Math.round(p));
}

async function enemyPhase() {
  const e = battle.enemy;
  const endTurn = () => { if (battle.roarTurns > 0) battle.roarTurns--; };
  if (battle.stunned) {
    battle.stunned = false;
    log(`${e.name}は動けない！`);
    renderBattle(); await pause(); endTurn();
    return;
  }
  if (!e.boss) {
    const t = randomAlive();
    if (t) enemyStrike(e, t, enemyPower(e), e.acc, `${e.name}の攻撃`);
    renderBattle();
    await pause();
    endTurn();
    return;
  }
  battle.bossTurn++;
  if (battle.heavyReady) {
    battle.heavyReady = false;
    const t = randomAlive();
    if (t) enemyStrike(e, t, enemyPower(e, BOSS_HEAVY_MULT), e.acc - BOSS_HEAVY_ACC_DOWN, `${e.name}の強攻撃`, true);
    renderBattle();
    await pause();
    endTurn();
    return;
  }
  if (battle.bossTurn % BOSS_CHARGE_EVERY === 0) {
    battle.heavyReady = true;
    log(`${e.name}は力を溜めている…！ 次は強攻撃だ。`);
    popNumber("力を溜めている", "#ffb02e", "center");
    renderBattle();
    await pause();
    endTurn();
    return;
  }
  const times = e.def.doubleBelowHalf && e.hp <= e.maxHp / 2 ? 2 : 1;
  for (let i = 0; i < times; i++) {
    const t = randomAlive();
    if (!t) break;
    enemyStrike(e, t, enemyPower(e), e.acc, times > 1 ? `${e.name}の連撃(${i + 1})` : `${e.name}の攻撃`);
    renderBattle();
    await pause();
  }
  endTurn();
}

// 落とすパーツを決める（系統とレア度）
function rollNormalDrop(e) {
  if (Math.random() >= PART_DROP_RATE) return null;
  const band = DROP_RARITY.find(b => floorNo <= b.maxFloor) || DROP_RARITY[DROP_RARITY.length - 1];
  const rarity = pickWeighted(band.rates);
  return PARTS.find(p => p.type === e.def.drop && p.rarity === rarity).id;
}
function rollBossDrop(f) {
  const rarity = pickWeighted(BOSS_DROP_RARITY[f]);
  const types = Object.keys(PART_TYPE_LABEL);
  const type = types[rnd(types.length)];
  return PARTS.find(p => p.type === type && p.rarity === rarity).id;
}

function winBattle() {
  const e = battle.enemy;
  battle.result = { rounds: battle.round, downs: battle.downs, boss: e.boss };
  lastBattle = battle.result;
  enemies = enemies.filter(o => o !== e);
  const living = alive();
  for (const u of living) { u.en = Math.min(u.maxEn, u.en + WIN_ENERGY_BONUS); addExp(u, e.exp); }
  log(`${e.name}を破壊した！${e.exp ? ` EXP+${e.exp}` : ""}`);
  $("eSprite").style.opacity = "0.2";

  if (e.boss) {
    progress.bossDefeated[floorNo] = true;
    if (floorNo >= FINAL_FLOOR) progress.cleared = true;
    saveGame();   // ボスを倒したら自動保存
  }
  if (e.boss && floorNo >= FINAL_FLOOR) {
    const loot = rollBossDrop(floorNo);
    lastBattle.loot = loot;
    renderBattle();
    setTimeout(() => gameClear(loot), 700);
    return;
  }

  if (e.boss) {
    // 落とし物はボスのいた場所に出る
    const id = rollBossDrop(floorNo);
    groundItems.push({ x: e.x, y: e.y, key: "part", part: id });
    const p = partById(id), r = RARITY[p.rarity];
    log(`『${p.name}』（${r.name}${r.stars}）が落ちた！ 奥の階段が使える。`, r.color);
  } else {
    const id = rollNormalDrop(e);
    if (id) logPartGain(addPart(id), "手に入れた");
    if (Math.random() < ITEM_DROP_RATE) {
      const key = Math.random() < 0.5 ? "repair" : "cell";
      inv.items[key]++;
      log(`${ITEMS[key].name}を手に入れた。`);
    }
    if (team.length < TEAM_MAX && Math.random() < e.def.recruit) recruit(e);
  }
  battle.menu = "result";
  battle.actor = -1;
  battle.busy = false;
  renderBattle();
}

// 仲間は、最初の機体と同じレベルで加わる。名前と絵と固有技は元の動物
function recruit(e) {
  const def = e.def;
  const u = createUnit({ name: uniqueName(e.name), sprite: e.sprite, kind: def.key,
    hp: def.ally.hp, en: def.ally.en, tackle: def.ally.tackle, lv: leader().lv, unique: ANIMAL_UNIQUE[e.sprite] });
  team.push(u);
  addPart(def.ally.part, u);
  log(`${u.name}が仲間になった！（Lv${u.lv}・固有技「${MOVES[u.unique].name}」）`);
}

// ---- コマンドの一覧 ----
function pickMove(key) {
  const u = team[battle.actor], info = moveInfo(u, key);
  if (info.en > u.en) { log("ENが足りない！"); return; }
  if (settings.instant || battle.selected === key) { runCommand("move", key); return; }
  battle.selected = key;
  renderBattle();
}
function battleCommands() {
  const b = battle, cmds = [];
  if (b.menu === "result") return [{ label: "つづける", sub: "マップにもどる", act: endBattle }];
  if (b.actor < 0) return [];
  const u = team[b.actor];
  const back = { label: "もどる", back: true, act: () => { b.menu = "main"; b.selected = null; renderBattle(); } };
  if (b.menu === "main") {
    cmds.push({ label: "わざ", sub: "攻撃・防御・固有技・パーツ", act: () => { b.menu = "moves"; b.selected = null; renderBattle(); } });
    cmds.push({ label: "アイテム", sub: `修理${inv.items.repair} セル${inv.items.cell}`, act: () => { b.menu = "item"; renderBattle(); } });
    cmds.push({ label: "にげる", sub: b.enemy.boss ? "ボスからは逃げられない" : `成功率${ESCAPE_RATE}%`,
                disabled: b.enemy.boss, act: () => runCommand("escape") });
  } else if (b.menu === "moves") {
    for (const key of moveKeys(u)) {
      const info = moveInfo(u, key), d = info.def;
      const lvTxt = info.lv ? ` Lv${info.lv}` : "";
      // パーツの★は2行目の頭に出す（名前が長くても★が切れないように）
      const stars = d.kind === "part" && d.part.rarity ? RARITY[d.part.rarity].stars + " " : "";
      const c = { key, label: info.name + lvTxt,
        sub: `${stars}EN${info.en}　${info.short}${info.acc != null ? `　命中${info.acc}%` : ""}`,
        noen: info.en > u.en, selected: b.selected === key, act: () => pickMove(key) };
      if (d.kind === "part") { c.color = RARITY[d.part.rarity].color; c.mark = d.part.type; }
      else if (d.kind === "unique") c.mark = "unique";
      cmds.push(c);
    }
    cmds.push(back);
  } else if (b.menu === "item") {
    for (const key of ["repair", "cell"]) {
      cmds.push({ label: `${ITEMS[key].name} ×${inv.items[key]}`, sub: key === "repair" ? `HP+${ITEMS[key].value}` : `EN+${ITEMS[key].value}`,
                  disabled: inv.items[key] <= 0, act: () => { b.itemKey = key; b.menu = "itemTarget"; renderBattle(); } });
    }
    cmds.push(back);
  } else if (b.menu === "itemTarget") {
    const key = b.itemKey;
    for (const t of alive()) {
      const full = key === "repair" ? t.hp >= t.maxHp : t.en >= t.maxEn;
      cmds.push({ label: t.name, sub: key === "repair" ? `HP ${t.hp}/${t.maxHp}` : `EN ${t.en}/${t.maxEn}`,
                  disabled: full, act: () => runCommand("item", { key, target: t }) });
    }
    cmds.push({ label: "もどる", back: true, act: () => { b.menu = "item"; renderBattle(); } });
  }
  return cmds;
}

// 選んだわざの説明・命中率・予測ダメージ
function renderMoveInfo() {
  const box = $("moveInfo");
  const b = battle;
  // 選んでいる間は、メッセージ欄の場所に説明を出す（スマホでも1画面に収まるように）
  const show = !!(b && b.menu === "moves" && b.selected && !b.busy && b.actor >= 0);
  box.hidden = !show;

let currentCmds = [];
function renderBattle() {
  const e = battle.enemy;
  $("eName").textContent = (e.boss ? "BOSS " : "") + e.name;
  const st = [];
  if (battle.roarTurns > 0) st.push(`攻撃−${battle.roarRate}%（残り${battle.roarTurns}）`);
  if (battle.stunned) st.push("ひるみ");
  $("eHpText").textContent = `${st.length ? st.join(" ") + "　" : ""}HP ${e.hp}/${e.maxHp}`;
  $("eHpBar").firstElementChild.style.width = (100 * e.hp / e.maxHp) + "%";
  $("charge").textContent = "⚡ 力を溜めている！ 次のターンに強攻撃（必中）";
  $("charge").hidden = !battle.heavyReady;

  team.forEach((u, i) => {
    const d = $("ally" + i);
    if (!d) return;
    d.classList.toggle("active", i === battle.actor);
    d.classList.toggle("down", u.hp <= 0);
  });
  const party = $("party");
  party.textContent = "";
  team.forEach((u, i) => {
    const r = document.createElement("div");
    r.className = "prow" + (i === battle.actor ? " active" : "") + (u.hp <= 0 ? " down" : "");
    r.innerHTML = `<span class="nm"></span><span class="bars"><span class="bar hp"><i></i></span><span class="bar en"><i></i></span></span><span class="num hpn"></span><span class="num enn"></span>`;
    r.querySelector(".nm").textContent = u.name;
    const small = document.createElement("small"); small.textContent = ` Lv${u.lv}`;
    r.querySelector(".nm").append(small);
    r.querySelector(".bar.hp i").style.width = (100 * u.hp / u.maxHp) + "%";
    r.querySelector(".bar.en i").style.width = (100 * u.en / u.maxEn) + "%";
    r.querySelector(".hpn").textContent = u.hp > 0 ? `${u.hp}/${u.maxHp}` : "停止";
    r.querySelector(".hpn").classList.toggle("low", u.hp > 0 && u.hp <= u.maxHp * 0.3);
    r.querySelector(".enn").textContent = `EN${u.en}/${u.maxEn}`;
    const s = [];
    if (u.bs.guard) s.push("防御中");
    if (u.bs.critUp) s.push(`会心+${u.bs.critUp}%`);
    if (u.bs.barrage) s.push(`集中砲火×${u.bs.barrage}`);
    if (u.bs.blind) s.push(`目くらまし${u.bs.blind}`);
    if (u.bs.curl) s.push("まるまる");
    if (u.bs.cover) s.push("かばう");
    if (u.bs.accUp) s.push(`命中+${u.bs.accUp}%`);
    if (u.bs.missStreak) s.push(`次の命中+${Math.min(MISS_STREAK_CAP, u.bs.missStreak * MISS_STREAK_BONUS)}%`);
    if (s.length) { const d = document.createElement("span"); d.className = "st"; d.textContent = s.join("　"); r.append(d); }
    party.append(r);
  });

  const titles = { main: "の行動", moves: "：わざを選ぶ", item: "：アイテムを選ぶ", itemTarget: "：使う相手を選ぶ" };
  const title = $("cmdTitle");
  title.textContent = "";
  if (battle.menu === "result") title.textContent = "勝利！";
  else if (battle.actor >= 0 && !battle.busy) {
    const b = document.createElement("b"); b.textContent = team[battle.actor].name;
    title.append(b, titles[battle.menu]);
  } else title.textContent = battle.actor < 0 ? `${e.name}の行動…` : "…";

  currentCmds = battle.busy ? [] : battleCommands();
  const box = $("cmds");
  box.textContent = "";
  box.classList.toggle("moveList", battle.menu === "moves");
  currentCmds.forEach((c, i) => {
    const btn = document.createElement("button");
    const k = document.createElement("span"); k.className = "k"; k.textContent = c.back ? "0" : String(i + 1);
    const lab = document.createElement("span"); lab.textContent = c.label;
    if (c.color) lab.style.color = c.color;
    const line = document.createElement("span");
    line.append(k);
    if (c.mark) line.append(el("span", "mk mk-" + c.mark, c.mark === "unique" ? "固" : PART_TYPE_LABEL[c.mark][0]));
    line.append(lab);
    btn.append(line);
    if (c.sub) { const sm = document.createElement("small"); sm.textContent = c.sub; btn.append(sm); }
    if (c.back) btn.classList.add("back");
    if (c.noen) btn.classList.add("noen");
    if (c.selected) btn.classList.add("sel");
    if (c.key) btn.dataset.key = c.key;
    btn.disabled = !!c.disabled;
    btn.addEventListener("click", () => { if (!btn.disabled && c.act) c.act(); });
    box.append(btn);
  });
  renderMoveInfo();
}

function battleKey(key) {
  if (!battle) return false;
  if (battle.busy) { if (skipWait) skipWait(); return true; }
  if (key === "0" || key === "Escape" || key === "Backspace") {
    const back = currentCmds.find(c => c.back);
    if (back) { back.act(); return true; }
    return false;
  }
  if (key === "Enter") {
    if (battle.menu === "result") { endBattle(); return true; }
    if (battle.menu === "moves" && battle.selected) { runCommand("move", battle.selected); return true; }
    return false;
  }
  const n = parseInt(key, 10);
  if (n >= 1 && n <= currentCmds.length) {
    const c = currentCmds[n - 1];
    if (!c.disabled && !c.back && c.act) c.act();
    return true;
  }
  return false;
}

// ================================================================
//  描画（マップ）。12×12ドットのタイルを整数倍で並べる
// ================================================================
function resize() {
  if (mode !== "map" && mode !== "menu") return;
  if (!team || !map) return;
  const availW = Math.min(window.innerWidth, 520) - 24;
  const others = $("mapScreen").offsetHeight - cv.offsetHeight;
  const availH = window.innerHeight - others - 16;
  // 画面に収まる最大の整数倍。マス数は 13〜15 列、11〜15 行の範囲で合わせる
  let pick = null;
  for (let s = 4; s >= 1; s--) {
    const cols = Math.min(VIEW_MAX, Math.floor(availW / (MAP_N * s)));
    const rows = Math.min(VIEW_MAX, Math.floor(availH / (MAP_N * s)));
    if (cols >= VIEW_MIN_COLS && rows >= VIEW_MIN_ROWS) { pick = { s, cols, rows }; break; }
  }
  if (!pick) pick = { s: 1, cols: VIEW_MAX, rows: VIEW_MAX };
  mapScale = pick.s; viewCols = pick.cols; viewRows = pick.rows;
  pxRatio = Math.max(1, Math.round(window.devicePixelRatio || 1));
  const T = MAP_N * mapScale;
  cv.style.width = viewCols * T + "px";
  cv.style.height = viewRows * T + "px";
  cv.width = viewCols * T * pxRatio;
  cv.height = viewRows * T * pxRatio;
  renderMap();
}

function renderMap() {
  if (!map) return;
  const s = mapScale * pxRatio, T = MAP_N * s;
  const camX = Math.max(0, Math.min(MAP_W - viewCols, pos.x - (viewCols >> 1)));
  const camY = Math.max(0, Math.min(MAP_H - viewRows, pos.y - (viewRows >> 1)));
  const draw = (key, x, y, mult = 1) => {
    const px = (x - camX) * T, py = (y - camY) * T;
    if (px + T * mult <= 0 || py + T * mult <= 0 || px >= cv.width || py >= cv.height) return;
    ctx.drawImage(spriteImage(key, s * mult, false), px, py);
  };

  ctx.imageSmoothingEnabled = false;
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, cv.width, cv.height);

  for (let vy = 0; vy < viewRows; vy++) {
    for (let vx = 0; vx < viewCols; vx++) {
      const x = camX + vx, y = camY + vy;
      if (!seen[y][x]) continue;
      const t = map[y][x];
      if (t === WALL) draw("t_wall", x, y);
      else if (t === BOSSFLOOR) draw("t_bossfloor", x, y);
      else if (t === GATE) draw("t_gate", x, y);
      else draw("t_floor", x, y);
      if (t === STAIRS) draw("m_stairs", x, y);
      if (t === HEAL) draw("m_heal", x, y);
    }
  }
  for (const it of groundItems) {
    if (!seen[it.y][it.x]) continue;
    draw(it.key === "part" ? "m_parts" : "m_" + ITEMS[it.key].icon, it.x, it.y);
  }
  for (const e of enemies) {
    if (!visible[e.y][e.x]) continue;
    if (e.boss) { draw("m_boss", e.x, e.y, 2); continue; }   // ボスは2倍で2×2マス
    draw("m_enemy", e.x, e.y);
    if (e.hp < e.maxHp) {
      const px = (e.x - camX) * T, py = (e.y - camY) * T;
      ctx.fillStyle = "#400"; ctx.fillRect(px + s, py + T - 2 * s, T - 2 * s, s);
      ctx.fillStyle = "#f44"; ctx.fillRect(px + s, py + T - 2 * s, (T - 2 * s) * e.hp / e.maxHp, s);
    }
  }
  draw("m_player", pos.x, pos.y);
  // 探索済みだが今見えていないマスは暗くする
  ctx.fillStyle = "rgba(0,0,0,0.5)";
  for (let vy = 0; vy < viewRows; vy++) for (let vx = 0; vx < viewCols; vx++) {
    const x = camX + vx, y = camY + vy;
    if (seen[y][x] && !visible[y][x]) ctx.fillRect(vx * T, vy * T, T, T);
  }
  updateStatus();
}
function updateStatus() {
  const fl = $("floorLabel");
  fl.textContent = isBossFloor(floorNo) ? `${floorNo}F ボスフロア` : `${floorNo}F`;
  fl.classList.toggle("bossfl", isBossFloor(floorNo));
  const rows = $("teamRows");
  rows.textContent = "";
  for (const u of team) {
    const r = el("div", "trow");
    const nm = el("span", "nm", u.name); nm.append(el("small", "", ` Lv${u.lv}`));
    const bars = el("span", "bars");
    const bar = el("span", "bar hp"); const i = el("i"); i.style.width = (100 * u.hp / u.maxHp) + "%"; bar.append(i);
    const ebar = el("span", "bar en"); const j = el("i"); j.style.width = (100 * u.en / u.maxEn) + "%"; ebar.append(j);
    bars.append(bar, ebar);
    const hp = el("span", "num", `${u.hp}/${u.maxHp}`);
    hp.classList.toggle("low", u.hp <= u.maxHp * 0.3);
    r.append(nm, bars, hp, el("span", "num", `EN${u.en}/${u.maxEn}`));
    rows.append(r);
  }
}

  R(0, 0, W, 12, "#3a5a78"); R(0, 12, W, 8, "#4f7a46"); R(0, 15, W, 1, "#5f8f54");
  R(50, 2, 4, 4, "#ffe08a");                                    // 太陽

    R(x, 8, 12, 7, wall); R(x - 1, 6, 14, 2, roof); R(x + 1, 4, 10, 2, roof); R(x + 3, 3, 6, 1, roof);
    R(x + 5, 11, 2, 4, "#5a3a22"); R(x + 2, 9, 2, 2, "#ffd23a"); R(x + 8, 9, 2, 2, "#ffd23a");

function depart(floor) {
  hideAllScreens();
  $("mapScreen").hidden = false;
  mode = "map";
  floorNo = floor;
  progress.maxFloor = Math.max(progress.maxFloor, floorNo);
  for (const u of team) u.bs = freshBattleState();
  newFloor();
  log(isBossFloor(floorNo) ? `${floorNo}F ボスフロアの準備部屋から出発した。` : `${floorNo}Fから出発した。階段を探せ。`);

// 全滅したときの処理はここだけ。GAME_MODE で切り替える
function onDefeat() {
  if (GAME_MODE === "rogue") {
    // 将来：全滅したら最初からやり直す（セーブを消してタイプ選択へ）
    deleteSave();
    showSelect();
    return;
  }
  // 冒険モード：強さは引き継ぎ、軽いペナルティだけ受けて村へ
  const msgs = ["全滅した…村に戻された。"];
  inv.items.repair = Math.floor(inv.items.repair * DEFEAT_PENALTY.itemKeep);
  inv.items.cell = Math.floor(inv.items.cell * DEFEAT_PENALTY.itemKeep);
  const hero = leader();
  const slots = hero.equip.map((it, i) => it ? i : -1).filter(i => i >= 0);
  if (slots.length && Math.random() < DEFEAT_PENALTY.breakRate) {
    const slot = slots[rnd(slots.length)], item = hero.equip[slot];
    hero.equip[slot] = null;
    inv.parts = inv.parts.filter(i => i !== item);
    const p = partOf(item);
    msgs.push({ t: `『${p.name}』が壊れた…`, c: RARITY[p.rarity].color });
  }
  goVillage(msgs);
}

// ================================================================
//  セーブ（localStorage）。失敗してもゲームは止めない
// ================================================================
function saveData() {
  const idx = new Map(inv.parts.map((it, i) => [it, i]));
  return {
    version: SAVE_VERSION, typeKey, progress, partUid, bestLevel, settings: { ...settings },
    items: { ...inv.items },
    parts: inv.parts.map(it => it.id),
    team: team.map(u => ({
      name: u.name, sprite: u.sprite, isLeader: u.isLeader, kind: u.kind,
      baseHp: u.baseHp, baseEn: u.baseEn, baseTackle: u.baseTackle, accBonus: u.accBonus, evade: u.evade,
      lv: u.lv, exp: u.exp, hp: u.hp, en: u.en, skills: { guard: u.skills.guard, unique: u.skills.unique }, unique: u.unique, manual: u.manual,
      equip: u.equip.map(it => it ? idx.get(it) : null),
    })),
  };
}
function saveGame() {
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify(saveData()));
    saveFailed = false;
  } catch (e) {
    saveFailed = true;
  }
}
function deleteSave() {
  try { localStorage.removeItem(SAVE_KEY); } catch (e) { /* 使えなくても続ける */ }
}
// 読み込み：{ status: "none" | "ok" | "broken", data }
function readSave() {
  let raw;
  try { raw = localStorage.getItem(SAVE_KEY); } catch (e) { return { status: "none" }; }
  if (raw == null) return { status: "none" };
  try {
    const d = JSON.parse(raw);
    const okNum = v => typeof v === "number" && isFinite(v);
    if (!d || (d.version !== SAVE_VERSION && d.version !== 1)) throw 0;   // 1 は移行して読む
    if (!START_TYPES.some(t => t.key === d.typeKey)) throw 0;
    if (!Array.isArray(d.parts) || !d.parts.every(id => partById(id))) throw 0;
    if (!d.items || !okNum(d.items.repair) || !okNum(d.items.cell)) throw 0;
    if (!d.progress || !okNum(d.progress.maxFloor) || !d.progress.bossDefeated) throw 0;
    if (!Array.isArray(d.team) || d.team.length < 1 || d.team.length > TEAM_MAX || !d.team[0].isLeader) throw 0;
    for (const u of d.team) {
      if (!SPR[u.sprite] || !okNum(u.lv) || !okNum(u.exp) || !okNum(u.baseHp) || !okNum(u.baseEn) || !okNum(u.baseTackle)) throw 0;
      if (!Array.isArray(u.equip) || u.equip.length !== SLOT_COUNT) throw 0;
      if (!u.equip.every(i => i === null || (Number.isInteger(i) && i >= 0 && i < d.parts.length))) throw 0;
      if (!u.skills || typeof u.skills !== "object") throw 0;
      if (d.version === SAVE_VERSION && !(okNum(u.skills.guard) && okNum(u.skills.unique))) throw 0;
      if (!u.isLeader && !baseOfAlly(u)) throw 0;
    }
    return { status: "ok", data: d };
  } catch (e) {
    return { status: "broken" };
  }
}
// 仲間の基本値（大きさ）を、保存された大きさか動物から決める
function baseOfAlly(s) {
  return ENEMY_TYPES.find(t => t.key === s.kind) || ENEMY_TYPES.find(t => t.animals.some(a => a.sprite === s.sprite));
}
// 読み込み。基本値はいまの定義から作り直す（版1→2：たいあたり+2の廃止、ENの伸び、スキルはLv1から）
function applySave(d) {
  const migrated = d.version !== SAVE_VERSION;
  typeKey = d.typeKey;
  if (d.settings) settings = { fx: d.settings.fx !== false, instant: !!d.settings.instant };
  partUid = d.partUid || 0;
  logLines = [];
  progress = { maxFloor: d.progress.maxFloor, bossDefeated: { 5: !!d.progress.bossDefeated[5], 10: !!d.progress.bossDefeated[10] }, cleared: !!d.progress.cleared };
  inv = { parts: d.parts.map(id => ({ id, uid: ++partUid })), items: { repair: d.items.repair, cell: d.items.cell } };
  team = d.team.map(s => {
    let u;
    if (s.isLeader) {
      const t = START_TYPES.find(x => x.key === d.typeKey);
      u = createUnit({ name: s.name, sprite: t.sprite, isLeader: true, kind: t.key, hp: t.hp, en: t.en, tackle: t.tackle,
        accBonus: t.accBonus, evade: t.evade, enGrowth: t.enGrowth, unique: t.unique, lv: s.lv });
    } else {
      const def = baseOfAlly(s);
      u = createUnit({ name: s.name, sprite: s.sprite, kind: def.key, hp: def.ally.hp, en: def.ally.en, tackle: def.ally.tackle,
        unique: ANIMAL_UNIQUE[s.sprite], lv: s.lv });
    }
    u.exp = s.exp; u.manual = !!s.manual;
    if (!migrated) {
      u.skills.guard = Math.min(SKILL_MAX_LEVEL, Math.max(1, s.skills.guard));
      u.skills.unique = Math.min(SKILL_MAX_LEVEL, Math.max(1, s.skills.unique));
    }
    // 最大値は式で作り直し、いまのHPとENは最大値を超えないようにする
    if (okNum(s.hp)) u.hp = Math.max(0, Math.min(u.maxHp, s.hp));
    if (okNum(s.en)) u.en = Math.max(0, Math.min(u.maxEn, s.en));
    u.equip = s.equip.map(i => i === null ? null : inv.parts[i]);
    return u;
  });
  bestLevel = Math.max(d.bestLevel || 1, ...team.map(u => u.lv));
  return migrated;
}
const okNum = v => typeof v === "number" && isFinite(v);

// 起動：セーブがあればタイトル（つづきから／はじめから）、なければタイプ選択
function boot() {
  const r = readSave();
  if (r.status === "none") { showSelect(); return; }
  hideAllScreens();
  mode = "title";
  $("title").hidden = false;
  $("btnContinue").hidden = r.status !== "ok";
  $("titleNote").textContent = r.status === "ok" ? "セーブデータがあります。" : "セーブデータを読めませんでした。はじめから遊べます。";
  $("btnContinue").onclick = () => {
    const migrated = applySave(r.data);
    goVillage(migrated ? ["つづきから再開した。", "古いセーブデータを新しい形式に移しました（防御と固有技はLv1から）。"] : ["つづきから再開した。"]);
  };
}

// テスト用：直近のバトル結果
let lastBattle = null;
let endShownAt = 0;
const END_KEY_DELAY = 1000;   // 結果画面が出てからキー入力を受け付けるまで(ms)

// ================================================================
//  入力
// ================================================================
const KEYMAP = {
  ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right",
  w: "up", s: "down", a: "left", d: "right", W: "up", S: "down", A: "left", D: "right",
  " ": "wait", ".": "wait",
};
document.addEventListener("keydown", ev => {
  if (mode === "select") {
    const n = parseInt(ev.key, 10);
    if (n >= 1 && n <= START_TYPES.length) { ev.preventDefault(); startGame(START_TYPES[n - 1].key); }
    return;
  }
  if (!$("dialog").hidden) {
    if (ev.key === "Escape") { const bs = $("dlgBtns").children; bs[bs.length - 1].click(); }
    return;
  }
  if (mode === "over") {
    // 戦闘中にEnterで送っていた勢いで、結果画面を飛ばさないようにする
    if ((ev.key === "Enter" || ev.key === " ") && Date.now() - endShownAt > END_KEY_DELAY) { ev.preventDefault(); goVillage(); }
    return;
  }
  if (mode === "village") {
    if (ev.key === "m" || ev.key === "M") { ev.preventDefault(); openMenu(); }
    else if (ev.key === "Enter") { ev.preventDefault(); openDepart(); }
    return;
  }
  if (mode === "title") return;
  if (mode === "menu") {
    if (ev.key === "Escape" || ev.key === "m" || ev.key === "M") { ev.preventDefault(); closeMenu(); }
    return;
  }
  if (mode === "battle") {
    if (battleKey(ev.key)) ev.preventDefault();
    return;
  }
  if (ev.key === "m" || ev.key === "M") { ev.preventDefault(); openMenu(); return; }
  const dir = KEYMAP[ev.key];
  if (!dir) return;
  ev.preventDefault();
  playerMove(dir);
});

// バトル中の待ち時間はタップで飛ばせる
$("battle").addEventListener("pointerdown", () => { if (battle && battle.busy && skipWait) skipWait(); });

let holdTimer = null;
function stopHold() { clearTimeout(holdTimer); clearInterval(holdTimer); holdTimer = null; }
document.querySelectorAll("#pad button").forEach(btn => {
  btn.addEventListener("pointerdown", ev => {
    ev.preventDefault();
    stopHold();
    const dir = btn.dataset.dir;
    playerMove(dir);
    if (dir === "wait") return;
    holdTimer = setTimeout(() => {
      holdTimer = setInterval(() => { if (mode === "map") playerMove(dir); else stopHold(); }, 130);
    }, 350);
  });
  ["pointerup", "pointerleave", "pointercancel"].forEach(t => btn.addEventListener(t, stopHold));
  btn.addEventListener("contextmenu", ev => ev.preventDefault());
});
$("menuBtn").addEventListener("click", openMenu);
$("menuClose").addEventListener("click", closeMenu);
$("retry").addEventListener("click", () => goVillage());
$("btnDepart").addEventListener("click", openDepart);
$("btnBackVillage").addEventListener("click", askReturnVillage);
$("btnVillageMenu").addEventListener("click", openMenu);
$("btnNewFromVillage").addEventListener("click", askNewGame);
$("btnNewFromTitle").addEventListener("click", askNewGame);
window.addEventListener("resize", resize);

prepareSprites();
if (DEBUG) document.body.append(el("div", "debug", "DEBUG MODE"));
boot();
</script>
