<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>ロボット遺跡探索</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #101114; --panel: #1a1b20; --line: #34363e; --fg: #dcdde2; --dim: #8a8c96;
    --hp: #e5534b; --en: #43b4f0; --accent: #ffd447; --ok: #3fae6a; --boss: #ff5a5a;
    /* 上端・下端の安全な余白。表示枠（Claudeなど）の浮かぶバーの分は、狭い画面だけ足す */
    --frame-top: 0px;
    --safe-top: calc(env(safe-area-inset-top, 0px) + var(--frame-top));
    --safe-bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
  }
  @media (max-width: 600px) { :root { --frame-top: 56px; } }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font-family: "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Meiryo", sans-serif;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  button { font-family: inherit; color: var(--fg); touch-action: manipulation; cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  button:disabled { opacity: 0.35; cursor: default; }
  canvas.px, #cv { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
  #app {
    max-width: 520px; margin: 0 auto; min-height: 100%;
    display: flex; flex-direction: column; align-items: center;
    padding: calc(var(--safe-top) + 8px) 12px var(--safe-bottom);
  }
  .screen { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  [hidden] { display: none !important; }

  .bar { display: inline-block; height: 8px; background: #2c2d33; border-radius: 2px; overflow: hidden; }
  .bar i { display: block; height: 100%; }
  .bar.hp i { background: var(--hp); }
  .bar.en i { background: var(--en); }
  .bar.ehp i { background: #e8a33a; }
  .low { color: var(--hp) !important; }

  /* タイプ選択 */
  #select h1 { font-size: 22px; margin: 4px 0 0; letter-spacing: .04em; }
  #select p.lead { margin: 0; color: var(--dim); font-size: 13px; text-align: center; }
  #typeList { width: 100%; display: grid; gap: 8px; }
  .typeCard {
    width: 100%; text-align: left; padding: 10px 12px; border-radius: 10px;
    background: var(--panel); border: 1px solid #50525c;
    display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 12px; align-items: center;
  }
  .typeCard:hover, .typeCard:focus-visible { border-color: var(--accent); }
  .typeCard canvas { grid-row: 1 / 4; }
  .typeCard .tname { font-size: 18px; font-weight: bold; }
  .typeCard .tname small { font-size: 12px; color: var(--dim); font-weight: normal; margin-left: 6px; }
  .typeCard .k { color: var(--accent); font-size: 12px; margin-right: 6px; }
  .typeCard .desc { font-size: 12px; color: #c4c5cc; }
  .typeCard .stats { display: flex; flex-wrap: wrap; gap: 2px 12px; font-size: 12px; font-variant-numeric: tabular-nums; }
  .typeCard .stats b { color: #fff; }
  .typeCard .role { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 4px; background: #3d8fd9; color: #fff; margin-left: 6px; vertical-align: 3px; font-weight: normal; }
  .typeCard .sw { font-size: 12px; color: #c4c5cc; }
  .typeCard .sw b { color: #8fe08f; font-weight: normal; } .typeCard .sw i { color: #ff9a8a; font-style: normal; }

  /* マップ画面 */
  #status { width: 100%; display: grid; gap: 3px; font-size: 13px; font-variant-numeric: tabular-nums; }
  #floorLabel { font-size: 15px; font-weight: bold; }
  #teamRows { display: grid; gap: 3px; min-height: calc(3 * 19px + 6px); align-content: start; }
  #floorLabel.bossfl { color: var(--boss); }
  .trow { display: grid; grid-template-columns: minmax(0, 1fr) 70px 64px 66px; align-items: center; gap: 6px; }
  .trow .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .trow .nm small { color: var(--dim); }
  .trow .bar { width: 100%; }
  .trow .num { text-align: right; }
  #cv { background: #000; }
  #mapWrap { position: relative; }
  #mini { position: absolute; top: 4px; right: 4px; border: 1px solid #50525c; cursor: pointer; }
  #mini[hidden] { display: none; }
  #stairsBtn { position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%); padding: 10px 18px; font-size: 15px; font-weight: bold;
    background: var(--ok); color: #fff; border: 2px solid #fff; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,.6); white-space: nowrap; }
  #stairsBtn.walking { background: #26272d; }
  #stairsBtn[hidden] { display: none; }
  #miniFull { position: fixed; inset: 0; z-index: 30; padding: var(--safe-top) 12px var(--safe-bottom); background: rgba(0,0,0,.88); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; }
  #miniFull[hidden] { display: none; }
  #miniFull .hint { font-size: 12px; color: #aaa; }
  #miniBig { border: 1px solid #50525c; }

  /* 高さを固定して、長い行が折り返しても画面がずれないようにする（新しい行が下に残る） */
  .log {
    width: 100%; height: calc(4 * 1.45em + 10px); padding: 4px 8px; overflow: hidden;
    display: flex; flex-direction: column; justify-content: flex-end;
    background: var(--panel); border: 1px solid var(--line); font-size: 13px; line-height: 1.45em;
  }
  .log div { min-height: 1.45em; flex-shrink: 0; }
  .log div:nth-child(1) { opacity: .5; }
  .log div:nth-child(2) { opacity: .75; }

  #controls { display: flex; align-items: center; gap: 18px; }
  #pad { display: grid; grid-template-columns: repeat(3, 58px); grid-template-rows: repeat(3, 48px); gap: 6px; }
  #pad button, #menuBtn, #miniBtn { font-size: 20px; background: #26272d; border: 1px solid #50525c; border-radius: 10px; }
  #pad button:active, #menuBtn:active, #miniBtn:active { background: #3a3c44; }
  #sideBtns { display: flex; flex-direction: column; gap: 8px; }
  #miniBtn { width: 76px; height: 48px; font-size: 15px; }
  #pad .wait { font-size: 13px; }
  #menuBtn { width: 76px; height: 62px; font-size: 15px; }
  #help { font-size: 12px; color: #666; text-align: center; }
  @media (hover: hover) and (pointer: fine) {
    #pad { grid-template-columns: repeat(3, 46px); grid-template-rows: repeat(3, 40px); }
    #pad button { font-size: 16px; }
    #menuBtn { height: 52px; }
  }
  @media (pointer: coarse) { #help { display: none; } }

  /* バトル画面 */
  .ehead { width: 100%; display: flex; flex-direction: column; gap: 4px; }
  .ehead .row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-variant-numeric: tabular-nums; }
  #eName { font-size: 17px; font-weight: bold; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #eName.boss { color: var(--boss); }
  #eHpText { flex-shrink: 0; }
  #charge { color: #1a1206; background: #ffb02e; font-weight: bold; font-size: 13px; padding: 2px 8px; border-radius: 4px; align-self: flex-start; }
  .wide { width: 100%; height: 12px; }
  .arena {
    position: relative; width: 100%;
    display: flex; align-items: center; justify-content: space-between; gap: 6px; padding: 6px 8px;
    background: linear-gradient(#17181d 0 62%, #24221e 62% 100%);
    border: 1px solid var(--line); border-radius: 6px; overflow: hidden;
  }
  .arena.bossArena { background: linear-gradient(#1d1214 0 62%, #2a1a1a 62% 100%); }
  #allies { display: flex; flex-direction: column; gap: 4px; }
  .ally { padding: 2px; border: 2px solid transparent; border-radius: 6px; }
  .ally.active { border-color: var(--accent); background: rgba(255, 212, 71, .12); }
  .ally.down { opacity: 0.25; }
  .hit { animation: shake .2s; }
  @keyframes shake { 0%,100% { transform: translateX(0); } 50% { transform: translateX(5px); } }
  @media (prefers-reduced-motion: reduce) { .hit { animation: none; } }
  /* 演出：ダメージの数字（跳ねる）、技名、閃光、揺れ */
  #fx { position: absolute; top: 30%; font-size: 20px; font-weight: bold; pointer-events: none; text-shadow: 0 2px 4px #000; z-index: 2; }
  #fx.enemy { right: 18%; } #fx.miss { right: 42%; } #fx.ally { left: 22%; top: 45%; } #fx.center { left: 0; right: 0; text-align: center; }
  #fx.critNum { font-size: 30px; }
  #fx.pop { animation: pop .4s ease-out; }
  @keyframes pop { 0% { transform: translateY(6px) scale(.8); } 40% { transform: translateY(-14px) scale(1.15); } 100% { transform: translateY(-6px) scale(1); } }
  #banner { position: absolute; left: 0; right: 0; top: 6px; text-align: center; font-size: 22px; font-weight: bold; color: #fff;
    text-shadow: 0 2px 6px #000, 0 0 2px #000; pointer-events: none; opacity: 0; z-index: 3; }
  #banner.show { animation: banner .5s ease-out forwards; }
  @keyframes banner { 0% { opacity: 0; transform: scale(.9); } 15% { opacity: 1; transform: scale(1); } 80% { opacity: 1; } 100% { opacity: 0; } }
  #flash { position: fixed; inset: 0; pointer-events: none; opacity: 0; z-index: 20; }
  #flash.show { animation: flash1 .1s linear; }
  @keyframes flash1 { 0% { opacity: 0; } 30% { opacity: 1; } 100% { opacity: 0; } }
  .shake2 { animation: shake2 .2s linear; }
  @keyframes shake2 { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 50% { transform: translateX(5px); } 75% { transform: translateX(-5px); } }
  @media (prefers-reduced-motion: reduce) { #fx.pop, #banner.show, .shake2 { animation: none; } #banner.show { opacity: 1; } }

  #party { width: 100%; display: grid; gap: 3px; font-size: 13px; font-variant-numeric: tabular-nums; }
  .prow {
    display: grid; grid-template-columns: minmax(0, 1fr) 80px 54px 66px; align-items: center; gap: 6px;
    padding: 3px 6px; border: 1px solid transparent; border-radius: 6px;
  }
  .prow.active { border-color: var(--accent); background: #26231a; }
  .prow.down { opacity: 0.45; }
  .prow .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .prow .nm small { color: var(--dim); }
  .prow .bar { width: 100%; height: 8px; }
  .bars { display: grid; gap: 2px; }
  .bars .bar.en { height: 5px; }
  .bar.en i { background: var(--en); }
  .prow .num { text-align: right; }
  .prow .st { grid-column: 1 / -1; font-size: 11px; color: #8fd; }

  #cmdTitle { width: 100%; font-size: 12px; color: var(--dim); letter-spacing: .06em; }
  #cmdTitle b { color: var(--accent); font-weight: normal; }
  #cmds { width: 100%; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 6px; }
  #cmds button { min-width: 0; }
  #cmds button {
    min-height: 48px; padding: 5px 8px; text-align: left;
    background: #24252b; border: 1px solid #50525c; border-radius: 8px; font-size: 15px;
    display: flex; flex-direction: column; justify-content: center; gap: 2px;
  }
  #cmds button:active:not(:disabled) { background: #3a3c44; }
  #cmds button .k { color: var(--accent); font-size: 12px; margin-right: 4px; }
  #cmds button small { color: var(--dim); font-size: 11px; }
  #cmds button.back { background: #1c1d22; }
  #cmds button.noen { opacity: .4; filter: grayscale(1); }
  /* わざの一覧は1行に収めて、スマホでも決定ボタンまで1画面に入るようにする */
  #cmds.moveList { gap: 4px; }
  #cmds.moveList button { min-height: 40px; padding: 3px 8px; font-size: 14px; }
  #cmds.moveList button > span:first-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; display: block; }
  #cmds.moveList button small { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #cmds button.sel { border-color: var(--accent); background: #2e2a1a; }
  .mk { display: inline-block; font-size: 10px; padding: 0 4px; border-radius: 3px; margin-right: 4px; color: #111; vertical-align: 2px; }
  .mk-gun { background: #e8c25a; } .mk-missile { background: #e98a5a; } .mk-laser { background: #6fd6f2; } .mk-unique { background: #b8e986; }
  #moveInfo { width: 100%; background: var(--panel); border: 1px solid var(--accent); border-radius: 8px; padding: 4px 10px; font-size: 12px;
    display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; align-items: center; }
  #moveInfo .miName { font-weight: bold; grid-column: 1 / -1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #moveInfo .miDesc { font-weight: normal; color: #c4c5cc; }
  #moveInfo .miLine { grid-column: 1 / -1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #moveInfo .miLine { color: var(--accent); font-variant-numeric: tabular-nums; }
  #moveInfo .miGo { grid-column: 2; grid-row: 1 / 4; min-width: 76px; min-height: 52px; font-size: 16px; background: var(--ok); color: #fff; border: none; border-radius: 8px; }

  /* オーバーレイ */
  .overlay {
    position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,0.82); padding: calc(var(--safe-top) + 16px) 16px calc(var(--safe-bottom) + 4px);
  }
  .dialog {
    width: 100%; max-width: 480px; max-height: 100%; overflow-y: auto;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px;
  }
  .center { text-align: center; }
  /* 仲間にする画面：中身はスクロール、ボタンは下に固定 */
  .rcDialog { display: flex; flex-direction: column; padding: 12px 14px; }
  .rcBody { overflow-y: auto; min-height: 0; flex: 1; }
  .rcBtns { display: flex; gap: 8px; padding-top: 10px; border-top: 1px solid var(--line); margin-top: 8px; }
  .rcBtns button { flex: 1; min-height: 46px; font-size: 15px; border-radius: 8px; }
  .rcBtns button.primary { background: var(--ok); color: #fff; border: none; }
  .rcTop { display: flex; gap: 12px; align-items: center; }
  .rcTop canvas { flex-shrink: 0; }
  .rcName { font-size: 19px; font-weight: bold; }
  .rcStats { display: grid; grid-template-columns: repeat(3, auto); gap: 2px 12px; font-size: 13px; margin-top: 4px; }
  .rcStats b { font-size: 15px; }
  .rcSec { margin-top: 8px; padding: 6px 8px; background: #22232a; border-radius: 6px; font-size: 13px; }
  .rcLabel { color: var(--dim); font-size: 12px; margin-top: 8px; }
  .rcSec .rcLabel { margin-top: 0; }
  #menuJunk, .junk { font-size: 12px; color: var(--dim); }
  #menuJunk { margin: -2px 0 4px; }
  .partyBar { display: grid; gap: 6px; padding: 6px 0 2px; }
  .partyBar .pbSel { font-size: 13px; min-height: 1.4em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .partyBar .pbBtns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .partyBar .pbBtns button { min-height: 40px; font-size: 12px; padding: 4px; white-space: nowrap; }
  .stockList { max-height: 46vh; overflow-y: auto; display: grid; gap: 4px; }
  .rcSec small { display: block; color: var(--dim); }
  .rcNote { margin-top: 8px; font-size: 13px; color: var(--accent); }
  .rcTeam { margin-top: 8px; display: grid; gap: 4px; }
  .rcUnit { display: flex; align-items: center; gap: 8px; font-size: 12px; padding: 3px 6px; background: #1f2026; border-radius: 6px; }
  .rcUnit canvas { flex-shrink: 0; }
  .rcTeam, .stockList { grid-template-columns: minmax(0, 1fr); }
  .rcUnit .rcuText { min-width: 0; flex: 1; }
  .rcUnit .rcuL { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rcUnit .rcuL + .rcuL { font-size: 11px; }
  .rcUnit.pick { cursor: pointer; border: 1px solid var(--line); }
  .rcUnit.pick.on { border-color: var(--accent); }
  .dialog h2 { margin: 0 0 8px; font-size: 21px; }
  .dialog h3 { margin: 14px 0 4px; font-size: 13px; color: var(--dim); letter-spacing: .06em; font-weight: normal; }
  .big { font-size: 17px; padding: 10px 28px; background: var(--ok); color: #fff; border: none; border-radius: 8px; margin-top: 12px; }
  .mhead {
    position: sticky; top: -14px; z-index: 1; margin: -14px -16px 8px; padding: 12px 16px 8px;
    display: flex; align-items: center; justify-content: space-between; background: var(--panel); border-bottom: 1px solid var(--line);
  }
  .mhead h2 { margin: 0; }
  #menuClose { padding: 8px 18px; font-size: 15px; background: var(--ok); color: #fff; border: none; border-radius: 8px; }
  /* メニューの固定ヘッダー（タイトル・タブ・選んでいる機体のHPとEN）。スマホで画面の1/3以内 */
  /* メニューの下端の操作バー（上の「とじる」「村に戻る」が押しにくいときの逃げ道） */
  .mfoot { position: sticky; bottom: -14px; z-index: 2; margin: 8px -16px -14px; padding: 8px 16px 10px; display: flex; gap: 8px; justify-content: flex-end; background: var(--panel); border-top: 1px solid var(--line); }
  .mfoot button { min-height: 44px; padding: 8px 18px; font-size: 15px; border-radius: 8px; }
  .mfoot #menuClose2 { background: var(--ok); color: #fff; border: none; flex: 1; max-width: 200px; }
  .mstick { position: sticky; top: -14px; z-index: 2; margin: -14px -16px 8px; padding: 0 16px 4px; background: var(--panel); border-bottom: 1px solid var(--line); }
  .mstick .mhead { position: static; margin: 0 -16px; padding: 10px 16px 6px; border-bottom: none; }
  #menu .tabs { flex-wrap: nowrap; overflow-x: auto; }
  #menu .tabs button { padding: 4px 10px; font-size: 13px; white-space: nowrap; }
  .bulk { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin-top: 4px; }
  .bulk button { padding: 8px 4px; font-size: 13px; background: #1f3328; border: 1px solid #3fae6a; border-radius: 8px; }
  .mnote { font-size: 12px; color: var(--dim); margin-top: 4px; }
  .mresult { font-size: 13px; margin-top: 6px; padding: 6px 8px; border: 1px solid #3fae6a; border-radius: 6px; background: #17251c; font-variant-numeric: tabular-nums; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; }
  .tabs button { padding: 7px 12px; background: #24252b; border: 1px solid #50525c; border-radius: 6px; font-size: 14px; }
  .tabs button.on { border-color: var(--accent); color: var(--accent); background: #2a2618; }
  .unitHead { display: flex; gap: 12px; align-items: center; margin-top: 10px; }
  .unitHead canvas { flex-shrink: 0; background: #22232a; border-radius: 6px; }
  .sgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 3px 12px; font-size: 13px; font-variant-numeric: tabular-nums; flex: 1; min-width: 0; }
  .sgrid b { color: #fff; font-weight: normal; }
  .mrow {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 7px 6px; border-bottom: 1px solid #2a2b31; font-size: 14px;
  }
  .mrow .info { min-width: 0; }
  .mrow small { display: block; color: var(--dim); font-size: 11px; font-variant-numeric: tabular-nums; }
  .mrow .btns { display: flex; gap: 4px; flex-shrink: 0; }
  .mrow button { padding: 6px 10px; background: #2c2d34; border: 1px solid #50525c; border-radius: 6px; font-size: 13px; }
  .mrow button.danger { border-color: #8a3a3a; color: #ff9a9a; }
  /* バトル：決定とその他、「その他」のボタン、固定ヘッダー */
  /* バトル画面はスマホ1画面に収める */
  #battle.screen { gap: 6px; }
  #battleLog { height: calc(3 * 1.45em + 8px); }
  #battle #cmdTitle { display: none; }
  #battle .arena { padding: 2px 8px; }
  #battle .ally { padding: 0; }
  #battle #allies { gap: 2px; }
  #battle .prow { padding: 1px 6px; }
  #battle #party { gap: 1px; }
  #cmdBar { width: 100%; display: grid; grid-template-columns: 1fr 2fr; gap: 8px; }
  #cmdBar button { min-height: 46px; border-radius: 8px; font-size: 16px; border: 1px solid #50525c; background: #26272d; }
  #cmdBar small { color: var(--dim); font-size: 11px; }
  #btnGo { background: var(--ok) !important; color: #fff; border: none !important; font-weight: bold; }
  #btnGo:disabled { background: #2c2d33 !important; color: var(--dim); }
  .otherBtn { width: 100%; min-height: 50px; margin-top: 8px; font-size: 15px; border-radius: 8px; background: #26272d; border: 1px solid #50525c; }
  .uhead { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr) minmax(0, 1.3fr); gap: 4px 8px; align-items: center; font-size: 12px; padding: 4px 0; font-variant-numeric: tabular-nums; }
  .uhName { font-weight: bold; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .uhStat { display: grid; gap: 2px; }
  .uhStat .bar { width: 100%; height: 7px; }
  .uhNum { white-space: nowrap; }
  .chg { font-weight: bold; }
  .chg-hp.glow { animation: glowHp .6s ease-out; color: #5fe07a; }
  .chg-en.glow { animation: glowEn .6s ease-out; color: #6fd6f2; }
  @keyframes glowHp { 0% { text-shadow: 0 0 10px #5fe07a; } 100% { text-shadow: none; } }

// ================================================================
//  グラフィック（図形の組み合わせからドット絵を作る）
// ================================================================
function makeGrid(w,h){return Array.from({length:h},()=>Array(w).fill(0));}
function inPoly(x,y,p){let c=false;for(let i=0,j=p.length-1;i<p.length;j=i++){const[xi,yi]=p[i],[xj,yj]=p[j];if((yi>y)!==(yj>y)&&x<(xj-xi)*(y-yi)/(yj-yi)+xi)c=!c;}return c;}
function applyOp(g,w,h,op){
  const t=op[0];
  if(t==="P"){for(let y=0;y<h;y++)for(let x=0;x<w;x++)if(inPoly(x+0.5,y+0.5,op[1]))g[y][x]=op[2];}
  else if(t==="E"){const m=op[6]===undefined?99:op[6];for(let y=0;y<h;y++)for(let x=0;x<w;x++){const dx=(x+0.5-op[1])/op[3],dy=(y+0.5-op[2])/op[4];if(dx*dx+dy*dy<=1&&y+0.5<=m)g[y][x]=op[5];}}
  else if(t==="R"){for(let y=op[2];y<op[2]+op[4];y++)for(let x=op[1];x<op[1]+op[3];x++)if(y>=0&&y<h&&x>=0&&x<w)g[y][x]=op[5];}
}
function buildSprite(def,w,h){
  const a=makeGrid(w,h),b=makeGrid(w,h);
  def.o.forEach(op=>applyOp(a,w,h,op));
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    if(a[y][x]){b[y][x]=a[y][x];}
    else{const nb=(y>0&&a[y-1][x])||(y<h-1&&a[y+1][x])||(x>0&&a[y][x-1])||(x<w-1&&a[y][x+1]);if(nb)b[y][x]="k";}
  }
  def.a.forEach(q=>{b[q[1]][q[0]]=q[2];});
  return b;
}

function tileGrid(fill, marks) {
  const g = Array.from({ length: MAP_N }, () => Array(MAP_N).fill(fill));
  marks.forEach(([x, y, w, h, c]) => { for (let yy = y; yy < y + h; yy++) for (let xx = x; xx < x + w; xx++) g[yy][xx] = c; });
  return g;
}

// 整数倍に拡大した画像（キャッシュ）。flip=左右反転
const spriteCache = new Map();
function spriteImage(key, s, flip) {
  const ck = `${key}|${s}|${flip ? 1 : 0}`;
  if (spriteCache.has(ck)) return spriteCache.get(ck);
  const sp = SPR[key], c = document.createElement("canvas");
  c.width = sp.w * s; c.height = sp.h * s;
  const x2 = c.getContext("2d");
  for (let y = 0; y < sp.h; y++) for (let x = 0; x < sp.w; x++) {
    const col = sp.p[sp.g[y][x]];
    if (!col) continue;
    x2.fillStyle = col;
    x2.fillRect((flip ? sp.w - 1 - x : x) * s, y * s, s, s);
  }
  spriteCache.set(ck, c);
  return c;
}
// DOMに置く用のキャンバス
function spriteEl(key, s, flip) {
  const src = spriteImage(key, s, flip), c = document.createElement("canvas");
  c.width = src.width; c.height = src.height; c.className = "px";
  c.dataset.sprite = key; c.dataset.scale = s; c.dataset.flip = flip ? "1" : "0";
  const x2 = c.getContext("2d");
  x2.imageSmoothingEnabled = false;
  x2.drawImage(src, 0, 0);
  return c;
}

// ---- レア個体の絵：今ある絵に、金色の縁取り2重・金色寄りの色・キラキラを足す ----
function padGrid(b,P){
  const h=b.length,w=b[0].length,g=makeGrid(w+2*P,h+2*P);
  for(let y=0;y<h;y++)for(let x=0;x<w;x++)g[y+P][x+P]=b[y][x];
  return g;
}
function ringOf(src,key){
  const H=src.length,W=src[0].length,r=makeGrid(W,H);
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    if(!src[y][x]){
      const nb=(y>0&&src[y-1][x])||(y<H-1&&src[y+1][x])||(x>0&&src[y][x-1])||(x<W-1&&src[y][x+1]);
      if(nb)r[y][x]=key;
    }
  }
  return r;
}
function addGlow(g){
  const H=g.length,W=g[0].length,o=g.map(r=>r.slice());
  const r1=ringOf(g,"G1");
  for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(r1[y][x])o[y][x]="G1";
  const r2=ringOf(o,"G2");
  for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(r2[y][x])o[y][x]="G2";
  return o;
}
function hexToRgb(c){return[parseInt(c.substr(1,2),16),parseInt(c.substr(3,2),16),parseInt(c.substr(5,2),16)];}
function tintGold(c){
  if(c==="#2b2b2b")return c;
  const a=hexToRgb(c),b=hexToRgb("#ffd23a");
  return "#"+a.map((v,i)=>Math.round(v*0.5+b[i]*0.5).toString(16).padStart(2,"0")).join("");
}
function rarePalette(p){
  const t={};
  for(const k in p)t[k]=tintGold(p[k]);
  if(p.q)t.q="#ffd23a";
  t.e="#ffffff";t.G1="#ffd23a";t.G2="#fff0a8";
  return t;
}
function buildRareSprite(def,w,h){
  const b=buildSprite(def,w,h);
  return {grid:addGlow(padGrid(b,2)),pal:rarePalette(def.p)};
}
const SPARKS_MAP=[[3,3],[14,6]];
const SPARKS_BATTLE=[[4,6],[32,4],[34,22],[9,25]];
function drawSparks(ctx,sparks,ox,oy,S,on){
  if(!on)return;
  sparks.forEach(([x,y])=>{
    ctx.fillStyle="#fff6c0";
    [[-1,0],[1,0],[0,-1],[0,1]].forEach(([dx,dy])=>ctx.fillRect(ox+(x+dx)*S,oy+(y+dy)*S,S,S));
    ctx.fillStyle="#ffffff";
    ctx.fillRect(ox+x*S,oy+y*S,S,S);

function blankMap() {

function fillRect(x, y, w, h, t) { for (let yy = y; yy < y + h; yy++) for (let xx = x; xx < x + w; xx++) map[yy][xx] = t; }

function generateMap() {

  for (let i = 0; i < ROOM_TRIES && rooms.length < ROOM_MAX; i++) {
    const w = rndRange(4, 8), h = rndRange(3, 6);
    const x = rndRange(1, MAP_W - w - 2), y = rndRange(1, MAP_H - h - 2);
    if (rooms.some(o => x <= o.x + o.w && x + w >= o.x && y <= o.y + o.h && y + h >= o.y)) continue;
    rooms.push({ x, y, w, h });
    fillRect(x, y, w, h, FLOOR);
  }
  for (let i = 1; i < rooms.length; i++) {
    const a = center(rooms[i - 1]), b = center(rooms[i]);
    if (Math.random() < 0.5) { hCorr(a.x, b.x, a.y); vCorr(a.y, b.y, b.x); }
    else { vCorr(a.y, b.y, a.x); hCorr(a.x, b.x, b.y); }

const covers = (e, x, y) => x >= e.x && x < e.x + e.size && y >= e.y && y < e.y + e.size;
const enemyAt = (x, y) => enemies.find(e => covers(e, x, y));

function occupied(x, y) {

}

    if (!occupied(x, y)) return { x, y };

}

function updateFov() {
  if (isBossFloor(floorNo)) return;
  for (let y = 0; y < MAP_H; y++) visible[y].fill(false);
  for (let dy = -FOV_RADIUS; dy <= FOV_RADIUS; dy++) {
    for (let dx = -FOV_RADIUS; dx <= FOV_RADIUS; dx++) {
      if (dx * dx + dy * dy > FOV_RADIUS * FOV_RADIUS + 1) continue;
      const tx = pos.x + dx, ty = pos.y + dy;
      if (tx < 0 || ty < 0 || tx >= MAP_W || ty >= MAP_H) continue;
      if (lineOfSight(pos.x, pos.y, tx, ty)) { visible[ty][tx] = true; seen[ty][tx] = true; }
    }
  }
}
function lineOfSight(x0, y0, x1, y1) {
  const dx = Math.abs(x1 - x0), dy = Math.abs(y1 - y0);
  const sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
  let err = dx - dy, x = x0, y = y0;
  while (!(x === x1 && y === y1)) {
    if (!(x === x0 && y === y0) && map[y][x] === WALL) return false;
    const e2 = 2 * err;
    if (e2 > -dy) { err -= dy; x += sx; }
    if (e2 < dx) { err += dx; y += sy; }
  }
  return true;
}

//  ログ（color を付けるとその色で表示）
// ================================================================
// バトル中はバトルの欄、それ以外はマップ（村）の欄に出す
function log(msg, color, target) {
  const l = { t: msg, c: color || "" };
  const arr = (target || (mode === "battle" ? "battle" : "map")) === "battle" ? battleLines : mapLines;
  arr.push(l);
  while (arr.length > 3) arr.shift();
  logLines.push(l);
  while (logLines.length > 40) logLines.shift();
  renderLog();
}
const mapLog = (msg, color) => log(msg, color, "map");
function resetLogs() { logLines = []; mapLines = []; battleLines = []; renderLog(); }
function renderLog() {
  for (const id of ["mapLog", "battleLog", "villageLog"]) {
    const lines = id === "battleLog" ? battleLines : mapLines;
    const divs = $(id).children, pad = 3 - lines.length;
    for (let i = 0; i < 3; i++) {
      const l = i < pad ? null : lines[i - pad];
      divs[i].textContent = l ? l.t : "";
      divs[i].style.color = l && l.c ? l.c : (i === 2 ? "#fff" : "");
    }
  }
}
const logText = () => logLines.map(l => l.t);

// ================================================================
//  マップでの行動
// ================================================================
const DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0], wait: [0, 0] };

function playerMove(dir) {
  if (mode !== "map" || miniOpen || recruitState) return;
  const [dx, dy] = DIRS[dir];
  const nx = pos.x + dx, ny = pos.y + dy;

  if (dx || dy) {
    const target = enemyAt(nx, ny);
    if (target) {
      if (!canOneHit(target)) { startBattle(target); return; }
      oneHit(target);
      // 仲間にする画面を出しているときは、決めてから敵が動く
      if (recruitState) { recruitAfter = () => { enemiesAct(); updateFov(); }; renderMap(); return; }
      enemiesAct(); updateFov(); renderMap();
      return;
    }
    if (map[ny][nx] === WALL) return;
    const wasBossRoom = map[pos.y][pos.x] === BOSSFLOOR;
    pos.x = nx; pos.y = ny;
    pickUpGround();
    const t = map[ny][nx];
    if (t === STAIRS) { descend(); return; }
    if (t === HEAL) healAll();
    if (t === GATE && dx > 0) log("この先はボス部屋。準備はいいか？");
    if (t === BOSSFLOOR && !wasBossRoom && enemies.some(e => e.boss)) {
      log(`強敵の気配がする…「${enemies.find(e => e.boss).name}」がいる！`);
    }
  }
  enemiesAct();
  updateFov();
  renderMap();
}

function healAll() {
  for (const u of team) { u.hp = u.maxHp; u.en = u.maxEn; }
  log("回復ポイント：全員のHPとENが全回復した。");
}

function pickUpGround() {
  const it = groundItems.find(i => i.x === pos.x && i.y === pos.y);
  if (!it) return;
  groundItems = groundItems.filter(i => i !== it);
  if (it.key === "part") {
    logPartGain(gainPart(it.part), "拾った");
  } else {
    inv.items[it.key]++;
    log(`${ITEMS[it.key].name}を拾った。（所持${inv.items[it.key]}）`);
  }
}

function descend() {
  // 10階（最深部）の階段は村へ戻る道
  if (floorNo >= FINAL_FLOOR) { goVillage(["遺跡の最深部から地上へ戻った。"]); return; }
  floorNo++;
  progress.maxFloor = Math.max(progress.maxFloor, floorNo);
  for (const u of team) u.en = Math.min(u.maxEn, u.en + STAIRS_ENERGY_BONUS);
  if (DEBUG) for (const u of team) u.hp = u.maxHp;   // テスト用：階を降りるたびにHP全回復
  newFloor();
  if (isBossFloor(floorNo)) {
    log(`${floorNo}F ボスフロアに着いた。（全員EN+${STAIRS_ENERGY_BONUS}）`);
    log("準備部屋だ。回復ポイントで全回復できる。");
  } else {
    log(`${floorNo}Fへ降りた。（全員EN+${STAIRS_ENERGY_BONUS}）`);
  }
  renderMap();
}

function enemiesAct() {
  for (const e of enemies) {
    if (e.boss) continue;               // ボスは動かない
    if (e.stun > 0) { e.stun--; continue; }
    const dist = Math.abs(e.x - pos.x) + Math.abs(e.y - pos.y);
    if (!e.awake && dist <= ENEMY_SIGHT && lineOfSight(e.x, e.y, pos.x, pos.y)) e.awake = true;
    if (e.awake) {
      if (dist === 1) {
        if (!canOneHit(e)) { startBattle(e); return; }
        oneHit(e);
        if (recruitState) return;   // 仲間にする画面を出している間は、残りの敵は動かない
        continue;
      }
      const sx = Math.sign(pos.x - e.x), sy = Math.sign(pos.y - e.y);
      const tries = Math.abs(pos.x - e.x) >= Math.abs(pos.y - e.y) ? [[sx, 0], [0, sy]] : [[0, sy], [sx, 0]];
      for (const [mx, my] of tries) {
        if ((mx || my) && canEnemyMove(e.x + mx, e.y + my)) { e.x += mx; e.y += my; break; }
      }
    } else if (Math.random() < 0.3) {
      const d = Object.values(DIRS)[rnd(4)];
      if (canEnemyMove(e.x + d[0], e.y + d[1])) { e.x += d[0]; e.y += d[1]; }
    }
  }
}
function canEnemyMove(x, y) {
  if (map[y][x] !== FLOOR) return false;
  if (pos.x === x && pos.y === y) return false;
  return !enemyAt(x, y);
}

//  バトル

let skipWait = null;
function pause(ms = BATTLE_WAIT) {
  return new Promise(res => {
    const t = setTimeout(done, ms);
    function done() { clearTimeout(t); skipWait = null; res(); }
    skipWait = done;
  });
}

// バトル画面の絵の倍率。ボスは画面の半分の幅に収まる最大の整数倍（上限7）、通常の敵は5倍まで
function battleScales() {
  const w = Math.min(window.innerWidth, 520) - 24 - 20;
  const boss = Math.max(3, Math.min(7, Math.floor(w / 2 / BATTLE_W)));
  return { boss, enemy: Math.min(5, boss - 1), ally: 2 };
}

function startBattle(e) {
  toggleMini(false);
  mode = "battle";
  e.awake = true;
  chooseAnimal(e);
  if (!e.boss && !e.rare) { const fs = fightStats[floorNo] || (fightStats[floorNo] = { oneHit: 0, battle: 0 }); fs.battle++; }
  for (const u of team) u.bs = freshBattleState();
  battle = { enemy: e, menu: "moves", busy: false, actor: team.findIndex(u => u.hp > 0),
             round: 1, bossTurn: 0, heavyReady: false, itemKey: null, downs: 0, selected: null,
             roarTurns: 0, roarRate: 0, stunned: false, stats: { moves: {} }, results: [] };
  for (const u of team) u.hawkRound = null;
  // 前のバトルやマップのメッセージは持ち込まない
  battleLines = []; renderLog();
  log(e.boss ? `ボス「${e.name}」との戦闘！` : e.rare ? `金色に輝く${e.name.replace(/^レア/, "")}が現れた！` : `${e.name}が現れた！`, e.rare ? "#ffd23a" : "", "battle");
  $("mapScreen").hidden = true;
  $("battle").hidden = false;
  $("eName").className = e.boss ? "boss" : "";
  $("arena").classList.toggle("bossArena", e.boss);
  $("fx").textContent = "";
  // 絵：敵は右側で左向き（反転）、味方は左側に縦に並べて右向き
  const sc = battleScales();
  const ew = $("eWrap");
  ew.textContent = "";
  const ec = e.rare ? rareEl(e, sc.enemy) : spriteEl(e.sprite, e.boss ? sc.boss : sc.enemy, true);
  ec.id = "eSprite";
  ew.append(ec);
  const allies = $("allies");
  allies.textContent = "";
  team.forEach((u, i) => {
    const d = document.createElement("div");
    d.className = "ally"; d.id = "ally" + i;
    d.append(spriteEl(u.sprite, sc.ally, false));
    allies.append(d);
  });
  beginTurn();
}

// バトル画面のレア個体の絵（キラキラは点滅のたびに描き直す）。縁取りの分だけ外にはみ出させる
function rareEl(e, s) {
  const key = rareSpriteKey(e.sprite), sp = SPR[key];
  const c = document.createElement("canvas");
  c.width = sp.w * s; c.height = sp.h * s; c.className = "px";
  c.dataset.sprite = key; c.dataset.scale = s; c.dataset.flip = "1"; c.dataset.rare = "1";
  c.style.margin = `${-RARE_PAD * s}px`;

}
function paintRareEl(c) {
  const s = +c.dataset.scale, x2 = c.getContext("2d");
  x2.imageSmoothingEnabled = false;
  x2.clearRect(0, 0, c.width, c.height);
  drawRare(x2, c.dataset.sprite, SPARKS_BATTLE, RARE_PAD * s, RARE_PAD * s, s, true);
}

// バトル終了後の後片付け（勝ち・逃げ共通）
function afterBattle() {
  for (const u of team) {
    u.bs = freshBattleState();
    if (u.hp <= 0) { u.hp = Math.max(1, Math.floor(u.maxHp * REVIVE_HP_RATE)); log(`${u.name}が再起動した。（HP${u.hp}）`); }
  }
  processLevelUps();
}

function endBattle() {
  const results = battle ? battle.results || [] : [];
  if (DEBUG && battle && battle.stats.byUnit) console.log("[バトルの記録]", battle.enemy.name, JSON.stringify(battle.stats.byUnit));
  battle = null;
  mode = "map";
  $("battle").hidden = true;
  $("other").hidden = true;
  $("mapScreen").hidden = false;
  for (const r of results) mapLog(r.t, r.c);
  afterBattle();
  updateFov();
  resize();
}

const varied = power => Math.max(1, power + rndRange(-DAMAGE_VARIANCE, DAMAGE_VARIANCE));

// ---- 演出（設定でオフにできる。ダメージの数字とメッセージは常に出す） ----
function restartAnim(el, cls) { if (!el) return; el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }
function showBanner(text) {
  if (!settings.fx) return false;
  const b = $("banner"); b.textContent = text; restartAnim(b, "show");
  return true;
}
function flashScreen(kind) {
  if (!settings.fx || !kind) return;   // 1行動で1回だけ。点滅はしない
  const f = $("flash"); f.style.background = FLASH_COLORS[kind]; restartAnim(f, "show");
}
function shake(el) { if (settings.fx) restartAnim(el, "shake2"); }
function popNumber(text, color, where = "enemy", big = false) {
  const f = $("fx");
  f.textContent = text; f.style.color = color;
  f.className = `${where}${big ? " critNum" : ""}`;
  restartAnim(f, "pop");
}

function levelUpSkill(u, key) {
  if (key !== "guard" && key !== "unique") return;   // たいあたりとパーツにはスキルレベルがない
  if (u.skills[key] < SKILL_MAX_LEVEL) u.skills[key]++;
}

function useItem(key, target) {
  inv.items[key]--;
  if (key === "repair") {
    const before = target.hp;
    target.hp = Math.min(target.maxHp, target.hp + ITEMS.repair.value);
    log(`${ITEMS.repair.name}で${target.name}のHPが${target.hp - before}回復。`);
  } else {
    const before = target.en;
    target.en = Math.min(target.maxEn, target.en + ITEMS.cell.value);
    log(`${ITEMS.cell.name}で${target.name}のENが${target.en - before}回復。`);
  }
}

// ---- わざの計算 ----
const lerp = (a, b, lv) => a + (b - a) * (Math.min(SKILL_MAX_LEVEL, Math.max(1, lv)) - 1) / (SKILL_MAX_LEVEL - 1);
const lerpInt = (a, b, lv) => Math.floor(lerp(a, b, lv) + 1e-9);
const lerpMul = (a, b, lv) => Math.floor(lerp(a, b, lv) * 100 + 1e-9) / 100;

// その機体が使えるわざ（一覧の順：たいあたり、防御、固有技、自由枠1、自由枠2）
function moveKeys(u) {
  const keys = ["tackle", "guard", "unique"];
  u.equip.forEach((it, i) => { if (it) keys.push("part" + i); });
  return keys;
}
function moveDef(u, key) {
  if (key === "tackle" || key === "guard") return MOVES[key];
  if (key === "unique") return MOVES[u.unique];
  const item = u.equip[+key.slice(4)], p = partOf(item);
  return { id: key, name: itemName(item), kind: "part", en: p.en, acc: p.acc, target: "enemy", effect: "damage", element: null, part: p, item };
}
function partEnCost(u, p) {
  const t = typeOf(u);
  let c = p.en;
  if (t && t.partEnRate) c = Math.max(1, Math.ceil(c * t.partEnRate));   // 砲撃型の割引
  if (u.bs.barrage) c = Math.max(1, Math.ceil(c / 2));                    // 集中砲火
  return c;
}
// 味方の命中率（型の補正、鷹の目、連続ミスの補正、下限50%）
function hitChance(u, base, opts = {}) {
  if (opts.sure) return 100;
  const t = typeOf(u);
  let a = base + u.accBonus + (opts.mod || 0) + u.bs.accUp + Math.min(MISS_STREAK_CAP, u.bs.missStreak * MISS_STREAK_BONUS);
  if (opts.part && t && t.heavyAccBonus && opts.part.type !== "gun") a += t.heavyAccBonus;
  return Math.max(PLAYER_ACC_MIN, Math.min(100, a));
}
function critRateOf(u) {
  const t = typeOf(u);
  let r = (t && t.critRate) || 0;
  if (r && battle && battle.enemy.boss && battle.heavyReady) r += CRIT_CHARGE_BONUS;
  return r + u.bs.critUp;
}
// わざの中身（一覧の表示、予測、実行、ボットで共通に使う）
function moveInfo(u, key) {
  const d = moveDef(u, key);
  const lv = key === "guard" ? u.skills.guard : key === "unique" ? u.skills.unique : 0;
  const info = { key, def: d, name: d.name, kind: d.kind, lv, en: 0, damaging: false, hits: 1, power: 0, acc: null, sure: false, desc: "", short: "" };
  const tk = tackleOf(u), vsBoss = !!(battle && battle.enemy.boss);
  if (key === "tackle") {
    Object.assign(info, { damaging: true, power: tk, acc: hitChance(u, TACKLE_ACC), desc: d.desc });
  } else if (key === "guard") {
    const rec = guardRecover(lv);
    Object.assign(info, { short: `EN+${rec}`, desc: `次に受けるダメージを半分にし、ENを${rec}回復する。攻撃はしない。` });
  } else if (d.kind === "part") {
    const p = d.part;
    info.en = partEnCost(u, p);
    info.power = itemPower(d.item) * (u.bs.barrage || 1);
    Object.assign(info, { damaging: true, acc: hitChance(u, p.acc, { part: p }),
      desc: `${PART_TYPE_LABEL[p.type]}（${RARITY[p.rarity].name}）。${p.type === "gun" ? "外れにくい堅実な武器。" : p.type === "missile" ? "当たれば大きい一発逆転の武器。" : "強いがENを多く使う武器。"}${u.bs.barrage ? `集中砲火で威力×${u.bs.barrage}、EN半分。` : ""}` });
  } else {
    info.en = d.en;
    switch (d.id) {
      case "crit": { const v = lerpInt(d.lv1, d.lv10, lv); info.value = v; info.short = `会心+${v}%`; info.desc = `次の攻撃の会心率が+${v}%（1回限り）。`; break; }
      case "barrage": { const m = lerpMul(d.lv1, d.lv10, lv); info.value = m; info.short = `次の武器×${m}`; info.desc = `次のパーツのわざの消費ENが半分、威力×${m}（1回限り）。`; break; }
      case "blind": { const n = lv >= d.twoAtLv ? 2 : 1; info.value = n; info.short = `回避${n}回`; info.desc = `次の敵の攻撃を${n}回、確実にかわす。ボスの強攻撃はかわせない。`; break; }
      case "curl": { const v = lerpInt(d.lv1, d.lv10, lv); info.value = v; info.short = `HP+${v}%`; info.desc = `次の被ダメージ−${d.cut}%。HPを最大の${v}%回復。`; break; }
      case "cover": { const v = lerpInt(d.lv1, d.lv10, lv); info.value = v; info.short = `かばう−${v}%`; info.desc = `次の敵の攻撃を、狙われた相手に関係なく自分が受ける。受けるダメージ−${v}%。`; break; }
      case "roar": { const v = lerpInt(d.lv1, d.lv10, lv); info.value = vsBoss ? Math.floor(v / 2) : v; info.short = `攻撃−${info.value}%`; info.desc = `敵の攻撃力を${d.turns}ターンの間−${v}%（ボスには半分）。`; break; }
      case "hawkeye": { const v = lerpInt(d.lv1, d.lv10, lv); info.value = v; info.short = `全員命中+${v}%`; info.desc = `味方全員の次の攻撃の命中+${v}%（1人1回ずつ）。`; break; }
      case "claws": { const m = lerpMul(d.lv1, d.lv10, lv);
        Object.assign(info, { damaging: true, hits: 2, power: tk * m / 2, acc: hitChance(u, TACKLE_ACC, { mod: d.accMod }), desc: `2回攻撃（合計はたいあたりの×${m}）。命中+${d.accMod}%。` }); break; }
      case "dive": { const m = lerpMul(d.lv1, d.lv10, lv); const pw = Math.max(1, Math.floor(tk * m));
        Object.assign(info, { damaging: true, power: pw, sure: true, acc: 100, desc: `たいあたりの×${m}。必ず当たる。` }); break; }
      case "bite": { const m = lerpMul(d.lv1, d.lv10, lv); let pw = Math.max(1, Math.floor(tk * m)); if (vsBoss) pw = Math.floor(pw * d.bossBonus);
        Object.assign(info, { damaging: true, power: pw, acc: hitChance(u, TACKLE_ACC, { mod: d.accMod }),
          desc: `たいあたりの×${m}、命中${d.accMod}%。当たると敵は次のターン動けない（ボスには効かず、代わりにダメージ+20%）。` }); break; }
    }
  }
  // レベル倍率（味方のダメージを与えるわざすべて）。四捨五入、最低1
  if (info.damaging) {
    info.power = Math.max(1, Math.round(info.power * levelMult(u)));
    info.short = `威力${info.power}${info.hits > 1 ? `×${info.hits}` : ""}`;
  }
  return info;
}

// 攻撃の処理（ダメージの式はパーツもたいあたりも固有技も同じ）
function doDamage(u, info) {
  const e = battle.enemy;
  let hitAny = false;
  for (let h = 0; h < info.hits && e.hp > 0; h++) {
    const label = info.hits > 1 ? `${info.name}(${h + 1})` : info.name;
    if (!info.sure && !roll(info.acc)) {
      u.bs.missStreak = Math.min(MISS_STREAK_CAP / MISS_STREAK_BONUS, u.bs.missStreak + 1);
      battle.stats.maxMissStreak = Math.max(battle.stats.maxMissStreak || 0, u.bs.missStreak);
      log(`${u.name}の${label}！ 外れた。`);
      popNumber("ミス", "#bbb", "miss");
      continue;
    }
    u.bs.missStreak = 0;
    let dmg = varied(info.power);
    const crit = roll(critRateOf(u));
    if (crit) dmg = Math.floor(dmg * CRIT_MULT);
    e.hp = Math.max(0, e.hp - dmg);
    hitAny = true;
    log(`${u.name}の${label}！ ${crit ? "会心！ " : ""}${dmg}ダメージ。`, crit ? "#ffd447" : "");
    popNumber(`-${dmg}`, crit ? "#ffd447" : "#fff", "enemy", crit);
    shake($("eSprite"));
  }
  // 1回限りの効果はここで使い切る
  u.bs.critUp = 0; u.bs.accUp = 0;
  if (info.kind === "part") u.bs.barrage = 0;
  if (hitAny && info.def.stun && !e.boss) { battle.stunned = true; log(`${e.name}はひるんで動けない！`); }
}

// わざを使う
function executeMove(u, key) {
  const info = moveInfo(u, key), d = info.def;
  u.en -= info.en;
  // 集計（テストと調整用）：わざの種類、攻撃の種類、固有技ごとの回数
  const st = battle.stats;
  st.moves[d.kind] = (st.moves[d.kind] || 0) + 1;
  if (info.damaging) (st.attacks ||= {})[d.kind] = (st.attacks[d.kind] || 0) + 1;
  if (d.kind === "unique") (st.uniques ||= {})[d.id] = (st.uniques[d.id] || 0) + 1;
  const bu = ((st.byUnit ||= {})[u.name] ||= {}); bu[info.name] = (bu[info.name] || 0) + 1;
  u.lastMove = key;   // 次の番のカーソル（セーブしない）
  showBanner(info.name);
  if (d.kind === "unique") flashScreen(d.flash);
  if (key === "guard") {
    u.bs.guard = GUARD_CUT;
    const rec = guardRecover(u.skills.guard), before = u.en;
    u.en = Math.min(u.maxEn, u.en + rec);
    log(`${u.name}は防御の構え。EN+${u.en - before}。`);
  } else if (info.damaging) {
    doDamage(u, info);
  } else {
    switch (d.id) {
      case "crit": u.bs.critUp = info.value; log(`${u.name}は力をためた。次の攻撃の会心率+${info.value}%！`); break;
      case "barrage": u.bs.barrage = info.value; log(`${u.name}は照準を合わせた。次のパーツはEN半分・威力×${info.value}！`); break;
      case "blind": u.bs.blind = info.value; log(`${u.name}の目くらまし！ 次の攻撃を${info.value}回かわす。`); break;
      case "curl": { u.bs.curl = d.cut; const before = u.hp; u.hp = Math.min(u.maxHp, u.hp + Math.floor(u.maxHp * info.value / 100));
        log(`${u.name}はまるまった。HP+${u.hp - before}、次の被ダメージ−${d.cut}%。`); popNumber(`+${u.hp - before}`, "#5fe07a", "ally"); break; }
      case "cover": u.bs.cover = info.value; log(`${u.name}は仲間をかばう構え。`); break;
      case "roar": battle.roarTurns = d.turns; battle.roarRate = info.value; log(`${u.name}のほえる！ ${battle.enemy.name}の攻撃力が${d.turns}ターン−${info.value}%。`); break;
      case "hawkeye": for (const a of alive()) a.bs.accUp = info.value; log(`${u.name}の鷹の目！ 味方全員の次の攻撃の命中+${info.value}%。`); break;
    }
  }
  levelUpSkill(u, key === "guard" ? "guard" : d.kind === "unique" ? "unique" : null);
}

// 各コマンド。"escaped" を返すとバトル終了
const ACTIONS = {
  move(u, key) { executeMove(u, key); },
  tackle(u) { executeMove(u, "tackle"); },      // 互換用
  item(u, arg) { useItem(arg.key, arg.target); },
  escape(u) {
    if (roll(ESCAPE_RATE)) {
      log("うまく逃げ切った！");
      battle.enemy.stun = ESCAPE_STUN_TURNS;
      return "escaped";
    }
    log(`${u.name}は逃げようとしたが、失敗した！`);
  },
};

function nextActor(from) {
  for (let i = from + 1; i < team.length; i++) if (team[i].hp > 0) return i;
  return -1;
}

async function runCommand(action, arg) {
  if (!battle || battle.busy || battle.actor < 0) return;
  battle.busy = true;
  battle.selected = null;
  const u = team[battle.actor];
  const result = ACTIONS[action](u, arg);
  renderBattle();
  // 技名の表示があるときだけ、待ち時間を少し延ばす（追加は最大0.5秒）
  const extra = settings.fx && (action === "move" || action === "tackle") ? Math.min(FX_EXTRA_WAIT_MAX, Math.max(0, FX_BANNER_MS - BATTLE_WAIT)) : 0;
  await pause(BATTLE_WAIT + extra);

  if (result === "escaped") { endBattle(); return; }
  if (battle.enemy.hp <= 0) { winBattle(); return; }

  const next = nextActor(battle.actor);
  if (next >= 0) {
    battle.actor = next;
    battle.busy = false;
    await beginTurn();
    return;
  }
  // 味方全員が行動したら、敵の番
  battle.actor = -1;
  renderBattle();
  await enemyPhase();
  if (alive().length === 0) {
    await pause(500);
    onDefeat();
    return;
  }
  battle.round++;
  battle.actor = nextActor(-1);
  battle.busy = false;
  await beginTurn();
}

function randomAlive() { const a = alive(); return a.length ? a[rnd(a.length)] : null; }

// 敵の攻撃。heavy=ボスの強攻撃（必中：回避も目くらましも無視。防御と軽減は有効）
function enemyStrike(e, target, power, acc, label, heavy = false) {
  // かくれがえし：狙われた相手に関係なく、構えている機体が受ける
  let u = target, coverCut = 0;
  const coverer = alive().find(a => a.bs.cover);
  if (coverer) {
    u = coverer; coverCut = coverer.bs.cover; coverer.bs.cover = 0;
    if (coverer !== target) log(`${coverer.name}が${target.name}をかばった！`);
  }
  if (!heavy) {
    if (u.bs.blind > 0) {
      u.bs.blind--;
      log(`${label}！ ${u.name}は目くらましでかわした。`);
      popNumber("回避", "#8fd", "ally");
      return;
    }
    const ev = Math.min(EVADE_CAP, u.evade);
    const chance = Math.max(ENEMY_ACC_MIN, acc - ev) + u.bs.evadeStreak * EVADE_STREAK_BONUS;
    if (!roll(chance)) {
      if (ev > 0) { u.bs.evadeStreak++; log(`${label}！ ${u.name}はひらりとかわした。`); popNumber("回避", "#8fd", "ally"); }
      else { log(`${label}！ ${u.name}への攻撃は外れた。`); popNumber("ミス", "#8fd", "ally"); }
      return;
    }
  }
  u.bs.evadeStreak = 0;
  let dmg = varied(power);
  const cut = [];
  if (u.bs.guard) { dmg *= u.bs.guard; u.bs.guard = 0; cut.push("防御"); }
  if (u.bs.curl) { dmg *= 1 - u.bs.curl / 100; u.bs.curl = 0; cut.push("まるまる"); }
  if (coverCut) { dmg *= 1 - coverCut / 100; cut.push("かくれがえし"); }
  dmg = Math.max(1, Math.round(dmg));
  u.hp = Math.max(0, u.hp - dmg);
  log(`${label}！ ${u.name}に${dmg}ダメージ${cut.length ? `（${cut.join("・")}）` : ""}。`);
  popNumber(`-${dmg}`, "#ff6a6a", "ally");
  shake($("ally" + team.indexOf(u)));
  if (u.hp === 0) { battle.downs++; log(`${u.name}は動けなくなった！`); }
}

// ほえるで下がった攻撃力
function enemyPower(e, mult = 1) {
  let p = e.atk * mult;
  if (battle.roarTurns > 0) p = p * (1 - battle.roarRate / 100);
  return Math.max(1, Math.round(p));
}

async function enemyPhase() {
  const e = battle.enemy;
  const endTurn = () => { if (battle.roarTurns > 0) battle.roarTurns--; };
  if (battle.stunned) {
    battle.stunned = false;
    log(`${e.name}は動けない！`);
    renderBattle(); await pause(); endTurn();
    return;
  }
  if (!e.boss) {
    const t = randomAlive();
    if (t) enemyStrike(e, t, enemyPower(e), e.acc, `${e.name}の攻撃`);
    renderBattle();
    await pause();
    endTurn();
    return;
  }
  battle.bossTurn++;
  if (battle.heavyReady) {
    battle.heavyReady = false;
    const t = randomAlive();
    if (t) enemyStrike(e, t, enemyPower(e, BOSS_HEAVY_MULT), e.acc - BOSS_HEAVY_ACC_DOWN, `${e.name}の強攻撃`, true);
    renderBattle();
    await pause();
    endTurn();
    return;
  }
  if (battle.bossTurn % BOSS_CHARGE_EVERY === 0) {
    battle.heavyReady = true;
    log(`${e.name}は力を溜めている…！ 次は強攻撃だ。`);
    popNumber("力を溜めている", "#ffb02e", "center");
    renderBattle();
    await pause();
    endTurn();
    return;
  }
  const times = e.def.doubleBelowHalf && e.hp <= e.maxHp / 2 ? 2 : 1;
  for (let i = 0; i < times; i++) {
    const t = randomAlive();
    if (!t) break;
    enemyStrike(e, t, enemyPower(e), e.acc, times > 1 ? `${e.name}の連撃(${i + 1})` : `${e.name}の攻撃`);
    renderBattle();
    await pause();
  }
  endTurn();
}

// 落とすパーツを決める（系統とレア度）。通常の敵は救済つき：続けて DROP_PITY_AFTER 体落とさなかったら、次は必ず落とす
function floorRarityPart(type) {
  const band = DROP_RARITY.find(b => floorNo <= b.maxFloor) || DROP_RARITY[DROP_RARITY.length - 1];
  const rarity = pickWeighted(band.rates);
  return PARTS.find(p => p.type === type && p.rarity === rarity).id;
}
function rollNormalDrop(e) {
  const sure = dropMiss >= DROP_PITY_AFTER;
  if (!sure && Math.random() >= DROP_CHANCE) { dropMiss++; return null; }
  dropMiss = 0;
  return floorRarityPart(e.def.drop);
}
function rollRareDrop(e) {
  const rarity = Math.random() < RARE_DROP_LEGEND ? 3 : 2;
  return PARTS.find(p => p.type === e.def.drop && p.rarity === rarity).id;
}
function rollBossDrop(f) {
  const rarity = pickWeighted(BOSS_DROP_RARITY[f]);
  const types = Object.keys(PART_TYPE_LABEL);
  const type = types[rnd(types.length)];
  return PARTS.find(p => p.type === type && p.rarity === rarity).id;
}

function winBattle() {
  const e = battle.enemy;
  battle.result = { rounds: battle.round, downs: battle.downs, boss: e.boss };
  lastBattle = battle.result;
  enemies = enemies.filter(o => o !== e);
  const living = alive();
  for (const u of living) { u.en = Math.min(u.maxEn, u.en + WIN_ENERGY_BONUS); addExp(u, e.exp); }
  log(`${e.name}を破壊した！`);
  // 結果（経験値、パーツ、仲間）はマップに戻ってから出す
  const res = (t, c) => battle.results.push({ t, c: c || "" });
  battle.results.push({ t: `${e.name}を倒した！${e.exp ? ` 経験値 +${e.exp}` : ""}` });
  $("eSprite").style.opacity = "0.2";

  if (e.boss) {
    progress.bossDefeated[floorNo] = true;
    if (floorNo >= FINAL_FLOOR) progress.cleared = true;
    saveGame();   // ボスを倒したら自動保存
  }
  if (e.boss && floorNo >= FINAL_FLOOR) {
    const loot = rollBossDrop(floorNo);
    lastBattle.loot = loot;
    renderBattle();
    setTimeout(() => gameClear(loot), 700);
    return;
  }

  if (e.boss) {
    // ボスのパーツは、倒した瞬間に自動で手に入る（メッセージはマップに戻ってから）
    logPartGain(gainPart(rollBossDrop(floorNo)), "手に入れた", res);
    res("奥の階段が使える。");
  } else if (e.rare) {
    // レア個体は必ずパーツを落とす（救済の数えには含めない）。仲間にはならない
    logPartGain(gainPart(rollRareDrop(e)), "手に入れた", res);
  } else {
    normalSpoils(e, res);
  }
  battle.menu = "result";
  battle.actor = -1;
  battle.busy = false;
  renderBattle();
}

// 通常の敵を倒したときの落とし物と仲間（バトルでも、ひとうちでも同じ）
// 仲間になる判定に当たったら、仲間にする画面を先に出し、決めてから結果のメッセージを出す
function normalSpoils(e, res) {
  const cand = rollRecruit(e);
  const lines = [], buf = (t, c) => lines.push([t, c]);
  const id = rollNormalDrop(e);
  if (id) logPartGain(gainPart(id), "手に入れた", buf);
  if (Math.random() < ITEM_DROP_RATE) {
    const key = Math.random() < 0.5 ? "repair" : "cell";
    inv.items[key]++;
    buf(`${ITEMS[key].name}を手に入れた。`);
  }
  const flush = () => { for (const [t, c] of lines) res(t, c); lines.length = 0; };
  if (cand) offerRecruit(cand, res, flush); else flush();
}

// ---- ひとうち：たいあたり1回で必ず倒せる通常の敵は、バトルに入らず倒す ----
// たいあたりの最小ダメージ（会心なし、レベル倍率込み、ぶれの下限）
const tackleMinDamage = u => Math.max(1, Math.max(1, Math.round(tackleOf(u) * levelMult(u))) - DAMAGE_VARIANCE);
function canOneHit(e) {
  if (!e || e.boss || e.rare || !settings.oneHit) return false;
  const hero = leader();
  return !!hero && hero.hp > 0 && tackleMinDamage(hero) >= e.hp;
}
function oneHit(e) {
  chooseAnimal(e);
  enemies = enemies.filter(o => o !== e);
  for (const u of alive()) addExp(u, e.exp);
  const fs = fightStats[floorNo] || (fightStats[floorNo] = { oneHit: 0, battle: 0 });
  fs.oneHit++;
  mapLog(`ひとうちで倒した！（経験値 +${e.exp}）`);
  normalSpoils(e, mapLog);
  processLevelUps();
}

// ================================================================
//  仲間にする（チームが満員でも判定する。入りきらなければ村のストックへ）
// ================================================================
// 仲間になる機体：倒した敵と同じ動物、主人公機と同じレベル、固有技はその動物の技（Lv1）
// パーツは1枠の固定。系統は大きさで決まり、レア度は倒した階の「敵の落とし物」の表（レジェンドは出ない）
const RECRUIT_MAX_RARITY = 2;
function makeRecruit(e) {
  let id = floorRarityPart(e.def.drop);
  if (partById(id).rarity > RECRUIT_MAX_RARITY) id = PARTS.find(p => p.type === e.def.drop && p.rarity === RECRUIT_MAX_RARITY).id;
  return createAlly(e.def, e.sprite, { lv: leader().lv, part: id });
}
function rollRecruit(e) {
  if (e.boss || e.rare || !e.def.recruit) return null;
  if (Math.random() >= e.def.recruit) return null;
  chooseAnimal(e);
  return makeRecruit(e);
}
// 仲間にする（チームに空きがなければストックへ。ストックの空きは呼ぶ側で確かめる）
function joinUnit(u, out = log, showPart = false) {
  u.name = uniqueName(u.name);
  u.hp = u.maxHp; u.en = u.maxEn; u.bs = freshBattleState();
  const tail = showPart && u.equip[0] ? `（パーツ『${itemText(u.equip[0])}』）` : "";
  const color = u.equip[0] ? RARITY[partOf(u.equip[0]).rarity].color : "";
  if (team.length < TEAM_MAX) { team.push(u); out(`${u.name}が仲間になった！${tail}`, showPart ? color : ""); return "team"; }
  stock.push(u);
  out(`${u.name}が仲間になった！（村のストックに送った）${tail}`, showPart ? color : "");
  return "stock";
}
const hasRoom = () => team.length < TEAM_MAX || stock.length < STOCK_MAX;

// 設定「仲間にする確認」で分ける。then=決めたあとに出す結果のメッセージ
let recruitState = null, recruitQueue = [];
function offerRecruit(cand, out, then = () => {}) {
  const m = settings.recruitConfirm;
  if (m === "never") { then(); return; }
  if (m === "always" && hasRoom()) { then(); joinUnit(cand, out, true); return; }
  if (recruitState) { recruitQueue.push({ cand, out, then }); return; }
  recruitState = { cand, out, then, view: hasRoom() ? "offer" : "full", pick: null };
  renderRecruit();
  $("recruit").hidden = false;
}
// 決める：yes=仲間にする
function recruitDecide(yes) {
  const st = recruitState;
  if (!st || st.view === "pick") return;
  if (yes && !hasRoom()) { st.view = "pick"; st.pick = null; renderRecruit(); return; }
  closeRecruit();
  st.then();
  if (yes) joinUnit(st.cand, st.out, settings.recruitConfirm === "always");
  else st.out(`${st.cand.name}は去っていった。`);
  afterRecruit();
}
function closeRecruit() {
  recruitState = null;
  $("recruit").hidden = true;
}
// 次の候補か、止めていたマップの続き
let recruitAfter = null;
function afterRecruit() {
  if (recruitQueue.length) { const q = recruitQueue.shift(); offerRecruit(q.cand, q.out, q.then); return; }
  if (recruitAfter) { const f = recruitAfter; recruitAfter = null; f(); }
  if (mode === "battle") renderBattle();
  else if (mode === "map") renderMap();
}
// ストックの機体を解体して空けてから仲間にする（ダンジョン中でも、このためだけにストックを開ける）
function recruitDismantlePicked() {
  const st = recruitState, u = st && st.pick;
  if (!u) return;
  showDialog("解体", dismantleText(u), [
    { label: "解体する", danger: true, act: () => {
      dismantle(u, st.out);
      closeRecruit();
      st.then();
      joinUnit(st.cand, st.out, settings.recruitConfirm === "always");
      afterRecruit();
    } },
    { label: "やめる", act: () => {} }]);
}

// 小さな機体の行（絵・名前・レベル・HP・パーツ）。仲間にする画面とメニューの「仲間」タブで使う
function unitLine(u, opts = {}) {
  const row = el("div", "rcUnit" + (opts.pick ? " pick" : "") + (opts.on ? " on" : ""));
  row.append(spriteEl(u.sprite, 1, false));
  // 1行目：名前・レベル・HP・固有技、2行目：パーツ（仲間は🔒固定）
  const t = el("div", "rcuText");
  const l1 = el("div", "rcuL");
  l1.append(el("b", "", u.name), ` Lv${u.lv}`);
  if (opts.hp !== false) l1.append(`　HP${u.maxHp}`);
  if (opts.unique) l1.append(`　${MOVES[u.unique].name}`);
  if (u.isLeader) l1.append(el("span", "junk", "　主人公機"));
  const l2 = el("div", "rcuL");
  const it = u.equip.filter(Boolean);
  if (!it.length) l2.append("パーツなし");
  it.forEach((x, i) => { const sp = el("span", "", (i ? "・" : "") + itemText(x)); sp.style.color = RARITY[partOf(x).rarity].color; l2.append(sp); });
  if (!u.isLeader && it.length) l2.append(el("span", "lock", " 🔒固定"));
  t.append(l1, l2);
  row.append(t);
  if (opts.onClick) row.addEventListener("click", opts.onClick);
  return row;
}

function renderRecruit() {
  const st = recruitState, u = st.cand, body = $("rcBody"), btns = $("rcBtns");
  body.textContent = ""; btns.textContent = "";
  const btn = (label, fn, cls, id, dis) => { const b = rowButton(label, fn, dis, cls); b.id = id; btns.append(b); return b; };
  if (st.view === "pick") {
    body.append(el("h2", "", "解体する機体を選ぶ"));
    body.append(el("div", "mnote", `ストック ${stock.length}/${STOCK_MAX}体。解体すると、パーツとジャンクが手に入ります。`));
    const list = el("div", "rcTeam");
    for (const x of stock) list.append(unitLine(x, { pick: true, on: st.pick === x, unique: true, onClick: () => { st.pick = x; renderRecruit(); } }));
    body.append(list);
    btn("解体する", recruitDismantlePicked, "danger", "rcDismantle", !st.pick);
    btn("もどる", () => { st.view = "full"; renderRecruit(); }, "", "rcBack");
    return;
  }
  body.append(el("h2", "", "仲間になりたそうにしている！"));
  const top = el("div", "rcTop");
  top.append(spriteEl(u.sprite, 3, false));
  const nm = el("div");
  nm.append(el("div", "rcName", u.name), el("div", "", `Lv${u.lv}`));
  const g = el("div", "rcStats");
  const stat = (k, v) => { const d = el("div", "", k + " "); d.append(el("b", "", v)); g.append(d); };
  stat("HP", String(u.maxHp)); stat("EN", String(u.maxEn)); stat("たいあたり", String(Math.max(1, Math.round(tackleOf(u) * levelMult(u)))));
  nm.append(g);
  top.append(nm);
  body.append(top);
  const mi = moveInfo(u, "unique");
  const sq = el("div", "rcSec");
  sq.append(el("div", "rcLabel", "固有技"), el("div", "", `${mi.name}　EN${mi.en}`), el("small", "", mi.desc));
  body.append(sq);
  const it = u.equip[0], p = partOf(it);
  const sp = el("div", "rcSec");
  const pn = el("span", "", itemText(it)); pn.style.color = RARITY[p.rarity].color;
  const pl = el("div"); pl.append(el("span", "tag " + p.type, PART_TYPE_LABEL[p.type]), pn, el("span", "lock", "　🔒固定"));
  sp.append(el("div", "rcLabel", "パーツ（1枠・付け替えできない）"), pl, el("small", "", `威力${Math.round(itemPower(it))}　命中${p.acc}%　EN${p.en}`));
  body.append(sp);
  body.append(el("div", "rcLabel", "今のチーム"));
  const tl = el("div", "rcTeam");
  for (const x of team) tl.append(unitLine(x));
  body.append(tl);
  if (st.view === "full") {
    body.append(el("div", "rcNote", `ストックが満員です（${stock.length}/${STOCK_MAX}体）`));
    btn("ストックの機体を解体して空ける（Y）", () => recruitDecide(true), "primary", "rcYes");
  } else {
    if (team.length >= TEAM_MAX) body.append(el("div", "rcNote", "チームが満員なので、村のストックに送ります"));
    btn("仲間にする（Y）", () => recruitDecide(true), "primary", "rcYes");
  }
  btn("あきらめる（N）", () => recruitDecide(false), "", "rcNo");
}
function recruitKey(key) {
  const st = recruitState;
  if (st.view === "pick") { if (key === "Escape" || key === "n" || key === "N") { st.view = "full"; renderRecruit(); } return true; }
  if (key === "y" || key === "Y") recruitDecide(true);
  else if (key === "n" || key === "N" || key === "Escape") recruitDecide(false);
  return true;
}

// ================================================================
//  解体（村のストックの機体だけ）：パーツは持ち物へ、ジャンクが手に入る
// ================================================================
const junkFor = u => JUNK_BASE[u.kind] + (u.equip[0] ? JUNK_RARITY[partOf(u.equip[0]).rarity] : 0);
function dismantleText(u) {
  const it = u.equip[0];
  return `${u.name}を解体します。${it ? `パーツ『${itemText(it)}』が持ち物に入り、` : ""}ジャンクが${junkFor(u)}個手に入ります。よろしいですか？`;
}
function dismantle(u, out = log) {
  if (!u || u.isLeader || !stock.includes(u)) return null;
  const it = u.equip[0], j = junkFor(u);
  stock = stock.filter(x => x !== u);
  inv.junk = Math.min(JUNK_MAX, (inv.junk || 0) + j);
  const res = it ? gainPart(it.id, { plus: it.plus || 0 }) : null;
  out(`${u.name}を解体した。${it ? `『${itemText(it)}』と、` : ""}ジャンク×${j}を手に入れた`, it ? RARITY[partOf(it).rarity].color : "");
  if (res && res.upgraded) out(`『${partOf(res.item).name}』が強化された！（+${res.item.plus}）`, RARITY[partOf(res.item).rarity].color);
  for (const d of (res && res.discarded) || []) out(`持ち物がいっぱいなので『${itemText(d)}』を捨てた。`);
  return { res, junk: j };
}

// ---- わざの一覧（常に表示）と「その他」 ----
// 自分の番の最初のカーソル：前回使ったわざ（使えなければ、たいあたり）
function defaultMove(u) {
  const k = u.lastMove;
  if (k && moveKeys(u).includes(k) && moveInfo(u, k).en <= u.en) return k;
  return "tackle";
}
function pickMove(key) {
  if (!battle || battle.busy || battle.actor < 0) return;
  const u = team[battle.actor], info = moveInfo(u, key);
  if (info.en > u.en) { log("ENが足りない！"); return; }
  if (settings.instant || battle.selected === key) { runCommand("move", key); return; }
  battle.selected = key;
  renderBattle();
}
function decide() {
  if (!battle || battle.busy || recruitState) return;
  if (battle.menu === "result") { endBattle(); return; }
  if (battle.actor < 0 || !battle.selected) return;
  const u = team[battle.actor];
  if (moveInfo(u, battle.selected).en > u.en) { log("ENが足りない！"); return; }
  runCommand("move", battle.selected);
}

// 仲間のおまかせ（主人公機は常に手動）
const AUTO_LOW_EN = 0.3, AUTO_WAIT = 300;
const isAutoUnit = u => !!(u && !u.isLeader && settings.allyAuto);
function autoChoose(u) {
  const e = battle.enemy, a = alive();
  const opts = moveKeys(u).map(k => moveInfo(u, k));
  const tk = opts.find(i => i.key === "tackle");
  const tackleMin = Math.max(1, tk.power - DAMAGE_VARIANCE);
  // 2. たいあたりで倒せるなら、たいあたり
  if (e.hp <= tackleMin) return "tackle";
  // 3. ボスの強攻撃の前で、受けると危ないなら防御
  if (e.boss && battle.heavyReady && u.hp <= enemyPower(e, BOSS_HEAVY_MULT) + DAMAGE_VARIANCE) return "guard";
  // 4. 固有技
  const uq = opts.find(i => i.kind === "unique");
  if (uq && uq.en <= u.en) {
    const id = uq.def.id;
    if (id === "curl" && !u.bs.curl && u.hp <= u.maxHp * 0.5) return "unique";
    if (id === "cover" && !u.bs.cover && a.some(x => x !== u && x.hp <= x.maxHp * 0.4)) return "unique";
    if (id === "roar" && battle.roarTurns === 0 && (e.boss || e.hp > tackleMin)) return "unique";
    if (id === "hawkeye" && a.length > 1 && (battle.round === 1 && !u.hawkRound || u.hawkRound != null && battle.round - u.hawkRound >= 3)) { u.hawkRound = battle.round; return "unique"; }
  }
  // 5. 使える攻撃のわざ（パーツ、攻撃系の固有技）で、期待ダメージが一番高いもの
  const atk = opts.filter(i => i.damaging && i.key !== "tackle" && i.en <= u.en)
    .map(i => ({ i, v: i.power * i.hits * (i.sure ? 100 : i.acc) / 100 }))
    .sort((x, y) => y.v - x.v);
  if (atk.length) return atk[0].i.key;
  // 6. ENが少なければ防御で補給、そうでなければたいあたり
  return u.en <= u.maxEn * AUTO_LOW_EN ? "guard" : "tackle";
}

// 番が回ってきたときの準備（カーソル、おまかせ）
async function beginTurn() {
  const u = team[battle.actor];
  battle.menu = "moves";
  battle.selected = defaultMove(u);
  renderBattle();
  if (isAutoUnit(u)) {
    battle.busy = true;
    renderBattle();
    await pause(AUTO_WAIT);
    if (!battle) return;
    battle.busy = false;
    await runCommand("move", autoChoose(u));
  }
}

function battleCommands() {
  const b = battle, cmds = [];
  if (b.menu === "result") return [{ label: "つづける", sub: "マップにもどる", act: endBattle }];
  if (b.actor < 0) return [];
  const u = team[b.actor];
  for (const key of moveKeys(u)) {
    const info = moveInfo(u, key), d = info.def;
    const lvTxt = info.lv ? ` Lv${info.lv}` : "";
    // パーツの★は2行目の頭に出す（名前が長くても★が切れないように）
    const stars = d.kind === "part" && d.part.rarity ? RARITY[d.part.rarity].stars + " " : "";
    const c = { key, label: info.name + lvTxt,
      sub: `${stars}EN${info.en}　${info.short}${info.acc != null ? `　命中${info.acc}%` : ""}`,
      noen: info.en > u.en, selected: b.selected === key, act: () => pickMove(key) };
    if (d.kind === "part") { c.color = RARITY[d.part.rarity].color; c.mark = d.part.type; }
    else if (d.kind === "unique") c.mark = "unique";
    cmds.push(c);
  }
  return cmds;
}

// 選んでいるわざの説明・命中率・予測ダメージ
function renderMoveInfo() {
  const box = $("moveInfo");
  const b = battle;
  const show = !!(b && b.menu === "moves" && b.selected && b.actor >= 0);
  box.hidden = !show;
  if (!show) return;
  const u = team[b.actor], info = moveInfo(u, b.selected);
  box.textContent = "";
  const top = el("div", "miName", `${u.name}：${info.name}${info.lv ? ` Lv${info.lv}` : ""}`);
  top.append(el("span", "miDesc", "　" + info.desc));
  box.append(top);
  const line = [];
  if (info.acc != null) line.push(`命中${info.acc}%`);
  if (info.damaging) line.push(`予測ダメージ 約${info.power}${info.hits > 1 ? `×${info.hits}` : ""}`);
  else line.push(`効果：${info.short}`);
  line.push(`EN${info.en}（残り${u.en - info.en}）`);
  box.append(el("div", "miLine", line.join("　")));
}

let currentCmds = [];
function renderBattle() {
  if (!battle) return;
  const e = battle.enemy;
  $("eName").textContent = (e.boss ? "BOSS " : "") + e.name;
  $("eName").classList.toggle("rareName", !!e.rare);
  const st = [];
  if (battle.roarTurns > 0) st.push(`攻撃−${battle.roarRate}%（残り${battle.roarTurns}）`);
  if (battle.stunned) st.push("ひるみ");
  $("eHpText").textContent = `${st.length ? st.join(" ") + "　" : ""}HP ${e.hp}/${e.maxHp}`;
  $("eHpBar").firstElementChild.style.width = (100 * e.hp / e.maxHp) + "%";
  $("charge").textContent = "⚡ 力を溜めている！ 次のターンに強攻撃（必中）";
  $("charge").hidden = !battle.heavyReady;

  team.forEach((u, i) => {
    const d = $("ally" + i);
    if (!d) return;
    d.classList.toggle("active", i === battle.actor);
    d.classList.toggle("down", u.hp <= 0);
  });
  const party = $("party");
  party.textContent = "";
  team.forEach((u, i) => {
    const r = document.createElement("div");
    r.className = "prow" + (i === battle.actor ? " active" : "") + (u.hp <= 0 ? " down" : "");
    r.innerHTML = `<span class="nm"></span><span class="bars"><span class="bar hp"><i></i></span><span class="bar en"><i></i></span></span><span class="num hpn"></span><span class="num enn"></span>`;
    r.querySelector(".nm").textContent = u.name;
    const small = document.createElement("small"); small.textContent = ` Lv${u.lv}${isAutoUnit(u) ? " 自動" : ""}`;
    r.querySelector(".nm").append(small);
    r.querySelector(".bar.hp i").style.width = (100 * u.hp / u.maxHp) + "%";
    r.querySelector(".bar.en i").style.width = (100 * u.en / u.maxEn) + "%";
    r.querySelector(".hpn").textContent = u.hp > 0 ? `${u.hp}/${u.maxHp}` : "停止";
    r.querySelector(".hpn").classList.toggle("low", u.hp > 0 && u.hp <= u.maxHp * 0.3);
    r.querySelector(".enn").textContent = `EN${u.en}/${u.maxEn}`;
    const s = [];
    if (u.bs.guard) s.push("防御中");
    if (u.bs.critUp) s.push(`会心+${u.bs.critUp}%`);
    if (u.bs.barrage) s.push(`集中砲火×${u.bs.barrage}`);
    if (u.bs.blind) s.push(`目くらまし${u.bs.blind}`);
    if (u.bs.curl) s.push("まるまる");
    if (u.bs.cover) s.push("かばう");
    if (u.bs.accUp) s.push(`命中+${u.bs.accUp}%`);
    if (u.bs.missStreak) s.push(`次の命中+${Math.min(MISS_STREAK_CAP, u.bs.missStreak * MISS_STREAK_BONUS)}%`);
    if (s.length) { const d = document.createElement("span"); d.className = "st"; d.textContent = s.join("　"); r.append(d); }
    party.append(r);
  });

  const title = $("cmdTitle");
  title.textContent = "";
  if (battle.menu === "result") title.textContent = "勝利！";
  else if (battle.actor >= 0 && !battle.busy) {
    const b = document.createElement("b"); b.textContent = team[battle.actor].name;
    title.append(b, "：わざを選ぶ（もう一度押すか「決定」で実行）");
  } else if (battle.actor >= 0 && isAutoUnit(team[battle.actor])) title.textContent = `${team[battle.actor].name}（おまかせ）の行動…`;
  else title.textContent = battle.actor < 0 ? `${e.name}の行動…` : "…";

  currentCmds = battle.busy && battle.menu !== "result" ? [] : battleCommands();
  const box = $("cmds");
  box.textContent = "";
  box.classList.toggle("moveList", battle.menu === "moves");
  currentCmds.forEach((c, i) => {
    const btn = document.createElement("button");
    const k = document.createElement("span"); k.className = "k"; k.textContent = String(i + 1);
    const lab = document.createElement("span"); lab.textContent = c.label;
    if (c.color) lab.style.color = c.color;
    const line = document.createElement("span");
    line.append(k);
    if (c.mark) line.append(el("span", "mk mk-" + c.mark, c.mark === "unique" ? "固" : PART_TYPE_LABEL[c.mark][0]));
    line.append(lab);
    btn.append(line);
    if (c.sub) { const sm = document.createElement("small"); sm.textContent = c.sub; btn.append(sm); }
    if (c.noen) btn.classList.add("noen");
    if (c.selected) btn.classList.add("sel");
    if (c.key) btn.dataset.key = c.key;
    btn.disabled = !!c.disabled;
    btn.addEventListener("click", () => { if (!btn.disabled && c.act) c.act(); });
    box.append(btn);
  });
  const myTurn = battle.menu === "moves" && battle.actor >= 0 && !battle.busy;
  $("btnGo").disabled = !(myTurn || battle.menu === "result");
  $("btnGo").textContent = battle.menu === "result" ? "つづける" : "決定";
  $("btnOther").disabled = !myTurn;
  renderMoveInfo();
}

// ---- 「その他」（アイテム、にげる、仲間のおまかせ切り替え） ----
let otherState = null;   // { view: "main" | "items" | "target", key, preview }
function openOther() {
  if (!battle || battle.busy || battle.actor < 0 || battle.menu !== "moves") return;
  otherState = { view: "main", unit: team[battle.actor] };
  renderOther();
  $("other").hidden = false;
}
function closeOther() { $("other").hidden = true; otherState = null; }
function renderOtherHead(u, preview) {
  const h = $("otherHead");
  h.textContent = "";
  h.append(unitHeadRow(u, preview));
}
function renderOther() {
  const o = otherState, u = o.unit;
  renderOtherHead(o.headUnit || u, o.preview);
  const body = $("otherBody");
  body.textContent = "";
  const big = (label, fn, disabled, id) => { const b = rowButton(label, fn, disabled, "otherBtn"); if (id) b.id = id; body.append(b); return b; };
  if (o.view === "main") {
    big(`アイテム（修理${inv.items.repair}・セル${inv.items.cell}）`, () => { o.view = "items"; renderOther(); }, false, "oItems");
    big(battle.enemy.boss ? "にげる（ボスからは逃げられない）" : `にげる（成功率${ESCAPE_RATE}%）`, () => {
      showDialog("にげる", "逃げますか？ 失敗すると、この機体の行動は終わります。", [
        { label: "にげる", primary: true, act: () => { closeOther(); runCommand("escape"); } },
        { label: "やめる", act: () => {} }]);
    }, battle.enemy.boss, "oEscape");
    big(`仲間：${settings.allyAuto ? "おまかせ" : "手動"}（押して切り替え）`, () => { settings.allyAuto = !settings.allyAuto; saveGame(); renderOther(); renderBattle(); }, false, "oAuto");
    big("もどる", closeOther, false, "oBack");
  } else if (o.view === "items") {
    for (const key of ["repair", "cell"]) {
      big(`${ITEMS[key].name} ×${inv.items[key]}（${key === "repair" ? "HP" : "EN"}+${ITEMS[key].value}）`, () => { o.key = key; o.view = "target"; renderOther(); }, inv.items[key] <= 0, "oi-" + key);
    }
    big("もどる", () => { o.view = "main"; renderOther(); }, false, "oBack");
  } else if (o.view === "target") {
    const key = o.key;
    for (const t of alive()) {
      const full = key === "repair" ? t.hp >= t.maxHp : t.en >= t.maxEn;
      big(`${t.name}（${key === "repair" ? `HP ${t.hp}/${t.maxHp}` : `EN ${t.en}/${t.maxEn}`}）`, async () => {
        // ヘッダーに変化を見せてから使う（使うと、今の機体の行動は終わる）
        const before = key === "repair" ? t.hp : t.en, max = key === "repair" ? t.maxHp : t.maxEn;
        o.headUnit = t; o.preview = { kind: key === "repair" ? "hp" : "en", from: before, to: Math.min(max, before + ITEMS[key].value) };
        renderOther();
        await pause(600);
        closeOther();
        runCommand("item", { key, target: t });
      }, full, "ot-" + team.indexOf(t));
    }
    big("もどる", () => { o.view = "items"; renderOther(); }, false, "oBack");
  }
}

function battleKey(key) {
  if (!battle) return false;
  if (recruitState) return recruitKey(key);
  if (!$("other").hidden) {
    if (key === "0" || key === "Escape") { closeOther(); return true; }
    return true;
  }
  if (battle.busy) { if (skipWait) skipWait(); return true; }
  if (key === "Enter" || key === " ") { decide(); return true; }
  if (key === "6") { openOther(); return true; }
  const n = parseInt(key, 10);
  if (battle.menu === "moves" && n >= 1 && n <= currentCmds.length) {
    const c = currentCmds[n - 1];
    if (c.key === battle.selected) decide();
    else { const u = team[battle.actor]; if (moveInfo(u, c.key).en > u.en) log("ENが足りない！"); else { battle.selected = c.key; renderBattle(); } }
    return true;
  }
  return false;
}

let menuFrom = "map";
function openMenu() {
  if (mode !== "map" && mode !== "village") return;

  mode = "menu";
  menuState = { unit: 0, pending: null, preview: null, result: null, note: null };

function closeMenu() {
  if (mode !== "menu") return;

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}
function partInfo(item, extra) {
  const p = partOf(item), info = el("div", "info");
  const name = el("div");
  const nm = el("span", "pname", itemText(item));
  nm.style.color = RARITY[p.rarity].color;
  name.append(el("span", "tag " + p.type, PART_TYPE_LABEL[p.type]), nm);

  return info;
}
// 機体の名前・HPバー・ENバー（メニューと「その他」の固定ヘッダー）。preview={kind:"hp"|"en", from, to} で変化を見せる
function unitHeadRow(u, preview) {
  const row = el("div", "uhead");
  row.append(el("div", "uhName", `${u.name} Lv${u.lv}`));
  const mk = (kind, cur, max) => {
    const box = el("div", "uhStat");
    const bar = el("span", `bar ${kind}`); const i = el("i"); i.style.width = (100 * cur / max) + "%"; bar.append(i);
    const pv = preview && preview.kind === kind ? preview : null;
    const num = el("span", "uhNum" + (pv ? ` chg chg-${kind}${settings.fx ? " glow" : ""}` : ""), pv ? `${kind.toUpperCase()} ${pv.from} → ${pv.to}` : `${kind.toUpperCase()} ${cur}/${max}`);
    if (pv) i.style.width = (100 * pv.to / max) + "%";
    box.append(bar, num);
    return box;
  };
  row.append(mk("hp", u.hp, u.maxHp), mk("en", u.en, u.maxEn));
  return row;
}
function rowButton(label, fn, disabled, cls) {
  const b = el("button", cls || "", label);
  b.disabled = !!disabled;
  b.addEventListener("click", fn);
  return b;
}

function menuUseItem(key, u) {

// 一括回復の計画：割合の低い順に、満タンになる最小限の個数だけ使う（HP0は対象外）
function planBulk(kind) {
  const plan = [];
  let left = { repair: inv.items.repair, cell: inv.items.cell }, short = false;
  const kinds = kind === "both" ? ["hp", "en"] : [kind];
  for (const k of kinds) {
    const key = k === "hp" ? "repair" : "cell", val = ITEMS[key].value, max = k === "hp" ? "maxHp" : "maxEn";
    const list = team.filter(u => u.hp > 0 && u[k] < u[max]).sort((a, b) => a[k] / a[max] - b[k] / b[max]);
    for (const u of list) {
      const need = Math.ceil((u[max] - u[k]) / val);
      const use = Math.min(need, left[key]);
      if (use < need) short = true;
      if (use > 0) { left[key] -= use; plan.push({ u, k, key, use, from: u[k], to: Math.min(u[max], u[k] + use * val) }); }
    }
  }
  const used = { repair: inv.items.repair - left.repair, cell: inv.items.cell - left.cell };
  return { plan, used, short };
}
function askBulkHeal(kind) {
  if (menuFrom === "village") return;
  const p = planBulk(kind);
  if (!p.used.repair && !p.used.cell) {
    menuState.note = p.short ? "回復アイテムが足りません" : "回復の必要はありません";
    renderMenu(); return;
  }
  const go = () => doBulkHeal(kind);
  if (settings.bulkNoConfirm) { go(); return; }
  showDialog("一括回復", `修理キットを${p.used.repair}個、エネルギーセルを${p.used.cell}個、使います。よろしいですか？`, [
    { label: "使う", primary: true, act: go }, { label: "やめる", act: () => {} }]);
}
function doBulkHeal(kind) {
  const p = planBulk(kind);
  const lines = [];
  for (const s of p.plan) {
    for (let i = 0; i < s.use; i++) { inv.items[s.key]--; s.u[s.k] = Math.min(s.k === "hp" ? s.u.maxHp : s.u.maxEn, s.u[s.k] + ITEMS[s.key].value); }
    lines.push(`${s.u.name} ${s.k.toUpperCase()} ${s.from} → ${s.u[s.k]}`);
  }
  menuState.note = p.short ? "回復しきれませんでした" : `修理キット${p.used.repair}個・エネルギーセル${p.used.cell}個を使った`;
  const first = p.plan[0];
  showPreview(first ? { unit: first.u, kind: first.k, from: first.from, to: first.u[first.k] } : null, lines);
  return p;
}
