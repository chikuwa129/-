// ================================================================
//  描画（マップ）。12×12ドットのタイルを整数倍で並べる
// ================================================================
function resize() {
  if (mode !== "map" && mode !== "menu") return;
  if (!team || !map) return;
  const availW = Math.min(window.innerWidth, 520) - 24;
  const others = $("mapScreen").offsetHeight - cv.offsetHeight;
  // #app の上下の余白（表示枠のバー、ホームバーの分を含む）を引く
  const as = getComputedStyle($("app"));
  const availH = window.innerHeight - others - parseFloat(as.paddingTop) - parseFloat(as.paddingBottom) - 8;
  // 画面に収まる最大の整数倍。マス数は 13〜15 列、11〜15 行の範囲で合わせる
  let pick = null;
  for (let s = 4; s >= 1; s--) {
    const cols = Math.min(VIEW_MAX, Math.floor(availW / (MAP_N * s)));
    const rows = Math.min(VIEW_MAX, Math.floor(availH / (MAP_N * s)));
    if (cols >= VIEW_MIN_COLS && rows >= VIEW_MIN_ROWS) { pick = { s, cols, rows }; break; }
  }
  if (!pick) pick = { s: 1, cols: VIEW_MAX, rows: VIEW_MAX };
  mapScale = pick.s; viewCols = pick.cols; viewRows = pick.rows;
  pxRatio = Math.max(1, Math.round(window.devicePixelRatio || 1));
  const T = MAP_N * mapScale;
  cv.style.width = viewCols * T + "px";
  cv.style.height = viewRows * T + "px";
  cv.width = viewCols * T * pxRatio;
  cv.height = viewRows * T * pxRatio;
  renderMap();
}

function renderMap() {
  if (!map) return;
  const s = mapScale * pxRatio, T = MAP_N * s;
  const camX = Math.max(0, Math.min(MAP_W - viewCols, pos.x - (viewCols >> 1)));
  const camY = Math.max(0, Math.min(MAP_H - viewRows, pos.y - (viewRows >> 1)));
  const draw = (key, x, y, mult = 1) => {
    const px = (x - camX) * T, py = (y - camY) * T;
    if (px + T * mult <= 0 || py + T * mult <= 0 || px >= cv.width || py >= cv.height) return;
    ctx.drawImage(spriteImage(key, s * mult, false), px, py);
  };

  ctx.imageSmoothingEnabled = false;
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, cv.width, cv.height);

  for (let vy = 0; vy < viewRows; vy++) {
    for (let vx = 0; vx < viewCols; vx++) {
      const x = camX + vx, y = camY + vy;
      if (!seen[y][x]) continue;
      const t = map[y][x];
      if (t === WALL) draw("t_wall", x, y);
      else if (t === BOSSFLOOR) draw("t_bossfloor", x, y);
      else if (t === GATE) draw("t_gate", x, y);
      else draw("t_floor", x, y);
      if (t === STAIRS) draw("m_stairs", x, y);
      if (t === HEAL) draw("m_heal", x, y);
    }
  }
  for (const it of groundItems) {
    if (!seen[it.y][it.x]) continue;
    draw(it.key === "part" ? "m_parts" : "m_" + ITEMS[it.key].icon, it.x, it.y);
  }
  for (const e of enemies) {
    if (!visible[e.y][e.x]) continue;
    if (e.boss) { draw("m_boss", e.x, e.y, 2); continue; }   // ボスは2倍で2×2マス
    const px = (e.x - camX) * T, py = (e.y - camY) * T;
    if (e.rare) drawRare(ctx, "m_rare", SPARKS_MAP, px, py, s, false);
    else draw("m_enemy", e.x, e.y);
    if (e.hp < e.maxHp) {
      ctx.fillStyle = "#400"; ctx.fillRect(px + s, py + T - 2 * s, T - 2 * s, s);
      ctx.fillStyle = "#f44"; ctx.fillRect(px + s, py + T - 2 * s, (T - 2 * s) * e.hp / e.maxHp, s);
    }
    // ひとうちできる敵の頭上に白い点
    if (canOneHit(e)) { ctx.fillStyle = "#fff"; ctx.fillRect(px + 5 * s, py - s, 2 * s, 2 * s); }
  }
  draw("m_player", pos.x, pos.y);
  // 探索済みだが今見えていないマスは暗くする
  ctx.fillStyle = "rgba(0,0,0,0.5)";
  for (let vy = 0; vy < viewRows; vy++) for (let vx = 0; vx < viewCols; vx++) {
    const x = camX + vx, y = camY + vy;
    if (seen[y][x] && !visible[y][x]) ctx.fillRect(vx * T, vy * T, T, T);
  }
  // 見えていないレア個体も、近ければ金色の光点を出す（未探索の暗いマスでも）
  for (const e of enemies) {
    if (!e.rare || visible[e.y][e.x] || !rareGlintShown(e)) continue;
    drawRare(ctx, "m_glint", SPARKS_MAP, (e.x - camX) * T, (e.y - camY) * T, s, false);
  }
  updateStatus();
  updateMini();
  checkFloorDone();
}

// ================================================================
//  階段へのスキップ：通常階で、敵（レア個体を含む）とアイテム・パーツを取りきり、階段を見つけているとき
// ================================================================
function floorEmpty() {
  if (!map || isBossFloor(floorNo) || enemies.length || groundItems.length) return false;
  for (let y = 0; y < MAP_H; y++) for (let x = 0; x < MAP_W; x++) if (map[y][x] === STAIRS && seen[y][x]) return true;
  return false;
}
function checkFloorDone() {
  if (!floorDone && mode === "map" && floorEmpty()) {
    floorDone = true;
    mapLog("この階には、もう何もないようだ");
  }
  const b = $("stairsBtn");
  b.hidden = !(floorDone && mode === "map" && !isBossFloor(floorNo));
  b.classList.toggle("walking", autoWalking);
  b.textContent = autoWalking ? "止める（キー・タップ）" : "階段へ向かう（T）";
}
// 階段までの最短の道の最初の一歩（階の地図の歩ける床で探す。未探索のマスも通る）
function stepToStairs() {
  const key = (x, y) => y * MAP_W + x, prev = new Map([[key(pos.x, pos.y), null]]), q = [[pos.x, pos.y]];
  while (q.length) {
    const [x, y] = q.shift();
    if (map[y][x] === STAIRS) {
      let k = key(x, y), d = null;
      while (prev.get(k)) { d = prev.get(k)[2]; k = prev.get(k)[0]; }
      return d;
    }
    for (const [dd, [dx, dy]] of Object.entries(DIRS)) {
      if (dd === "wait") continue;
      const nx = x + dx, ny = y + dy, k = key(nx, ny);
      if (nx < 0 || ny < 0 || nx >= MAP_W || ny >= MAP_H || map[ny][nx] === WALL || prev.has(k)) continue;
      prev.set(k, [key(x, y), 0, dd]); q.push([nx, ny]);
    }
  }
  return null;
}
function startAutoWalk() {
  if (!floorDone || mode !== "map" || autoWalking || miniOpen || recruitState) return;
  autoWalking = true;
  checkFloorDone();
  walkStep();
}
function stopAutoWalk() {
  if (!autoWalking) return;
  autoWalking = false;
  if (mode === "map") checkFloorDone();
}
function walkStep() {
  if (!autoWalking) return;
  if (mode !== "map" || miniOpen || recruitState) { stopAutoWalk(); return; }
  const f = floorNo, d = stepToStairs();
  if (!d) { stopAutoWalk(); return; }
  playerMove(d);
  // 階を移った・バトルに入ったら終わり
  if (floorNo !== f || mode !== "map") { autoWalking = false; return; }
  setTimeout(walkStep, AUTO_WALK_MS);
}
const rareGlintShown = e => Math.hypot(e.x - pos.x, e.y - pos.y) <= RARE_VISIBLE_DIST;
// レア個体がマップに見えているか（アイコンか光点）
const rareShown = e => visible[e.y][e.x] || rareGlintShown(e);

// ================================================================
//  ミニマップ：探索済みの範囲だけ。点滅する点（未探索の出口、レア個体）は上から重ねる
// ================================================================
const MINI_COLORS = { floor: "#cfcab0", wall: "#4b4a5c", player: "#4fe0ff", stairs: "#ffffff", heal: "#3fcf6e", item: "#ffd23a", enemy: "#e0443a", rare: "#ffd23a", frontier: "#ffffff" };
const miniBase = document.createElement("canvas");   // 点滅しない部分（マップが変わったときだけ描き直す）
let miniBaseCell = 0, miniOpen = false;
const isWide = () => window.innerWidth >= MINI_WIDE_MIN;
const walkable = (x, y) => x >= 0 && y >= 0 && x < MAP_W && y < MAP_H && map[y][x] !== WALL;
// 未探索の出口：探索済みの歩けるマスで、上下左右に「歩けるのに未探索」のマスがあるもの
function frontierCells() {
  const out = [];
  for (let y = 0; y < MAP_H; y++) for (let x = 0; x < MAP_W; x++) {
    if (!seen[y][x] || !walkable(x, y)) continue;
    if ([[1, 0], [-1, 0], [0, 1], [0, -1]].some(([dx, dy]) => walkable(x + dx, y + dy) && !seen[y + dy][x + dx])) out.push({ x, y });
  }
  return out;
}
function paintMiniBase(c) {
  miniBase.width = MAP_W * c; miniBase.height = MAP_H * c; miniBaseCell = c;
  const g = miniBase.getContext("2d"), dot = (x, y, col, n = 1) => { g.fillStyle = col; g.fillRect(x * c, y * c, c * n, c * n); };
  for (let y = 0; y < MAP_H; y++) for (let x = 0; x < MAP_W; x++) {
    if (!seen[y][x]) continue;
    const t = map[y][x];
    dot(x, y, t === WALL ? MINI_COLORS.wall : t === STAIRS ? MINI_COLORS.stairs : t === HEAL ? MINI_COLORS.heal : MINI_COLORS.floor);
  }
  for (const it of groundItems) if (seen[it.y][it.x]) dot(it.x, it.y, MINI_COLORS.item);
  for (const e of enemies) {
    if (e.rare || !visible[e.y][e.x]) continue;
    dot(e.x, e.y, MINI_COLORS.enemy, e.size);
  }
  dot(pos.x, pos.y, MINI_COLORS.player);
}
// target に、ベース＋点滅する点を描く（倍率 k = target の1マス / ベースの1マス）

}

    deleteSave();

  const hero = leader();
  const slots = hero.equip.map((it, i) => it ? i : -1).filter(i => i >= 0);
  if (slots.length && Math.random() < DEFEAT_PENALTY.breakRate) {
    const slot = slots[rnd(slots.length)], item = hero.equip[slot];

    const p = partOf(item);

// ================================================================
//  セーブ（localStorage）。失敗してもゲームは止めない
// ================================================================
function saveData() {
  const idx = new Map(inv.parts.map((it, i) => [it, i]));
  return {
    version: SAVE_VERSION, typeKey, progress, partUid, bestLevel, settings: { ...settings },
    items: { ...inv.items },
    parts: inv.parts.map(it => it.id),
    plus: inv.parts.map(it => it.plus || 0),
    junk: inv.junk || 0,
    team: team.map(u => unitToSave(u, idx)),
    stock: stock.map(u => unitToSave(u, idx)),
  };
}
// 機体1体ぶんの保存データ（チームとストックで同じ形）。主人公機は持ち物の番号、仲間は固定パーツそのもの
function unitToSave(u, idx) {
  const o = {
    name: u.name, sprite: u.sprite, isLeader: u.isLeader, kind: u.kind,
    baseHp: u.baseHp, baseEn: u.baseEn, baseTackle: u.baseTackle, accBonus: u.accBonus, evade: u.evade,
    lv: u.lv, exp: u.exp, hp: u.hp, en: u.en, skills: { guard: u.skills.guard, unique: u.skills.unique }, unique: u.unique, manual: u.manual,
  };
  if (u.isLeader) o.equip = u.equip.map(it => it ? idx.get(it) : null);
  else o.part = u.equip[0] ? { id: u.equip[0].id, plus: u.equip[0].plus || 0 } : null;
  return o;
}
function saveGame() {
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify(saveData()));
    saveFailed = false;
  } catch (e) {
    saveFailed = true;
  }
}
function deleteSave() {
  try { localStorage.removeItem(SAVE_KEY); } catch (e) { /* 使えなくても続ける */ }
}
// 読み込み：{ status: "none" | "ok" | "broken", data }
function readSave() {
  let raw;
  try { raw = localStorage.getItem(SAVE_KEY); } catch (e) { return { status: "none" }; }
  if (raw == null) return { status: "none" };
  try {
    const d = JSON.parse(raw);
    const okNum = v => typeof v === "number" && isFinite(v);
    if (!d || ![1, 2, 3, SAVE_VERSION].includes(d.version)) throw 0;   // 1〜3 は移行して読む
    if (d.version >= 3 && (!Array.isArray(d.plus) || d.plus.length !== d.parts.length || !d.plus.every(v => Number.isInteger(v) && v >= 0 && v <= PLUS_MAX))) throw 0;
    if (!START_TYPES.some(t => t.key === d.typeKey)) throw 0;
    if (!Array.isArray(d.parts) || !d.parts.every(id => partById(id))) throw 0;
    if (!d.items || !okNum(d.items.repair) || !okNum(d.items.cell)) throw 0;
    if (!d.progress || !okNum(d.progress.maxFloor) || !d.progress.bossDefeated) throw 0;
    if (!Array.isArray(d.team) || d.team.length < 1 || d.team.length > TEAM_MAX || !d.team[0].isLeader) throw 0;
    if (d.version >= 4) {
      if (!okNum(d.junk) || !Array.isArray(d.stock) || d.stock.length > STOCK_MAX) throw 0;
      if (d.stock.some(u => u.isLeader)) throw 0;
    }
    const okIdx = i => i === null || (Number.isInteger(i) && i >= 0 && i < d.parts.length);
    for (const u of d.team.concat(d.version >= 4 ? d.stock : [])) {
      if (!SPR[u.sprite] || !okNum(u.lv) || !okNum(u.exp) || !okNum(u.baseHp) || !okNum(u.baseEn) || !okNum(u.baseTackle)) throw 0;
      if (u.isLeader || d.version < 4) {
        if (!Array.isArray(u.equip) || u.equip.length !== SLOT_COUNT || !u.equip.every(okIdx)) throw 0;
      } else if (u.part !== null && !(u.part && partById(u.part.id) && Number.isInteger(u.part.plus) && u.part.plus >= 0 && u.part.plus <= PLUS_MAX)) throw 0;
      if (!u.skills || typeof u.skills !== "object") throw 0;
      if (d.version >= 2 && !(okNum(u.skills.guard) && okNum(u.skills.unique))) throw 0;
      if (!u.isLeader && !baseOfAlly(u)) throw 0;
    }
    return { status: "ok", data: d };
  } catch (e) {
    return { status: "broken" };
  }
}
// 仲間の基本値（大きさ）を、保存された大きさか動物から決める
function baseOfAlly(s) {
  return ENEMY_TYPES.find(t => t.key === s.kind) || ENEMY_TYPES.find(t => t.animals.some(a => a.sprite === s.sprite));
}
// 読み込み。基本値はいまの定義から作り直す
// 版1→：たいあたり+2の廃止、ENの伸び、スキルはLv1から。版2→3：パーツの強化値は0、足した設定は初期値
// 版3→4：ストックは空、ジャンクは0。仲間の装備は先頭の1つを固定パーツに残し、2つ目は持ち物へ（なければ大きさの初期パーツ）
function applySave(d) {
  const migrated = d.version !== SAVE_VERSION;
  const skillsReset = d.version < 2;
  typeKey = d.typeKey;
  settings = { ...DEFAULT_SETTINGS };
  if (d.settings) for (const k of Object.keys(DEFAULT_SETTINGS)) {
    const v = d.settings[k];
    if (typeof v === typeof DEFAULT_SETTINGS[k] && (k !== "recruitConfirm" || RECRUIT_MODES.some(m => m.key === v))) settings[k] = v;
  }
  partUid = d.partUid || 0;
  resetLogs();
  progress = { maxFloor: d.progress.maxFloor, bossDefeated: { 5: !!d.progress.bossDefeated[5], 10: !!d.progress.bossDefeated[10] }, cleared: !!d.progress.cleared };
  const all = d.parts.map((id, i) => ({ id, uid: ++partUid, plus: d.version >= 3 ? d.plus[i] : 0 }));
  const moved = new Set();   // 古い仲間の固定パーツになったもの（持ち物から外す）
  inv = { parts: all, items: { repair: d.items.repair, cell: d.items.cell }, junk: d.version >= 4 ? Math.min(JUNK_MAX, Math.max(0, Math.floor(d.junk))) : 0 };
  const load = s => {
    let u;
    if (s.isLeader) {
      const t = START_TYPES.find(x => x.key === d.typeKey);
      u = createUnit({ name: s.name, sprite: t.sprite, isLeader: true, kind: t.key, hp: t.hp, en: t.en, tackle: t.tackle,
        accBonus: t.accBonus, evade: t.evade, enGrowth: t.enGrowth, unique: t.unique, lv: s.lv });
      u.equip = s.equip.map(i => i === null ? null : all[i]);
    } else {
      const def = baseOfAlly(s);
      u = createAlly(def, s.sprite, { name: s.name, lv: s.lv });
      if (d.version >= 4) {
        u.equip = [s.part ? fixedPart(s.part.id, s.part.plus) : fixedPart(def.ally.part)];
      } else {
        const first = s.equip.find(i => i !== null);
        if (first != null) { moved.add(all[first]); u.equip = [all[first]]; }
        else u.equip = [fixedPart(def.ally.part)];
      }
    }
    u.exp = s.exp; u.manual = !!s.manual;
    if (!skillsReset) {
      u.skills.guard = Math.min(SKILL_MAX_LEVEL, Math.max(1, s.skills.guard));
      u.skills.unique = Math.min(SKILL_MAX_LEVEL, Math.max(1, s.skills.unique));
    }
    // 最大値は式で作り直し、いまのHPとENは最大値を超えないようにする
    if (okNum(s.hp)) u.hp = Math.max(0, Math.min(u.maxHp, s.hp));
    if (okNum(s.en)) u.en = Math.max(0, Math.min(u.maxEn, s.en));
    return u;
  };
  team = d.team.map(load);
  stock = d.version >= 4 ? d.stock.map(load) : [];
  if (moved.size) { inv.parts = all.filter(i => !moved.has(i)); trimInventory(); }
  bestLevel = Math.max(d.bestLevel || 1, ...team.map(u => u.lv));
  return migrated;
}
const okNum = v => typeof v === "number" && isFinite(v);

// 起動：セーブがあればタイトル（つづきから／はじめから）、なければタイプ選択
function boot() {
  const r = readSave();
  if (r.status === "none") { showSelect(); return; }
  hideAllScreens();
  mode = "title";
  $("title").hidden = false;
  $("btnContinue").hidden = r.status !== "ok";
  $("titleNote").textContent = r.status === "ok" ? "セーブデータがあります。" : "セーブデータを読めませんでした。はじめから遊べます。";
  $("btnContinue").onclick = () => {
    const migrated = applySave(r.data);
    goVillage(migrated ? ["つづきから再開した。", r.data.version < 2 ? "古いセーブデータを新しい形式に移しました（防御と固有技はLv1から）。" : "古いセーブデータを新しい形式に移しました。"] : ["つづきから再開した。"]);
  };
}

// テスト用：直近のバトル結果
let lastBattle = null;
let endShownAt = 0;
const END_KEY_DELAY = 1000;   // 結果画面が出てからキー入力を受け付けるまで(ms)

// ================================================================
//  入力
// ================================================================
const KEYMAP = {
  ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right",
  w: "up", s: "down", a: "left", d: "right", W: "up", S: "down", A: "left", D: "right",
  " ": "wait", ".": "wait",
};
document.addEventListener("keydown", ev => {
  if (mode === "select") {
    const n = parseInt(ev.key, 10);
    if (n >= 1 && n <= START_TYPES.length) { ev.preventDefault(); startGame(START_TYPES[n - 1].key); }
    return;
  }
  if (!$("dialog").hidden) {
    if (ev.key === "Escape") { const bs = $("dlgBtns").children; bs[bs.length - 1].click(); }
    return;
  }
  if (recruitState) { if (recruitKey(ev.key)) ev.preventDefault(); return; }
  if (mode === "over") {
    // 戦闘中にEnterで送っていた勢いで、結果画面を飛ばさないようにする
    if ((ev.key === "Enter" || ev.key === " ") && Date.now() - endShownAt > END_KEY_DELAY) { ev.preventDefault(); goVillage(); }
    return;
  }
  if (mode === "village") {
    if (ev.key === "m" || ev.key === "M") { ev.preventDefault(); openMenu(); }
    else if (ev.key === "Enter") { ev.preventDefault(); openDepart(); }
    return;
  }
  if (mode === "title") return;
  if (mode === "menu") {
    if (ev.key === "Escape" || ev.key === "m" || ev.key === "M") { ev.preventDefault(); closeMenu(); }
    return;
  }
  if (mode === "battle") {
    if (battleKey(ev.key)) ev.preventDefault();
    return;
  }
  if (miniOpen) {
    if (["Escape", "n", "N", "m", "M", "Enter", " "].includes(ev.key)) { ev.preventDefault(); toggleMini(false); }
    return;
  }
  if (autoWalking) { ev.preventDefault(); stopAutoWalk(); return; }
  if ((ev.key === "t" || ev.key === "T") && floorDone) { ev.preventDefault(); startAutoWalk(); return; }
  if (ev.key === "n" || ev.key === "N") { ev.preventDefault(); toggleMini(true); return; }
  if (ev.key === "m" || ev.key === "M") { ev.preventDefault(); openMenu(); return; }
  const dir = KEYMAP[ev.key];
  if (!dir) return;
  ev.preventDefault();
  playerMove(dir);
});

// バトル中の待ち時間はタップで飛ばせる
$("battle").addEventListener("pointerdown", () => { if (battle && battle.busy && skipWait) skipWait(); });

let swallowClickUntil = 0;
document.addEventListener("click", ev => {
  if (Date.now() < swallowClickUntil) { swallowClickUntil = 0; ev.stopPropagation(); ev.preventDefault(); }
}, true);
let holdTimer = null;
function stopHold() { clearTimeout(holdTimer); clearInterval(holdTimer); holdTimer = null; }
document.querySelectorAll("#pad button").forEach(btn => {
  btn.addEventListener("pointerdown", ev => {
    ev.preventDefault();
    stopHold();
    const dir = btn.dataset.dir;
    const before = mode;
    playerMove(dir);
    // 押した瞬間に画面が切り替わったら（バトル開始など）、同じタップの click が新しい画面のボタン（「その他」など）に当たらないようにする
    if (mode !== before) swallowClickUntil = Date.now() + 600;
    if (dir === "wait") return;
    holdTimer = setTimeout(() => {
      holdTimer = setInterval(() => { if (mode === "map") playerMove(dir); else stopHold(); }, 130);
    }, 350);
  });
  ["pointerup", "pointerleave", "pointercancel"].forEach(t => btn.addEventListener(t, stopHold));
  btn.addEventListener("contextmenu", ev => ev.preventDefault());
});
$("menuBtn").addEventListener("click", () => { if (!miniOpen) openMenu(); });
$("miniBtn").addEventListener("click", () => toggleMini());
$("stairsBtn").addEventListener("click", ev => { ev.stopPropagation(); if (autoWalking) stopAutoWalk(); else startAutoWalk(); });
// 歩いている間に画面をタップすると止まる（ボタン自体は上で処理する）
document.addEventListener("pointerdown", ev => { if (autoWalking && ev.target !== $("stairsBtn")) stopAutoWalk(); }, true);
$("mini").addEventListener("click", () => toggleMini(true));
$("miniFull").addEventListener("click", () => toggleMini(false));
$("menuClose").addEventListener("click", closeMenu);
$("menuClose2").addEventListener("click", closeMenu);
$("retry").addEventListener("click", () => goVillage());
$("btnDepart").addEventListener("click", openDepart);
$("btnGo").addEventListener("click", decide);
$("btnOther").addEventListener("click", openOther);
$("otherClose").addEventListener("click", closeOther);
$("btnBackVillage").addEventListener("click", askReturnVillage);
$("btnBackVillage2").addEventListener("click", askReturnVillage);
$("btnVillageMenu").addEventListener("click", openMenu);
$("btnNewFromVillage").addEventListener("click", askNewGame);
$("btnNewFromTitle").addEventListener("click", askNewGame);
window.addEventListener("resize", () => { resize(); if (miniOpen) paintBigMini(); });

prepareSprites();
if (DEBUG) document.body.append(el("div", "debug", "DEBUG MODE"));
boot();
</script>
