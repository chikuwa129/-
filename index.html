<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>ロボット遺跡探索</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #101114; --panel: #1a1b20; --line: #34363e; --fg: #dcdde2; --dim: #8a8c96;
    --hp: #e5534b; --en: #43b4f0; --accent: #ffd447; --ok: #3fae6a; --boss: #ff5a5a;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font-family: "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Meiryo", sans-serif;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  button { font-family: inherit; color: var(--fg); touch-action: manipulation; cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  button:disabled { opacity: 0.35; cursor: default; }
  #app {
    max-width: 520px; margin: 0 auto; min-height: 100%;
    display: flex; flex-direction: column; align-items: center;
    padding: 8px 12px;
  }
  .screen { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  [hidden] { display: none !important; }

  .bar { display: inline-block; height: 8px; background: #2c2d33; border-radius: 2px; overflow: hidden; }
  .bar i { display: block; height: 100%; }
  .bar.hp i { background: var(--hp); }
  .bar.en i { background: var(--en); }
  .bar.ehp i { background: #e8a33a; }
  .low { color: var(--hp) !important; }

  /* タイプ選択 */
  #select h1 { font-size: 22px; margin: 12px 0 0; letter-spacing: .04em; }
  #select p.lead { margin: 0; color: var(--dim); font-size: 13px; text-align: center; }
  #typeList { width: 100%; display: grid; gap: 10px; }
  .typeCard {
    width: 100%; text-align: left; padding: 12px 14px; border-radius: 10px;
    background: var(--panel); border: 1px solid #50525c; display: grid; gap: 6px;
  }
  .typeCard:hover, .typeCard:focus-visible { border-color: var(--accent); }
  .typeCard .tname { font-size: 18px; font-weight: bold; }
  .typeCard .tname small { font-size: 12px; color: var(--dim); font-weight: normal; margin-left: 8px; }
  .typeCard .k { color: var(--accent); font-size: 12px; margin-right: 6px; }
  .typeCard .desc { font-size: 13px; color: #c4c5cc; }
  .typeCard .stats { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; font-variant-numeric: tabular-nums; }
  .typeCard .stats b { color: #fff; }

  /* マップ画面 */
  #status { width: 100%; display: grid; gap: 3px; font-size: 13px; font-variant-numeric: tabular-nums; }
  #floorLabel { font-size: 15px; font-weight: bold; }
  #floorLabel.bossfl { color: var(--boss); }
  .trow { display: grid; grid-template-columns: minmax(0, 1fr) 70px 64px 52px; align-items: center; gap: 6px; }
  .trow .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .trow .nm small { color: var(--dim); }
  .trow .bar { width: 100%; }
  .trow .num { text-align: right; }

  canvas { display: block; background: #000; border: 1px solid var(--line); }

  .log {
    width: 100%; min-height: 4.4em; padding: 4px 8px;
    background: var(--panel); border: 1px solid var(--line); font-size: 13px; line-height: 1.45em;
  }
  .log div { min-height: 1.45em; }
  .log div:nth-child(1) { color: #777; }
  .log div:nth-child(2) { color: #aaa; }
  .log div:nth-child(3) { color: #fff; }

  #controls { display: flex; align-items: center; gap: 18px; }
  #pad { display: grid; grid-template-columns: repeat(3, 58px); grid-template-rows: repeat(3, 50px); gap: 6px; }
  #pad button, #menuBtn { font-size: 20px; background: #26272d; border: 1px solid #50525c; border-radius: 10px; }
  #pad button:active, #menuBtn:active { background: #3a3c44; }
  #pad .wait { font-size: 13px; }
  #menuBtn { width: 76px; height: 62px; font-size: 15px; }
  #help { font-size: 12px; color: #666; text-align: center; }
  @media (hover: hover) and (pointer: fine) {
    #pad { grid-template-columns: repeat(3, 46px); grid-template-rows: repeat(3, 40px); }
    #pad button { font-size: 16px; }
    #menuBtn { height: 52px; }
  }

  /* バトル画面 */
  .ehead { width: 100%; display: flex; flex-direction: column; gap: 4px; }
  .ehead .row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-variant-numeric: tabular-nums; }
  #eName { font-size: 17px; font-weight: bold; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #eHpText { flex-shrink: 0; }
  #eName.boss { color: var(--boss); }
  #charge { color: #1a1206; background: #ffb02e; font-weight: bold; font-size: 13px; padding: 2px 8px; border-radius: 4px; align-self: flex-start; }
  .wide { width: 100%; height: 12px; }
  .arena {
    position: relative; width: 100%; height: 150px;
    background: linear-gradient(#17181d 0 60%, #24221e 60% 100%);
    border: 1px solid var(--line); border-radius: 6px; overflow: hidden;
  }
  .arena.bossArena { height: 176px; background: linear-gradient(#1d1214 0 60%, #2a1a1a 60% 100%); }
  .sprite {
    position: absolute; display: flex; align-items: center; justify-content: center;
    font-family: monospace; font-weight: bold; border-radius: 8px; border: 2px solid;
  }
  #eSprite { right: 12%; top: 14px; width: 84px; height: 84px; font-size: 46px; }
  #eSprite.boss { width: 140px; height: 140px; top: 12px; right: 6%; font-size: 84px; border-width: 3px; }
  #allies { position: absolute; left: 4%; bottom: 10px; display: flex; gap: 8px; align-items: flex-end; }
  .ally {
    position: relative; width: 46px; height: 46px; font-size: 26px;
    background: #22232a; border-width: 2px;
  }
  .ally.active { outline: 3px solid var(--accent); outline-offset: 2px; }
  .ally.down { opacity: 0.25; }
  .hit { animation: shake .2s; }
  @keyframes shake { 0%,100% { transform: translateX(0); } 50% { transform: translateX(5px); } }
  @media (prefers-reduced-motion: reduce) { .hit { animation: none; } }
  #fx { position: absolute; left: 0; right: 0; top: 38%; text-align: center; font-size: 20px; font-weight: bold; pointer-events: none; text-shadow: 0 2px 4px #000; }

  #party { width: 100%; display: grid; gap: 3px; font-size: 13px; font-variant-numeric: tabular-nums; }
  .prow {
    display: grid; grid-template-columns: minmax(0, 1fr) 80px 58px 48px; align-items: center; gap: 6px;
    padding: 3px 6px; border: 1px solid transparent; border-radius: 6px;
  }
  .prow.active { border-color: var(--accent); background: #26231a; }
  .prow.down { opacity: 0.45; }
  .prow .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .prow .nm small { color: var(--dim); }
  .prow .bar { width: 100%; height: 9px; }
  .prow .num { text-align: right; }
  .prow .st { grid-column: 1 / -1; font-size: 11px; color: #8fd; }

  #cmdTitle { width: 100%; font-size: 12px; color: var(--dim); letter-spacing: .06em; }
  #cmdTitle b { color: var(--accent); font-weight: normal; }
  #cmds { width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  #cmds button {
    min-height: 48px; padding: 5px 8px; text-align: left;
    background: #24252b; border: 1px solid #50525c; border-radius: 8px; font-size: 15px;
    display: flex; flex-direction: column; justify-content: center; gap: 2px;
  }
  #cmds button:active:not(:disabled) { background: #3a3c44; }
  #cmds button .k { color: var(--accent); font-size: 12px; margin-right: 4px; }
  #cmds button small { color: var(--dim); font-size: 11px; }
  #cmds button.back { background: #1c1d22; }

  /* オーバーレイ */
  .overlay {
    position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,0.82); padding: 16px;
  }
  .dialog {
    width: 100%; max-width: 480px; max-height: 100%; overflow-y: auto;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px;
  }
  .center { text-align: center; }
  .dialog h2 { margin: 0 0 8px; font-size: 21px; }
  .dialog h3 { margin: 14px 0 4px; font-size: 13px; color: var(--dim); letter-spacing: .06em; font-weight: normal; }
  .big { font-size: 17px; padding: 10px 28px; background: var(--ok); color: #fff; border: none; border-radius: 8px; margin-top: 12px; }
  .mhead {
    position: sticky; top: -14px; z-index: 1; margin: -14px -16px 8px; padding: 12px 16px 8px;
    display: flex; align-items: center; justify-content: space-between; background: var(--panel); border-bottom: 1px solid var(--line);
  }
  .mhead h2 { margin: 0; }
  #menuClose { padding: 8px 18px; font-size: 15px; background: var(--ok); color: #fff; border: none; border-radius: 8px; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; }
  .tabs button { padding: 7px 12px; background: #24252b; border: 1px solid #50525c; border-radius: 6px; font-size: 14px; }
  .tabs button.on { border-color: var(--accent); color: var(--accent); background: #2a2618; }
  .sgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 3px 12px; font-size: 13px; margin-top: 8px; font-variant-numeric: tabular-nums; }
  .sgrid b { color: #fff; font-weight: normal; }
  .mrow {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 7px 6px; border-bottom: 1px solid #2a2b31; font-size: 14px;
  }
  .mrow .info { min-width: 0; }
  .mrow small { display: block; color: var(--dim); font-size: 11px; font-variant-numeric: tabular-nums; }
  .mrow .btns { display: flex; gap: 4px; flex-shrink: 0; }
  .mrow button { padding: 6px 10px; background: #2c2d34; border: 1px solid #50525c; border-radius: 6px; font-size: 13px; }
  .mrow button.danger { border-color: #8a3a3a; color: #ff9a9a; }
  .tag { display: inline-block; font-size: 10px; padding: 1px 5px; border-radius: 3px; margin-right: 4px; vertical-align: 1px; color: #111; }
  .tag.gun { background: #e8c25a; }
  .tag.missile { background: #e98a5a; }
  .tag.laser { background: #6fd6f2; }
  .eq { color: var(--accent); font-size: 11px; margin-left: 4px; }
  .empty { color: #666; }
  .debug { position: fixed; right: 6px; bottom: 6px; font-size: 11px; color: #f5d; }
</style>
</head>
<body>
<div id="app">

  <!-- タイプ選択画面 -->
  <section id="select" class="screen">
    <h1>ロボット遺跡探索</h1>
    <p class="lead">最初の機体のタイプを選んでください</p>
    <div id="typeList"></div>
  </section>

  <!-- マップ画面 -->
  <section id="mapScreen" class="screen" hidden>
    <div id="status">
      <div id="floorLabel">1F</div>
      <div id="teamRows"></div>
    </div>
    <canvas id="cv"></canvas>
    <div class="log" id="mapLog"><div></div><div></div><div></div></div>
    <div id="controls">
      <div id="pad">
        <span></span><button data-dir="up" aria-label="上">▲</button><span></span>
        <button data-dir="left" aria-label="左">◀</button><button data-dir="wait" class="wait">待機</button><button data-dir="right" aria-label="右">▶</button>
        <span></span><button data-dir="down" aria-label="下">▼</button><span></span>
      </div>
      <button id="menuBtn">メニュー</button>
    </div>
    <div id="help">矢印キー / WASD：移動　スペース：待機　M：メニュー</div>
  </section>

  <!-- バトル画面 -->
  <section id="battle" class="screen" hidden>
    <div class="ehead">
      <div class="row"><span id="eName">ガードロボ</span><span id="eHpText">8/8</span></div>
      <span class="bar ehp wide" id="eHpBar"><i></i></span>
      <div id="charge" hidden></div>
    </div>
    <div class="arena" id="arena">
      <div class="sprite" id="eSprite">g</div>
      <div id="allies"></div>
      <div id="fx"></div>
    </div>
    <div id="party"></div>
    <div class="log" id="battleLog"><div></div><div></div><div></div></div>
    <div id="cmdTitle">コマンド</div>
    <div id="cmds"></div>
  </section>
</div>

<!-- メニュー -->
<div class="overlay" id="menu" hidden>
  <div class="dialog">
    <div class="mhead"><h2>メニュー</h2><button id="menuClose">とじる</button></div>
    <div class="tabs" id="menuTabs"></div>
    <div id="menuBody"></div>
  </div>
</div>

<!-- ゲームオーバー / クリア -->
<div class="overlay" id="endScreen" hidden>
  <div class="dialog center">
    <h2 id="endTitle">機能停止…</h2>
    <p id="endText"></p>
    <button class="big" id="retry">もう一度</button>
  </div>
</div>

<script>
"use strict";

// ================================================================
//  調整用の定数・データ
// ================================================================
// ?debug=1 を付けたときだけ、全機体のHPを大きくする（テスト用）
const DEBUG = /[?&]debug=1(&|$)/.test(location.search);
const DEBUG_HP_BONUS = 600;

const STAIRS_ENERGY_BONUS = 30;    // 次の階へ進んだとき、全員のエネルギー回復
const WIN_ENERGY_BONUS = 5;        // 戦闘に勝ったとき、生きている全員のエネルギー回復
const REVIVE_HP_RATE = 0.25;       // バトル後、HP0の機体が復活するときのHP（最大HP比）
const DAMAGE_VARIANCE = 1;         // ダメージのぶれ（±）
const BATTLE_WAIT = 300;           // バトル中のメッセージ待ち時間(ms)。タップで飛ばせる

const TACKLE_BASE = 4;             // たいあたりの基本威力
const TACKLE_ACC = 95;
const ESCAPE_RATE = 50;            // にげる成功率(%)
const ESCAPE_STUN_TURNS = 3;       // 逃げた後、敵が追ってこないターン数
const TEAM_MAX = 3;

// 機体レベル
const LEVEL_MAX = 20;
const expToNext = lv => 8 + 4 * lv;          // 次のレベルに必要な経験値
const LEVEL_HP_GROWTH = 5;
const LEVEL_EN_GROWTH = 3;
const TACKLE_GROWTH = 0.7;                   // たいあたり威力 = 基本 + floor((Lv-1) × これ)
const EXP_FLOOR_SCALE = 0.1;                 // 経験値 × (1 + これ × (階-1))、切り上げ

// 最初のタイプ（Lv1の値）
const START_TYPES = [
  { key: "assault",   label: "突撃型",   name: "ブレイカー",   hp: 50, en: 80,  tackle: TACKLE_BASE + 2, accBonus: 0,  evade: 0,
    part: "g1", desc: "HPが高く、たいあたりが強い。正面から殴り合うタイプ。" },
  { key: "artillery", label: "砲撃型",   name: "キャノニア",   hp: 36, en: 130, tackle: TACKLE_BASE,     accBonus: 0,  evade: 0,
    part: "m1", desc: "エネルギーが多く、ミサイルを撃ち続けられる。打たれ弱い。" },
  { key: "mobile",    label: "高機動型", name: "スプリンター", hp: 40, en: 100, tackle: TACKLE_BASE,     accBonus: 10, evade: 15,
    part: "l1", desc: "攻撃の命中+10%、敵の攻撃を15%で回避する。レーザーで戦う。" },
];
const STARTING_ITEMS = { repair: 1, cell: 0 };

// パーツ（武装）。power=威力 acc=命中(%) en=消費エネルギー。レベルでは変わらない
const PARTS = [
  { id: "g1", type: "gun",     name: "ハンドガンK7",       power: 6,  acc: 92, en: 3 },
  { id: "g2", type: "gun",     name: "ツインバルカン",     power: 8,  acc: 90, en: 5 },
  { id: "g3", type: "gun",     name: "レールライフル",     power: 11, acc: 93, en: 8 },
  { id: "m1", type: "missile", name: "マイクロミサイル",   power: 11, acc: 76, en: 6 },
  { id: "m2", type: "missile", name: "クラスターミサイル", power: 15, acc: 73, en: 9 },
  { id: "m3", type: "missile", name: "ヘビーミサイル",     power: 21, acc: 70, en: 13 },
  { id: "l1", type: "laser",   name: "ビームレーザー",     power: 17, acc: 90, en: 14 },
  { id: "l2", type: "laser",   name: "プラズマレーザー",   power: 25, acc: 92, en: 20 },
];
const PART_TYPE_LABEL = { gun: "ガン", missile: "ミサイル", laser: "レーザー" };
const SLOT_COUNT = 3;

// 通常の敵（基本値）。drop=落とすパーツの系統。ally=仲間になったときの基本値（Lv1）
const ENEMY_TYPES = [
  { key: "small", name: "ガードロボ",   ch: "g", color: "#e8a33a", hp: 8,  atk: 3, acc: 80, exp: 4,  minFloor: 1, weight: 5, drop: "gun",
    recruit: 0.12, ally: { hp: 24, en: 60,  tackle: 3, part: "g1" } },
  { key: "mid",   name: "ハンターロボ", ch: "h", color: "#d77be0", hp: 16, atk: 5, acc: 80, exp: 8,  minFloor: 3, weight: 3, drop: "missile",
    recruit: 0.08, ally: { hp: 34, en: 80,  tackle: 4, part: "m1" } },
  { key: "large", name: "タイタンロボ", ch: "T", color: "#ef5a5a", hp: 30, atk: 8, acc: 75, exp: 14, minFloor: 6, weight: 2, drop: "laser",
    recruit: 0.05, ally: { hp: 46, en: 100, tackle: 6, part: "l1" } },
];
// 階による補正：HP × (0.6 + 0.12×(階-1))、攻撃 × (0.7 + 0.08×(階-1))、切り上げ
const ENEMY_HP_SCALE = { base: 0.6, perFloor: 0.3 };
const ENEMY_ATK_SCALE = { base: 0.7, perFloor: 0.1 };
const EARLY_FLOORS = 2;            // 1〜2階は敵が少なく、命中も低め
const EARLY_ENEMY_COUNT = [2, 3];
const EARLY_ACC_PENALTY = 10;
const enemyCountFor = f => f <= 4 ? f + 2 : Math.min(6, f - 1);   // 3階以降の敵の数
const ENEMY_SIGHT = 7;
const PART_DROP_RATE = 0.5;
const ITEM_DROP_RATE = 0.35;

// ボス（階の補正はかけない）
const BOSSES = {
  5:  { name: "ゲートキーパー",     ch: "B", color: "#ff8a3c", hp: 230, atk: 16, acc: 85, exp: 40, drops: ["m2", "m3", "l1"] },
  10: { name: "遺跡の守護機オメガ", ch: "Ω", color: "#ff4a6e", hp: 400, atk: 26, acc: 85, exp: 0,  drops: ["l2"], doubleBelowHalf: true },
};
const FINAL_FLOOR = 10;
const BOSS_CHARGE_EVERY = 3;       // 3ターンに1回「力を溜める」→ 次のターンに強攻撃
const BOSS_HEAVY_MULT = 2;
const BOSS_HEAVY_ACC_DOWN = 10;

// アイテム
const ITEMS = {
  repair: { name: "修理キット",     ch: "+", color: "#5fe07a", value: 15 },
  cell:   { name: "エネルギーセル", ch: "e", color: "#43b4f0", value: 30 },
};
const MAP_ITEM_MIN = 2, MAP_ITEM_MAX = 4;
const BOSS_PREP_ITEMS = { repair: 2, cell: 2 };

// スキル（効果はスキルレベルで決まる。機体レベルでは変わらない）
const SKILL_MAX_LEVEL = 10;
const SKILLS = [
  { id: "double", name: "連続攻撃",
    hitPower: lv => 2 + Math.ceil(lv / 2), hitAcc: lv => 84 + lv,
    desc: lv => `2回攻撃 威力${2 + Math.ceil(lv / 2)}×2 命中${84 + lv}%` },
  { id: "guard", name: "防御",
    ratio: lv => Math.max(0.2, 0.5 - 0.03 * (lv - 1)),
    desc: lv => `次に狙われたときの被ダメージを${Math.round(100 * Math.max(0.2, 0.5 - 0.03 * (lv - 1)))}%に` },
  { id: "focus", name: "集中攻撃",
    bonus: lv => 20 + 3 * (lv - 1),
    desc: lv => `次のぶそうの命中+${20 + 3 * (lv - 1)}%` },
];

// マップ
const MAP_W = 36, MAP_H = 28, VIEW = 15, FOV_RADIUS = 6;
const ROOM_TRIES = 50, ROOM_MAX = 9;

// ================================================================
//  状態
// ================================================================
const WALL = 0, FLOOR = 1, STAIRS = 2, HEAL = 3, BOSSFLOOR = 4, GATE = 5;
let map, seen, visible, enemies, groundItems, floorNo, logLines;
let team, inv, pos, bestLevel;
let mode = "select";    // select | map | battle | menu | over
let battle = null;
let menuState = { unit: 0, pending: null, confirmRelease: false };

const $ = id => document.getElementById(id);
const cv = $("cv"), ctx = cv.getContext("2d");
let tile = 24;

const rnd = n => Math.floor(Math.random() * n);
const rndRange = (a, b) => a + rnd(b - a + 1);
const roll = pct => Math.random() * 100 < pct;
const partById = id => PARTS.find(p => p.id === id);
const isBossFloor = f => !!BOSSES[f];
const leader = () => team[0];
const alive = () => team.filter(u => u.hp > 0);

// ================================================================
//  機体
// ================================================================
const maxHpOf = u => u.baseHp + LEVEL_HP_GROWTH * (u.lv - 1) + (DEBUG ? DEBUG_HP_BONUS : 0);
const maxEnOf = u => u.baseEn + LEVEL_EN_GROWTH * (u.lv - 1);
const tackleOf = u => u.baseTackle + Math.floor((u.lv - 1) * TACKLE_GROWTH);

function createUnit(o) {
  const u = {
    name: o.name, ch: o.ch, color: o.color, isLeader: !!o.isLeader, kind: o.kind,
    baseHp: o.hp, baseEn: o.en, baseTackle: o.tackle, accBonus: o.accBonus || 0, evade: o.evade || 0,
    lv: o.lv || 1, exp: 0, pendingLv: 0,
    equip: new Array(SLOT_COUNT).fill(null),
    skills: Object.fromEntries(SKILLS.map(s => [s.id, 1])),
    guard: 0, focus: 0,
  };
  u.maxHp = maxHpOf(u); u.hp = u.maxHp;
  u.maxEn = maxEnOf(u); u.en = u.maxEn;
  return u;
}

function uniqueName(base) {
  if (!team.some(u => u.name === base)) return base;
  for (const s of ["B", "C", "D"]) if (!team.some(u => u.name === `${base}${s}`)) return `${base}${s}`;
  return base;
}

// パーツは共有の持ち物。装備は inv.parts の番号で持つ
function isEquipped(i) { return team.some(u => u.equip.includes(i)); }
function addPart(id, prefer) {
  inv.parts.push(id);
  const idx = inv.parts.length - 1;
  const order = prefer ? [prefer, ...team.filter(u => u !== prefer)] : team;
  const u = order.find(u => u.equip.includes(null));
  if (u) u.equip[u.equip.indexOf(null)] = idx;
  return u;
}

function addExp(u, amount) {
  if (u.lv >= LEVEL_MAX) return;
  u.exp += amount;
}
// レベルアップはバトルが終わってから処理する
function processLevelUps() {
  for (const u of team) {
    const before = u.lv;
    while (u.lv < LEVEL_MAX && u.exp >= expToNext(u.lv)) {
      u.exp -= expToNext(u.lv);
      u.lv++;
    }
    if (u.lv >= LEVEL_MAX) u.exp = 0;
    if (u.lv !== before) {
      const hpUp = maxHpOf(u) - u.maxHp, enUp = maxEnOf(u) - u.maxEn;
      u.maxHp += hpUp; u.maxEn += enUp;
      if (u.hp > 0) u.hp += hpUp;
      u.en += enUp;
      log(`${u.name}はLv${u.lv}になった！`);
      bestLevel = Math.max(bestLevel, u.lv);
    }
  }
}

// ================================================================
//  マップ生成
// ================================================================
function blankMap() {
  map = []; seen = []; visible = [];
  for (let y = 0; y < MAP_H; y++) {
    map.push(new Array(MAP_W).fill(WALL));
    seen.push(new Array(MAP_W).fill(false));
    visible.push(new Array(MAP_W).fill(false));
  }
}
function fillRect(x, y, w, h, t) { for (let yy = y; yy < y + h; yy++) for (let xx = x; xx < x + w; xx++) map[yy][xx] = t; }

function generateMap() {
  blankMap();
  const rooms = [];
  for (let i = 0; i < ROOM_TRIES && rooms.length < ROOM_MAX; i++) {
    const w = rndRange(4, 8), h = rndRange(3, 6);
    const x = rndRange(1, MAP_W - w - 2), y = rndRange(1, MAP_H - h - 2);
    if (rooms.some(o => x <= o.x + o.w && x + w >= o.x && y <= o.y + o.h && y + h >= o.y)) continue;
    rooms.push({ x, y, w, h });
    fillRect(x, y, w, h, FLOOR);
  }
  for (let i = 1; i < rooms.length; i++) {
    const a = center(rooms[i - 1]), b = center(rooms[i]);
    if (Math.random() < 0.5) { hCorr(a.x, b.x, a.y); vCorr(a.y, b.y, b.x); }
    else { vCorr(a.y, b.y, a.x); hCorr(a.x, b.x, b.y); }
  }
  return rooms;
}
function center(r) { return { x: r.x + (r.w >> 1), y: r.y + (r.h >> 1) }; }
function hCorr(x1, x2, y) { for (let x = Math.min(x1, x2); x <= Math.max(x1, x2); x++) map[y][x] = FLOOR; }
function vCorr(y1, y2, x) { for (let y = Math.min(y1, y2); y <= Math.max(y1, y2); y++) map[y][x] = FLOOR; }

const covers = (e, x, y) => x >= e.x && x < e.x + e.size && y >= e.y && y < e.y + e.size;
const enemyAt = (x, y) => enemies.find(e => covers(e, x, y));

function occupied(x, y) {
  return (pos.x === x && pos.y === y) || !!enemyAt(x, y) ||
         groundItems.some(it => it.x === x && it.y === y) || map[y][x] !== FLOOR;
}
function freeCellIn(r) {
  for (let t = 0; t < 60; t++) {
    const x = rndRange(r.x, r.x + r.w - 1), y = rndRange(r.y, r.y + r.h - 1);
    if (!occupied(x, y)) return { x, y };
  }
  return null;
}

function scaled(base, s) { return Math.max(1, Math.ceil(base * (s.base + s.perFloor * (floorNo - 1)))); }
function makeEnemy(def, x, y) {
  const hp = scaled(def.hp, ENEMY_HP_SCALE);
  return { def, name: def.name, ch: def.ch, color: def.color, x, y, size: 1,
           hp, maxHp: hp, atk: scaled(def.atk, ENEMY_ATK_SCALE),
           acc: def.acc - (floorNo <= EARLY_FLOORS ? EARLY_ACC_PENALTY : 0),
           exp: Math.ceil(def.exp * (1 + EXP_FLOOR_SCALE * (floorNo - 1))),
           boss: false, awake: false, stun: 0 };
}
function makeBoss(def, x, y) {
  return { def, name: def.name, ch: def.ch, color: def.color, x, y, size: 2,
           hp: def.hp, maxHp: def.hp, atk: def.atk, acc: def.acc, exp: def.exp,
           boss: true, awake: true, stun: 0 };
}

function pickEnemyType() {
  const pool = ENEMY_TYPES.filter(t => floorNo >= t.minFloor);
  let r = Math.random() * pool.reduce((s, t) => s + t.weight, 0);
  for (const t of pool) { if ((r -= t.weight) < 0) return t; }
  return pool[0];
}

function newFloor() {
  enemies = []; groundItems = [];
  if (isBossFloor(floorNo)) { bossFloor(); return; }

  let rooms = generateMap();
  while (rooms.length < 4) rooms = generateMap();
  const start = center(rooms[0]);
  pos = { x: start.x, y: start.y };
  const s = freeCellIn(rooms[rooms.length - 1]);
  map[s.y][s.x] = STAIRS;

  const count = floorNo <= EARLY_FLOORS ? rndRange(...EARLY_ENEMY_COUNT) : enemyCountFor(floorNo);
  for (let i = 0; i < count; i++) {
    const p = freeCellIn(rooms[1 + rnd(rooms.length - 1)]);
    if (p) enemies.push(makeEnemy(pickEnemyType(), p.x, p.y));
  }
  const itemCount = rndRange(MAP_ITEM_MIN, MAP_ITEM_MAX);
  for (let i = 0; i < itemCount; i++) {
    const p = freeCellIn(rooms[rnd(rooms.length)]);
    if (p) groundItems.push({ x: p.x, y: p.y, key: Math.random() < 0.5 ? "repair" : "cell" });
  }
  updateFov();
}

// ボス階：準備部屋 → 1本道の通路 → ボス部屋 → ボスの後ろに階段（左から右へ）
const BOSS_LAYOUT = {
  prep: { x: 2, y: 10, w: 7, h: 7 },     // 準備部屋
  corridorY: 13, corridorX: [9, 13],      // 通路（9 が出口の目印）
  room: { x: 14, y: 6, w: 10, h: 15 },    // ボス部屋（準備部屋より大きい）
  boss: { x: 22, y: 12 },                 // ボス（2×2）
  stairs: { x: 25, y: 13 },               // ボスの真後ろ。(24,13) はボスの横からしか入れない
  start: { x: 3, y: 13 },
  heal: { x: 5, y: 13 },
  items: [[3, 11], [7, 11], [3, 15], [7, 15]],
};
function bossFloor() {
  blankMap();
  const L = BOSS_LAYOUT;
  fillRect(L.prep.x, L.prep.y, L.prep.w, L.prep.h, FLOOR);
  for (let x = L.corridorX[0]; x <= L.corridorX[1]; x++) map[L.corridorY][x] = FLOOR;
  map[L.corridorY][L.corridorX[0]] = GATE;
  fillRect(L.room.x, L.room.y, L.room.w, L.room.h, BOSSFLOOR);
  map[L.stairs.y][L.stairs.x - 1] = BOSSFLOOR;
  map[L.stairs.y][L.stairs.x] = STAIRS;
  map[L.heal.y][L.heal.x] = HEAL;
  pos = { ...L.start };
  enemies.push(makeBoss(BOSSES[floorNo], L.boss.x, L.boss.y));
  const keys = [];
  for (const [k, n] of Object.entries(BOSS_PREP_ITEMS)) for (let i = 0; i < n; i++) keys.push(k);
  keys.forEach((k, i) => { const [x, y] = L.items[i % L.items.length]; groundItems.push({ x, y, key: k }); });
  // ボス階は全体を見せる
  for (let y = 0; y < MAP_H; y++) { seen[y].fill(true); visible[y].fill(true); }
}

// ================================================================
//  視界
// ================================================================
function updateFov() {
  if (isBossFloor(floorNo)) return;
  for (let y = 0; y < MAP_H; y++) visible[y].fill(false);
  for (let dy = -FOV_RADIUS; dy <= FOV_RADIUS; dy++) {
    for (let dx = -FOV_RADIUS; dx <= FOV_RADIUS; dx++) {
      if (dx * dx + dy * dy > FOV_RADIUS * FOV_RADIUS + 1) continue;
      const tx = pos.x + dx, ty = pos.y + dy;
      if (tx < 0 || ty < 0 || tx >= MAP_W || ty >= MAP_H) continue;
      if (lineOfSight(pos.x, pos.y, tx, ty)) { visible[ty][tx] = true; seen[ty][tx] = true; }
    }
  }
}
function lineOfSight(x0, y0, x1, y1) {
  const dx = Math.abs(x1 - x0), dy = Math.abs(y1 - y0);
  const sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
  let err = dx - dy, x = x0, y = y0;
  while (!(x === x1 && y === y1)) {
    if (!(x === x0 && y === y0) && map[y][x] === WALL) return false;
    const e2 = 2 * err;
    if (e2 > -dy) { err -= dy; x += sx; }
    if (e2 < dx) { err += dx; y += sy; }
  }
  return true;
}

// ================================================================
//  ログ
// ================================================================
function log(msg) {
  logLines.push(msg);
  while (logLines.length > 3) logLines.shift();
  renderLog();
}
function renderLog() {
  for (const id of ["mapLog", "battleLog"]) {
    const divs = $(id).children, pad = 3 - logLines.length;
    for (let i = 0; i < 3; i++) divs[i].textContent = i < pad ? "" : logLines[i - pad];
  }
}

// ================================================================
//  マップでの行動
// ================================================================
const DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0], wait: [0, 0] };

function playerMove(dir) {
  if (mode !== "map") return;
  const [dx, dy] = DIRS[dir];
  const nx = pos.x + dx, ny = pos.y + dy;

  if (dx || dy) {
    const target = enemyAt(nx, ny);
    if (target) { startBattle(target); return; }
    if (map[ny][nx] === WALL) return;
    const wasBossRoom = map[pos.y][pos.x] === BOSSFLOOR;
    pos.x = nx; pos.y = ny;
    pickUpGround();
    const t = map[ny][nx];
    if (t === STAIRS) { descend(); return; }
    if (t === HEAL) healAll();
    if (t === GATE && dx > 0) log("この先はボス部屋。準備はいいか？");
    if (t === BOSSFLOOR && !wasBossRoom && enemies.some(e => e.boss)) {
      log(`強敵の気配がする…。「${enemies.find(e => e.boss).name}」が待ち構えている！`);
    }
  }
  enemiesAct();
  updateFov();
  renderMap();
}

function healAll() {
  for (const u of team) { u.hp = u.maxHp; u.en = u.maxEn; }
  log("回復ポイント：チーム全員のHPとエネルギーが全回復した。");
}

function pickUpGround() {
  const it = groundItems.find(i => i.x === pos.x && i.y === pos.y);
  if (!it) return;
  groundItems = groundItems.filter(i => i !== it);
  if (it.key === "part") {
    const u = addPart(it.part);
    log(`パーツ「${partById(it.part).name}」を拾った！${u ? `（${u.name}に装備）` : "（メニューで装備）"}`);
  } else {
    inv.items[it.key]++;
    log(`${ITEMS[it.key].name}を拾った。（所持${inv.items[it.key]}）`);
  }
}

function descend() {
  floorNo++;
  for (const u of team) u.en = Math.min(u.maxEn, u.en + STAIRS_ENERGY_BONUS);
  if (DEBUG) for (const u of team) u.hp = u.maxHp;   // テスト用：階を降りるたびにHP全回復
  newFloor();
  if (isBossFloor(floorNo)) {
    log(`${floorNo}F ボスフロアに着いた。（全員EN+${STAIRS_ENERGY_BONUS}）`);
    log("準備部屋だ。回復ポイント + で全回復できる。");
  } else {
    log(`${floorNo}Fへ降りた。（全員EN+${STAIRS_ENERGY_BONUS}）`);
  }
  renderMap();
}

function enemiesAct() {
  for (const e of enemies) {
    if (e.boss) continue;               // ボスは動かない
    if (e.stun > 0) { e.stun--; continue; }
    const dist = Math.abs(e.x - pos.x) + Math.abs(e.y - pos.y);
    if (!e.awake && dist <= ENEMY_SIGHT && lineOfSight(e.x, e.y, pos.x, pos.y)) e.awake = true;
    if (e.awake) {
      if (dist === 1) { startBattle(e); return; }
      const sx = Math.sign(pos.x - e.x), sy = Math.sign(pos.y - e.y);
      const tries = Math.abs(pos.x - e.x) >= Math.abs(pos.y - e.y) ? [[sx, 0], [0, sy]] : [[0, sy], [sx, 0]];
      for (const [mx, my] of tries) {
        if ((mx || my) && canEnemyMove(e.x + mx, e.y + my)) { e.x += mx; e.y += my; break; }
      }
    } else if (Math.random() < 0.3) {
      const d = Object.values(DIRS)[rnd(4)];
      if (canEnemyMove(e.x + d[0], e.y + d[1])) { e.x += d[0]; e.y += d[1]; }
    }
  }
}
function canEnemyMove(x, y) {
  if (map[y][x] !== FLOOR) return false;
  if (pos.x === x && pos.y === y) return false;
  return !enemyAt(x, y);
}

// ================================================================
//  バトル
// ================================================================
let skipWait = null;
function pause(ms = BATTLE_WAIT) {
  return new Promise(res => {
    const t = setTimeout(done, ms);
    function done() { clearTimeout(t); skipWait = null; res(); }
    skipWait = done;
  });
}

function startBattle(e) {
  mode = "battle";
  e.awake = true;
  for (const u of team) { u.guard = 0; u.focus = 0; }
  battle = { enemy: e, menu: "main", busy: false, actor: team.findIndex(u => u.hp > 0),
             round: 1, bossTurn: 0, heavyReady: false, itemKey: null, downs: 0 };
  log(e.boss ? `ボス「${e.name}」との戦闘！` : `${e.name}が現れた！`);
  $("mapScreen").hidden = true;
  $("battle").hidden = false;
  const sp = $("eSprite");
  sp.className = "sprite" + (e.boss ? " boss" : "");
  $("eName").className = e.boss ? "boss" : "";
  $("arena").classList.toggle("bossArena", e.boss);
  sp.textContent = e.ch;
  sp.style.color = e.color;
  sp.style.borderColor = e.color;
  sp.style.background = e.color + "22";
  $("fx").textContent = "";
  renderBattle();
}

// バトル終了後の後片付け（勝ち・逃げ共通）
function afterBattle() {
  for (const u of team) {
    u.guard = 0; u.focus = 0;
    if (u.hp <= 0) { u.hp = Math.max(1, Math.floor(u.maxHp * REVIVE_HP_RATE)); log(`${u.name}が再起動した。（HP${u.hp}）`); }
  }
  processLevelUps();
}

function endBattle() {
  battle = null;
  mode = "map";
  $("battle").hidden = true;
  $("mapScreen").hidden = false;
  afterBattle();
  updateFov();
  resize();
}

const varied = power => Math.max(1, power + rndRange(-DAMAGE_VARIANCE, DAMAGE_VARIANCE));
function showFx(text, color) { const f = $("fx"); f.textContent = text; f.style.color = color; }
function bump(el) { if (!el) return; el.classList.remove("hit"); void el.offsetWidth; el.classList.add("hit"); }

function attack(u, label, power, acc) {
  const e = battle.enemy;
  acc = Math.min(100, acc + u.accBonus);
  if (!roll(acc)) { log(`${u.name}の${label}！ 外れた。`); showFx("MISS", "#aaa"); return; }
  const dmg = varied(power);
  e.hp = Math.max(0, e.hp - dmg);
  log(`${u.name}の${label}！ ${dmg}ダメージ。`);
  showFx(`-${dmg}`, "#ffd447");
  bump($("eSprite"));
}

function levelUpSkill(u, id) {
  if (u.skills[id] < SKILL_MAX_LEVEL) u.skills[id]++;
}

function useItem(key, target) {
  inv.items[key]--;
  if (key === "repair") {
    const before = target.hp;
    target.hp = Math.min(target.maxHp, target.hp + ITEMS.repair.value);
    log(`${ITEMS.repair.name}で${target.name}のHPが${target.hp - before}回復。`);
  } else {
    const before = target.en;
    target.en = Math.min(target.maxEn, target.en + ITEMS.cell.value);
    log(`${ITEMS.cell.name}で${target.name}のENが${target.en - before}回復。`);
  }
}

// 各コマンド。"escaped" を返すとバトル終了
const ACTIONS = {
  tackle(u) { attack(u, "たいあたり", tackleOf(u), TACKLE_ACC); },
  weapon(u, slot) {
    const part = partById(inv.parts[u.equip[slot]]);
    u.en -= part.en;
    const acc = part.acc + u.focus;
    u.focus = 0;
    attack(u, part.name, part.power, acc);
  },
  skill(u, id) {
    const s = SKILLS.find(s => s.id === id), lv = u.skills[id];
    if (id === "double") {
      attack(u, "連続攻撃(1)", s.hitPower(lv), s.hitAcc(lv));
      if (battle.enemy.hp > 0) attack(u, "連続攻撃(2)", s.hitPower(lv), s.hitAcc(lv));
    } else if (id === "guard") {
      u.guard = s.ratio(lv);
      log(`${u.name}は防御の構え。（被ダメージ${Math.round(u.guard * 100)}%）`);
    } else if (id === "focus") {
      u.focus = s.bonus(lv);
      log(`${u.name}は集中した。（次のぶそう命中+${u.focus}%）`);
    }
    levelUpSkill(u, id);
  },
  item(u, arg) { useItem(arg.key, arg.target); },
  escape(u) {
    if (roll(ESCAPE_RATE)) {
      log("うまく逃げ切った！");
      battle.enemy.stun = ESCAPE_STUN_TURNS;
      return "escaped";
    }
    log(`${u.name}は逃げようとしたが、失敗した！`);
  },
};

function nextActor(from) {
  for (let i = from + 1; i < team.length; i++) if (team[i].hp > 0) return i;
  return -1;
}

async function runCommand(action, arg) {
  if (!battle || battle.busy) return;
  battle.busy = true;
  battle.menu = "main";
  const u = team[battle.actor];
  const result = ACTIONS[action](u, arg);
  renderBattle();
  await pause();

  if (result === "escaped") { endBattle(); return; }
  if (battle.enemy.hp <= 0) { winBattle(); return; }

  const next = nextActor(battle.actor);
  if (next >= 0) {
    battle.actor = next;
    battle.busy = false;
    renderBattle();
    return;
  }
  // 味方全員が行動したら、敵の番
  battle.actor = -1;
  renderBattle();
  await enemyPhase();
  if (alive().length === 0) {
    await pause(500);
    gameOver(`${battle.enemy.name}にチームが全滅させられた…`);
    return;
  }
  battle.round++;
  battle.actor = nextActor(-1);
  battle.busy = false;
  renderBattle();
}

function randomAlive() { const a = alive(); return a.length ? a[rnd(a.length)] : null; }

function enemyStrike(e, u, power, acc, label) {
  const guard = u.guard;
  u.guard = 0;   // 狙われたら防御は消える
  if (!roll(acc)) { log(`${label}！ ${u.name}への攻撃は外れた。`); showFx("MISS", "#8fd"); return; }
  if (u.evade && roll(u.evade)) { log(`${label}！ ${u.name}はひらりとかわした。`); showFx("回避", "#8fd"); return; }
  let dmg = varied(power);
  if (guard) dmg = Math.max(1, Math.round(dmg * guard));
  u.hp = Math.max(0, u.hp - dmg);
  log(`${label}！ ${u.name}に${dmg}ダメージ${guard ? "（防御）" : ""}。`);
  showFx(`-${dmg}`, "#ff6a6a");
  bump($("ally" + team.indexOf(u)));
  if (u.hp === 0) { battle.downs++; log(`${u.name}は動けなくなった！`); }
}

async function enemyPhase() {
  const e = battle.enemy;
  if (!e.boss) {
    const t = randomAlive();
    if (t) enemyStrike(e, t, e.atk, e.acc, `${e.name}の攻撃`);
    renderBattle();
    await pause();
    return;
  }
  battle.bossTurn++;
  if (battle.heavyReady) {
    battle.heavyReady = false;
    const t = randomAlive();
    if (t) enemyStrike(e, t, e.atk * BOSS_HEAVY_MULT, e.acc - BOSS_HEAVY_ACC_DOWN, `${e.name}の強攻撃`);
    renderBattle();
    await pause();
    return;
  }
  if (battle.bossTurn % BOSS_CHARGE_EVERY === 0) {
    battle.heavyReady = true;
    log(`${e.name}は力を溜めている…！ 次は強攻撃だ。`);
    showFx("力を溜めている", "#ffb02e");
    renderBattle();
    await pause();
    return;
  }
  const times = e.def.doubleBelowHalf && e.hp <= e.maxHp / 2 ? 2 : 1;
  for (let i = 0; i < times; i++) {
    const t = randomAlive();
    if (!t) break;
    enemyStrike(e, t, e.atk, e.acc, times > 1 ? `${e.name}の連撃(${i + 1})` : `${e.name}の攻撃`);
    renderBattle();
    await pause();
  }
}

function winBattle() {
  const e = battle.enemy;
  battle.result = { rounds: battle.round, downs: battle.downs, boss: e.boss };
  lastBattle = battle.result;
  enemies = enemies.filter(o => o !== e);
  const living = alive();
  for (const u of living) { u.en = Math.min(u.maxEn, u.en + WIN_ENERGY_BONUS); addExp(u, e.exp); }
  log(`${e.name}を破壊した！${e.exp ? ` EXP+${e.exp}` : ""}`);

  if (e.boss && floorNo >= FINAL_FLOOR) {
    renderBattle();
    setTimeout(gameClear, 700);
    return;
  }

  if (e.boss) {
    // 落とし物はボスのいた場所に出る
    const id = e.def.drops[rnd(e.def.drops.length)];
    groundItems.push({ x: e.x, y: e.y, key: "part", part: id });
    log(`${partById(id).name}が落ちた！ 奥の階段が使える。`);
  } else {
    if (Math.random() < PART_DROP_RATE) {
      const pool = PARTS.filter(p => p.type === e.def.drop);
      const id = pool[rnd(Math.min(pool.length, 1 + Math.floor(floorNo / 3)))].id;
      const u = addPart(id);
      log(`パーツ「${partById(id).name}」を入手！${u ? `（${u.name}に装備）` : ""}`);
    }
    if (Math.random() < ITEM_DROP_RATE) {
      const key = Math.random() < 0.5 ? "repair" : "cell";
      inv.items[key]++;
      log(`${ITEMS[key].name}を手に入れた。`);
    }
    if (team.length < TEAM_MAX && Math.random() < e.def.recruit) recruit(e.def);
  }
  battle.menu = "result";
  battle.actor = -1;
  battle.busy = false;
  renderBattle();
}

// 仲間は、最初の機体と同じレベルで加わる
function recruit(def) {
  const u = createUnit({ name: uniqueName(def.name), ch: def.ch, color: def.color, kind: def.key,
    hp: def.ally.hp, en: def.ally.en, tackle: def.ally.tackle, lv: leader().lv });
  team.push(u);
  addPart(def.ally.part, u);
  log(`${u.name}が仲間になった！（Lv${u.lv}）`);
}

// コマンド一覧
function battleCommands() {
  const b = battle, cmds = [];
  if (b.menu === "result") return [{ label: "つづける", sub: "マップにもどる", act: endBattle }];
  if (b.actor < 0) return [];
  const u = team[b.actor];
  const back = { label: "もどる", back: true, act: () => { b.menu = "main"; renderBattle(); } };
  if (b.menu === "main") {
    cmds.push({ label: "たいあたり", sub: `威力${tackleOf(u)} 命中${Math.min(100, TACKLE_ACC + u.accBonus)}%`, act: () => runCommand("tackle") });
    cmds.push({ label: "ぶそう", sub: "パーツで攻撃", act: () => { b.menu = "weapon"; renderBattle(); } });
    cmds.push({ label: "スキル", sub: "技を使う", act: () => { b.menu = "skill"; renderBattle(); } });
    cmds.push({ label: "アイテム", sub: `修理${inv.items.repair} セル${inv.items.cell}`, act: () => { b.menu = "item"; renderBattle(); } });
    cmds.push({ label: "にげる", sub: b.enemy.boss ? "ボスからは逃げられない" : `成功率${ESCAPE_RATE}%`,
                disabled: b.enemy.boss, act: () => runCommand("escape") });
  } else if (b.menu === "weapon") {
    u.equip.forEach((pi, slot) => {
      if (pi === null) { cmds.push({ label: `スロット${slot + 1}：なし`, disabled: true }); return; }
      const p = partById(inv.parts[pi]);
      const acc = Math.min(100, p.acc + u.focus + u.accBonus);
      cmds.push({ label: p.name, sub: `威力${p.power} 命中${acc}% EN${p.en}`,
                  disabled: u.en < p.en, act: () => runCommand("weapon", slot) });
    });
    cmds.push(back);
  } else if (b.menu === "skill") {
    for (const s of SKILLS) {
      const lv = u.skills[s.id];
      cmds.push({ label: `${s.name} Lv${lv}`, sub: s.desc(lv), act: () => runCommand("skill", s.id) });
    }
    cmds.push(back);
  } else if (b.menu === "item") {
    for (const key of ["repair", "cell"]) {
      cmds.push({ label: `${ITEMS[key].name} ×${inv.items[key]}`, sub: key === "repair" ? `HP+${ITEMS[key].value}` : `EN+${ITEMS[key].value}`,
                  disabled: inv.items[key] <= 0, act: () => { b.itemKey = key; b.menu = "itemTarget"; renderBattle(); } });
    }
    cmds.push(back);
  } else if (b.menu === "itemTarget") {
    const key = b.itemKey;
    for (const t of alive()) {
      const full = key === "repair" ? t.hp >= t.maxHp : t.en >= t.maxEn;
      cmds.push({ label: t.name, sub: key === "repair" ? `HP ${t.hp}/${t.maxHp}` : `EN ${t.en}/${t.maxEn}`,
                  disabled: full, act: () => runCommand("item", { key, target: t }) });
    }
    cmds.push({ label: "もどる", back: true, act: () => { b.menu = "item"; renderBattle(); } });
  }
  return cmds;
}

let currentCmds = [];
function renderBattle() {
  const e = battle.enemy;
  $("eName").textContent = (e.boss ? "BOSS " : "") + e.name;
  $("eHpText").textContent = `HP ${e.hp}/${e.maxHp}`;
  $("eHpBar").firstElementChild.style.width = (100 * e.hp / e.maxHp) + "%";
  $("charge").textContent = "⚡ 力を溜めている！ 次のターンに強攻撃";
  $("charge").hidden = !battle.heavyReady;

  // 味方の表示
  const allies = $("allies");
  allies.textContent = "";
  team.forEach((u, i) => {
    const s = document.createElement("div");
    s.className = "sprite ally" + (i === battle.actor ? " active" : "") + (u.hp <= 0 ? " down" : "");
    s.id = "ally" + i;
    s.textContent = u.isLeader ? "@" : u.ch;
    s.style.color = u.isLeader ? "#ffd447" : u.color;
    s.style.borderColor = u.isLeader ? "#ffd447" : u.color;
    allies.append(s);
  });
  const party = $("party");
  party.textContent = "";
  team.forEach((u, i) => {
    const r = document.createElement("div");
    r.className = "prow" + (i === battle.actor ? " active" : "") + (u.hp <= 0 ? " down" : "");
    r.innerHTML = `<span class="nm"></span><span class="bar hp"><i></i></span><span class="num hpn"></span><span class="num enn"></span>`;
    r.querySelector(".nm").textContent = u.name;
    const small = document.createElement("small"); small.textContent = ` Lv${u.lv}`;
    r.querySelector(".nm").append(small);
    r.querySelector("i").style.width = (100 * u.hp / u.maxHp) + "%";
    r.querySelector(".hpn").textContent = u.hp > 0 ? `${u.hp}/${u.maxHp}` : "停止";
    r.querySelector(".hpn").classList.toggle("low", u.hp > 0 && u.hp <= u.maxHp * 0.3);
    r.querySelector(".enn").textContent = `EN${u.en}`;
    const st = [];
    if (u.guard) st.push(`防御中 ${Math.round(u.guard * 100)}%`);
    if (u.focus) st.push(`集中 命中+${u.focus}%`);
    if (st.length) { const d = document.createElement("span"); d.className = "st"; d.textContent = st.join("　"); r.append(d); }
    party.append(r);
  });

  const titles = { main: "の行動", weapon: "：パーツを選ぶ", skill: "：スキルを選ぶ", item: "：アイテムを選ぶ", itemTarget: "：使う相手を選ぶ" };
  const title = $("cmdTitle");
  title.textContent = "";
  if (battle.menu === "result") title.textContent = "勝利！";
  else if (battle.actor >= 0 && !battle.busy) {
    const b = document.createElement("b"); b.textContent = team[battle.actor].name;
    title.append(b, titles[battle.menu]);
  } else title.textContent = battle.actor < 0 ? `${e.name}の行動…` : "…";

  currentCmds = battle.busy ? [] : battleCommands();
  const box = $("cmds");
  box.textContent = "";
  currentCmds.forEach((c, i) => {
    const btn = document.createElement("button");
    const k = document.createElement("span"); k.className = "k"; k.textContent = c.back ? "0" : String(i + 1);
    const line = document.createElement("span"); line.append(k, c.label);
    btn.append(line);
    if (c.sub) { const sm = document.createElement("small"); sm.textContent = c.sub; btn.append(sm); }
    if (c.back) btn.classList.add("back");
    btn.disabled = !!c.disabled;
    btn.addEventListener("click", () => { if (!btn.disabled && c.act) c.act(); });
    box.append(btn);
  });
}

function battleKey(key) {
  if (!battle) return false;
  if (battle.busy) { if (skipWait) skipWait(); return true; }
  if (key === "0" || key === "Escape" || key === "Backspace") {
    const back = currentCmds.find(c => c.back);
    if (back) { back.act(); return true; }
    return false;
  }
  if (key === "Enter" && battle.menu === "result") { endBattle(); return true; }
  const n = parseInt(key, 10);
  if (n >= 1 && n <= currentCmds.length) {
    const c = currentCmds[n - 1];
    if (!c.disabled && !c.back && c.act) c.act();
    return true;
  }
  return false;
}

function openMenu() {

  mode = "menu";

  renderMenu();
  $("menu").hidden = false;
}
function closeMenu() {
  if (mode !== "menu") return;
  $("menu").hidden = true;
  mode = "map";
  renderMap();

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}
function partInfo(id, extra) {
  const p = partById(id), info = el("div", "info");
  const name = el("div");
  name.append(el("span", "tag " + p.type, PART_TYPE_LABEL[p.type]), p.name);
  if (extra) name.append(el("span", "eq", extra));
  info.append(name, el("small", "", `威力${p.power}　命中${p.acc}%　EN${p.en}`));
  return info;
}
function rowButton(label, fn, disabled, cls) {
  const b = el("button", cls || "", label);
  b.disabled = !!disabled;
  b.addEventListener("click", fn);
  return b;
}

function renderMenu() {
  const ms = menuState;
  if (ms.unit >= team.length) ms.unit = 0;
  const u = team[ms.unit];

  const tabs = $("menuTabs");
  tabs.textContent = "";
  team.forEach((t, i) => {
    tabs.append(rowButton(`${t.name} Lv${t.lv}`, () => { menuState = { unit: i, pending: null, confirmRelease: false }; renderMenu(); }, false, i === ms.unit ? "on" : ""));
  });

  const body = $("menuBody");
  body.textContent = "";

  // ステータス
  const g = el("div", "sgrid");
  const stat = (k, v) => { const d = el("div", "", k + " "); d.append(el("b", "", v)); g.append(d); };
  stat("Lv", u.lv >= LEVEL_MAX ? `${u.lv}（最大）` : String(u.lv));
  stat("次のLvまで", u.lv >= LEVEL_MAX ? "—" : `${expToNext(u.lv) - u.exp} EXP`);
  stat("HP", `${u.hp}/${u.maxHp}`);
  stat("EN", `${u.en}/${u.maxEn}`);
  stat("たいあたり", `威力${tackleOf(u)}`);
  stat("特性", [u.accBonus ? `命中+${u.accBonus}%` : "", u.evade ? `回避${u.evade}%` : ""].filter(Boolean).join(" ") || "—");
  body.append(g);

  body.append(el("h3", "", `${u.name}の装備（${SLOT_COUNT}枠）`));
  u.equip.forEach((pi, slot) => {
    const row = el("div", "mrow");
    if (pi === null) row.append(el("div", "info empty", `スロット${slot + 1}：なし`));
    else row.append(partInfo(inv.parts[pi], `スロット${slot + 1}`));
    const btns = el("div", "btns");
    if (ms.pending !== null) {
      btns.append(rowButton("ここに装備", () => { u.equip[slot] = ms.pending; ms.pending = null; renderMenu(); }));
    } else if (pi !== null) {
      btns.append(rowButton("はずす", () => { u.equip[slot] = null; renderMenu(); }));
    }
    row.append(btns);
    body.append(row);
  });

  body.append(el("h3", "", "持ち物のパーツ（だれも装備していないもの）"));
  const free = inv.parts.map((_, i) => i).filter(i => !isEquipped(i));
  if (free.length === 0) body.append(el("div", "mrow empty", "ありません。他の機体から外すとここに入ります"));
  for (const i of free) {
    const row = el("div", "mrow");
    row.append(partInfo(inv.parts[i], ms.pending === i ? "← 付ける枠を選んでください" : ""));
    const btns = el("div", "btns");
    if (ms.pending === i) {
      btns.append(rowButton("やめる", () => { ms.pending = null; renderMenu(); }));
    } else {
      btns.append(rowButton("装備", () => {
        const f = u.equip.indexOf(null);
        if (f >= 0) u.equip[f] = i; else ms.pending = i;
        renderMenu();
      }));
    }
    row.append(btns);
    body.append(row);
  }

  body.append(el("h3", "", `アイテム（${u.name}に使う）`));
  for (const key of ["repair", "cell"]) {
    const it = ITEMS[key], row = el("div", "mrow");
    const info = el("div", "info", `${it.name} ×${inv.items[key]}`);
    info.append(el("small", "", key === "repair" ? `HP+${it.value}` : `EN+${it.value}`));
    const full = key === "repair" ? u.hp >= u.maxHp : u.en >= u.maxEn;
    const btns = el("div", "btns");
    btns.append(rowButton("使う", () => { useItem(key, u); renderMenu(); }, inv.items[key] <= 0 || full));
    row.append(info, btns);
    body.append(row);
  }

  body.append(el("h3", "", "スキル（使うたびにレベルアップ）"));
  for (const s of SKILLS) {
    const lv = u.skills[s.id], row = el("div", "mrow");
    const info = el("div", "info", `${s.name}　Lv${lv}${lv >= SKILL_MAX_LEVEL ? "（最大）" : ""}`);
    info.append(el("small", "", s.desc(lv)));
    row.append(info);
    body.append(row);
  }

  if (!u.isLeader) {
    body.append(el("h3", "", "チーム"));
    const row = el("div", "mrow");
    const btns = el("div", "btns");
    if (ms.confirmRelease) {
      row.append(el("div", "info", `${u.name}を手放しますか？ 装備パーツは持ち物に戻ります。`));
      btns.append(rowButton("やめる", () => { ms.confirmRelease = false; renderMenu(); }));
      btns.append(rowButton("手放す", () => releaseAlly(u), false, "danger"));
    } else {
      row.append(el("div", "info", "この仲間をチームから外す"));
      btns.append(rowButton("手放す", () => { ms.confirmRelease = true; renderMenu(); }, false, "danger"));
    }
    row.append(btns);
    body.append(row);
  }
}

function releaseAlly(u) {
  if (u.isLeader) return;
  team = team.filter(t => t !== u);
  log(`${u.name}と別れた。`);
  menuState = { unit: 0, pending: null, confirmRelease: false };
  renderMenu();
}

// ================================================================
//  描画（マップ）
// ================================================================
function resize() {
  if (mode === "battle" || mode === "select") return;
  const byW = Math.floor((Math.min(window.innerWidth, 520) - 26) / VIEW);
  const others = $("mapScreen").offsetHeight - cv.offsetHeight + 24;
  const byH = Math.floor((window.innerHeight - others) / VIEW);
  tile = Math.max(14, Math.min(32, byW, byH));
  const dpr = window.devicePixelRatio || 1;
  cv.style.width = cv.style.height = tile * VIEW + "px";
  cv.width = cv.height = Math.round(tile * VIEW * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (team) renderMap();
}

const TILE_COLORS = {
  [FLOOR]:     ["#2b2b33", "#16161a"],
  [STAIRS]:    ["#2b2b33", "#16161a"],
  [HEAL]:      ["#1d3a26", "#12221a"],
  [GATE]:      ["#3a3418", "#221f10"],
  [BOSSFLOOR]: ["#3e171b", "#24100f"],
};

function renderMap() {
  const half = VIEW >> 1;
  const camX = Math.max(0, Math.min(MAP_W - VIEW, pos.x - half));
  const camY = Math.max(0, Math.min(MAP_H - VIEW, pos.y - half));
  const size = tile * VIEW;
  const toScreen = (x, y) => [(x - camX) * tile, (y - camY) * tile];

  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, size, size);
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.font = `bold ${Math.floor(tile * 0.75)}px monospace`;

  for (let vy = 0; vy < VIEW; vy++) {
    for (let vx = 0; vx < VIEW; vx++) {
      const x = camX + vx, y = camY + vy;
      if (!seen[y][x]) continue;
      const vis = visible[y][x], px = vx * tile, py = vy * tile, t = map[y][x];
      if (t === WALL) {
        ctx.fillStyle = vis ? "#5a5248" : "#2a2622";
        ctx.fillRect(px, py, tile, tile);
        continue;
      }
      ctx.fillStyle = TILE_COLORS[t][vis ? 0 : 1];
      ctx.fillRect(px + 1, py + 1, tile - 2, tile - 2);
      if (t === STAIRS) drawChar(">", px, py, vis ? "#fff" : "#777");
      if (t === HEAL) drawChar("+", px, py, "#5dff8a");
      if (t === GATE) drawChar("¦", px, py, "#ffd447");
    }
  }
  for (const it of groundItems) {
    if (!seen[it.y][it.x]) continue;
    const ch = it.key === "part" ? "P" : ITEMS[it.key].ch;
    const color = it.key === "part" ? "#ff7be0" : ITEMS[it.key].color;
    drawChar(ch, ...toScreen(it.x, it.y), visible[it.y][it.x] ? color : "#555");
  }
  for (const e of enemies) {
    if (!visible[e.y][e.x]) continue;
    const [px, py] = toScreen(e.x, e.y);
    if (e.boss) {
      // ボスは2×2マスで大きく表示
      const s = tile * 2;
      ctx.fillStyle = "#5a1a1e";
      ctx.fillRect(px + 1, py + 1, s - 2, s - 2);
      ctx.strokeStyle = e.color; ctx.lineWidth = 2;
      ctx.strokeRect(px + 2, py + 2, s - 4, s - 4);
      ctx.fillStyle = e.color;
      ctx.font = `bold ${Math.floor(s * 0.75)}px monospace`;
      ctx.fillText(e.ch, px + s / 2, py + s / 2 + 2);
      ctx.font = `bold ${Math.floor(tile * 0.75)}px monospace`;
      continue;
    }
    drawChar(e.ch, px, py, e.stun > 0 ? "#777" : e.color);
    if (e.hp < e.maxHp) {
      ctx.fillStyle = "#400"; ctx.fillRect(px + 2, py + tile - 4, tile - 4, 3);
      ctx.fillStyle = "#f44"; ctx.fillRect(px + 2, py + tile - 4, (tile - 4) * e.hp / e.maxHp, 3);
    }
  }
  drawChar("@", ...toScreen(pos.x, pos.y), "#ffd447");
  updateStatus();
}
function drawChar(ch, px, py, color) {
  if (px < 0 || py < 0 || px >= tile * VIEW || py >= tile * VIEW) return;
  ctx.fillStyle = color;
  ctx.fillText(ch, px + tile / 2, py + tile / 2 + 1);
}
function updateStatus() {
  const fl = $("floorLabel");
  fl.textContent = isBossFloor(floorNo) ? `${floorNo}F ボスフロア` : `${floorNo}F`;
  fl.classList.toggle("bossfl", isBossFloor(floorNo));
  const rows = $("teamRows");
  rows.textContent = "";
  for (const u of team) {
    const r = el("div", "trow");
    const nm = el("span", "nm", u.name); nm.append(el("small", "", ` Lv${u.lv}`));
    const bar = el("span", "bar hp"); const i = el("i"); i.style.width = (100 * u.hp / u.maxHp) + "%"; bar.append(i);
    const hp = el("span", "num", `${u.hp}/${u.maxHp}`);
    hp.classList.toggle("low", u.hp <= u.maxHp * 0.3);
    r.append(nm, bar, hp, el("span", "num", `EN${u.en}`));
    rows.append(r);
  }
}

function startGame(typeKey) {
  const t = START_TYPES.find(x => x.key === typeKey);
  floorNo = 1;
  logLines = [];
  team = [];
  inv = { parts: [], items: { ...STARTING_ITEMS } };
  team.push(createUnit({ name: t.name, ch: "@", color: "#ffd447", isLeader: true, kind: t.key,
    hp: t.hp, en: t.en, tackle: t.tackle, accBonus: t.accBonus, evade: t.evade }));
  addPart(t.part, team[0]);
  bestLevel = 1;
  battle = null;
  mode = "map";
  $("select").hidden = true;
  $("endScreen").hidden = true;
  $("menu").hidden = true;
  $("battle").hidden = true;
  $("mapScreen").hidden = false;
  newFloor();
  renderLog();
  log(`${t.label}「${t.name}」で地下遺跡に潜入した。階段 > を探せ。`);
  resize();
}

function gameOver(msg) {
  mode = "over";
  log(msg);
  bestLevel = Math.max(bestLevel, ...team.map(u => u.lv));
  $("endTitle").textContent = "機能停止…";
  $("endTitle").style.color = "#ff6a6a";
  $("endText").textContent = `${msg}　到達階：${floorNo}F　最高機体レベル：Lv${bestLevel}`;
  $("endScreen").hidden = false;
  endShownAt = Date.now();
}

function gameClear() {
  mode = "over";
  processLevelUps();
  bestLevel = Math.max(bestLevel, ...team.map(u => u.lv));
  $("endTitle").textContent = "遺跡踏破！";
  $("endTitle").style.color = "#ffd447";
  $("endText").textContent = `${floorNo}Fの守護機を倒し、遺跡の最深部にたどり着いた！　最高機体レベル：Lv${bestLevel}`;
  $("endScreen").hidden = false;
  endShownAt = Date.now();
}

// テスト用：直近のバトル結果
let lastBattle = null;
let endShownAt = 0;
const END_KEY_DELAY = 1000;   // 結果画面が出てからキー入力を受け付けるまで(ms)

// ================================================================
//  入力
// ================================================================
const KEYMAP = {
  ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right",
  w: "up", s: "down", a: "left", d: "right", W: "up", S: "down", A: "left", D: "right",
  " ": "wait", ".": "wait",
};
document.addEventListener("keydown", ev => {
  if (mode === "select") {
    const n = parseInt(ev.key, 10);
    if (n >= 1 && n <= START_TYPES.length) { ev.preventDefault(); startGame(START_TYPES[n - 1].key); }
    return;
  }
  if (mode === "over") {
    // 戦闘中にEnterで送っていた勢いで、結果画面を飛ばさないようにする
    if ((ev.key === "Enter" || ev.key === " ") && Date.now() - endShownAt > END_KEY_DELAY) { ev.preventDefault(); showSelect(); }
    return;
  }
  if (mode === "menu") {
    if (ev.key === "Escape" || ev.key === "m" || ev.key === "M") { ev.preventDefault(); closeMenu(); }
    return;
  }
  if (mode === "battle") {
    if (battleKey(ev.key)) ev.preventDefault();
    return;
  }
  if (ev.key === "m" || ev.key === "M") { ev.preventDefault(); openMenu(); return; }
  const dir = KEYMAP[ev.key];
  if (!dir) return;
  ev.preventDefault();
  playerMove(dir);
});

// バトル中の待ち時間はタップで飛ばせる
$("battle").addEventListener("pointerdown", () => { if (battle && battle.busy && skipWait) skipWait(); });

let holdTimer = null;
function stopHold() { clearTimeout(holdTimer); clearInterval(holdTimer); holdTimer = null; }
document.querySelectorAll("#pad button").forEach(btn => {
  btn.addEventListener("pointerdown", ev => {
    ev.preventDefault();
    stopHold();
    const dir = btn.dataset.dir;
    playerMove(dir);
    if (dir === "wait") return;
    holdTimer = setTimeout(() => {
      holdTimer = setInterval(() => { if (mode === "map") playerMove(dir); else stopHold(); }, 130);
    }, 350);
  });
  ["pointerup", "pointerleave", "pointercancel"].forEach(t => btn.addEventListener(t, stopHold));
  btn.addEventListener("contextmenu", ev => ev.preventDefault());
});
$("menuBtn").addEventListener("click", openMenu);
$("menuClose").addEventListener("click", closeMenu);
$("retry").addEventListener("click", showSelect);
window.addEventListener("resize", resize);

if (DEBUG) document.body.append(el("div", "debug", "DEBUG MODE"));
showSelect();
</script>
